        <marker id="fv2" markerWidth="6" markerHeight="6" refX="5" refY="2.8" orient="auto"><path d="M0,0 L6,2.8 L0,5.6 Z" fill="${VIO}"/></marker>
      </defs>
      <style>.cs{fill:#8fa3b5;font:600 9.5px system-ui}</style>${g}</svg>`;

    const mag2 = method==="electromagnetic";
    ro.innerHTML = "";
    ro.appendChild(readout([
      {k:"Method", v:DEFLECTION[method].name},
      {k:"Vertical movement comes from", v:mag2 ? "a HORIZONTAL magnetic field" : "the Y-plates", cls:mag2?"c":""},
      {k:"Horizontal movement comes from", v:mag2 ? "a VERTICAL magnetic field" : "the X-plates", cls:mag2?"c":""},
      {k:"On the screen", v:s.symptom, cls:(!s.hOK||!s.vOK)?"r":"g"},
      {k:"Component to investigate", v:(!s.hOK&&!s.vOK)?(s.hComp+" AND "+s.vComp):(!s.vOK?s.vComp:(!s.hOK?s.hComp:"none")), cls:(!s.hOK||!s.vOK)?"r":""}
    ]));

    note.innerHTML = "";
    let cls = "", body;
    if(!s.hOK && !s.vOK){
      cls = "err";
      body = "<b>A stationary bright dot &mdash; switch it off.</b> Both axes are dead, so the whole beam is landing "+
        "on one small patch of phosphor. This is the burn mechanism you meet properly in Module 3 as stroke "+
        "scanning's disadvantage, except here it is concentrated on a single spot.";
    }else if(!s.vOK || !s.hOK){
      cls = "warn";
      const lost = !s.vOK ? "vertical" : "horizontal";
      const comp = !s.vOK ? s.vComp : s.hComp;
      body = "<b>"+s.symptom.charAt(0).toUpperCase()+s.symptom.slice(1)+".</b> The surviving axis still sweeps, so "+
        "the <b>"+lost+"</b> deflection is what has failed. On this tube that names the <b>"+comp+"</b>. "+
        (mag2
          ? "Notice the field orientation in that name is the <i>opposite</i> word to the movement that was lost &mdash; that is the crossed rule."
          : "With plates there is no crossing: the plate pair is named after the movement it produces.");
    }else if(mag2 && (Math.abs(s.ev)>2 || Math.abs(s.eh)>2)){
      cls = "";
      const bits = [];
      if(Math.abs(s.ev)>2) bits.push("moving the spot <b>"+(s.ev>0?"up":"down")+"</b> takes a <b>horizontal</b> magnetic field");
      if(Math.abs(s.eh)>2) bits.push("moving it <b>"+(s.eh>0?"right":"left")+"</b> takes a <b>vertical</b> one");
      body = "<b>The crossed rule, live.</b> Right now "+bits.join(", and ")+". The force on a moving electron acts "+
        "at right angles to both the field and its direction of travel, and its travel is along the tube &mdash; so "+
        "the movement can only be at right angles to the field.";
    }else if(!mag2 && (Math.abs(s.ev)>2 || Math.abs(s.eh)>2)){
      cls = "";
      body = "<b>Plates are the intuitive ones.</b> An electric field pushes a charge along the field direction, so "+
        "the <b>X-plates</b> move the spot horizontally and the <b>Y-plates</b> move it vertically. "+
        "This is the method used for <b>"+DEFLECTION.electrostatic.app+"</b>, where the tube is small and the "+
        "deflection has to follow a fast signal.";
    }else{
      cls = "";
      body = "<b>Undeflected.</b> The beam is going straight down the middle of the tube and landing in the centre "+
        "of the screen. Move one of the drive sliders and watch which piece of hardware lights up.";
    }
    note.appendChild(el("div",{class:"note "+cls, style:"margin-bottom:0"}, body));
    redrawTask && redrawTask();
  }

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>`${DEFLECTION[s.method].name} &middot; H ${s.hDrive}% ${s.hOK?"":"(failed)"} &middot; V ${s.vDrive}% ${s.vOK?"":"(failed)"} &rarr; ${s.symptom}`,
    id);
  draw();
};

/* ---------------- M3 · SCAN ANIMATOR ---------------- */
LABS.m3 = function(host, id, tier){
  const box = labShell("Scan animator","Draw the same symbol both ways, and watch each method earn its own fault");
  const B = box._body;
  host.appendChild(box);

  let method = "raster";
  let fieldMode = "progressive";
  let rate = 50;                 /* refresh, 25..80 Hz */
  let running = true, t = 0, burn = 0, timer = null;

  const cols = el("div",{class:"lab-cols wide-left"});
  const left = el("div"), right = el("div");
  cols.appendChild(left); cols.appendChild(right);
  B.appendChild(cols);

  const anim = el("div"); left.appendChild(anim);
  const ro   = el("div",{style:"margin-top:14px"}); left.appendChild(ro);
  const note = el("div",{style:"margin-top:12px"}); left.appendChild(note);

  right.appendChild(el("div",{class:"eyebrow"},"Scanning method"));
  right.appendChild(segBar([["raster","Raster"],["stroke","Stroke"]], method,
    v=>{ method=v; burn=0; draw(); labTouch(id,8); }, "margin-bottom:14px"));

  right.appendChild(el("div",{class:"eyebrow"},"Line order (raster only)"));
  right.appendChild(segBar([["progressive","Progressive"],["interlaced","Interlaced"]], fieldMode,
    v=>{ fieldMode=v; draw(); labTouch(id,8); }, "margin-bottom:14px"));

  right.appendChild(ctrl("Refresh rate","m3rv", range("m3r",25,80,1,rate)));
  $("#m3r").addEventListener("input", e=>{ rate=+e.target.value; draw(); labTouch(id,8); });

  const runRow = el("div",{class:"btn-row", style:"margin-bottom:14px"});
  const runBtn = el("button",{class:"btn sec", onclick:()=>{ running=!running; runBtn.textContent = running?"Pause":"Run"; }},"Pause");
  runRow.appendChild(runBtn);
  runRow.appendChild(el("button",{class:"btn sec", onclick:()=>{ burn=0; draw(); }},"Fit a new tube"));
  right.appendChild(runRow);

  const TASKS = {
    foundation:[
      {q:"Run the <b>raster</b> bench at <b>25 Hz</b> and read the fault it develops.",
       test:s=>s.method==="raster" && s.rate<=30},
      {q:"Switch to <b>stroke</b> and watch the burn meter for a few seconds. Read the fault this method has instead.",
       test:s=>s.method==="stroke" && s.burn>12},
      {q:"Back on raster, set the refresh high enough that the flicker warning clears.",
       test:s=>s.method==="raster" && s.flickerLevel==="none"}
    ],
    developing:[
      {q:"Get the raster bench to flicker, then switch the line order to <b>interlaced</b> and read what starts flickering specifically.",
       test:s=>s.method==="raster" && s.fieldMode==="interlaced"},
      {q:"Set <b>progressive</b> scanning and a refresh of 60 Hz or more &mdash; the PC computer display case.",
       test:s=>s.method==="raster" && s.fieldMode==="progressive" && s.rate>=60},
      {q:"Switch to stroke and accumulate a <b>severe</b> burn mark on the symbol.",
       test:s=>s.method==="stroke" && s.burn>60}
    ],
    proficient:[
      {q:"Read the dwell share for <b>raster</b>, then for <b>stroke</b>, and satisfy yourself both faults come from that one number.",
       test:s=>s.method==="stroke" && s.dwell===1},
      {q:"Produce the display that has <b>neither</b> fault showing: no flicker warning, and a fresh tube.",
       test:s=>s.method==="raster" && s.flickerLevel==="none" && s.burn<5},
      {q:"Now produce the worst of both worlds on one bench: interlaced raster at the lowest refresh available.",
       test:s=>s.method==="raster" && s.fieldMode==="interlaced" && s.rate<=26}
    ]
  };

  function flickerFor(){
    if(method === "stroke") return "none";
    let r = rate;
    if(fieldMode === "interlaced") r = rate;          /* fields alternate; thin lines see half of it */
    const eff = fieldMode === "interlaced" ? r/2 : r;
    if(eff >= 50) return "none";
    if(eff >= 30) return "slight";
    return "bad";
  }
  function state(){
    return {method, fieldMode, rate, burn:Math.round(burn),
            dwell:dwellShare(method, 0.12),
            fault:scanFault(method),
            flickerLevel:flickerFor()};
  }

  const SYM = [ [30,86,110,86], [70,44,70,128], [46,62,70,44], [94,62,70,44] ];  /* an aircraft-ish symbol */

  function draw(){
    const s = state();
    $("#m3rv").textContent = rate + " Hz";

    const W = 470, H = 210, sx = 150, sy = 22, sw = 220, sh = 165;
    let g = "";
    g += `<rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" rx="5" fill="#080f16" stroke="#2a3a4a"/>`;

    if(method === "raster"){
      const lines = 24;
      const phase = (t % 60) / 60;
      const cur = Math.floor(phase * lines);
      for(let i=0;i<lines;i++){
        const isOdd = (i % 2 === 0);
        let show = true, dim = 0.30;
        if(fieldMode === "interlaced"){
          const evenField = (Math.floor(t/30) % 2 === 0);
          show = evenField ? isOdd : !isOdd;
        }
        if(i === cur) dim = 0.95;
        if(!show) dim = 0.05;
        const y = sy + 6 + i*(sh-12)/lines;
        g += `<line x1="${sx+6}" y1="${y}" x2="${sx+sw-6}" y2="${y}" stroke="#5fb7d9" stroke-width="3.4" opacity="${dim}"/>`;
      }
      /* the symbol drawn over the filled area */
      SYM.forEach(l=>{ g += `<line x1="${sx+l[0]}" y1="${sy+l[1]}" x2="${sx+l[2]}" y2="${sy+l[3]}"
        stroke="#eafff4" stroke-width="2" opacity=".85"/>`; });
      /* saw tooth trace */
      let saw = "";
      for(let i=0;i<4;i++){ const x0 = 18 + i*28; saw += `M${x0},${H-22} L${x0+24},${H-52} L${x0+24},${H-22} `; }
      g += `<path d="${saw}" stroke="${AMB}" stroke-width="1.5" fill="none"/>`;
      g += `<text x="18" y="${H-6}" class="cs" fill="${AMB}">saw tooth &rarr; X-plates</text>`;
    }else{
      SYM.forEach(l=>{
        g += `<line x1="${sx+l[0]}" y1="${sy+l[1]}" x2="${sx+l[2]}" y2="${sy+l[3]}"
                stroke="#eafff4" stroke-width="3" opacity="1"/>`;
        if(burn > 8)
          g += `<line x1="${sx+l[0]}" y1="${sy+l[1]}" x2="${sx+l[2]}" y2="${sy+l[3]}"
                  stroke="#c98a4a" stroke-width="${3 + burn/22}" opacity="${Math.min(0.6, burn/140)}"/>`;
      });
      /* the beam head running round the symbol */
      const seg = SYM[Math.floor(t/14) % SYM.length];
      const f = ((t % 14)/14);
      g += `<circle cx="${sx + seg[0] + (seg[2]-seg[0])*f}" cy="${sy + seg[1] + (seg[3]-seg[1])*f}" r="4" fill="${AMB}"/>`;
      g += `<text x="18" y="${H-6}" class="cs">(X,Y) coordinate method</text>`;
    }
    /* flicker: dim the whole face periodically when the refresh is too low */
    if(s.flickerLevel !== "none"){
      const amp = s.flickerLevel === "bad" ? 0.42 : 0.16;
      const dip = amp * (0.5 + 0.5*Math.sin(t/2.2));
      g += `<rect x="${sx}" y="${sy}" width="${sw}" height="${sh}" fill="#080f16" opacity="${dip}"/>`;
    }
    g += `<text x="${sx+sw/2}" y="${H-6}" class="cs" text-anchor="middle">${
      method==="raster" ? SCAN.raster.name+" &middot; "+(fieldMode==="interlaced"?"interlaced, 2 fields":"progressive, single pass")
                        : SCAN.stroke.name+" &middot; repeats to maintain picture persistence"}</text>`;

    anim.innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}">
      <style>.cs{fill:#8fa3b5;font:600 9.5px system-ui}</style>${g}</svg>`;

    ro.innerHTML = "";
    ro.appendChild(readout([
      {k:"Method", v:SCAN[method].name},
      {k:"Dwell on any one lit spot", v:method==="raster" ? "about 12% of the frame" : "the whole frame", cls:method==="raster"?"":"r"},
      {k:"This method's fault", v:method==="raster" ? "the display will flicker" : "a burn mark", cls:"c"},
      {k:"Flicker now", v:s.flickerLevel==="none"?"none":(s.flickerLevel==="slight"?"slight":"bad"),
       cls:s.flickerLevel==="none"?"g":(s.flickerLevel==="bad"?"r":"")},
      {k:"Phosphor burn", v:method==="stroke" ? s.burn+"%" : "not accumulating", cls:s.burn>60?"r":(s.burn>12?"":"g")}
    ]));

    note.innerHTML = "";
    let cls = "", body;
    if(method === "stroke"){
      cls = burn > 60 ? "err" : (burn > 12 ? "warn" : "");
      body = "<b>Stroke overcomes flickering.</b> The beam skips the empty screen entirely and spends the whole frame "+
        "on the symbol, using the <b>(X,Y) coordinate method</b> and repeating to maintain <b>picture persistence</b>. "+
        "That is why the image is <b>sharper &amp; brighter</b> &mdash; the slow beam speed across the CRT face "+
        "deposits more energy along each part of the track, which is what a <b>head-up display</b> needs against "+
        "daylight. The price is on the burn meter: the same phosphor, hammered indefinitely."+
        (burn > 60 ? "<br><br><b>That tube is now scrap.</b> The symbol is permanently visible whether it is being drawn or not." : "");
    }else if(s.flickerLevel === "bad"){
      cls = "err";
      body = "<b>Flicker &mdash; raster's stated disadvantage.</b> The beam visits every spot on the screen, so it "+
        "can spend only a fraction of each frame on any one of them. At "+rate+" Hz"+
        (fieldMode==="interlaced" ? ", split into <b>2 fields</b> of odd and even lines, any given line is refreshed only "+(rate/2).toFixed(0)+" times a second" : "")+
        " the phosphor fades visibly before the beam returns."+
        (fieldMode==="interlaced" ? " Watch the thin horizontal lines specifically &mdash; the appearance and disappearance of the odd and even fields is exactly what the deck describes." : "");
    }else if(fieldMode === "interlaced"){
      cls = "warn";
      body = "<b>Interlaced &mdash; 2 separate fields.</b> The odd lines are painted, then the even lines. That halves "+
        "how much must be drawn before something appears, but a thin horizontal line may live in only <i>one</i> field, "+
        "so it appears and disappears at half the field rate. This is <b>TV display</b>. A "+
        "<b>PC computer display</b> is progressive, a single pass, with <b>no flickering problem</b> &mdash; because a "+
        "PC screen is full of one-pixel rules and text that show this up.";
    }else{
      cls = "";
      body = "<b>Raster covers area for free.</b> Sweeping line by line visits the whole screen whether there is "+
        "anything there or not, which is why raster is used for the filled colour regions on an aircraft: the "+
        "<b>weather scope</b>, the <b>Navigation Display / EHSI</b>, and the <b>blue &amp; brown backgrounds on the "+
        "ADI</b>. The linear sweep comes from a <b>sweep generator (oscillator)</b> whose <b>saw tooth</b> output "+
        "goes to the <b>X-plates</b> &mdash; the ramp sweeps the beam across, the snap-back flies it home for the "+
        "next line. Drop the refresh below 50 Hz and the fault appears.";
    }
    note.appendChild(el("div",{class:"note "+cls, style:"margin-bottom:0"}, body));
    redrawTask && redrawTask();
  }

  /* the animation stops itself the moment this lab leaves the DOM — there is no
     teardown hook in the router, and a stray interval would redraw a detached node */
  timer = setInterval(()=>{
    if(!document.body.contains(box)){ clearInterval(timer); timer = null; return; }
    if(!running) return;
    t++;
    if(method === "stroke" && burn < 100) burn += 0.9;
    draw();
  }, 90);

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>`${SCAN[s.method].name} &middot; ${s.method==="raster"?s.fieldMode+", "+s.rate+" Hz":"burn "+s.burn+"%"} &rarr; flicker ${s.flickerLevel}`,
    id);
  draw();
};

/* ---------------- M4 · SHADOW MASK BENCH ---------------- */
LABS.m4 = function(host, id, tier){
  const box = labShell("Shadow mask bench","Three guns, one perforated sheet &mdash; mistune it and watch colour purity fail");
  const B = box._body;
  host.appendChild(box);

  let pitch = 0.30;                       /* mm */
  let offset = 0;                         /* mm, mask misregistration */
  let drive = {red:1, green:1, blue:1};

  const cols = el("div",{class:"lab-cols wide-left"});
  const left = el("div"), right = el("div");
  cols.appendChild(left); cols.appendChild(right);
  B.appendChild(cols);

  const anim = el("div"); left.appendChild(anim);
  const ro   = el("div",{style:"margin-top:14px"}); left.appendChild(ro);
  const note = el("div",{style:"margin-top:12px"}); left.appendChild(note);

  right.appendChild(ctrl("Dot-pitch (distance between pixels)","m4pv", range("m4p",0.20,0.60,0.01,pitch)));
  right.appendChild(ctrl("Shadow mask misregistration","m4ov", range("m4o",-0.20,0.20,0.005,offset)));
  $("#m4p").addEventListener("input", e=>{ pitch=+e.target.value; draw(); labTouch(id,8); });
  $("#m4o").addEventListener("input", e=>{ offset=+e.target.value; draw(); labTouch(id,8); });

  right.appendChild(el("div",{class:"eyebrow", style:"margin-top:6px"},"Gun drive"));
  ["red","green","blue"].forEach(c=>{
    right.appendChild(ctrl(c.charAt(0).toUpperCase()+c.slice(1)+" gun","m4"+c+"v", range("m4"+c,0,100,1,100)));
    $("#m4"+c).addEventListener("input", e=>{ drive[c]=(+e.target.value)/100; draw(); labTouch(id,8); });
  });
  const presets = el("div",{class:"btn-row", style:"margin:12px 0 14px"});
  [["White",1,1,1],["Red only",1,0,0],["Green only",0,1,0]].forEach(p=>{
    presets.appendChild(el("button",{class:"btn sec", style:"font-size:.74rem;padding:7px 9px", onclick:()=>{
      drive={red:p[1],green:p[2],blue:p[3]};
      ["red","green","blue"].forEach(c=>{ const n=$("#m4"+c); if(n) n.value = Math.round(drive[c]*100); });
      draw(); labTouch(id,8);
    }}, p[0]));
  });
  right.appendChild(presets);

  const TASKS = {
    foundation:[
      {q:"With the mask aligned, drive <b>only the red gun</b> and confirm no other phosphor lights.",
       test:s=>s.drive.red>0.5 && s.drive.green<0.05 && s.drive.blue<0.05 && Math.abs(s.offset)<0.005},
      {q:"Keep red only, and now <b>mistune the mask</b> until some green or blue appears.",
       test:s=>s.drive.red>0.5 && s.drive.green<0.05 && Math.abs(s.offset)>0.02 && s.purity<0.9},
      {q:"Reduce the <b>dot-pitch</b> below 0.25 mm and read the resolution figure.",
       test:s=>s.pitch<=0.25}
    ],
    developing:[
      {q:"Drive all three guns for <b>white</b>, then mistune the mask until purity falls below <b>50%</b>.",
       test:s=>s.drive.red>0.8 && s.drive.green>0.8 && s.drive.blue>0.8 && s.purity<0.5},
      {q:"Read the total light output and confirm the fault is impurity rather than darkness.",
       test:s=>s.purity<0.7 && Math.abs(s.total - s.driveTotal) < 0.001 && s.driveTotal>0.5},
      {q:"Realign the mask and set the <b>largest</b> dot-pitch available. Read what happens to the resolution.",
       test:s=>Math.abs(s.offset)<0.01 && s.pitch>=0.58}
    ],
    proficient:[
      {q:"Displace the mask by a <b>full dot width</b> so that <i>none</i> of each beam lands on its own phosphor.",
       test:s=>s.purity===0},
      {q:"With the mask fully displaced, drive <b>green only</b> and read which phosphor is actually lighting.",
       test:s=>s.purity===0 && s.drive.green>0.8 && s.drive.red<0.05 && s.drive.blue<0.05},
      {q:"Realign it, then find the dot-pitch that gives roughly <b>10,000 triads per square inch</b>.",
       test:s=>Math.abs(s.offset)<0.01 && s.res>8500 && s.res<12000}
    ]
  };

  function state(){
    const purity = beamPurity(offset, pitch);
    const out = triadOutput(offset, pitch, drive);
    const total = out.red+out.green+out.blue;
    const driveTotal = drive.red+drive.green+drive.blue;
    return {pitch, offset, drive:Object.assign({},drive), purity, out, total, driveTotal,
            res:resolutionFromPitch(pitch)};
  }

  function draw(){
    const s = state();
    $("#m4pv").textContent = pitch.toFixed(2)+" mm";
    $("#m4ov").textContent = (offset===0 ? "aligned" : (offset>0?"+":"")+offset.toFixed(3)+" mm");
    ["red","green","blue"].forEach(c=>{ const n=$("#m4"+c+"v"); if(n) n.textContent = Math.round(drive[c]*100)+"%"; });

    const W = 470, H = 240;
    const gx = 26, mx = 214, scx = 300;
    let g = "";
    /* three guns */
    const gunY = {red:70, green:120, blue:170};
    COLOUR.primaries.forEach(c=>{
      const col = {red:"#e04a4a", green:"#3ad68b", blue:"#5b8cff"}[c];
      const lit = drive[c] > 0.02;
      g += `<rect x="${gx}" y="${gunY[c]-11}" width="42" height="22" rx="3" fill="${lit?col:"#1b2836"}" opacity="${lit?.85:.4}"/>`;
      g += `<text x="${gx+21}" y="${gunY[c]+4}" class="ml">${c.charAt(0).toUpperCase()}</text>`;
      if(lit){
        const landY = 120 + (gunY[c]-120)*0.42 + (offset/0.20)*16;
        g += `<line x1="${gx+42}" y1="${gunY[c]}" x2="${mx}" y2="${landY}" stroke="${col}" stroke-width="1.6" opacity=".75"/>`;
        g += `<line x1="${mx+8}" y1="${landY}" x2="${scx+6}" y2="${landY}" stroke="${col}" stroke-width="1.6" opacity=".55"/>`;
      }
    });
    g += `<text x="${gx+21}" y="46" class="cs" text-anchor="middle">3 guns</text>`;
    /* shadow mask */
    g += `<rect x="${mx}" y="40" width="8" height="168" fill="#6b7a89"/>`;
    for(let i=0;i<9;i++) g += `<rect x="${mx}" y="${48+i*18}" width="8" height="7" fill="#080f16"/>`;
    g += `<text x="${mx+4}" y="30" class="cs" text-anchor="middle">shadow mask</text>`;
    g += `<text x="${mx+4}" y="222" class="cs" text-anchor="middle">perforated steel</text>`;
    /* screen with triads */
    g += `<rect x="${scx}" y="40" width="140" height="168" rx="4" fill="#080f16" stroke="#2a3a4a"/>`;
    const cellsX = 4, cellsY = 4, cw = 132/cellsX, ch = 160/cellsY;
    for(let a=0;a<cellsX;a++) for(let b=0;b<cellsY;b++){
      const bx = scx+4+a*cw, by = 44+b*ch;
      COLOUR.primaries.forEach((c,i)=>{
        const col = {red:"#e04a4a", green:"#3ad68b", blue:"#5b8cff"}[c];
        const v = clamp(s.out[c],0,1.4);
        g += `<rect x="${bx+2+i*(cw-6)/3}" y="${by+3}" width="${(cw-6)/3-2}" height="${ch-9}" rx="2"
                fill="${col}" opacity="${0.06 + 0.9*Math.min(1,v)}"/>`;
      });
      g += `<rect x="${bx}" y="${by}" width="${cw-2}" height="${ch-3}" fill="none" stroke="#243444"/>`;
    }
    g += `<text x="${scx+70}" y="30" class="cs" text-anchor="middle">triads (pixels) on the screen</text>`;
    g += `<text x="${scx+70}" y="222" class="cs" text-anchor="middle" fill="${s.purity>0.95?HI:(s.purity>0.5?AMB:ACC)}">colour purity ${pct(s.purity)}</text>`;

    anim.innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}">
      <style>.ml{fill:#0b1219;font:700 11px system-ui;text-anchor:middle}
             .cs{fill:#8fa3b5;font:600 9.5px system-ui}</style>${g}</svg>`;

    ro.innerHTML = "";
    ro.appendChild(readout([
      {k:"Dot-pitch", v:pitch.toFixed(2)+" mm"},
      {k:"Resolution", v:Math.round(s.res).toLocaleString()+" triads / sq in", cls:s.res>8000?"g":""},
      {k:"Beam on its own phosphor", v:pct(s.purity), cls:s.purity>0.95?"g":(s.purity>0.5?"":"r")},
      {k:"Light out (R / G / B)", v:s.out.red.toFixed(2)+" / "+s.out.green.toFixed(2)+" / "+s.out.blue.toFixed(2)},
      {k:"Total light", v:s.total.toFixed(2)+" (drive "+s.driveTotal.toFixed(2)+")", cls:"c"}
    ]));

    note.innerHTML = "";
    let cls = "", body;
    if(s.purity >= 0.999){
      body = "<b>Aligned.</b> Each of the <b>3 electron guns</b> is dedicated to one primary colour, and the "+
        "<b>"+COLOUR.maskIs+"</b> placed <b>"+COLOUR.maskAt+"</b> lets each beam through only onto its designated "+
        "phosphor. Drive one gun on its own and check the screen: nothing else lights. That is the mask doing its job "+
        "by geometry &mdash; the three guns sit at three slightly different positions, so their beams arrive at each "+
        "hole at three slightly different angles.";
    }else if(s.purity === 0){
      cls = "err";
      body = "<b>Fully misregistered.</b> The mask is displaced by a whole dot width, so <i>none</i> of any beam lands "+
        "on its own phosphor &mdash; every gun is now lighting its neighbour's dot. Notice the <b>total light output "+
        "has not changed</b>. The electrons still arrive with the same energy; they are simply exciting the wrong "+
        "phosphor. A mask fault corrupts colour, it does not darken the picture &mdash; which is why a display that "+
        "has gone pink or muddy points here rather than at the gun.";
    }else{
      cls = "warn";
      body = "<b>Colour purity failing.</b> Only "+pct(s.purity)+" of each beam is landing on its designated phosphor; "+
        "the rest is spilling onto the neighbouring dot. On a real tube this happens for two reasons, and both are "+
        "in the word <i>steel</i>: the mask is a mechanical part that can shift, and it absorbs most of the beam "+
        "energy as heat and therefore <b>expands</b> &mdash; which is why colour purity typically degrades after an "+
        "hour of running and is worst away from the mounting points.";
    }
    body += "<br><br><span class='tiny muted'><b>Resolution</b> is the number of triads that fit into a square inch; "+
      "<b>dot-pitch</b> is the distance between the pixels. They are different measurements of the same packing, "+
      "which is why a smaller pitch always reads as a higher resolution. The purity figure here is an illustrative "+
      "geometric model &mdash; each dot occupies a third of the pitch, so a beam displaced by that much has left its "+
      "own dot entirely. The deck states the mask's purpose, not a misregistration curve.</span>";
    note.appendChild(el("div",{class:"note "+cls, style:"margin-bottom:0"}, body));
    redrawTask && redrawTask();
  }

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>`pitch ${s.pitch.toFixed(2)} mm &middot; offset ${s.offset.toFixed(3)} mm &middot; purity ${pct(s.purity)} &middot; ${Math.round(s.res).toLocaleString()} triads/sq in`,
    id);
  draw();
};
/* ---------------- M5 · CORRECTION BENCH ---------------- */
LABS.m5 = function(host, id, tier){
  const box = labShell("Correction bench","Three distortions, two of them geometry &mdash; correct each one and see which control does it");
  const B = box._body;
  host.appendChild(box);

  let cushionK = 0.22, linA = 0.20, gamma = 2.2;
  let devCoil = 0;                          /* 0 = uncorrected, 100 = fully corrected */
  let gammaOn = false;
  let drive = 50;                           /* test-pattern drive level, % */

  const cols = el("div",{class:"lab-cols wide-left"});
  const left = el("div"), right = el("div");
  cols.appendChild(left); cols.appendChild(right);
  B.appendChild(cols);

  const anim = el("div"); left.appendChild(anim);
  const ro   = el("div",{style:"margin-top:14px"}); left.appendChild(ro);
  const note = el("div",{style:"margin-top:12px"}); left.appendChild(note);

  right.appendChild(el("div",{class:"eyebrow"},"Fault present on this tube"));
  const faultSeg = segBar([["cushion","Cushion"],["linearity","Linearity"],["gamma","Gamma"]], "cushion",
    v=>{ fault=v; devCoil=0; gammaOn=false; sync(); draw(); labTouch(id,8); }, "margin-bottom:14px");
  right.appendChild(faultSeg);
  let fault = "cushion";

  right.appendChild(ctrl("Deviation coil current correction","m5dv", range("m5d",0,100,1,0)));
  $("#m5d").addEventListener("input", e=>{ devCoil=+e.target.value; draw(); labTouch(id,8); });

  const gRow = el("div",{style:"margin:10px 0 14px"});
  right.appendChild(gRow);
  const gBtn = toggleBtn(gRow,"Gamma correction APPLIED","Gamma correction off",
    ()=>gammaOn, v=>{gammaOn=v;}, ()=>{ draw(); labTouch(id,8); });

  right.appendChild(ctrl("Test pattern drive","m5vv", range("m5v",0,100,1,drive)));
  $("#m5v").addEventListener("input", e=>{ drive=+e.target.value; draw(); labTouch(id,8); });
  right.appendChild(ctrl("Tube gamma","m5gv", range("m5g",1.6,2.8,0.1,gamma)));
  $("#m5g").addEventListener("input", e=>{ gamma=+e.target.value; draw(); labTouch(id,8); });

  const TASKS = {
    foundation:[
      {q:"With the <b>cushion</b> fault selected, wind the deviation coil correction up until the edges are straight.",
       test:s=>s.fault==="cushion" && s.devCoil>=92},
      {q:"Switch to the <b>linearity</b> fault and correct that one too. Note it takes the same control.",
       test:s=>s.fault==="linearity" && s.devCoil>=92},
      {q:"Switch to the <b>gamma</b> fault and try the deviation coil control on it. Then read why it does nothing.",
       test:s=>s.fault==="gamma" && s.devCoil>=50}
    ],
    developing:[
      {q:"On the gamma fault, set the drive to <b>50%</b> and read how much light actually comes out uncorrected.",
       test:s=>s.fault==="gamma" && !s.gammaOn && s.drive>=45 && s.drive<=55},
      {q:"Now apply <b>gamma correction</b> and read the light output at the same drive.",
       test:s=>s.fault==="gamma" && s.gammaOn && s.drive>=45 && s.drive<=55 && s.err<0.01},
      {q:"Change the <b>tube gamma</b> to 2.6 and confirm the correction still lands on a straight line.",
       test:s=>s.gammaOn && s.gamma>=2.55 && s.err<0.01}
    ],
    proficient:[
      {q:"Show that cushion distortion is <b>symmetrical</b>: leave it uncorrected and read the symmetry figure.",
       test:s=>s.fault==="cushion" && s.devCoil<=10},
      {q:"Now show that linearity distortion is <b>not</b> symmetrical, uncorrected.",
       test:s=>s.fault==="linearity" && s.devCoil<=10},
      {q:"Correct the linearity fault fully, then leave the tube with a <b>correct shape but crushed mid-greys</b>.",
       test:s=>s.devCoil>=92 && !s.gammaOn && s.drive>=30 && s.drive<=70 && s.err>0.1}
    ]
  };

  function state(){
    const k = fault==="cushion"   ? cushionK*(1-devCoil/100) : 0;
    const a = fault==="linearity" ? linA*(1-devCoil/100)     : 0;
    const v = drive/100;
    const lum = screenLuminance(v, gamma, gammaOn);
    return {fault, devCoil, gammaOn, drive, gamma, k, a, v, lum,
            err:Math.abs(lum - v),
            symmetric: fault!=="linearity"};
  }

  function draw(){
    const s = state();
    gBtn._sync();
    $("#m5dv").textContent = devCoil + "%";
    $("#m5vv").textContent = drive + "%";
    $("#m5gv").textContent = "γ = " + gamma.toFixed(1);

    const W = 470, H = 236;
    const gx = 22, gy = 18, gw = 210, gh = 200;
    const cx = gx+gw/2, cy = gy+gh/2, hw = gw/2-10, hh = gh/2-10;
    let g = "";
    g += `<rect x="${gx}" y="${gy}" width="${gw}" height="${gh}" rx="5" fill="#080f16" stroke="#2a3a4a"/>`;
    /* warped test grid */
    const N = 6;
    const map = (u,w)=>{
      let p = [u,w];
      if(s.k) p = cushionWarp(p[0],p[1],s.k);
      if(s.a) p = linearityWarp(p[0],p[1],s.a);
      return [cx + p[0]*hw, cy + p[1]*hh];
    };
    const lit = Math.max(0.08, s.lum);
    for(let i=0;i<=N;i++){
      const u = -1 + 2*i/N;
      let d1="", d2="";
      for(let j=0;j<=24;j++){
        const w = -1 + 2*j/24;
        const p1 = map(u,w), p2 = map(w,u);
        d1 += (j?"L":"M")+p1[0].toFixed(1)+","+p1[1].toFixed(1)+" ";
        d2 += (j?"L":"M")+p2[0].toFixed(1)+","+p2[1].toFixed(1)+" ";
      }
      g += `<path d="${d1}" stroke="#5fb7d9" stroke-width="1.3" fill="none" opacity="${lit}"/>`;
      g += `<path d="${d2}" stroke="#5fb7d9" stroke-width="1.3" fill="none" opacity="${lit}"/>`;
    }
    g += `<text x="${cx}" y="${gy+gh+14}" class="cs" text-anchor="middle">${
      (s.k||s.a) ? (fault==="cushion"?"cushion distortion":"linearity distortion")+" &middot; "+(100-devCoil)+"% uncorrected"
                 : (fault==="gamma" ? "geometry is correct &mdash; look at the brightness" : "geometry corrected")}</text>`;

    /* the gamma transfer curve */
    const px = 262, py = 26, pw = 180, ph = 160;
    g += `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="4" fill="#080f16" stroke="#2a3a4a"/>`;
    g += `<line x1="${px}" y1="${py+ph}" x2="${px+pw}" y2="${py}" stroke="${GRID}" stroke-width="1.5" stroke-dasharray="3 3"/>`;
    let curve = "";
    for(let i=0;i<=40;i++){
      const v = i/40, l = screenLuminance(v, gamma, gammaOn);
      curve += (i?"L":"M")+(px + v*pw).toFixed(1)+","+(py + ph - l*ph).toFixed(1)+" ";
    }
    g += `<path d="${curve}" stroke="${gammaOn?HI:ACC}" stroke-width="2.2" fill="none"/>`;
    g += `<circle cx="${px + s.v*pw}" cy="${py + ph - s.lum*ph}" r="4.5" fill="${AMB}"/>`;
    g += `<text x="${px+pw/2}" y="${py-8}" class="cs" text-anchor="middle">luminance against input voltage</text>`;
    g += `<text x="${px+pw/2}" y="${py+ph+14}" class="cs" text-anchor="middle" fill="${gammaOn?HI:ACC}">${
      gammaOn ? "corrected &mdash; the relationship is linear" : "uncorrected &mdash; luminance &prop; V to the power "+gamma.toFixed(1)}</text>`;
    /* grey ramp */
    for(let i=0;i<10;i++){
      const v = (i+0.5)/10, l = screenLuminance(v, gamma, gammaOn);
      g += `<rect x="${px + i*pw/10}" y="${py+ph+22}" width="${pw/10-1}" height="14" fill="#eafff4" opacity="${l.toFixed(3)}"/>`;
    }
    g += `<text x="${px+pw/2}" y="${H-2}" class="cs" text-anchor="middle">grey ramp as the eye sees it</text>`;

    anim.innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}">
      <style>.cs{fill:#8fa3b5;font:600 9.5px system-ui}</style>${g}</svg>`;

    const c = CORR_BY_ID[fault];
    ro.innerHTML = "";
    ro.appendChild(readout([
      {k:"Fault", v:c.name+" ("+c.kind+")"},
      {k:"Cause", v:c.cause},
      {k:"Remedy", v:c.remedy, cls:c.kind==="geometry"?"c":""},
      {k:"Geometry error", v:(s.k||s.a) ? "present, "+(s.symmetric?"symmetrical":"asymmetrical") : "none", cls:(s.k||s.a)?"r":"g"},
      {k:"Light out at "+drive+"% drive", v:Math.round(s.lum*100)+"%  (should be "+drive+"%)", cls:s.err<0.01?"g":(s.err>0.1?"r":"")}
    ]));

    note.innerHTML = "";
    let cls = "", body;
    if(fault === "gamma"){
      cls = gammaOn ? "" : "warn";
      body = "<b>Gamma is not a shape fault.</b> The grid on the left is perfectly square whatever you do with the "+
        "deviation coil control &mdash; the coils steer the beam, they have nothing to do with brightness. "+
        "The CRT does not produce a luminance proportional to the input voltage; it is proportional to the "+
        "<b>input voltage raised to the power gamma</b>. At "+drive+"% drive you are getting "+Math.round(s.lum*100)+"% "+
        "of full brightness."+
        (gammaOn
          ? " With <b>gamma correction</b> applied, the signal is pre-distorted the opposite way, so the combination "+
            "comes out on the straight dashed line. That is what &lsquo;introduced to make the relationship linear&rsquo; means."
          : " Look at the grey ramp: the mid-tones are crushed towards black. Apply gamma correction and watch the "+
            "curve straighten onto the dashed line.");
    }else if(devCoil >= 92){
      cls = "";
      body = "<b>Corrected.</b> "+c.name+" distortion is caused by <b>"+c.cause+"</b>, and it is corrected through "+
        "<b>"+c.remedy+"</b> &mdash; the same control that corrects the other geometry fault. That is why the deck "+
        "lists them as two separate corrections sharing one remedy: different causes, different correction shapes, "+
        "one handle."+
        (!gammaOn && drive>10 && drive<90
          ? "<br><br>Note the shape is now right but the grey ramp is still wrong. Geometry and brightness are "+
            "independent problems, and this tube still has the gamma one."
          : "");
    }else if(fault === "cushion"){
      cls = "warn";
      body = "<b>Cushion distortion.</b> All four sides bow inwards <b>equally</b> and the error grows towards the "+
        "corners, while the centre lines stay put. That symmetry is the signature, and it points straight at the "+
        "cause: <b>curvature of the screen</b>. Equal deflection angles do not reach equally distant points on a "+
        "curved surface, so the correction has to vary with how far off-centre the beam is &mdash; applied through "+
        "the <b>deviation coil current</b>.";
    }else{
      cls = "warn";
      body = "<b>Linearity distortion.</b> Notice this one is <b>not</b> symmetrical: one side is stretched and the "+
        "other compressed, so evenly spaced features do not come out evenly spaced. The <b>geometrical shape of the "+
        "object is distorted</b>, and the cause lies in the sweep rather than in the screen &mdash; but the only "+
        "handle on where the beam lands is the same one, the <b>deviation coil current</b>.";
    }
    note.appendChild(el("div",{class:"note "+cls, style:"margin-bottom:0"}, body));
    redrawTask && redrawTask();
  }
  function sync(){ const n=$("#m5d"); if(n) n.value = devCoil; }

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>`${CORR_BY_ID[s.fault].name} &middot; coil correction ${s.devCoil}% &middot; gamma correction ${s.gammaOn?"on":"off"} &middot; ${s.drive}% drive &rarr; ${Math.round(s.lum*100)}% light`,
    id);
  draw();
};

/* ---------------- M6 · LIGHT-PATH BENCH ---------------- */
LABS.m6 = function(host, id, tier){
  const box = labShell("LCD light-path bench","Follow the light through the sandwich, then switch the voltage on");
  const B = box._body;
  host.appendChild(box);

  let volts = 0;                 /* 0..100 % of full segment voltage */
  let lampOn = true;
  let crystalFitted = true;

  const cols = el("div",{class:"lab-cols wide-left"});
  const left = el("div"), right = el("div");
  cols.appendChild(left); cols.appendChild(right);
  B.appendChild(cols);

  const anim = el("div"); left.appendChild(anim);
  const ro   = el("div",{style:"margin-top:14px"}); left.appendChild(ro);
  const note = el("div",{style:"margin-top:12px"}); left.appendChild(note);

  right.appendChild(ctrl("Voltage across the segment","m6vv", range("m6v",0,100,1,0)));
  $("#m6v").addEventListener("input", e=>{ volts=+e.target.value; draw(); labTouch(id,8); });

  const swRow = el("div",{style:"margin:10px 0 14px"});
  right.appendChild(swRow);
  const lampBtn = toggleBtn(swRow,"Backlight lamp ON","Backlight lamp FAILED",
    ()=>lampOn, v=>{lampOn=v;}, ()=>{ draw(); labTouch(id,8); });
  const xtalBtn = toggleBtn(swRow,"Liquid crystal fitted","Liquid crystal REMOVED",
    ()=>crystalFitted, v=>{crystalFitted=v;}, ()=>{ draw(); labTouch(id,8); });

  const jump = el("div",{class:"btn-row", style:"margin-bottom:14px"});
  [["No voltage",0],["Half",50],["Full voltage",100]].forEach(p=>{
    jump.appendChild(el("button",{class:"btn sec", style:"font-size:.74rem;padding:7px 9px", onclick:()=>{
      volts=p[1]; const n=$("#m6v"); if(n) n.value=volts; draw(); labTouch(id,8);
    }}, p[0]));
  });
  right.appendChild(jump);

  const TASKS = {
    foundation:[
      {q:"Set <b>no voltage</b> across the segment and read whether it is visible.",
       test:s=>s.volts===0 && s.lampOn && s.crystalFitted},
      {q:"Now apply <b>full voltage</b> and read what the segment does.",
       test:s=>s.volts>=99 && s.lampOn && s.crystalFitted},
      {q:"Read the twist angle in both states, and leave the bench at the state where light passes.",
       test:s=>s.volts<=2 && s.lampOn && s.crystalFitted && s.transmission>0.99}
    ],
    developing:[
      {q:"Produce a <b>mid-grey</b> segment &mdash; between 35% and 65% of the light getting through.",
       test:s=>s.lampOn && s.crystalFitted && s.transmission>0.35 && s.transmission<0.65},
      {q:"<b>Remove the liquid crystal</b> and confirm what the two crossed polarisers do on their own.",
       test:s=>!s.crystalFitted && s.lampOn},
      {q:"Refit the crystal, then <b>fail the backlight</b> with the segment still being driven black.",
       test:s=>s.crystalFitted && !s.lampOn && s.volts>=80}
    ],
    proficient:[
      {q:"Set the state a technician would call &lsquo;the display is blank&rsquo; on a working LCD with power removed from every segment.",
       test:s=>s.volts===0 && s.lampOn && s.crystalFitted && !s.visible},
      {q:"Now produce the fault where the drive is perfect but nothing is readable from the front.",
       test:s=>!s.lampOn && s.crystalFitted},
      {q:"Finally, show the case where the panel would be black at <b>every</b> voltage &mdash; the crossed pair with nothing to rotate the light.",
       test:s=>!s.crystalFitted && s.lampOn && s.volts>=50}
    ]
  };

  function state(){
    const v = volts/100;
    const seg = lcdSegment(volts > 50);
    const transmission = crystalFitted ? lcdTransmission(v) : 0;
    const outLight = lampOn ? transmission : 0;
    const visible = crystalFitted ? (transmission < 0.5) : true;
    return {volts, lampOn, crystalFitted, v, seg, transmission, outLight, visible,
            twist: crystalFitted ? Math.round(90*(1-v)) : 0};
  }

  function draw(){
    const s = state();
    lampBtn._sync(); xtalBtn._sync();
    $("#m6vv").textContent = volts + "%";

    const W = 470, H = 216;
    const y0 = 44, hgt = 108;
    const xs = [30, 108, 186, 284, 358];      /* lamp, pol1, crystal, pol2, mirror/eye */
    let g = "";
    const layer=(x,w,fill,stroke,lab,sub)=>{
      g += `<rect x="${x}" y="${y0}" width="${w}" height="${hgt}" rx="3" fill="${fill}" stroke="${stroke}"/>`;
      g += `<text x="${x+w/2}" y="${y0-10}" class="cs" text-anchor="middle">${lab}</text>`;
      if(sub) g += `<text x="${x+w/2}" y="${y0+hgt+14}" class="cs" text-anchor="middle">${sub}</text>`;
    };
    /* lamp */
    layer(xs[0], 26, lampOn?"#f7e6a8":"#1b2836", lampOn?"#f5d98a":"#33475c", "lamp", lampOn?"":"failed");
    if(!lampOn) g += `<line x1="${xs[0]}" y1="${y0}" x2="${xs[0]+26}" y2="${y0+hgt}" stroke="${ACC}" stroke-width="2"/>`;
    /* first polariser */
    layer(xs[1], 16, "#20303f", "#3c5165", "polariser 1", "vertical");
    for(let i=0;i<7;i++) g += `<line x1="${xs[1]+3+i*2}" y1="${y0+4}" x2="${xs[1]+3+i*2}" y2="${y0+hgt-4}" stroke="#587490" stroke-width="0.9"/>`;
    /* liquid crystal */
    if(s.crystalFitted){
      layer(xs[2], 62, "#12202c", "#3c5165", "liquid crystal", s.twist+"&deg; twist");
      for(let i=0;i<5;i++){
        const yy = y0 + 14 + i*20;
        for(let j=0;j<6;j++){
          const f = j/5, ang = s.twist * f;
          const mxp = xs[2]+8+j*10, len = 7;
          const dx = len*Math.cos(ang*Math.PI/180), dy = len*Math.sin(ang*Math.PI/180);
          g += `<line x1="${(mxp-dx/2).toFixed(1)}" y1="${(yy-dy/2).toFixed(1)}" x2="${(mxp+dx/2).toFixed(1)}" y2="${(yy+dy/2).toFixed(1)}"
                  stroke="${volts>50?VIO:CYN}" stroke-width="2" stroke-linecap="round"/>`;
        }
      }
    }else{
      g += `<rect x="${xs[2]}" y="${y0}" width="62" height="${hgt}" rx="3" fill="#0d1620" stroke="#33475c" stroke-dasharray="4 3"/>`;
      g += `<text x="${xs[2]+31}" y="${y0-10}" class="cs" text-anchor="middle">no crystal</text>`;
      g += `<text x="${xs[2]+31}" y="${y0+hgt/2}" class="cs" text-anchor="middle" fill="${ACC}">nothing to rotate the light</text>`;
    }
    /* second polariser */
    layer(xs[3], 16, "#20303f", "#3c5165", "polariser 2", "horizontal");
    for(let i=0;i<6;i++) g += `<line x1="${xs[3]+2}" y1="${y0+8+i*18}" x2="${xs[3]+14}" y2="${y0+8+i*18}" stroke="#587490" stroke-width="0.9"/>`;
    /* light beam through the stack */
    const beamY = y0 + hgt/2;
    if(lampOn){
      g += `<rect x="${xs[0]+26}" y="${beamY-13}" width="${xs[1]-xs[0]-26}" height="26" fill="#f7e6a8" opacity=".5"/>`;
      g += `<rect x="${xs[1]+16}" y="${beamY-9}" width="${xs[2]-xs[1]-16}" height="18" fill="#cfe4f5" opacity=".38"/>`;
      if(s.crystalFitted)
        g += `<rect x="${xs[2]+62}" y="${beamY-9}" width="${xs[3]-xs[2]-62}" height="18" fill="#cfe4f5" opacity=".38"/>`;
      if(s.outLight > 0.01)
        g += `<rect x="${xs[3]+16}" y="${beamY-9}" width="${xs[4]-xs[3]-4}" height="18" fill="#eafff4" opacity="${(0.15+0.7*s.outLight).toFixed(3)}"/>`;
      else
        g += `<text x="${xs[3]+52}" y="${beamY+4}" class="cs" fill="${ACC}">blocked</text>`;
    }else{
      g += `<text x="${xs[1]+60}" y="${beamY+4}" class="cs" fill="${ACC}">no light entering the panel</text>`;
    }
    /* what the viewer sees */
    const segCol = s.outLight;
    g += `<rect x="${xs[4]+10}" y="${y0+18}" width="72" height="72" rx="5" fill="#0d1620" stroke="#33475c"/>`;
    g += `<rect x="${xs[4]+22}" y="${y0+30}" width="48" height="48" rx="3" fill="#eafff4" opacity="${Math.max(0.02, segCol).toFixed(3)}"/>`;
    g += `<text x="${xs[4]+46}" y="${y0-10}" class="cs" text-anchor="middle">the segment</text>`;
    g += `<text x="${xs[4]+46}" y="${y0+hgt+14}" class="cs" text-anchor="middle" fill="${s.visible?ACC:HI}">${
      !lampOn ? "nothing visible" : (s.visible ? "BLACK &mdash; visible" : "not visible")}</text>`;
    g += `<text x="235" y="${H-4}" class="cs" text-anchor="middle">the two polarisers are crossed &middot; ${LCD_SOURCE}</text>`;

    anim.innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}">
      <style>.cs{fill:#8fa3b5;font:600 9.5px system-ui}</style>${g}</svg>`;

    ro.innerHTML = "";
    ro.appendChild(readout([
      {k:"Voltage across the segment", v:volts+"%"},
      {k:"Crystal twist", v:s.crystalFitted ? s.twist+" degrees" : "no crystal fitted", cls:s.crystalFitted?"":"r"},
      {k:"Light through polariser 2", v:pct(s.transmission), cls:s.transmission>0.9?"g":(s.transmission<0.1?"r":"")},
      {k:"Reaching the viewer", v:lampOn ? pct(s.outLight) : "none (lamp out)", cls:lampOn?"":"r"},
      {k:"Segment", v:!lampOn ? "nothing visible" : (s.visible?"BLACK — visible":"not visible"),
       cls:!lampOn ? "r" : (s.visible?"c":"g")}
    ]));

    note.innerHTML = "";
    let cls = "", body;
    if(!lampOn){
      cls = "err";
      body = "<b>The backlight has failed.</b> The shutters are still being set correctly &mdash; the voltage is doing "+
        "exactly what it should to the crystal &mdash; but an LCD <b>does not emit its own light</b>, so with nothing "+
        "behind the panel there is nothing to block or pass. This is why the deck insists it <b>requires an external "+
        "light source for readout</b>. Shine a torch at the panel and the readings come back, which is how you tell "+
        "this fault from a dead drive.";
    }else if(!crystalFitted){
      cls = "warn";
      body = "<b>Two crossed polarisers block everything.</b> With no liquid crystal there to rotate the light, "+
        "whatever gets through the first polariser is exactly what the second one rejects &mdash; at every voltage. "+
        "That is the <i>default</i> state of the sandwich, and it is why the crystal has to be there at all: its job "+
        "is to <b>twist the light by 90 degrees</b> so it can get past the crossed pair.";
    }else if(volts <= 2){
      cls = "";
      body = "<b>No voltage, and the segment is NOT visible.</b> The crystal twists the light by <b>90 degrees</b>, "+
        "which lines it up with the second polariser, so it passes through and is reflected back via the mirror. "+
        "Light comes back out and the segment looks like everything around it. Say it out loud until it stops "+
        "feeling wrong: on an LCD, <b>off means invisible</b>.";
    }else if(volts >= 98){
      cls = "";
      body = "<b>Voltage applied, and the segment turns BLACK.</b> The molecules <b>align themselves</b> with the "+
        "field, so the twist is gone. The light reaches the second polariser still crossed with it and cannot pass "+
        "through. No light returns from this spot, so it reads black &mdash; and black is what makes it visible. "+
        "You are powering a <b>shutter</b>, not a lamp.";
    }else{
      cls = "";
      body = "<b>A level of gray.</b> Partial voltage gives partial alignment, so the light is rotated part of the "+
        "way and the second polariser passes some of it and rejects the rest &mdash; "+pct(s.transmission)+" through "+
        "at this setting. Each liquid crystal <b>acts like a shutter</b>, and controlling the voltage across each "+
        "pixel lets light through in <b>varying amounts</b>. That continuous control is what makes photographic "+
        "images possible on a panel that can only block or pass.";
    }
    note.appendChild(el("div",{class:"note "+cls, style:"margin-bottom:0"}, body));
    redrawTask && redrawTask();
  }

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>`${s.volts}% volts &middot; lamp ${s.lampOn?"on":"failed"} &middot; crystal ${s.crystalFitted?"fitted":"removed"} &rarr; ${pct(s.transmission)} through, segment ${s.lampOn?(s.visible?"black":"not visible"):"dark"}`,
    id);
  draw();
};

/* ---------------- M7 · MATRIX BENCH ---------------- */
LABS.m7 = function(host, id, tier){
  const box = labShell("Viewing mode &amp; matrix bench","Walk the ambient light from a dark hangar to tropical noon, on both panels");
  const B = box._body;
  host.appendChild(box);

  let mode = "transmissive";
  let logLux = 2.5;                        /* 0 .. 5  => 1 .. 100000 lux */
  let backlight = true;
  let matrix = "active";
  let rows = 480, cols = 640;

  const cols_ = el("div",{class:"lab-cols wide-left"});
  const left = el("div"), right = el("div");
  cols_.appendChild(left); cols_.appendChild(right);
  B.appendChild(cols_);

  const anim = el("div"); left.appendChild(anim);
  const ro   = el("div",{style:"margin-top:14px"}); left.appendChild(ro);
  const note = el("div",{style:"margin-top:12px"}); left.appendChild(note);

  right.appendChild(el("div",{class:"eyebrow"},"Viewing mode"));
  right.appendChild(segBar([["transmissive","Transmissive"],["reflective","Reflective"]], mode,
    v=>{ mode=v; draw(); labTouch(id,8); }, "margin-bottom:14px"));

  right.appendChild(ctrl("Ambient light","m7lv", range("m7l",0,5,0.05,logLux)));
  $("#m7l").addEventListener("input", e=>{ logLux=+e.target.value; draw(); labTouch(id,8); });
  const envRow = el("div",{class:"btn-row", style:"margin-bottom:14px"});
  [["Dark hangar",0],["Indoors",2.48],["Outdoor shade",3.9],["Tropical noon",5]].forEach(p=>{
    envRow.appendChild(el("button",{class:"btn sec", style:"font-size:.72rem;padding:7px 8px", onclick:()=>{
      logLux=p[1]; const n=$("#m7l"); if(n) n.value=logLux; draw(); labTouch(id,8);
    }}, p[0]));
  });
  right.appendChild(envRow);

  const blRow = el("div",{style:"margin-bottom:14px"});
  right.appendChild(blRow);
  const blBtn = toggleBtn(blRow,"Backlight ON","Backlight FAILED", ()=>backlight, v=>{backlight=v;},
    ()=>{ draw(); labTouch(id,8); });

  right.appendChild(el("div",{class:"eyebrow"},"Matrix type"));
  right.appendChild(segBar([["passive","Passive (TN/STN)"],["active","Active (TFT)"]], matrix,
    v=>{ matrix=v; draw(); labTouch(id,8); }, "margin-bottom:14px"));

  right.appendChild(el("div",{class:"eyebrow"},"Panel size"));
  right.appendChild(segBar([["seg","7 segments"],["small","64 x 64"],["panel","480 x 640"]], "panel",
    v=>{ if(v==="seg"){rows=1;cols=7;} else if(v==="small"){rows=64;cols=64;} else {rows=480;cols=640;}
         draw(); labTouch(id,8); }, "margin-bottom:14px"));

  const TASKS = {
    foundation:[
      {q:"Put the <b>transmissive</b> panel indoors and read the verdict.",
       test:s=>s.mode==="transmissive" && s.lux>100 && s.lux<1000 && s.backlight && s.verdict==="excellent"},
      {q:"Take that same panel out into <b>tropical noon</b> and read what direct sunlight does to it.",
       test:s=>s.mode==="transmissive" && s.lux>=90000 && s.verdict==="unreadable"},
      {q:"Switch to <b>reflective</b> at tropical noon, then take it into the <b>dark hangar</b>.",
       test:s=>s.mode==="reflective" && s.lux<=2}
    ],
    developing:[
      {q:"Find the ambient level at which the transmissive panel drops from excellent to merely <b>usable</b> &mdash; the deck's &lsquo;outdoors in the shade&rsquo; case.",
       test:s=>s.mode==="transmissive" && s.backlight && s.verdict==="usable"},
      {q:"Show the one condition where the <b>reflective</b> panel beats the transmissive one outright.",
       test:s=>s.mode==="reflective" && s.verdict==="excellent" && s.lux>20000},
      {q:"Set the panel to <b>480 x 640</b> and compare the contact count for passive against active.",
       test:s=>s.rows===480 && s.matrix==="passive"}
    ],
    proficient:[
      {q:"Show why passive matrix is only workable at a <b>small number of segments</b>: set 7 segments, passive, and read the contact count.",
       test:s=>s.matrix==="passive" && s.rows===1 && s.contacts<=8},
      {q:"Now scale that same passive wiring to a full <b>480 x 640</b> cockpit panel.",
       test:s=>s.matrix==="passive" && s.rows===480 && s.contacts>300000},
      {q:"Switch to <b>active matrix</b> at that size and read what the thin film transistor buys you.",
       test:s=>s.matrix==="active" && s.rows===480 && s.contacts<2000},
      {q:"Finally, configure the panel the deck names for the cockpit: active matrix, full size, transmissive with the backlight on.",
       test:s=>s.matrix==="active" && s.rows===480 && s.mode==="transmissive" && s.backlight}
    ]
  };

  function state(){
    const lux = Math.pow(10, logLux);
    const r = readability(mode, lux, backlight);
    return {mode, lux, backlight, matrix, rows, cols,
            score:r.score, verdict:r.verdict, why:r.why,
            contacts:contactsFor(matrix, rows, cols)};
  }

  function draw(){
    const s = state();
    blBtn._sync();
    $("#m7lv").textContent = s.lux >= 1000 ? Math.round(s.lux/1000)+"k lux" : Math.round(s.lux)+" lux";

    const W = 470, H = 226;
    let g = "";
    /* the scene: ambient wash behind the panel */
    const amb = clamp(logLux/5, 0, 1);
    g += `<rect x="0" y="0" width="${W}" height="${H}" fill="#08111a"/>`;
    g += `<rect x="0" y="0" width="${W}" height="${H}" fill="#c9dcf0" opacity="${(amb*0.30).toFixed(3)}"/>`;
    /* panel */
    const px = 40, py = 34, pw = 190, ph = 150;
    g += `<rect x="${px-8}" y="${py-8}" width="${pw+16}" height="${ph+16}" rx="7" fill="#14202b" stroke="#33475c"/>`;
    g += `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" fill="#050a0f"/>`;
    /* backlight glow behind the panel, transmissive only */
    if(mode==="transmissive" && backlight)
      g += `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" fill="#eef7ff" opacity=".5"/>`;
    if(mode==="reflective")
      g += `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" fill="#eef7ff" opacity="${(0.06+0.5*amb).toFixed(3)}"/>`;
    /* readable content, faded by the readability score */
    const cont = clamp(s.score, 0, 1);
    ["ALT   24 000","IAS      280","HDG      147","N1     92.4%"].forEach((line,i)=>{
      g += `<text x="${px+16}" y="${py+34+i*32}" fill="#0b1219" opacity="${(0.10+0.9*cont).toFixed(3)}"
              style="font:700 15px ui-monospace,monospace">${line}</text>`;
    });
    /* sun / dark marker */
    if(logLux > 4.3) g += `<circle cx="${W-46}" cy="34" r="15" fill="#ffe9a3"/><text x="${W-46}" y="60" class="cs" text-anchor="middle">direct sun</text>`;
    else if(logLux < 0.6) g += `<text x="${W-58}" y="38" class="cs" text-anchor="middle">dark</text>`;
    /* verdict */
    const vc = s.verdict==="excellent"?HI:(s.verdict==="usable"?AMB:ACC);
    g += `<text x="${px+pw/2}" y="${py+ph+26}" class="cs" text-anchor="middle" fill="${vc}">${s.verdict.toUpperCase()}</text>`;
    /* matrix wiring diagram */
    const wx = 268, wy = 40, ws = 118;
    g += `<rect x="${wx}" y="${wy}" width="${ws}" height="${ws}" rx="4" fill="#0d1620" stroke="#2a3a4a"/>`;
    const n = 6;
    for(let i=0;i<n;i++) for(let j=0;j<n;j++){
      const cxp = wx+12+j*(ws-24)/(n-1), cyp = wy+12+i*(ws-24)/(n-1);
      g += `<rect x="${cxp-6}" y="${cyp-6}" width="12" height="12" rx="2" fill="#16232f" stroke="#2f4256"/>`;
      if(matrix==="active")
        g += `<rect x="${cxp-2}" y="${cyp-2}" width="5" height="5" rx="1" fill="${HI}"/>`;
      else
        g += `<line x1="${cxp}" y1="${cyp}" x2="${wx}" y2="${cyp - 3 + (j-2)*1.5}" stroke="${AMB}" stroke-width="0.5" opacity=".55"/>`;
    }
    if(matrix==="active"){
      for(let i=0;i<n;i++){
        const yy = wy+12+i*(ws-24)/(n-1), xx = wx+12+i*(ws-24)/(n-1);
        g += `<line x1="${wx}" y1="${yy}" x2="${wx+ws}" y2="${yy}" stroke="${CYN}" stroke-width="0.7" opacity=".5"/>`;
        g += `<line x1="${xx}" y1="${wy}" x2="${xx}" y2="${wy+ws}" stroke="${VIO}" stroke-width="0.7" opacity=".5"/>`;
      }
    }
    g += `<text x="${wx+ws/2}" y="${wy-8}" class="cs" text-anchor="middle">${MATRIX[matrix].name}</text>`;
    g += `<text x="${wx+ws/2}" y="${wy+ws+14}" class="cs" text-anchor="middle" fill="${s.contacts>10000?ACC:HI}">${
      s.contacts.toLocaleString()} contacts for ${rows===1?cols+" segments":rows+" x "+cols}</text>`;
    g += `<text x="${wx+ws/2}" y="${wy+ws+28}" class="cs" text-anchor="middle">${
      matrix==="active" ? "one TFT per pixel &middot; rows + columns" : "one individual contact per segment"}</text>`;

    anim.innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}">
      <style>.cs{fill:#8fa3b5;font:600 9.5px system-ui}</style>${g}</svg>`;

    ro.innerHTML = "";
    ro.appendChild(readout([
      {k:"Viewing mode", v:MODES[mode].name},
      {k:"Light source", v:MODES[mode].source},
      {k:"Ambient", v:s.lux>=1000 ? (s.lux/1000).toFixed(s.lux>=10000?0:1)+"k lux" : Math.round(s.lux)+" lux"},
      {k:"Readability", v:s.verdict, cls:s.verdict==="excellent"?"g":(s.verdict==="usable"?"":"r")},
      {k:"Contacts needed", v:s.contacts.toLocaleString(), cls:s.contacts>10000?"r":"g"}
    ]));

    note.innerHTML = "";
    let cls = "", body;
    if(mode==="transmissive" && !backlight){
      cls = "err";
      body = "<b>No backlight, no picture.</b> A transmissive panel's entire light budget is the lamp behind it. "+
        "This is the fault from Module 6 seen from the other side: the shutters are set correctly, but there is "+
        "nothing to shutter.";
    }else if(mode==="transmissive" && s.verdict==="unreadable"){
      cls = "err";
      body = "<b>Washed out.</b> Direct sunlight is brighter than any lamp you can fit behind a panel, so it swamps "+
        "the backlight and the contrast collapses. This is precisely why the deck says a transmissive display "+
        "<b>must be used outdoors in the shade</b>. Switch to reflective at this ambient level and watch what happens.";
    }else if(mode==="reflective" && s.verdict==="unreadable"){
      cls = "err";
      body = "<b>Nothing to reflect.</b> A reflective readout uses <b>the ambient light in the vicinity</b>, passing "+
        "it through the LCD layer to a <b>mirror</b> which reflects it back to the viewer. In a dark hangar there is "+
        "no ambient light, so there is nothing to work with &mdash; it is the <b>least costly</b> mode precisely "+
        "because it provides no light of its own.";
    }else if(mode==="reflective" && s.lux>20000){
      cls = "";
      body = "<b>The reflective panel's one clear win.</b> It gets <i>better</i> as the surroundings get brighter, "+
        "because brighter surroundings are its light source. The two modes fail in opposite conditions, which is why "+
        "a cockpit &mdash; tropical sun through the windscreen on one sector, near darkness on the next &mdash; "+
        "cannot simply pick one and stop.";
    }else if(matrix==="passive" && s.contacts>10000){
      cls = "warn";
      body = "<b>This is what &lsquo;unwieldy&rsquo; means.</b> Passive matrix gives each segment <b>its own "+
        "individual contact</b>, driven by an <b>external dedicated circuit</b>. At "+rows+" x "+cols+" that is "+
        s.contacts.toLocaleString()+" wires brought out to the edge of the glass. It is a wiring problem before it "+
        "is anything else &mdash; on top of passive's own disadvantages of <b>poor contrast &amp; sharpness</b> and "+
        "<b>very slow response time</b>.";
    }else if(matrix==="active"){
      cls = "";
      body = "<b>The thin film transistor changes the arithmetic.</b> Each pixel has <b>its own dedicated "+
        "transistor</b>, so each column line accesses one pixel and the wiring scales with rows <i>plus</i> columns "+
        "&mdash; "+s.contacts.toLocaleString()+" here instead of "+contactsFor("passive",rows,cols).toLocaleString()+". "+
        "Because each pixel holds its own state at full drive rather than waiting to be re-driven from outside, it is "+
        "also <b>brighter, sharper</b> and has a <b>much wider viewing range</b>. That last one is why the cockpit "+
        "ended up with the <b>AMLCD</b>: a display must be readable from the other seat, and wide viewing angle was "+
        "the CRT's natural strength that the flat panel had to match.";
    }else{
      cls = "";
      body = "<b>"+MODES[mode].name+".</b> "+MODES[mode].use.charAt(0).toUpperCase()+MODES[mode].use.slice(1)+". "+
        MODES[mode].limit.charAt(0).toUpperCase()+MODES[mode].limit.slice(1)+".";
    }
    body += "<br><br><span class='tiny muted'>The readability figure is an illustrative model. The deck states the "+
      "four verdicts &mdash; transmissive excellent indoors and needing shade outdoors, reflective good in bright "+
      "light and difficult in the dark &mdash; and this bench is built to land on them, not to reproduce a measured "+
      "contrast curve.</span>";
    note.appendChild(el("div",{class:"note "+cls, style:"margin-bottom:0"}, body));
    redrawTask && redrawTask();
  }

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>`${MODES[s.mode].name} &middot; ${Math.round(s.lux).toLocaleString()} lux &middot; ${MATRIX[s.matrix].name} &middot; ${s.contacts.toLocaleString()} contacts &rarr; ${s.verdict}`,
    id);
  draw();
};

/* ---------------- M8 · LED DRIVER BENCH ---------------- */
LABS.m8 = function(host, id, tier){
  const box = labShell("LED driver bench","Bias a junction, wire a matrix, then settle the three-way comparison");
  const B = box._body;
  host.appendChild(box);

  let vf = 2.0, forward = true, colour = "red";
  let device = "matrix";                    /* single | seg7 | matrix */
  let common = "cathode", driver = "cathode";
  let q3 = {};                              /* key -> chosen technology */

  const cols = el("div",{class:"lab-cols wide-left"});
  const left = el("div"), right = el("div");
  cols.appendChild(left); cols.appendChild(right);
  B.appendChild(cols);

  const anim = el("div"); left.appendChild(anim);
  const ro   = el("div",{style:"margin-top:14px"}); left.appendChild(ro);
  const q3box= el("div",{style:"margin-top:14px"}); left.appendChild(q3box);
  const note = el("div",{style:"margin-top:12px"}); left.appendChild(note);

  right.appendChild(ctrl("Forward bias","m8vv", range("m8v",0,5,0.1,vf)));
  $("#m8v").addEventListener("input", e=>{ vf=+e.target.value; draw(); labTouch(id,9); });

  const biasRow = el("div",{style:"margin:10px 0 14px"});
  right.appendChild(biasRow);
  const fwdBtn = toggleBtn(biasRow,"FORWARD biased","REVERSE biased", ()=>forward, v=>{forward=v;},
    ()=>{ draw(); labTouch(id,9); });

  right.appendChild(el("div",{class:"eyebrow"},"Emitted colour"));
  right.appendChild(segBar([["red","Red"],["yellow","Yellow"],["green","Green"]], colour,
    v=>{ colour=v; draw(); labTouch(id,9); }, "margin-bottom:14px"));

  right.appendChild(el("div",{class:"eyebrow"},"Device"));
  right.appendChild(segBar([["single","Single LED"],["seg7","7 segment"],["matrix","5 x 7 dot matrix"]], device,
    v=>{ device=v; draw(); labTouch(id,9); }, "margin-bottom:14px"));

  right.appendChild(el("div",{class:"eyebrow"},"Device wiring"));
  right.appendChild(segBar([["cathode","Common cathode"],["anode","Common anode"]], common,
    v=>{ common=v; draw(); labTouch(id,9); }, "margin-bottom:10px"));
  right.appendChild(el("div",{class:"eyebrow"},"Driver expects"));
  right.appendChild(segBar([["cathode","Common cathode"],["anode","Common anode"]], driver,
    v=>{ driver=v; draw(); labTouch(id,9); }, "margin-bottom:14px"));

  const TASKS = {
    foundation:[
      {q:"Set a forward bias inside the typical <b>1.2 V to 4.4 V</b> range and light the LED.",
       test:s=>s.st.lit},
      {q:"Now <b>reverse</b> the bias at the same voltage and read what an LED does when it is not forward biased.",
       test:s=>!s.forward && s.vf>=1.2},
      {q:"Return to forward bias and select <b>green</b>. Read which semiconductor produces it.",
       test:s=>s.forward && s.st.lit && s.colour==="green"}
    ],
    developing:[
      {q:"Drop the forward bias <b>below</b> the typical range and confirm the junction stops emitting.",
       test:s=>s.forward && s.vf<1.2 && !s.st.lit},
      {q:"Select the <b>5 x 7 dot matrix</b> and read how many pins the row-and-column wiring saves.",
       test:s=>s.device==="matrix"},
      {q:"Fit a <b>common cathode</b> device into a <b>common anode</b> driver and read what lights.",
       test:s=>s.common!==s.driver}
    ],
    proficient:[
      {q:"Get the device lit correctly: forward biased in range, and the wiring matched to the driver.",
       test:s=>s.works && s.st.lit},
      {q:"Select the <b>7 segment</b> device and confirm the deck's two segmented sizes from the readout.",
       test:s=>s.device==="seg7"},
      {q:"Answer all five rows of the <b>Q3 comparison</b> below correctly.",
       test:s=>s.q3Right===5}
    ]
  };

  function state(){
    const st = ledState(vf, forward);
    const works = driveWorks(common, driver);
    const rows = LED.matrixRows, colsN = LED.matrixCols;
    let q3Right = 0;
    Q3_ROWS.forEach(r=>{ if(q3[r.key] === r.ans) q3Right++; });
    return {vf, forward, colour, device, common, driver, st, works,
            material:ledMaterialFor(colour),
            pinsM:pinsMatrixed(rows,colsN), pinsI:pinsIndividual(rows,colsN),
            q3:Object.assign({},q3), q3Right,
            lit: st.lit && works};
  }

  function drawQ3(){
    const s = state();
    q3box.innerHTML = "";
    const card = el("div",{class:"card tight", style:"margin:0"});
    card.innerHTML = `<div class="eyebrow">Q3 &middot; which technology wins on each key parameter?</div>
      <p class="tiny muted" style="margin:0 0 10px">Each answer comes straight from that technology's own advantage
      list in your deck &mdash; and the loser's matching disadvantage.</p>`;
    Q3_ROWS.forEach(r=>{
      const row = el("div",{style:"display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap"});
      row.appendChild(el("div",{class:"small", style:"min-width:130px"}, "<b>"+r.label+"</b>"));
      ["CRT","LCD","LED"].forEach(t=>{
        const chosen = q3[r.key] === t;
        const right = chosen && t === r.ans;
        const wrong = chosen && t !== r.ans;
        row.appendChild(el("button",{class:"btn sec",
          style:"font-size:.74rem;padding:6px 12px;"+(right?("border-color:"+HI+";color:"+HI):(wrong?("border-color:"+ACC+";color:"+ACC):"")),
          onclick:()=>{
            q3[r.key] = t;
            if(t !== r.ans) addMisconception("m8","Attributing "+r.label.toLowerCase()+" to the "+t+" rather than the "+r.ans+".");
            else flag("m8","q3_"+r.key);
            drawQ3(); redrawTask && redrawTask(); labTouch(id,9);
          }}, t));
      });
      if(q3[r.key]) row.appendChild(el("div",{class:"tiny", style:"flex:1 1 100%;color:"+(q3[r.key]===r.ans?"#8fbfa6":"#d08a94")},
        (q3[r.key]===r.ans?"Correct. ":"Not this one. ")+r.why));
      card.appendChild(row);
    });
    if(s.q3Right === 5){
      card.appendChild(el("div",{class:"note", style:"margin:10px 0 0"},
        "<b>All five.</b> No technology wins everything, and each winner traces to a specific line in its own "+
        "advantage list. That is the argument the whole topic has been building towards: the CRT keeps brightness "+
        "and viewing angle, the LCD takes compactness and power, the LED takes response time &mdash; which is why "+
        "the flight deck uses all three, in different places."));
    }
    q3box.appendChild(card);
  }

  function draw(){
    const s = state();
    fwdBtn._sync();
    $("#m8vv").textContent = vf.toFixed(1) + " V";

    const W = 470, H = 210;
    let g = "";
    const col = {red:"#e04a4a", yellow:"#f5c542", green:"#3ad68b"}[colour];
    /* the junction, left */
    const jx = 30, jy = 76;
    g += `<rect x="${jx}" y="${jy}" width="46" height="44" rx="4" fill="#7a5fbf" opacity=".8"/>`;
    g += `<rect x="${jx+46}" y="${jy}" width="46" height="44" rx="4" fill="#3f6fa8" opacity=".8"/>`;
    g += `<text x="${jx+23}" y="${jy+27}" class="ml">p</text><text x="${jx+69}" y="${jy+27}" class="ml">n</text>`;
    g += `<line x1="${jx+46}" y1="${jy}" x2="${jx+46}" y2="${jy+44}" stroke="#0b1219" stroke-width="2"/>`;
    g += `<text x="${jx+46}" y="${jy-10}" class="cs" text-anchor="middle">p-n junction</text>`;
    g += `<text x="${jx+46}" y="${jy+62}" class="cs" text-anchor="middle" fill="${forward?HI:ACC}">${
      forward ? "forward biased, "+vf.toFixed(1)+" V" : "REVERSE biased"}</text>`;
    if(s.st.lit){
      for(let i=0;i<5;i++){
        const a = -50 + i*25;
        g += `<line x1="${jx+46}" y1="${jy+22}" x2="${(jx+46+34*Math.cos(a*Math.PI/180)).toFixed(1)}" y2="${(jy+22+34*Math.sin(a*Math.PI/180)).toFixed(1)}"
                stroke="${col}" stroke-width="2" opacity=".8"/>`;
      }
      g += `<circle cx="${jx+46}" cy="${jy+22}" r="16" fill="${col}" opacity=".35"/>`;
    }
    /* the device, right */
    const dx = 200, dy = 40;
    if(device === "single"){
      g += `<circle cx="${dx+70}" cy="${dy+62}" r="26" fill="${s.lit?col:"#1b2836"}" stroke="#33475c"/>`;
      g += `<text x="${dx+70}" y="${dy+130}" class="cs" text-anchor="middle">a single LED indicates a discrete state</text>`;
    }else if(device === "seg7"){
      const SEG = [[16,4,44,4],[48,8,48,36],[48,44,48,72],[16,76,44,76],[12,44,12,72],[12,8,12,36],[16,40,44,40]];
      SEG.forEach(sg=>{
        g += `<line x1="${dx+40+sg[0]}" y1="${dy+10+sg[1]}" x2="${dx+40+sg[2]}" y2="${dy+10+sg[3]}"
                stroke="${s.lit?col:"#1b2836"}" stroke-width="7" stroke-linecap="round"/>`;
      });
      g += `<text x="${dx+70}" y="${dy+130}" class="cs" text-anchor="middle">7 segment &middot; also commonly 16 segment</text>`;
    }else{
      const PAT = ["01110","10001","10001","11111","10001","10001","10001"];   /* an 'A' */
      for(let r=0;r<LED.matrixRows;r++) for(let c=0;c<LED.matrixCols;c++){
        const onq = s.lit && PAT[r][c]==="1";
        g += `<circle cx="${dx+42+c*17}" cy="${dy+12+r*15}" r="5.4" fill="${onq?col:"#1b2836"}" stroke="#2f4256" stroke-width="0.8"/>`;
      }
      /* row and column lines */
      for(let r=0;r<LED.matrixRows;r++)
        g += `<line x1="${dx+30}" y1="${dy+12+r*15}" x2="${dx+42+(LED.matrixCols-1)*17+10}" y2="${dy+12+r*15}" stroke="${CYN}" stroke-width="0.6" opacity=".45"/>`;
      for(let c=0;c<LED.matrixCols;c++)
        g += `<line x1="${dx+42+c*17}" y1="${dy+2}" x2="${dx+42+c*17}" y2="${dy+12+(LED.matrixRows-1)*15+10}" stroke="${VIO}" stroke-width="0.6" opacity=".45"/>`;
      g += `<text x="${dx+70}" y="${dy+130}" class="cs" text-anchor="middle">5 x 7 &middot; ${s.pinsM} pins wired in rows &amp; columns, not ${s.pinsI}</text>`;
    }
    g += `<text x="${dx+70}" y="${dy-14}" class="cs" text-anchor="middle" fill="${s.works?"#8fa3b5":ACC}">common ${common} device in a common ${driver} driver${s.works?"":" &mdash; MISMATCH"}</text>`;

    anim.innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}">
      <style>.ml{fill:#0b1219;font:700 12px system-ui;text-anchor:middle}
             .cs{fill:#8fa3b5;font:600 9.5px system-ui}</style>${g}</svg>`;

    ro.innerHTML = "";
    ro.appendChild(readout([
      {k:"Bias", v:forward ? vf.toFixed(1)+" V forward" : vf.toFixed(1)+" V reverse", cls:forward?"":"r"},
      {k:"Current", v:s.st.lit ? "about "+LED.iTyp+" mA" : "none", cls:s.st.lit?"g":"r"},
      {k:"Semiconductor", v:s.material || "not named in the deck"},
      {k:"Drive polarity", v:s.works ? "matched" : "MISMATCHED", cls:s.works?"g":"r"},
      {k:"Emitting?", v:s.lit ? "yes — electroluminescence" : "no", cls:s.lit?"g":"r"}
    ]));

    note.innerHTML = "";
    let cls = "", body;
    if(!s.works){
      cls = "err";
      body = "<b>Nothing lights at all.</b> A <b>common "+common+"</b> device has every LED's "+common+" tied to one "+
        "shared pin, but this driver is built for a common <b>"+driver+"</b> part, so it drives the individual pins "+
        "the wrong way. Every junction ends up <b>reverse biased</b>, and an LED emits only in the <b>forward</b> "+
        "direction. Both segmented and dot matrix displays are configurable either way &mdash; it changes how you "+
        "drive them, not what they do.";
    }else if(!s.st.lit){
      cls = "warn";
      body = "<b>Not emitting.</b> "+s.st.why;
    }else{
      cls = "";
      body = "<b>Emitting &mdash; "+LED.effect+".</b> Forward biased at "+vf.toFixed(1)+" V, inside the typical "+
        "<b>"+LED.vfMin+" V to "+LED.vfMax+" V</b> range, with about <b>"+LED.iTyp+" mA</b> flowing. "+
        colour.charAt(0).toUpperCase()+colour.slice(1)+" light comes from <b>"+s.material+"</b> &mdash; the colour is "+
        "a property of the junction material, not of a coloured lens.";
      if(device === "matrix")
        body += "<br><br><b>Why rows and columns.</b> This 5 &times; 7 array is 35 LEDs. Wired individually that is "+
          s.pinsI+" pins; wired in <b>rows and columns</b> it is <b>"+s.pinsM+"</b>, and any dot is selected by "+
          "energising one row and one column. That is the stated reason: to <b>minimise the number of pins</b> "+
          "needed to drive them. The cost is that only one row can be lit at a time, so the display is scanned "+
          "rapidly and the eye does the rest.";
      if(device === "seg7")
        body += "<br><br>Segmented devices are commonly <b>7 segment</b> and <b>16 segment</b>, used for "+
          "<b>alphanumeric display</b> &mdash; seven makes digits, sixteen adds letters. On an aircraft, LEDs like "+
          "this replace the pointers and tapes on circular or vertical scale displays such as the <b>Torque "+
          "Indicator</b> and the <b>Temperature Indicator</b>.";
    }
    note.appendChild(el("div",{class:"note "+cls, style:"margin-bottom:0"}, body));
    redrawTask && redrawTask();
  }

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>`${s.forward?"forward":"reverse"} ${s.vf.toFixed(1)} V &middot; ${s.colour} &middot; ${s.works?"wiring matched":"wiring MISMATCHED"} &middot; Q3 ${s.q3Right}/5 &rarr; ${s.lit?"emitting":"dark"}`,
    id);
  drawQ3();
  draw();
};

/* ============================================================
   15 · BOOT
   ============================================================ */
(function init(){
  load();
  $("#resetBtn").onclick = ()=>{
    if(confirm("Clear all your answers, explanations and progress on this device?")) resetAll();
  };
  $("#menuBtn").onclick = ()=> $("#rail").classList.toggle("open");
  go(S.diagnosticDone ? "m1" : "home");
})();
</script>
</body>
