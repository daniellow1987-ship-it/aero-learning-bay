<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic 9 — Electronic Displays | Interactive Learning Bay</title>
<style>
/* ============================================================
   Topic 9 — Electronic Displays: CRT, LCD & LED
   Interactive learning environment · Temasek Polytechnic
   Self-contained: no external fonts, scripts, styles or images.
   ============================================================ */

:root{
  --bg:#080d13;
  --bg-2:#0e151d;
  --panel:#121b25;
  --panel-2:#17222e;
  --panel-3:#1d2b39;
  --line:#26384a;
  --line-soft:#1c2937;
  --ink:#e3edf6;
  --ink-2:#a8bccd;
  --ink-3:#6f8598;
  --tp:#e02b3c;
  --tp-deep:#a8121f;
  --grn:#3ad68b;
  --amb:#f5b431;
  --red:#ff5a5f;
  --cyn:#38c6d9;
  --vio:#9b8cff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1200px 700px at 78% -10%, #16283a 0%, transparent 60%),
    radial-gradient(900px 600px at 0% 100%, #14202c 0%, transparent 55%),
    var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.02rem}h4{font-size:.9rem}
p{margin:0 0 .85em}
a{color:var(--cyn)}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono)}

/* ---------- app frame ---------- */
.app{display:flex;min-height:100vh}

/* ---------- rail ---------- */
.rail{
  width:262px;flex:0 0 262px;background:linear-gradient(180deg,#0d141c,#0a1018);
  border-right:1px solid var(--line-soft);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.rail-head{padding:18px 18px 14px;border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.brand-mark{
  width:26px;height:26px;border-radius:6px;flex:0 0 26px;
  background:linear-gradient(145deg,var(--tp),var(--tp-deep));
  display:grid;place-items:center;font-weight:800;font-size:.72rem;color:#fff;letter-spacing:.02em;
}
.brand-txt{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.rail-title{font-size:.98rem;font-weight:650;line-height:1.3}
.rail-sub{font-size:.72rem;color:var(--ink-3);margin-top:3px}

.rail-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-label{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:10px 8px 6px;font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:8px;
  padding:8px 9px;margin-bottom:2px;cursor:pointer;color:var(--ink-2);
  font-size:.845rem;transition:background .13s,color .13s,border-color .13s;
}
.nav-item:hover{background:#141f2b;color:var(--ink)}
.nav-item.active{background:#182739;border-color:#2b4560;color:#fff;font-weight:600}
.nav-num{
  width:21px;height:21px;flex:0 0 21px;border-radius:5px;background:#1b2836;
  display:grid;place-items:center;font-size:.68rem;font-family:var(--mono);color:var(--ink-3);
  border:1px solid var(--line-soft);
}
.nav-item.active .nav-num{background:var(--tp);color:#fff;border-color:transparent}
.nav-item.done .nav-num{background:rgba(58,214,139,.15);color:var(--grn);border-color:rgba(58,214,139,.35)}
.nav-txt{flex:1;min-width:0}
.nav-tier{
  font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:2px 6px;border-radius:20px;white-space:nowrap;
}
.tier-foundation{background:rgba(56,198,217,.14);color:var(--cyn)}
.tier-developing{background:rgba(245,180,49,.14);color:var(--amb)}
.tier-proficient{background:rgba(58,214,139,.14);color:var(--grn)}

.rail-foot{padding:12px;border-top:1px solid var(--line-soft)}
.progress-wrap{margin-bottom:10px}
.progress-line{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-3);margin-bottom:5px}
.bar{height:5px;border-radius:5px;background:#18222d;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--tp),#ff7a5c);border-radius:5px;transition:width .35s ease}
.ghost-btn{
  width:100%;background:#141e29;border:1px solid var(--line);border-radius:8px;
  padding:7px;font-size:.76rem;color:var(--ink-2);cursor:pointer;transition:.13s;
}
.ghost-btn:hover{background:#1a2734;color:var(--ink)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 26px;border-bottom:1px solid var(--line-soft);
  background:rgba(9,14,20,.82);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;
}
.crumb{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.topbar h2{margin:2px 0 0;font-size:1.06rem}
.view{padding:26px;max-width:1120px;width:100%;margin:0 auto;flex:1}

/* ---------- generic pieces ---------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.card.tight{padding:14px 16px}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.card-h .dot{width:7px;height:7px;border-radius:50%;background:var(--tp);flex:0 0 7px}
.card-h h3{margin:0}
.eyebrow{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:6px}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:18px 0}

.btn{
  background:linear-gradient(180deg,#e33c4c,var(--tp-deep));border:0;border-radius:8px;
  padding:9px 16px;font-weight:600;font-size:.86rem;color:#fff;cursor:pointer;
  box-shadow:0 3px 10px rgba(224,43,60,.24);transition:filter .13s,transform .06s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#1c2836;border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.sec:hover{background:#243444}
.btn.ok{background:linear-gradient(180deg,#43dd95,#1e9e63);box-shadow:0 3px 10px rgba(58,214,139,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;background:#1b2836;color:var(--ink-2);border:1px solid var(--line-soft)}
.pill.g{background:rgba(58,214,139,.12);color:var(--grn);border-color:rgba(58,214,139,.28)}
.pill.a{background:rgba(245,180,49,.12);color:var(--amb);border-color:rgba(245,180,49,.28)}
.pill.r{background:rgba(255,90,95,.12);color:var(--red);border-color:rgba(255,90,95,.28)}
.pill.c{background:rgba(56,198,217,.12);color:var(--cyn);border-color:rgba(56,198,217,.28)}

.note{border-left:3px solid var(--cyn);background:#101c26;padding:11px 14px;border-radius:0 8px 8px 0;font-size:.87rem;margin:12px 0}
.note.warn{border-left-color:var(--amb);background:#1d1a10}
.note.err{border-left-color:var(--red);background:#201415}
.note.ok{border-left-color:var(--grn);background:#101f18}
.note b{color:var(--ink)}

/* ---------- lab shell ---------- */
.lab{background:linear-gradient(180deg,#101a24,#0c141c);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.lab-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 16px;background:#0d161f;border-bottom:1px solid var(--line-soft);
}
.lab-head .t{display:flex;align-items:center;gap:9px;font-weight:650;font-size:.92rem}
.lab-head .t svg{opacity:.85}
.lab-body{padding:18px}
.lab-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.lab-cols.wide-left{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}

.ctrl{margin-bottom:14px}
.ctrl label{display:flex;justify-content:space-between;align-items:baseline;font-size:.79rem;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.ctrl label .v{font-family:var(--mono);color:var(--ink);font-size:.86rem;background:#182430;padding:1px 7px;border-radius:5px;border:1px solid var(--line-soft)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;
  background:#22303e;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--tp);cursor:pointer;border:2px solid #0e151d;box-shadow:0 0 0 1px var(--tp);
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--tp);cursor:pointer;border:2px solid #0e151d;
}
input[type=text],input[type=number],select,textarea{
  width:100%;background:#0c141d;border:1px solid var(--line);border-radius:7px;
  padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:.88rem;
}
input:focus,select,textarea:focus{outline:2px solid rgba(56,198,217,.4);outline-offset:-1px}
textarea{font-family:var(--sans);line-height:1.6;resize:vertical;min-height:120px}
select{font-family:var(--sans)}

.seg{display:flex;gap:4px;background:#0d161f;padding:4px;border-radius:9px;border:1px solid var(--line-soft);flex-wrap:wrap}
.seg button{
  flex:1;min-width:62px;background:transparent;border:0;border-radius:6px;padding:7px 8px;
  font-size:.79rem;color:var(--ink-2);cursor:pointer;font-weight:600;transition:.12s;
}
.seg button:hover{background:#182432;color:var(--ink)}
.seg button.on{background:var(--tp);color:#fff}

/* input toggles (logic switches) */
.switches{display:flex;gap:10px;flex-wrap:wrap}
.sw{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:#0d161f;border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;
  min-width:66px;transition:.13s;user-select:none;
}
.sw:hover{border-color:#33506b}
.sw .nm{font-size:.72rem;color:var(--ink-3);font-weight:700;letter-spacing:.05em}
.sw .lamp{
  width:30px;height:30px;border-radius:50%;background:#16212c;border:2px solid #24313d;
  display:grid;place-items:center;font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--ink-3);
  transition:.16s;
}
.sw.on .lamp{background:rgba(58,214,139,.2);border-color:var(--grn);color:var(--grn);box-shadow:0 0 12px rgba(58,214,139,.35)}
.sw.out{cursor:default}
.sw.out.on .lamp{background:rgba(245,180,49,.2);border-color:var(--amb);color:var(--amb);box-shadow:0 0 14px rgba(245,180,49,.4)}

/* truth table */
table.tt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.85rem}
table.tt th,table.tt td{border:1px solid var(--line-soft);padding:6px 10px;text-align:center}
table.tt th{background:#16212c;color:var(--ink-2);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-family:var(--sans);font-weight:700}
table.tt td.out{color:var(--amb);font-weight:700}
table.tt tr.hi td{background:rgba(224,43,60,.14);outline:1px solid rgba(224,43,60,.45)}
table.tt tr.hi td.out{color:#ff9a5c}
/* prose table (SSM / comparison) */
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem;margin:8px 0 2px}
table.tbl th,table.tbl td{border:1px solid var(--line-soft);padding:7px 10px;text-align:left;vertical-align:top}
table.tbl th{background:#16212c;color:var(--ink-2);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
table.tbl td:first-child,table.tbl th:first-child{white-space:nowrap}
table.tbl td b{color:var(--ink)}
.tblwrap{overflow-x:auto}

/* readouts */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px}
.ro{background:#0d161f;border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px}
.ro .k{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:3px}
.ro .v{font-family:var(--mono);font-size:1.02rem;color:var(--ink);word-break:break-all}
.ro.hl .v{color:var(--amb)}
.ro.g .v{color:var(--grn)}
.ro.c .v{color:var(--cyn)}

svg.viz{display:block;width:100%;height:auto;background:#0a1119;border:1px solid var(--line-soft);border-radius:9px}

/* bit boxes */
.bits{display:flex;gap:6px;flex-wrap:wrap}
.bit{
  width:46px;text-align:center;background:#0d161f;border:1px solid var(--line);border-radius:8px;
  padding:7px 0 5px;cursor:pointer;transition:.12s;user-select:none;
}
.bit:hover{border-color:#3a5b78}
.bit .b{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--ink-3);line-height:1.1}
.bit.on{background:rgba(224,43,60,.14);border-color:var(--tp)}
.bit.on .b{color:#ff8b8b}
.bit .w{font-size:.6rem;color:var(--ink-3);font-family:var(--mono);margin-top:2px}
.bit.on .w{color:var(--amb)}
.bit.flip{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}

/* q&a */
.q{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:15px 17px;margin-bottom:12px}
.q .stem{font-weight:600;margin-bottom:11px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;align-items:flex-start;gap:10px;background:#0e1720;border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;cursor:pointer;transition:.12s;font-size:.89rem;
}
.opt:hover{border-color:#3a5b78;background:#122030}
.opt .k{
  width:20px;height:20px;flex:0 0 20px;border-radius:5px;background:#1b2836;border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;color:var(--ink-3);font-weight:700;
}
.opt.sel{border-color:var(--cyn);background:#0f1e26}
.opt.sel .k{background:var(--cyn);color:#04141a;border-color:transparent}
.opt.right{border-color:var(--grn);background:#0e1e17}
.opt.right .k{background:var(--grn);color:#052014;border-color:transparent}
.opt.wrong{border-color:var(--red);background:#1e1315}
.opt.wrong .k{background:var(--red);color:#2a0b0c;border-color:transparent}
.opt.locked{cursor:default}
.fb{margin-top:11px;font-size:.86rem;padding:10px 13px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.good{background:#0e1e17;border:1px solid rgba(58,214,139,.3)}
.fb.bad{background:#1e1315;border:1px solid rgba(255,90,95,.3)}

/* stepper */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;padding-bottom:14px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:1px;background:var(--line)}
.step .n{
  width:23px;height:23px;flex:0 0 23px;border-radius:50%;background:#1b2836;border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;color:var(--ink-2);z-index:1;
}
.step.done .n{background:var(--grn);color:#052014;border-color:transparent}
.step .c{flex:1;font-size:.88rem;padding-top:1px}

/* tier banner */
.tier-banner{
  display:flex;align-items:center;gap:14px;padding:13px 17px;border-radius:10px;margin-bottom:16px;
  background:linear-gradient(90deg,#131f2b,#101820);border:1px solid var(--line);
}
.tier-banner .ic{
  width:36px;height:36px;flex:0 0 36px;border-radius:9px;display:grid;place-items:center;font-size:1.05rem;font-weight:800;
}
.tb-foundation .ic{background:rgba(56,198,217,.16);color:var(--cyn)}
.tb-developing .ic{background:rgba(245,180,49,.16);color:var(--amb)}
.tb-proficient .ic{background:rgba(58,214,139,.16);color:var(--grn)}
.tier-banner .tx{flex:1;min-width:0}
.tier-banner .tx b{display:block;font-size:.92rem}
.tier-banner .tx span{font-size:.79rem;color:var(--ink-2)}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:.87rem;cursor:pointer}
.chk .box{
  width:19px;height:19px;flex:0 0 19px;border-radius:5px;border:1px solid var(--line);background:#0e1720;
  display:grid;place-items:center;font-size:.72rem;color:transparent;transition:.12s;margin-top:1px;
}
.chk.on .box{background:var(--grn);border-color:var(--grn);color:#052014}

/* module footer nav */
.modfoot{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft)}

/* summary print */
.sum-block{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.sum-block h4{margin:0 0 8px;font-size:.95rem;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:.86rem}
.kv .k{color:var(--ink-3)}
.quoted{background:#0d151d;border-left:3px solid var(--vio);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.87rem;white-space:pre-wrap;color:var(--ink-2)}

/* misc */
.badge-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.hidden{display:none !important}
.center{text-align:center}
.stack>*+*{margin-top:12px}
ul.tick{list-style:none;padding:0;margin:0}
ul.tick li{padding-left:22px;position:relative;margin-bottom:7px;font-size:.88rem}
ul.tick li::before{content:"▸";position:absolute;left:4px;color:var(--tp);font-size:.8rem}
ul.plain{margin:0 0 .8em;padding-left:20px}
ul.plain li{margin-bottom:5px;font-size:.89rem}

.hero{
  background:linear-gradient(135deg,#16232f 0%,#101820 60%);
  border:1px solid var(--line);border-radius:14px;padding:28px 30px;margin-bottom:18px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(224,43,60,.16),transparent 68%);
}
.hero h1{font-size:1.75rem;margin-bottom:8px;position:relative}
.hero p{max-width:640px;position:relative;color:var(--ink-2)}

.mod-card{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:11px;padding:15px 16px;
  cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;
}
.mod-card:hover{border-color:#33506b;background:var(--panel-2);transform:translateY(-1px)}
.mod-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mod-card .idx{font-family:var(--mono);font-size:.7rem;color:var(--ink-3)}
.mod-card b{font-size:.94rem}
.mod-card p{font-size:.8rem;color:var(--ink-3);margin:0}

@media (max-width:1080px){
  .lab-cols,.lab-cols.wide-left,.split{grid-template-columns:1fr}
  .g2,.g3{grid-template-columns:1fr}
}
@media (max-width:820px){
  .rail{position:fixed;left:-262px;z-index:60;transition:left .2s;box-shadow:var(--shadow)}
  .rail.open{left:0}
  .menu-btn{display:inline-flex !important}
  .view{padding:18px 16px}
}
.menu-btn{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#182432;border:1px solid var(--line);cursor:pointer}

@media print{
  .rail,.topbar,.modfoot,.no-print{display:none !important}
  body{background:#fff;color:#111}
  .sum-block,.card{background:#fff;border:1px solid #ccc;color:#111;break-inside:avoid}
  .quoted{background:#f5f5f5;color:#222}
  .kv .k{color:#555}
}
</style>
</head>
<body>
<div class="app">

  <!-- ================= RAIL ================= -->
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="brand">
        <div class="brand-mark">TP</div>
        <div class="brand-txt">School of Engineering</div>
      </div>

"use strict";
/* ============================================================
   1 · STATE  (browser-local only; never leaves the device)
   ============================================================ */
const STORE_KEY = "tp_topic9_lb_v1";

const BLANK = {
  started:false,
  diagnosticDone:false,
  diagAnswers:{},                  // qid -> chosen index
  tiers:{},                        // modId -> 'foundation'|'developing'|'proficient'
  progress:{},                     // modId -> {concept,lab,practice,feynman}
  feynman:{},                      // modId -> text
  feynmanScore:{},                 // modId -> {covered:[], missing:[], words:n}
  practice:{},                     // modId -> {qid:{choice,correct}}
  labFlags:{},                     // modId -> {flagName:true}
  misconceptions:[],               // {mod, text}
  predictions:{}                   // key -> {guess, actual, hit}
};

let S = clone(BLANK);

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ S = Object.assign(clone(BLANK), JSON.parse(raw)); }
  }catch(e){ /* storage blocked (private window / sandboxed iframe) — run in memory */ }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch(e){ /* non-fatal: session continues in memory */ }
}
function resetAll(){
  S = clone(BLANK);
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  go("home");
}

function prog(id){
  if(!S.progress[id]) S.progress[id] = {concept:false,lab:false,practice:false,feynman:false};
  return S.progress[id];
}
function markProg(id, key){
  const p = prog(id);
  if(!p[key]){ p[key]=true; save(); renderNav(); }
}
function tierOf(id){ return S.tiers[id] || "developing"; }
function flag(id, name){
  if(!S.labFlags[id]) S.labFlags[id] = {};
  if(!S.labFlags[id][name]){ S.labFlags[id][name] = true; save(); }
}
function hasFlag(id,name){ return !!(S.labFlags[id] && S.labFlags[id][name]); }
function addMisconception(mod, text){
  if(!S.misconceptions.some(m=>m.mod===mod && m.text===text)){
    S.misconceptions.push({mod,text}); save();
  }
}

/* ============================================================
   2 · SMALL DOM HELPERS
   ============================================================ */
const $  = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
function el(tag, attrs, html){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(attrs[k]===undefined || attrs[k]===null) continue;
    if(k==="class") n.className = attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  if(html!=null) n.innerHTML = html;
  return n;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

const MODULES = [
  {id:"m1", n:1, title:"The Electron Gun",            blurb:"Six parts in a glass tube, each doing one job &mdash; take any of them away and the picture stops."},

  {id:"m7", n:7, title:"Viewing Modes &amp; Matrices",     blurb:"Backlight or ambient light, and why the cockpit display had to wait for the thin film transistor."},

const DIAG = [
  {id:"d1", mod:"m1", stem:"In a CRT, what is the job of the HEATER?",
   opts:["To warm the phosphor screen","To heat the cathode","To accelerate the electron beam"], ans:1,
   why:"The heater heats the cathode. The cathode then emits electrons from a very small source, forming a mist in front of it."},
  {id:"d2", mod:"m1", stem:"The CONTROL GRID sits at what potential, and controls what?",
   opts:["Negative with respect to the cathode; the amount of electron flow","Positive with respect to the cathode; the beam focus","At earth potential; the screen brightness only"], ans:0,
   why:"The control grid is at a <b>negative</b> potential with respect to the cathode and controls the <b>amount</b> of electron flow down the tube. The anodes are the positive ones, and they accelerate and focus."},

  {id:"d3", mod:"m2", stem:"Electrostatic deflection is commonly used for:",
   opts:["Large television screens","Small CRT displays such as an oscilloscope","Head-up displays only"], ans:1,
   why:"The deck states electrostatic deflection is for small CRT displays like an oscilloscope. Electromagnetic deflection is what computer monitors and TV screens use."},
  {id:"d4", mod:"m2", stem:"In electromagnetic deflection, VERTICAL movement of the beam is achieved by:",
   opts:["A vertical magnetic field","A horizontal magnetic field","A vertical electric field"], ans:1,
   why:"Vertical movement comes from a <b>horizontal</b> magnetic field, and horizontal movement from a <b>vertical</b> one. The field and the movement are at right angles &mdash; this is the single most-reversed fact in the topic."},

  {id:"d5", mod:"m3", stem:"Which scanning method results in FLICKER?",
   opts:["Raster scanning","Stroke scanning","Neither &mdash; flicker is a phosphor fault"], ans:0,
   why:"Raster's disadvantage is that the display will flicker. Stroke overcomes flickering, but its disadvantage is a burn mark. This is Q2 of your review quiz."},
  {id:"d6", mod:"m3", stem:"An INTERLACED display builds each full screen from:",
   opts:["A single progressive pass, top to bottom","Two separate fields, the odd lines and the even lines","Three fields, one per primary colour"], ans:1,
   why:"Two fields &mdash; odd lines then even lines. Their appearance and disappearance causes the noticeable flickering of thin horizontal lines. A single pass is progressive (non-interlaced) scanning."},

  {id:"d7", mod:"m4", stem:"How many electron guns does a colour CRT have?",
   opts:["One, switched between colours","Three, one per primary colour","Thousands, one per triad"], ans:1,
   why:"Three electron guns, each dedicated to one of the primary colours red, green or blue."},
  {id:"d8", mod:"m4", stem:"What is the purpose of the SHADOW MASK?",
   opts:["To filter the light leaving the screen","To ensure each gun's beam strikes only its designated phosphor","To shield the tube from external magnetic fields"], ans:1,
   why:"It is a perforated steel sheet placed adjacent to the screen. Without it, a gun's beam would land on the wrong phosphor dots and the colour would be wrong."},

  {id:"d9", mod:"m5", stem:"Cushion distortion in a CRT is caused by:",
   opts:["Curvature of the screen","An incorrect gamma value","A faulty electron gun"], ans:0,
   why:"Cushion shape is due to the curvature of the screen, and the correction is done through the deviation coil current &mdash; the same remedy as linearity correction."},
  {id:"d10", mod:"m5", stem:"Gamma correction exists because a CRT's light output is:",
   opts:["Directly proportional to the input voltage","Proportional to the input voltage raised to the power gamma","Independent of the input voltage"], ans:1,
   why:"The CRT does not produce a luminance proportional to input voltage &mdash; it is proportional to the input voltage raised to the power gamma. Gamma correction is introduced to make the relationship linear."},

  {id:"d11", mod:"m6", stem:"An LCD produces an image by:",
   opts:["Emitting light from each pixel","Blocking light from an external source","Heating a phosphor coating"], ans:1,
   why:"It works by blocking light. Unlike a CRT it does not emit its own light, so it requires an external light source for readout &mdash; for example a cold cathode fluorescent lamp behind the panel."},
  {id:"d12", mod:"m6", stem:"With NO voltage applied to the liquid crystal, the segment is:",
   opts:["Black and visible","Not visible","Grey and flickering"], ans:1,
   why:"With no voltage the crystal twists light by 90 degrees, so light passes the second polariser and is reflected back. The segment is <b>not visible</b>. Applying voltage aligns the molecules, light is blocked, and the segment turns black."},

  {id:"d13", mod:"m7", stem:"A REFLECTIVE LCD readout uses:",
   opts:["A backlight behind the panel","The ambient light in the vicinity","An internal phosphor layer"], ans:1,
   why:"Reflective uses ambient light, passing it through the LCD layer to a mirror which reflects it back to the viewer. Transmissive is the one with a backlight."},
  {id:"d14", mod:"m7", stem:"An ACTIVE matrix display employs:",
   opts:["Twisted Nematic (TN) only","Thin Film Transistors (TFT), one per pixel","A shadow mask and phosphor triads"], ans:1,
   why:"Active matrix adds a matrix of thin film transistors, each pixel having its own dedicated transistor. Passive matrix is the one employing Twisted Nematic or Super-Twisted Nematic."},

  {id:"d15", mod:"m8", stem:"An LED emits light when it is:",
   opts:["Reverse biased beyond breakdown","Forward biased across its p-n junction","Heated above its rated temperature"], ans:1,

  {id:"d16", mod:"m8", stem:"A dot matrix LED display is typically arranged in what pattern?",
   opts:["3 &times; 3","5 &times; 7","7 &times; 16"], ans:1,
   why:"Typically a 5 &times; 7 pattern. The LEDs are wired in rows and columns to minimise the number of pins needed to drive them. 7 and 16 are the common <i>segment</i> counts, not matrix dimensions."}

function overallPct(){

    const p = prog(m.id);
    ["concept","lab","practice","feynman"].forEach(k=>{ if(p[k]) done++; });

VIEWS.diagnostic = function(host){
  setHead("Step 1","Pre-flight check");

  host.appendChild(el("div",{class:"note"},
    "<b>16 questions, about 7 minutes.</b> Answer honestly &mdash; there is no mark attached. "+
    "The point is to route you to the right level of support in each module. If you do not know, pick what you "+
    "think is most likely; a wrong answer here simply gets you more scaffolding later."));

  const form = el("div");
  DIAG.forEach((q,i)=>{
    const box = el("div",{class:"q"});
    box.appendChild(el("div",{class:"stem"}, `<span class="tiny muted">Q${i+1} &middot; Module ${MOD_BY_ID[q.mod].n}</span><br>${q.stem}`));
    const opts = el("div",{class:"opts"});
    q.opts.forEach((o,oi)=>{
      const chosen = S.diagAnswers[q.id]===oi;
      const b = el("button",{class:"opt"+(chosen?" sel":""), onclick:()=>{
        S.diagAnswers[q.id]=oi; save();
        $$(".opt",opts).forEach(x=>x.classList.remove("sel"));
        b.classList.add("sel");
        updateCount();
      }});
      b.innerHTML = `<span class="k">${"ABC"[oi]}</span><span>${o}</span>`;
      opts.appendChild(b);
    });
    box.appendChild(opts);
    form.appendChild(box);
  });
  host.appendChild(form);

  const foot = el("div",{class:"card"});
  foot.innerHTML = `<div class="btn-row"><button class="btn" id="scoreBtn">Score my check &amp; set my pathway</button>
    <span class="small muted" id="cnt"></span></div>`;
  host.appendChild(foot);

  function updateCount(){
    const n = DIAG.filter(q=>S.diagAnswers[q.id]!=null).length;
    $("#cnt").textContent = n+" of "+DIAG.length+" answered";
    $("#scoreBtn").disabled = n<DIAG.length;
  }
  $("#scoreBtn").onclick = scoreDiagnostic;
  updateCount();
};

function scoreDiagnostic(){
  const byMod = {};
  DIAG.forEach(q=>{
    if(!byMod[q.mod]) byMod[q.mod] = {right:0, total:0, wrong:[]};
    byMod[q.mod].total++;
    if(S.diagAnswers[q.id]===q.ans) byMod[q.mod].right++;
    else byMod[q.mod].wrong.push(q);
  });
  MODULES.forEach(m=>{
    const r = byMod[m.id] ? byMod[m.id].right : 0;
    S.tiers[m.id] = r===2 ? "proficient" : (r===1 ? "developing" : "foundation");
  });
  S.diagnosticDone = true;
  save();
  showDiagResult(byMod);
}

  setHead("Step 1 complete","Your personalised pathway");

    host.appendChild(card);

  host.appendChild(go1);
  $("#beginBtn").onclick = ()=>go("m1");
}

   those electrons form a <b>mist in front of the cathode</b>. "Very small source" matters: a small emitting area
   is what makes a sharp spot possible at the far end.</div>
   <div class="note warn"><b>3 &middot; Control grid.</b> Sits at a <b>negative potential with respect to the
   cathode</b>, and controls the <b>amount of electron flow</b> down the tube. It is negative because electrons are
   negative &mdash; making the grid more negative pushes more of them back, so less current gets through and the
   spot dims. This is the brightness control, and it is the one part in the gun at a negative potential.</div>
   <div class="note"><b>4 &middot; 1st &amp; 2nd anode.</b> At a <b>positive potential</b>. They <b>accelerate</b>
   the electrons and <b>focus</b> them into a beam. Positive attracts negative, so the electrons are pulled towards
   the screen and squeezed into a narrow column on the way.</div>
   <div class="note"><b>5 &middot; Final anode.</b> A <b>graphite coating on the inside of the flared part of the
   tube</b>, connected via its own terminal to the <b>HT (high tension) supply</b>. It is not a separate metal
   electrode &mdash; it is painted onto the glass.</div>
   <div class="note"><b>6 &middot; Screen.</b> The front of the tube, coated with <b>phosphor</b>, which
   <b>illuminates when bombarded by electrons</b>. A variety of colours is available depending on the phosphor
   used.</div>
   <p>Put together, the <b>cathode, heater, control grid and anode assembly form the electron gun</b>, which
   produces a beam focused on the <b>rear phosphor coating</b> of the screen &mdash; the inside face, not the face
   you are looking at.</p>`,

  developing:`
   <p>You can name the six parts. Now get the two things students reliably reverse the right way round, because
   both of them appear in exam questions every year.</p>
   <div class="note warn"><b>Polarity: the grid is negative, the anodes are positive.</b> The control grid is
   negative <i>with respect to the cathode</i>, and it throttles the flow. The anodes are positive, and they
   accelerate. If you can hold on to "the negative one restricts, the positive ones attract" you never have to
   memorise which is which &mdash; it follows from the charge on an electron.</div>
   <div class="note"><b>Amount versus aim.</b> The grid controls <b>how many</b> electrons go down the tube; it
   does not steer them. Steering is Module 2's job, done by plates or coils further along. Focusing is the anodes'
   job. Three different jobs, three different parts, and the exam likes to swap them.</div>
   <p><b>The chain of dependency.</b> Work through what actually stops if one part fails, because this is what the
   lab tests:</p>
   <ul class="plain">
     <li><b>No heater</b> &rarr; a cold cathode emits nothing &rarr; no electrons at all &rarr; blank screen. The
     tube is not broken; it is simply not emitting.</li>
     <li><b>No cathode emission</b> &rarr; same result, for the same reason one step further down.</li>
     <li><b>No control grid</b> &rarr; electrons flow unrestricted. There is a beam, but no control over how much
     of it, so no brightness control.</li>
     <li><b>No focusing anode</b> &rarr; the electron mist spreads out and arrives as a broad blur instead of a
     spot. Light on the screen, but no sharp image.</li>
     <li><b>No final anode / HT</b> &rarr; the electrons are never accelerated to enough energy to excite the
     phosphor. Dim or nothing.</li>
     <li><b>No phosphor</b> &rarr; electrons arrive and nothing happens, because there is nothing there to
     illuminate.</li>
   </ul>
   <p><b>Predict before you check.</b> Which single failure leaves a bright but hopelessly blurred picture?
   Decide, then open the bench and pull that part.</p>`,

  proficient:`
   <p>Two things worth understanding rather than memorising, and then the trade-off the whole technology sits on.</p>
   <ul class="plain">
     <li><b>Why "a very small source" is in the definition.</b> A spot on the screen can never be smaller than the
     image of the emitting area, however good the focusing is. The cathode is designed to emit from a tiny patch
     precisely so that the anodes have something small to focus. Resolution is set at the gun before deflection is
     even involved.</li>
     <li><b>Why the final anode is a graphite coating rather than a metal ring.</b> It is spread over the whole
     flared section, so the accelerating field is continuous along the electron's path rather than a single kick,
     and it also collects the secondary electrons knocked out of the phosphor. Painting it on the inside glass is
     a design choice that gets a large electrode where no metal part could conveniently go.</li>
     <li><b>The grid is a valve, not a switch.</b> Because it varies the <i>amount</i> of flow continuously, the
     same electrode gives you black, every level of grey, and full brightness. Module 5's gamma problem exists
     because the relationship between grid voltage and screen brightness along that range is not a straight line.</li>
   </ul>
   <div class="note"><b>What the CRT buys you and what it costs.</b> The deck lists two significant advantages:
   an <b>extremely bright colour display</b> and a <b>wide range of viewing angle</b>, plus text and graphics
   display modes and good speed of updating and image retention. Against that: <b>large size and weight</b>,
   <b>high voltage and power consumption</b>, <b>generates a high amount of heat</b>, and <b>fragile &mdash; made
   of glass vacuum tubes</b>. Every one of those disadvantages traces back to something in this module: the HT
   supply, the length of tube the beam needs, and the vacuum envelope.</div>
   <div class="note"><b>Transfer task.</b> A CRT display in a cockpit shows a picture that is correctly positioned
   and correctly shaped, but soft and smeared at every edge, and no brighter or dimmer than it should be. Name the
   part you would suspect, say why the symptom rules out the other five, and state which part you would suspect
   instead if the picture were sharp but stuck at full brightness.</div>`
 },

/* ---------------- MODULE 2 · DEFLECTING THE BEAM ---------------- */
m2:{
 takeaways:[
  "There are two methods of deflection, chosen according to the size and application of the display.",
  "Electrostatic deflection uses electric charge on plates: X-plates deflect horizontally, Y-plates deflect vertically.",
  "Electrostatic deflection is commonly used for small CRT displays such as an oscilloscope.",
  "Electromagnetic deflection uses an externally applied magnetic field from 2 sets of coils around the neck of the CRT.",
  "VERTICAL movement of the beam is achieved by a HORIZONTAL magnetic field.",
  "HORIZONTAL movement of the beam is achieved by a VERTICAL magnetic field.",
  "Electromagnetic deflection is commonly used in computer monitors and TV screens."
 ],
 concept:{
  foundation:`
   <p>The gun in Module 1 fires straight down the middle of the tube and puts one dot in the centre of the screen.
   To draw anything you have to move that dot, and there are <b>two methods of deflecting the electron beam</b>.
   Which one is used depends on the <b>size and application</b> of the display.</p>
   <div class="note"><b>Method 1 &middot; Electrostatic deflection.</b> Two pairs of metal plates inside the tube,
   using <b>electric charge</b> to bend the beam.
   <ul class="plain" style="margin:8px 0 0">
     <li><b>X-plates</b> deflect the beam <b>horizontally</b>.</li>
     <li><b>Y-plates</b> deflect the beam <b>vertically</b>.</li>
   </ul>
   Because electrons are negative, the beam bends <b>towards the positive plate</b>. Commonly used for
   <b>small CRT displays such as an oscilloscope</b>.</div>
   <div class="note"><b>Method 2 &middot; Electromagnetic deflection.</b> An <b>externally applied magnetic
   field</b>. Two sets of coils are placed <b>externally, around the neck of the CRT</b> &mdash; nothing is
   inside the tube. Commonly used in <b>computer monitors and TV screens</b>.</div>
   <div class="note warn"><b>The rule everyone writes down backwards.</b> With magnetic deflection the field and
   the movement are <b>at right angles</b>:
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Vertical movement</b> of the beam is achieved by a <b>horizontal magnetic field</b>.</li>
     <li><b>Horizontal movement</b> of the beam is achieved by a <b>vertical magnetic field</b>.</li>
   </ul>
   This is not a typing error in your notes. It is genuinely crossed over, and it is the single most-reversed fact
   in Topic 9. Electro<b>static</b> plates are the intuitive ones &mdash; X-plates move the beam in X. Electro<b>magnetic</b>
   coils are the crossed ones.</div>
   <p>The lab puts both benches side by side so you can watch the same beam move under plates and under coils, and
   see the crossing happen.</p>`,

  developing:`
   <p>Two methods, two different mental models. Keeping them apart is most of the work in this module.</p>
   <div class="grid g2">
     <div class="note"><b>Electrostatic &mdash; direct.</b> An electric field pushes a charge along the field
     direction. The plates are inside the tube, the deflection is proportional to the plate voltage, and the axis
     is named after what it does: X-plates &rarr; horizontal, Y-plates &rarr; vertical. Small tubes, oscilloscopes.</div>
     <div class="note warn"><b>Electromagnetic &mdash; crossed.</b> A magnetic field pushes a moving charge
     <i>sideways</i>, at right angles to both the field and the direction of travel. The coils sit outside the
     neck. Horizontal field &rarr; vertical movement. Vertical field &rarr; horizontal movement. Monitors and TVs.</div>
   </div>
   <p><b>Why the crossing happens.</b> An electron travelling down the tube through a magnetic field feels a force
   perpendicular to <i>both</i> its own motion and the field. Its motion is along the tube. So the force has to be
   at right angles to the field, in the plane of the screen. A field lying horizontally can only push the beam up
   or down. If you can hold on to that one sentence, you never have to memorise the pair.</p>
   <div class="note"><b>Why the choice is made on size and application.</b> Deflecting a beam through a wide angle
   needs a lot of force. Plates inside a large tube would have to be enormous and would need very high voltages,
   and the beam would clip them. Coils outside the neck can produce a strong field on a short, wide tube without
   putting anything in the beam's path &mdash; which is why big screens are magnetic and small instrument tubes,
   where deflection is small and speed matters, are electrostatic.</div>
   <p><b>Predict before you check.</b> A monitor's picture has lost all vertical movement &mdash; everything is
   drawn on one horizontal line. Which coil set has failed, and what orientation was its field? Decide, then open
   the bench.</p>`,

  proficient:`
   <p>Where this module earns its keep on the flight line: reading a symptom backwards to a component.</p>
   <ul class="plain">
     <li><b>A single bright horizontal line.</b> The beam still sweeps left to right, so the horizontal system is
     alive, which means the <b>vertical</b> deflection has failed. On an electromagnetic tube the failed set is the
     one producing the <b>horizontal</b> field. On an electrostatic tube it is the <b>Y-plates</b>. Same symptom,
     opposite-sounding answers &mdash; you must know which tube you are looking at first.</li>
     <li><b>A single bright vertical line.</b> The mirror image: horizontal deflection lost, so the vertical-field
     coil set, or the X-plates.</li>
     <li><b>A stationary bright dot.</b> Both axes gone. On a real tube this is an emergency, because all the beam
     energy is landing on one patch of phosphor and will burn it &mdash; the same failure mode you will meet
     deliberately in Module 3 as the stroke-scanning burn mark.</li>
   </ul>
   <div class="note"><b>Why electrostatic is the oscilloscope's choice.</b> Plates respond to a voltage almost
   instantly; deflection coils are inductors and resist rapid changes of current. An oscilloscope's whole purpose
   is to follow fast signals faithfully, so it needs the fast, low-inertia deflection method &mdash; and its tube
   is small enough that plates can do the job with sensible voltages. A television has the opposite priorities:
   a wide, short tube and a fixed, repetitive scan rate.</div>
   <div class="note"><b>Transfer task.</b> A head-up display tube and a cockpit weather-radar display both fail
   with a single bright line across the middle of the screen. For each, state the deflection method you would
   expect the tube to use, name the component you would investigate, and state the orientation of the field or the
   plate pair involved. Then explain why the two answers use different words for the same fault.</div>`
 },

  "Raster scanning covers the screen line by line; its disadvantage is that the display will flicker.",

  "Stroke scanning overcomes flickering, but its disadvantage is a burn mark.",
  "Stroke draws using the (X,Y) coordinate method and repeats the whole drawing to maintain picture persistence.",
  "Stroke gives a sharper and brighter image because the beam moves slowly across the CRT face; used in head-up and helmet-mounted displays.",

 concept:{
  foundation:`
   <p>You now have a beam you can aim anywhere on the screen. There are <b>two ways to use that ability</b>, and
   they produce two different pictures with two different faults.</p>
   <div class="note"><b>Raster scanning.</b> The beam sweeps across the screen <b>line by line</b>, top to bottom,
   covering every part of the screen whether there is anything to draw there or not &mdash; like reading a page.
   The linear sweep is produced by a <b>sweep generator (an oscillator)</b> whose output is a <b>saw tooth
   wave</b>, applied to the <b>X-plates</b>. A saw tooth ramps up steadily (the beam crosses the screen at constant
   speed) then snaps back to the start (the beam flies back for the next line).
   <br><br><b>Disadvantage: the display will flicker.</b>
   <br><br>Used to cover <b>large areas of screen with image</b>, such as coloured areas &mdash; on an aircraft
   that means the <b>weather scope</b>, the <b>Navigation Display / EHSI</b>, and the <b>blue and brown
   backgrounds on the ADI</b>.</div>
   <div class="note"><b>Stroke scanning.</b> The beam draws the symbol directly, the way you would draw it with a
   pen, using the <b>(X,Y) coordinate method</b>. When the entire screen has been drawn the process repeats, to
   maintain <b>picture persistence</b>. It can reproduce all symbols including alphanumeric ones &mdash; datum
   marks, arcs, cursive symbols.
   <br><br><b>It overcomes flickering. Advantage: the image is sharper and brighter</b>, because the beam moves
   slowly across the CRT face. <b>Disadvantage: a burn mark</b> &mdash; the beam dwells on the same phosphor over
   and over.
   <br><br>Commonly used in <b>head-up and helmet-mounted display CRTs</b>, where the image must be viewed against
   a very bright background.</div>
   <div class="note warn"><b>Learn this pair as a pair.</b> Raster &rarr; <b>flicker</b>. Stroke &rarr; <b>burn
   mark</b>. This is Q2 of your review quiz, and the two faults are never swapped: raster keeps the beam moving
   everywhere, so it never dwells but revisits each spot slowly; stroke keeps the beam on the symbol, so it is
   bright and steady but always in the same place.</div>
   <p>Then there is the question of <b>how the lines of a raster are ordered</b>:</p>
   <div class="note"><b>Interlaced.</b> Each full screen is composed of <b>2 separate fields</b> &mdash; the
   <b>odd</b> lines first, then the <b>even</b> lines. The appearance and disappearance of the odd and even fields
   causes <b>noticeable flickering of thin horizontal lines</b>. Used in <b>TV display</b>.</div>
   <div class="note"><b>Non-interlaced (progressive).</b> Lines are painted progressively, left to right, top to
   bottom, in a <b>single pass</b>. <b>No flickering problem.</b> Used in <b>PC computer display</b>.</div>`,

  developing:`
   <p>Both faults come from the same thing &mdash; how long the beam spends on any given piece of phosphor &mdash;
   which is why one method has each fault and the other has the opposite.</p>
   <div class="grid g2">
     <div class="note"><b>Raster: everywhere, briefly.</b> The beam visits every spot on the screen, so it can only
     spend a tiny fraction of each frame on any one of them. The phosphor is excited briefly and then left to fade
     until the beam comes back. If the return is not fast enough, the eye sees the fade. <b>Flicker.</b></div>
     <div class="note"><b>Stroke: only the symbol, repeatedly.</b> The beam skips the empty screen entirely and
     spends the whole frame on the drawing. Each lit spot is revisited far more often and dwelt on longer, so it is
     bright and does not flicker &mdash; but the same phosphor is hammered indefinitely. <b>Burn mark.</b></div>
   </div>
   <p><b>Why stroke is sharper as well as brighter.</b> The deck attributes it to the <b>slow beam speed across
   the CRT face</b>. A slower-moving beam deposits more energy per millimetre of track, giving a well-defined,
   high-contrast line instead of a faint smear &mdash; which is exactly what a head-up display needs when it is
   competing with daylight through the windscreen.</p>
   <div class="note warn"><b>The interlacing trade.</b> Interlacing halves the amount of picture that must be
   drawn before something appears on screen, so the screen is refreshed more often for a given line rate. But
   because a thin horizontal line may live in only <i>one</i> of the two fields, it appears, disappears, and
   reappears at half the field rate &mdash; hence the <b>noticeable flickering of thin horizontal lines</b>. A TV
   image of moving scenery hides this well; a PC display full of one-pixel rules and text does not, which is why
   PCs are progressive.</div>
   <p><b>Predict before you check.</b> Draw the same symbol both ways in the lab. Which method leaves the screen
   background lit, and which one leaves a mark on the phosphor after long use? Decide first.</p>`,

  proficient:`
   <p>Aircraft displays do not pick one method and stop &mdash; they pick the method that fits what is being drawn,
   and often use both in the same tube.</p>
   <ul class="plain">
     <li><b>Raster where there are areas.</b> Weather radar returns, the coloured terrain and map washes on the
     Navigation Display / EHSI, and the blue sky and brown ground of the ADI are all <i>filled regions</i>. Drawing
     a filled region stroke by stroke would mean an enormous number of strokes, and the frame time would collapse.
     Raster covers area for free, because it visits everywhere anyway.</li>
     <li><b>Stroke where there are symbols.</b> A head-up display draws a handful of bright lines and characters
     against the outside world. There is no background to fill, brightness is the entire design problem, and stroke
     spends every microsecond of the frame on the few things that matter.</li>
     <li><b>Hybrid.</b> Many aircraft CRTs raster the background field and then stroke the symbology over it in the
     remaining time. You get filled colour areas <i>and</i> sharp bright symbols &mdash; and you inherit a little
     of both faults.</li>
   </ul>
   <div class="note"><b>Reading the fault back to the method.</b> A display returned with a permanent faint ghost
   of an aircraft symbol burned into the centre has been running stroke symbology. A display reported as
   "shimmering" or tiring to look at, particularly along horizontal rules, is a raster display with an interlacing
   or refresh problem. The complaint tells you which scanning method the tube was using.</div>
   <div class="note"><b>Transfer task.</b> A designer proposes using stroke scanning for the whole Navigation
   Display to eliminate flicker. Give two reasons the proposal fails, one about what is on that display and one
   about what stroke does to phosphor over a long service life. Then state what a hybrid design would give up.</div>`
 },

/* ---------------- MODULE 4 · THE COLOUR CRT ---------------- */
m4:{
 takeaways:[
  "The colour CRT is widely used in aircraft cockpit displays, particularly for larger aircraft.",
  "It has 3 electron guns, each dedicated to one of the primary colours red, green and blue.",
  "The screen is coated with many thousands of tiny dots of red, green and blue phosphors, arranged in small areas; each area contains a phosphor of each type.",
  "The beam from a particular gun must strike only its designated phosphor.",
  "This is achieved with a perforated steel sheet called the shadow mask, placed adjacent to the screen.",
  "Each area containing the 3 coloured dots is a triad, or pixel.",
  "Resolution is the number of triads that can be fitted into a square inch &mdash; higher resolution gives a sharper image.",
  "Dot-pitch is the distance between the pixels."
 ],
 concept:{
  foundation:`
   <p>Everything so far has described one gun making one dot. A colour CRT &mdash; <b>widely used in aircraft
   cockpit displays, particularly for larger aircraft</b> &mdash; does the same thing three times over.</p>
   <div class="note"><b>Three guns.</b> There are <b>3 electron guns</b>, each dedicated to one of the primary
   colours: <b>red</b>, <b>green</b> and <b>blue</b>. The guns themselves are identical &mdash; an electron beam
   has no colour. What makes a gun "the red gun" is that it is aimed at red phosphor.</div>
   <div class="note"><b>Three phosphors.</b> The screen is coated with <b>many thousands of tiny dots of red,
   green and blue phosphors</b>, arranged in small areas, and <b>each area contains a phosphor of each type</b>.
   So every small patch of screen can produce any colour, by lighting its three dots in different proportions.</div>
   <div class="note warn"><b>The problem, and the shadow mask.</b> Three beams converging on a screen covered in
   three kinds of dot could easily land on the wrong ones. <b>The beam from a particular gun must only strike its
   designated phosphor.</b> To make sure of that, a <b>perforated steel sheet called the shadow mask</b> is placed
   <b>adjacent to the screen</b>. Each beam approaches at its own angle, and the holes in the mask only let a beam
   through onto the dots it is supposed to hit &mdash; everything else is shadowed. Hence the name.</div>
   <div class="note"><b>Triads, resolution and dot-pitch.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li>Each area containing the 3 coloured dots is called a <b>triad</b>, or a <b>pixel</b>.</li>
     <li><b>Resolution</b> is the <b>number of triads that can be fitted into a square inch</b>. Higher resolution
     means a sharper image.</li>
     <li><b>Dot-pitch</b> is the <b>distance between the pixels</b>.</li>
   </ul>
   The two are related but they are not the same measurement, and the exam asks for the definitions separately.</div>`,

  developing:`
   <p>Three ideas here reward a second look, because each one is a common misunderstanding.</p>
   <div class="note"><b>The beams are not coloured.</b> An electron beam is electrons; it has no colour at all.
   The colour is entirely a property of the <i>phosphor</i> that gets hit. "The red gun" means "the gun whose
   geometry lines it up with the red dots through the mask". This is why a mask problem produces wrong colours
   rather than no colours &mdash; the electrons still arrive, they simply excite the wrong phosphor.</div>
   <div class="note warn"><b>The shadow mask works by geometry, not by filtering.</b> It does not absorb colours
   like a filter. It is a perforated steel sheet, and it works because the three guns sit at three slightly
   different positions, so their beams arrive at each hole from three slightly different angles and therefore land
   on three slightly different spots behind it. Move the mask a fraction, or let the tube's geometry drift, and
   every beam lands slightly off its dot &mdash; the picture washes out and colours become impure. The lab lets you
   mistune the mask and watch exactly that happen.</div>
   <div class="note"><b>Resolution and dot-pitch pull in opposite directions.</b> Resolution counts triads per
   square inch; dot-pitch measures the distance between pixels. Pack the triads closer and the pitch falls while
   the resolution rises. So a <i>smaller</i> dot-pitch means a <i>higher</i> resolution, which is why a small
   dot-pitch figure is quoted as a selling point.</div>
   <p><b>Predict before you check.</b> If the shadow mask is displaced slightly sideways, will the picture go dark,
   go the wrong colour, or go blurred? Decide, then mistune the mask in the lab.</p>`,

  proficient:`
   <p>The colour CRT is where the technology's advantages and its costs both peak, and that is worth being able to
   argue.</p>
   <ul class="plain">
     <li><b>The mask throws away most of the beam.</b> By design, the great majority of each beam lands on the
     steel rather than through a hole. That is the price of colour purity, and it is why colour tubes need more
     beam current &mdash; and therefore more power and more heat &mdash; than a monochrome tube of the same
     brightness. The deck's "extremely bright colour display" advantage is bought with the "high voltage and power
     consumption" and "generates a high amount of heat" disadvantages.</li>
     <li><b>The mask is a mechanical part in a thermal environment.</b> It is steel, adjacent to the screen,
     absorbing most of the beam energy as heat. It expands. Colour purity therefore depends on mechanical stability
     in a component that is being continuously heated &mdash; one reason a cockpit CRT is a demanding piece of
     equipment and a reason the technology is fragile in the deck's sense.</li>
     <li><b>Resolution is limited by the mask, not the gun.</b> Module 1's small emitting source sets how fine a
     spot the gun can make; the shadow mask sets how many triads exist to be addressed. You cannot resolve detail
     finer than the triad spacing no matter how well the beam is focused, which is why dot-pitch, not spot size, is
     the figure quoted for a colour tube.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A cockpit colour display develops patches where whites look pink and
   greens look muddy, worst near the edges of the screen and worse after the display has been running for an hour.
   Identify the component, explain both the geometric and the thermal part of the mechanism, and state why a
   monochrome tube in the same rack shows no equivalent fault.</div>`
 },

m5:{
 takeaways:[
  "There are three types of CRT correction: cushion, linearity and gamma.",
  "Cushion shape is due to curvature of the screen; correction is done through the deviation coil current.",
  "Linearity distortion is a distortion of the geometrical shape of the object; correction is done through the deviation coil current.",
  "A CRT does not produce a light intensity (luminance) proportional to the input voltage; it is proportional to the input voltage raised to the power gamma.",
  "Gamma correction is introduced to make the relationship linear.",
  "CRT advantages: inherent wider viewing angle, text and graphics display modes, extremely bright colour display, good speed of updating and retention of image.",
  "CRT disadvantages: large size and weight, high voltage and power consumption, generates a high amount of heat, fragile because it is made of glass vacuum tubes."
 ],
 concept:{
  foundation:`
   <p>A CRT does not draw what you asked for. Left alone, it draws something with the right content but the wrong
   shape and the wrong brightness, and three corrections are applied to fix that. Your notes list <b>three types of
   correction: cushion, linearity and gamma</b>.</p>
   <div class="note"><b>1 &middot; Cushion.</b> The picture bows inwards at the edges, like a cushion pinched at
   the corners. <b>Cushion shape is due to the curvature of the screen.</b> The beam is deflected through equal
   angles, but a curved screen is not the same distance away at the centre as it is at the corners, so equal angles
   do not give equal distances. <b>Correction is done through the deviation coil current.</b></div>
   <div class="note"><b>2 &middot; Linearity.</b> The <b>geometrical shape of the object is distorted</b> &mdash; a
   square comes out stretched on one side and squashed on the other, because the sweep is not moving the beam at a
   truly constant rate. <b>Correction is done through the deviation coil current.</b></div>
   <div class="note warn"><b>3 &middot; Gamma.</b> This one is not about shape at all, it is about brightness.
   <b>The CRT does not produce a light intensity (luminance) proportional to the input voltage.</b> Instead the
   luminance is <b>proportional to the input voltage raised to the power gamma</b>. Double the voltage and you do
   not get double the brightness &mdash; you get considerably more than double, so mid-greys come out far too dark.
   <b>Gamma correction is introduced to make the relationship linear.</b></div>
   <div class="note"><b>Two shape faults, one brightness fault.</b> Cushion and linearity are both geometry, and
   both are corrected the same way &mdash; <b>through the deviation coil current</b>. Gamma is the odd one out: a
   different symptom, a different cause and a different remedy.</div>
   <p>The module also closes off the CRT half of this topic, so it is where the balance sheet belongs:</p>
   <div class="grid g2">
     <div class="note"><b>CRT advantages.</b> Inherent <b>wider viewing angle</b> &middot; <b>text and graphics
     display modes</b> &middot; <b>extremely bright colour display</b> available &middot; <b>speed of updating and
     retention of image is good</b>. The two the deck singles out as significant are the extremely bright colour
     display and the wide range of viewing angle.</div>
     <div class="note warn"><b>CRT disadvantages.</b> <b>Large size and weight</b> &middot; <b>high voltage and
     power consumption</b> &middot; <b>generates a high amount of heat</b> &middot; <b>fragile</b>, because it is
     made of glass vacuum tubes.</div>
   </div>`,

  developing:`
   <p>Sort the three corrections by <b>what you would see</b>, because that is how a fault presents itself.</p>
   <div class="note"><b>Cushion &mdash; a shape fault that is symmetrical.</b> All four sides bow the same way,
   the centre is right, and the error grows towards the corners. That signature points straight at geometry
   between the deflection angle and the screen surface, which is exactly what "curvature of screen" means. The
   deflection amount has to be adjusted as a function of how far off-centre the beam is &mdash; hence a correction
   applied to the <b>deviation coil current</b>.</div>
   <div class="note"><b>Linearity &mdash; a shape fault that is asymmetrical.</b> One side is stretched and the
   other compressed; evenly spaced things do not come out evenly spaced. The cause is in the sweep itself rather
   than in the screen shape, but the remedy is the same control: shape the <b>deviation coil current</b> so that
   the beam really does move at a constant rate.</div>
   <div class="note warn"><b>Gamma &mdash; not a shape fault at all.</b> A perfectly shaped picture with crushed
   mid-tones. The relationship is luminance &prop; V<sup>&gamma;</sup>, so a half-scale input gives far less than
   half brightness. Gamma correction pre-distorts the signal in the opposite direction so that the combination
   comes out <b>linear</b>. Note carefully: gamma correction is <i>not</i> done through the deviation coil current
   &mdash; the coils have nothing to do with brightness.</div>
   <p><b>Why this matters for a colour display.</b> If red, green and blue are handled with even slightly
   different gamma, greys stop being grey and take on a colour cast that changes with brightness. On a cockpit
   display where colour carries meaning, that is not a cosmetic problem.</p>
   <p><b>Predict before you check.</b> A test pattern of evenly spaced concentric squares comes out with all four
   sides bowed inwards but correctly spaced along the centre lines. Which correction is out? Decide, then open the
   bench.</p>`,

  proficient:`
   <p>Two things to be able to argue, and then the honest verdict on the whole technology.</p>
   <ul class="plain">
     <li><b>Why cushion and linearity share a remedy but not a cause.</b> Both are errors in <i>where the beam
     lands</i> as a function of the drive signal, and the only handle available on where the beam lands is the
     deviation coil current. Cushion originates in the fixed geometry of a curved screen and is therefore
     predictable and symmetrical; linearity originates in imperfections in the sweep and is not. The same control
     fixes both, but the correction waveform differs, which is why they are listed as two separate corrections
     rather than one.</li>
     <li><b>Why gamma is not a defect to be engineered out.</b> The power law comes from the physics of the grid's
     control of beam current, not from a sloppy design, so it cannot simply be removed. Correction is applied to
     the <i>signal</i> instead, ahead of the tube. That means the correction has to match the tube, and a
     mismatched correction shows up as crushed shadows or washed-out highlights on a display that is otherwise
     working perfectly.</li>
   </ul>
   <div class="note"><b>The balance sheet, and why it eventually lost.</b> Every advantage on the CRT's list is
   real: <b>wider viewing angle</b>, <b>text and graphics modes</b>, <b>extremely bright colour</b>, <b>good
   update speed and image retention</b>. But every disadvantage &mdash; <b>large size and weight</b>, <b>high
   voltage and power consumption</b>, <b>high heat</b>, <b>fragile glass vacuum tube</b> &mdash; is a direct
   consequence of the architecture in Modules 1 to 4: a long evacuated glass envelope so the beam has room to be
   deflected, an HT supply to accelerate it, and a steel mask absorbing most of that energy as heat. You cannot
   keep the advantages and design out the disadvantages, which is the argument Module 6 picks up.</div>
   <div class="note"><b>Transfer task.</b> Three displays come off the same aircraft. Display A shows a correctly
   proportioned picture in which dark greys are almost black. Display B shows a picture whose left half is wider
   than its right. Display C shows a picture whose four edges all bow inwards equally. For each, name the
   correction at fault, state its cause, and state whether the deviation coil current is the remedy.</div>`
 },

/* ---------------- MODULE 6 · HOW AN LCD WORKS ---------------- */
m6:{
 takeaways:[
  "An LCD works by BLOCKING light. It does not emit its own light as compared to a CRT.",
  "It requires an external light source for readout, such as a cold cathode fluorescent lamp situated behind the LCD panel.",
  "The panel is two sheets of polarising material with a liquid crystal solution between them.",
  "The two polarising filters are at right angles to each other and together block light.",
  "With NO voltage the crystal twists the light by 90 degrees, so it passes the second polariser and is reflected back &mdash; the segment is NOT visible.",
  "With voltage applied the molecules align, light cannot pass through the polariser, and the segment turns black &mdash; visible.",
  "Each liquid crystal acts like a shutter, either allowing light to pass or blocking it.",
  "Controlling the voltage across each pixel lets light through in varying amounts, giving different levels of gray."
 ],
 concept:{
  foundation:`
   <p>Everything about the CRT was about <b>making</b> light. The LCD does the opposite: it <b>works by blocking
   light</b>. It does <b>not emit its own light as compared to CRT</b>, so it <b>requires an external light source
   for readout</b> &mdash; typically a <b>cold cathode fluorescent lamp situated behind the LCD panel</b>.</p>
   <p>Follow the light through the sandwich, one layer at a time. This is the whole module.</p>
   <div class="note"><b>The build.</b> Two sheets of <b>polarising material</b> with a <b>liquid crystal
   solution</b> between them. The two polarising filters are <b>at right angles to each other</b>, and on their own
   that pair <b>blocks light completely</b> &mdash; whatever gets through the first one is exactly what the second
   one rejects. A backlight creates light that passes through the first sheet.</div>
   <div class="note warn"><b>NO voltage &rarr; the segment is NOT visible.</b> With no voltage applied, the liquid
   crystal <b>twists the light by 90 degrees</b>. Twisted through 90 degrees, the light now lines up with the
   second polariser, <b>passes through it, and is reflected back via the mirror</b>. Light comes back out, the
   segment looks the same as everything around it, and so the segment is <b>not visible</b>.</div>
   <div class="note warn"><b>Voltage applied &rarr; the segment turns BLACK.</b> Applying a voltage makes the
   crystal <b>molecules align themselves</b>. Aligned, they no longer twist the light. The light arrives at the
   second polariser still crossed with it, so it <b>cannot pass through</b>. No light returns from that spot and
   the <b>segment turns black</b> &mdash; which is what makes it visible.</div>
   <div class="note"><b>The mental model: a shutter.</b> Each liquid crystal <b>acts like a shutter</b>, either
   allowing light to pass or blocking it. And because you can control the voltage across each pixel, the shutter
   does not have to be fully open or fully shut &mdash; controlling the voltage lets light through in <b>varying
   amounts</b>, giving <b>different levels of gray</b>.</div>
   <div class="note"><b>Say it out loud until it stops feeling wrong.</b> Voltage OFF &rarr; light passes &rarr;
   nothing to see. Voltage ON &rarr; light blocked &rarr; a black segment you can read. On an LCD, applying power
   to a segment does not light it up; it darkens it.</div>`,

  developing:`
   <p>Two crossed polarisers block everything. That is the starting condition, and everything else in the module is
   about whether the crystal defeats it.</p>
   <div class="note"><b>The crossed pair is the default: black.</b> The first polariser passes only light waving in
   one direction. The second one, at right angles, passes only light waving at 90 degrees to that. Put them
   together and nothing gets through &mdash; which is why the liquid crystal has to be there at all.</div>
   <div class="note"><b>The crystal's job is to rotate.</b> In its relaxed state the molecules sit in a twisted
   arrangement, and light following that twist comes out rotated by <b>90 degrees</b>: exactly the rotation needed
   to get through the second polariser. So the relaxed, unpowered state is the <i>transparent</i> one. Apply a
   field and the molecules straighten up and align with it; the twist is gone, the rotation is gone, and the
   crossed pair does what a crossed pair does &mdash; blocks.</div>
   <div class="note warn"><b>Why this trips people up.</b> Every other display in this topic emits light when you
   power it. On an LCD you are powering a <i>shutter</i>, not a lamp. The light was always there; the voltage
   decides whether you see it. Two useful checks: an LCD with a dead backlight and perfectly good drive shows you
   nothing at all, and an LCD with no power anywhere goes <i>blank and pale</i>, not black.</div>
   <div class="note"><b>How grey happens.</b> Partial voltage means partial alignment, which means partial
   rotation, which means the second polariser passes some of the light and rejects the rest. That continuous
   control is what makes photographic images possible, and it is why the deck says controlling the voltage across
   each pixel gives different levels of gray.</div>
   <p><b>Predict before you check.</b> A single segment on a fuel-quantity LCD is permanently black while the rest
   of the display works normally. Is that segment stuck with voltage applied or with voltage removed? Decide, then
   trace the light path in the lab.</p>`,

  proficient:`
   <p>The consequences of "blocking rather than emitting" run through the whole rest of the topic, so it is worth
   pulling them together here.</p>
   <ul class="plain">
     <li><b>Contrast is set by how well the crossed pair blocks, not by how bright the source is.</b> Turning the
     backlight up raises the white level and the leaked black level together. This is the mechanism behind the
     deck's LCD disadvantage <b>"lower contrast than CRT"</b>: a CRT's black is an unlit phosphor, which is
     genuinely black, while an LCD's black is a shutter that is nearly, but not perfectly, closed.</li>
     <li><b>Response time is mechanical, not electrical.</b> The molecules physically have to rotate into their new
     alignment and relax back out of it. Nothing in a CRT has to move &mdash; the beam is already where you point
     it &mdash; which is why the deck lists <b>slow response time</b> as an LCD disadvantage and <b>speed of
     updating</b> as a CRT advantage. It is also why Module 8's LED, which switches electronically, wins on
     response time outright.</li>
     <li><b>The power goes to the lamp, not to the picture.</b> A segment costs almost nothing to switch, so the
     LCD's power consumption is dominated by the backlight and is essentially independent of what is displayed.
     A CRT's consumption rises with brightness because brightness <i>is</i> beam current. This is why <b>low power
     consumption</b> is on the LCD's advantage list even though the panel needs a lamp behind it.</li>
   </ul>
   <div class="note"><b>The LCD balance sheet.</b> Advantages: <b>low power consumption</b> &middot; <b>physically
   thin</b> &middot; <b>low heat dissipation</b> &middot; <b>screen perfectly flat</b> &middot; <b>image perfectly
   sharp</b> &middot; <b>zero geometric distortion</b> &middot; <b>high peak intensity produces very bright
   images</b>. Disadvantages: <b>slow response time</b> and <b>lower contrast than a CRT</b>. Notice that "perfectly
   flat", "perfectly sharp" and "zero geometric distortion" are precisely the three things Module 5 had to correct
   on a CRT &mdash; a flat panel addresses pixels by their coordinates, so there is no cushion and no linearity
   error to correct in the first place.</div>
   <div class="note"><b>Transfer task.</b> A cockpit LCD is reported as "completely dead &mdash; no display at
   all", but a technician shining a torch at the panel at an angle can just make out the correct readings. State
   what has failed, explain why the readings are still being formed, and say what the same symptom would mean on a
   CRT.</div>`
 },
