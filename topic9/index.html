/* ---------------- MODULE 7 · VIEWING MODES & MATRICES ---------------- */
m7:{
 takeaways:[
  "The two main viewing modes of LCD readout are TRANSMISSIVE and REFLECTIVE.",
  "Transmissive uses a backlight; widely used in portable computers, excellent viewing indoors, and must be used outdoors in the shade.",
  "Reflective uses the ambient light in the vicinity, passing it through the LCD layer to a mirror which reflects it back to the viewer.",
  "Reflective is the least costly mode but requires bright light; viewing is difficult in dark rooms or outside at night.",
  "Passive matrix employs Twisted Nematic (TN) or Super-Twisted Nematic (STN), with each segment having its own individual contact fed by an external dedicated circuit.",
  "Passive matrix disadvantages: poor contrast and sharpness, and very slow response time.",
  "Active matrix employs Thin Film Transistors (TFT), with each pixel having its own dedicated transistor.",
  "Active matrix is brighter, sharper and has a much wider viewing range than passive matrix; the cockpit application is the high resolution colour AMLCD."
 ],
 concept:{
  foundation:`
   <p>Module 6 said an LCD needs light from somewhere else. This module answers two questions about that: <b>where
   does the light come from</b>, and <b>how is each pixel switched</b>.</p>
   <p><b>Question 1 &mdash; the two main viewing modes of LCD readout.</b> This is Q1 of your review quiz.</p>
   <div class="grid g2">
     <div class="note"><b>Transmissive.</b> An LCD screen that uses a <b>backlight</b>. Widely used in
     <b>portable computers</b>, and gives <b>excellent viewing indoors</b>. Outdoors it must be used <b>in the
     shade</b>, because direct sunlight simply overwhelms the backlight.</div>
     <div class="note"><b>Reflective.</b> Uses the <b>ambient light in the vicinity</b>. Light passes through the
     LCD layer to a <b>mirror</b>, which reflects it back to the viewer. It is the <b>least costly</b> mode, but it
     <b>requires bright light</b> &mdash; viewing is difficult in a dark room or outside at night.</div>
   </div>
   <div class="note warn"><b>They fail in opposite conditions.</b> Transmissive struggles in bright sunlight;
   reflective struggles in the dark. A calculator is reflective; a laptop is transmissive. Neither is "better"
   &mdash; they suit different places.</div>
   <p><b>Question 2 &mdash; how the pixels are switched.</b> LCDs are classified into two types.</p>
   <div class="note"><b>Passive matrix.</b> Employs <b>Twisted Nematic (TN)</b> or <b>Super-Twisted Nematic
   (STN)</b>. It has a small number of segments, <b>each with its own individual contact</b>, and an <b>external
   dedicated circuit supplies an electric charge</b> to control each segment. That structure is <b>unwieldy for
   more than a few display elements</b>. Disadvantages: <b>poor contrast and sharpness</b>, and <b>very slow
   response time</b>.</div>
   <div class="note"><b>Active matrix.</b> Employs the <b>Thin Film Transistor (TFT)</b>, and is used for high
   resolution colour displays. A matrix of TFTs is added to the polarising and colour filters, and <b>each pixel
   has its own dedicated transistor</b>, allowing each column line to access one pixel. Advantages: <b>brighter,
   sharper and a much wider viewing range</b> than passive matrix. Its application is the high resolution colour
   graphic display &mdash; the <b>AMLCD</b> in the cockpit.</div>`,

  developing:`
   <p>Both classifications are really about <b>scale</b>: how much light you need, and how many elements you can
   drive.</p>
   <div class="note"><b>The viewing-mode trade is a light budget.</b> Transmissive brings its own light, so it is
   independent of the room &mdash; excellent indoors, and beaten outdoors only because the sun is brighter than any
   lamp you can fit behind a panel. Reflective borrows whatever light is already there, which costs nothing to
   provide (hence <b>least costly</b>) and gets <i>better</i> as the surroundings get brighter, but has nothing to
   fall back on in the dark.</div>
   <div class="note warn"><b>Why passive matrix hits a wall.</b> Each segment needs <b>its own individual
   contact</b>, and an external circuit to charge it. Seven segments on a fuel gauge is seven contacts &mdash;
   manageable. A cockpit display with hundreds of thousands of pixels would need hundreds of thousands of wires
   brought out to the edge of the glass. That is what "unwieldy for more than a few display elements" means, and
   it is a wiring problem before it is anything else.</div>
   <div class="note"><b>What the TFT actually fixes.</b> Putting a transistor <i>at</i> every pixel means the pixel
   can hold its own state instead of waiting to be re-driven from outside. Each column line accesses one pixel at a
   time, so the wiring scales with rows plus columns rather than with the number of pixels. Because each pixel is
   held at full drive rather than briefly refreshed, it is <b>brighter and sharper</b>, and because it is not
   relying on a slow-relaxing crystal to remember its state between refreshes, the response and the
   <b>viewing range</b> both improve.</div>
   <p><b>Predict before you check.</b> Take a reflective display outside on a sunny day and then into a dark
   hangar. Then do the same with a transmissive one. Which one is unreadable where? Decide, then run the ambient
   light slider in the lab.</p>`,

  proficient:`
   <p>Why the cockpit ended up with the <b>AMLCD</b>, and what it had to wait for.</p>
   <ul class="plain">
     <li><b>The application forced active matrix.</b> A high resolution colour graphic display is exactly the case
     passive matrix cannot serve: too many elements to wire individually, and both of passive's disadvantages
     &mdash; poor contrast and sharpness, and very slow response &mdash; are disqualifying for primary flight
     information. The flat panel could not replace the CRT in a cockpit until the thin film transistor made a
     large, fast, sharp panel possible.</li>
     <li><b>Viewing range is a certification issue, not a comfort one.</b> A cockpit display must be readable from
     the other seat and by an observer, which is precisely the "much wider viewing range" advantage active matrix
     brings &mdash; and the one thing the CRT was always naturally good at, with its inherent wide viewing angle.
     This is the parameter the flat panel had to match before it could take over.</li>
     <li><b>The viewing mode has to survive the whole flight envelope.</b> A cockpit sees direct tropical sun
     through the windscreen and near-total darkness on a night sector, so a purely transmissive panel washes out at
     one end and a purely reflective one goes unreadable at the other. In practice cockpit panels are driven hard
     enough &mdash; the deck's LCD advantage <b>"high peak intensity produces very bright images"</b> &mdash; and
     dimmed far enough to cover both, which is a design requirement that ordinary consumer panels never face.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A supplier offers two panels for a standby instrument: a reflective
   passive-matrix panel and a transmissive active-matrix panel. State one condition in which each would be the
   safer choice, name the specific disadvantage of the passive panel that matters most for an instrument that must
   be readable at a glance, and say which of the CRT's advantages the active panel is being asked to replace.</div>`
 },

 concept:{
  foundation:`
   <p>The third technology is the simplest to describe and the hardest to build a large picture with. An LED is a
   <b>semiconductor diode that emits light when biased in the forward direction of the p-n junction</b>. The effect
   has a name: <b>electroluminescence</b>.</p>
   <div class="note warn"><b>Forward, and only forward.</b> Bias the junction the right way round and it emits.
   Reverse it and nothing happens. The junction emits light when a forward bias of typically <b>1.2 V to 4.4 V</b>
   is present and about <b>20 mA</b> of current flows. Those two numbers are the whole electrical specification you
   are expected to know.</div>
   <div class="note"><b>Two semiconductors, three colours.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Gallium arsenide phosphide</b> &mdash; <b>red</b> or <b>yellow</b> light.</li>
     <li><b>Gallium arsenide (GaAs)</b> &mdash; <b>green</b> light.</li>
   </ul>
   The colour comes from the material of the junction, not from a coloured lens.</div>
   <p><b>Three ways LEDs are used.</b></p>
   <div class="note"><b>Individual LEDs</b> indicate <b>discrete states</b> &mdash; power on/off, and similar
   annunciations.</div>
   <div class="note"><b>Segmented displays.</b> Commonly <b>7 segment</b> and <b>16 segment</b> devices, used for
   <b>alphanumeric display</b>. Seven segments make digits; sixteen make letters as well.</div>
   <div class="note"><b>Dot matrix displays.</b> An array of individually addressable LED dots, selected in groups
   to form alphanumeric characters and symbols. Multiple LEDs are wired in <b>rows and columns to minimise the
   number of pins</b> needed to drive them, and the array is typically arranged in a <b>5 &times; 7 pattern</b>.</div>
   <div class="note"><b>Common anode or common cathode.</b> Both the segmented and the dot matrix types are
   configurable either way. In a <b>common anode</b> device every LED's anode is tied to one shared pin and each
   cathode is driven separately; in a <b>common cathode</b> device it is the other way round. It changes how you
   drive them, not what they do.</div>
   <p><b>On the aircraft</b>, LEDs replace the pointers and tapes on circular or vertical scale displays &mdash;
   for example the <b>Torque Indicator</b> and the <b>Temperature Indicator</b>.</p>`,

  developing:`
   <p>The physics is one sentence. Where the module gets interesting is <b>why the wiring looks the way it
   does</b>, and <b>what an LED is and is not good for</b>.</p>
   <div class="note"><b>Why rows and columns.</b> A 5 &times; 7 dot matrix is 35 LEDs. Wired individually that is
   35 drive pins plus a common return. Wired as rows and columns it is <b>5 + 7 = 12</b> pins, and any dot is
   selected by energising one column and one row. The stated reason in your notes is exactly this: to
   <b>minimise the number of pins</b> needed to drive them. The cost is that you can only light one row (or one
   column) at a time, so the display is scanned rapidly and the eye does the rest.</div>
   <div class="note"><b>Common anode versus common cathode, practically.</b> Common anode means the shared pin
   goes to the positive supply and each individual pin is pulled <i>low</i> to light its LED. Common cathode means
   the shared pin goes to ground and each individual pin is driven <i>high</i>. Fit the wrong type into a driver
   designed for the other and nothing lights at all &mdash; every junction is reverse biased.</div>
   <div class="note warn"><b>The current is the thing to control, not the voltage.</b> The deck gives a forward
   bias range of 1.2 V to 4.4 V and about 20 mA of current. A diode's current rises very steeply once it is
   conducting, so a small increase in applied voltage produces a large increase in current &mdash; which is why
   LEDs are driven through a series resistor or a constant-current source and specified by their 20 mA rather than
   by a voltage.</div>
   <div class="note"><b>Why "limited resolution" is a real disadvantage.</b> Every dot is a physical device that
   has to be placed, connected and driven. A 5 &times; 7 character is legible, not detailed. That is fine for a
   Torque Indicator replacing a pointer, and hopeless for a weather picture &mdash; which is precisely why the
   three technologies divide the cockpit up between them rather than one winning outright.</div>
   <p><b>Predict before you check.</b> A common-cathode 7-segment display is fitted where a common-anode one
   should be. Does it show the wrong digits, dim digits, or nothing? Decide, then wire it in the lab.</p>`,

  proficient:`
   <p>This is the last module, so it is also where the three technologies get compared &mdash; which is
   <b>Q3 of your review quiz</b>, and the comparison bench in the lab.</p>
   <div class="note"><b>Q3 &mdash; which technology wins on each key parameter</b><br>
   <b>Brightness &rarr; CRT.</b> The deck lists "extremely bright colour display available" as one of the CRT's two
   significant advantages.<br>
   <b>Viewing angle &rarr; CRT.</b> Listed as "inherent wider viewing angle", and the other of the two
   significant advantages. It is exactly what active matrix later had to work to match.<br>
   <b>Compactness &rarr; LCD.</b> "Physically thin" and "screen perfectly flat", against the CRT's "large size and
   weight".<br>
   <b>Power consumption &rarr; LCD.</b> "Low power consumption", against the CRT's "high voltage and power
   consumption". The LED is efficient per unit of light, but a full display made of them is not the low-power
   option.<br>
   <b>Response time &rarr; LED.</b> "High response time" and "lights up very quickly". A junction switches
   electronically, while the LCD's crystals have to physically rotate &mdash; the LCD's "slow response time"
   disadvantage.</div>
   <p>Notice that no technology wins everything, and that each winner traces to a specific line in that
   technology's own advantage list. That is the argument the whole topic has been building towards.</p>
   <ul class="plain">
     <li><b>Why the LED took the indicators rather than the displays.</b> Its advantages &mdash; <b>energy
     saving</b>, <b>high response time</b>, <b>lights up very quickly</b>, <b>more light per watt</b>,
     <b>extremely long life span</b>, <b>very small and easily populated onto PCBs</b> &mdash; are exactly the
     properties you want for a bar, a scale or an annunciation that must be unambiguous and never fail. Its
     disadvantage of <b>limited resolution</b> rules it out for the picture-forming displays, which is why it
     replaced pointers and tapes on the <b>Torque Indicator</b> and <b>Temperature Indicator</b> rather than
     replacing the ND.</li>
     <li><b>The temperature disadvantage is an aircraft problem specifically.</b> LED <b>performance depends on the
     ambient temperature of the operating environment</b>, and an aircraft goes from a soaked flight deck on the
     ground in the tropics to a cold-soaked cockpit at altitude within one sector. Brightness and colour shift with
     junction temperature, which is why cockpit LED indicators are specified and dimmed with far more care than a
     panel indicator on the ground would need.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A design team must choose one technology for each of three items on a
   new flight deck: the primary navigation display, a master caution annunciator, and a digital engine torque
   readout. Choose one technology for each, and justify each choice by naming the specific advantage from that
   technology's list and the specific disadvantage that rules out the other two.</div>`

function renderPractice(host, modId, qs){
  if(!S.practice[modId]) S.practice[modId] = {};
  const rec = S.practice[modId];

  qs.forEach((q,i)=>{
    const box = el("div",{class:"q"});
    box.appendChild(el("div",{class:"stem"}, `<span class="tiny muted">Question ${i+1}</span><br>${q.stem}`));
    const opts = el("div",{class:"opts"});
    const fb = el("div",{class:"fb"});

    const paint = ()=>{
      const r = rec[q.id];
      $$(".opt",opts).forEach((b,bi)=>{
        b.className = "opt locked";
        if(r){
          if(bi===q.ans) b.classList.add("right");
          else if(bi===r.choice) b.classList.add("wrong");
        }else{
          b.className = "opt";
        }
      });
      if(r){
        fb.className = "fb show "+(r.correct?"good":"bad");
        fb.innerHTML = (r.correct?"<b>Correct.</b> ":"<b>Not quite.</b> ")+q.why;
      }
    };

    q.opts.forEach((o,oi)=>{
      const b = el("button",{class:"opt", onclick:()=>{
        if(rec[q.id]) return;
        const ok = oi===q.ans;
        rec[q.id] = {choice:oi, correct:ok};
        if(!ok && q.mis) addMisconception(modId, q.mis);
        save();
        paint();
        if(qs.every(x=>rec[x.id])) markProg(modId,"practice");
      }});
      b.innerHTML = `<span class="k">${"ABC"[oi]}</span><span>${o}</span>`;
      opts.appendChild(b);
    });
    box.appendChild(opts);
    box.appendChild(fb);
    host.appendChild(box);
    paint();
  });

  const again = el("button",{class:"btn sec no-print", onclick:()=>{
    S.practice[modId] = {}; save(); host.innerHTML=""; renderPractice(host, modId, qs);
  }},"Clear my answers and try again");
  host.appendChild(el("div",{class:"btn-row", style:"margin-top:6px"})).appendChild(again);
}

   11 · FEYNMAN ENGINE
   ============================================================ */
function analyseFeynman(text, ideas){
  const t = " "+text.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ")+" ";
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const covered = [], missing = [];
  ideas.forEach(idea=>{
    const hit = idea.terms.some(term=> t.indexOf(" "+term.toLowerCase()) !== -1 || t.indexOf(term.toLowerCase()) !== -1);
    (hit?covered:missing).push(idea.k);
  });
  // sentence count as a rough proxy for whether it is an explanation or a label
  const sentences = (text.match(/[.!?]+/g)||[]).length;
  return {words, sentences, covered, missing, pct: Math.round(covered.length/ideas.length*100)};
}

function renderFeynman(modId, F){
  const card = el("div",{class:"card"});
  card.innerHTML = `<div class="card-h"><span class="dot"></span><h3>4 &middot; Explain it back (Feynman method)</h3></div>
    <p class="small muted">If you cannot explain it simply, you do not understand it yet. Write it as if the person in
    front of you has never seen this topic &mdash; no formulas you have not explained, no jargon you have not unpacked.</p>
    <div class="note">${F.prompt}</div>`;

  const ta = el("textarea",{placeholder:F.starter, id:"fey_"+modId});
  ta.value = S.feynman[modId] || "";
  card.appendChild(ta);

  const meta = el("div",{class:"small muted", style:"margin-top:6px"});
  const out = el("div",{style:"margin-top:14px"});

  const refresh = ()=>{
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    meta.textContent = n+" words"+(n<40?" — aim for roughly 60–120":"");
  };
  ta.addEventListener("input", refresh);
  refresh();
  card.appendChild(meta);

  const row = el("div",{class:"btn-row no-print", style:"margin-top:12px"});
  const chk = el("button",{class:"btn", onclick:()=>{
    const text = ta.value.trim();
    S.feynman[modId] = text; save();
    const a = analyseFeynman(text, F.ideas);
    S.feynmanScore[modId] = {covered:a.covered, missing:a.missing, words:a.words, pct:a.pct};
    save();
    out.innerHTML = "";

    if(a.words < 25){
      out.appendChild(el("div",{class:"note warn"},
        "<b>Too short to check.</b> A one-line answer is a label, not an explanation. Write it as you would say it out "+
        "loud to someone standing next to you &mdash; roughly 60 to 120 words."));
      return;
    }

    const head = el("div",{class:"note "+(a.pct>=80?"ok":(a.pct>=50?"warn":"err"))});
    head.innerHTML = `<b>${a.covered.length} of ${F.ideas.length} key ideas covered (${a.pct}%).</b> `+
      (a.pct>=80 ? "That is a solid explanation &mdash; someone could learn the idea from it."
       : a.pct>=50 ? "You have the shape of it. The gaps below are the parts your listener would still be confused about."
       : "Most of the key ideas are missing. Read the concept section again, then rewrite &mdash; do not just add the words in.");
    out.appendChild(head);

    const g = el("div",{class:"grid g2"});
    const cvd = el("div");
    cvd.innerHTML = `<div class="eyebrow">You covered</div>`+
      (a.covered.length? "<ul class='tick'>"+a.covered.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"
                       : "<p class='small muted'>Nothing yet.</p>");
    const mis = el("div");
    mis.innerHTML = `<div class="eyebrow">Still missing</div>`+
      (a.missing.length? "<ul class='tick'>"+a.missing.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"
                       : "<p class='small muted'>Nothing &mdash; all key ideas present.</p>");
    g.appendChild(cvd); g.appendChild(mis);
    out.appendChild(g);

    out.appendChild(el("div",{class:"note small"},
      "<b>Careful:</b> this check looks for the ideas, not for the exact words. Dropping a missing keyword into your "+
      "text will tick the box without teaching anyone anything. Rewrite the sentence so the idea is actually explained."));

    markProg(modId,"feynman");
  }},"Check my explanation");
  row.appendChild(chk);
  row.appendChild(el("button",{class:"btn sec", onclick:()=>{ ta.value=""; refresh(); out.innerHTML=""; }},"Clear"));
  card.appendChild(row);
  card.appendChild(out);
  return card;
}

/* ============================================================
   13b · DISPLAY DATA & MODEL  (one source of truth for every lab)

   Everything below is taken from the Topic 9 slide deck. Where a bench
   needs a continuous relationship the slides state only in words — the
   gamma power law, shadow-mask misregistration, LCD grey levels, ambient
   readability — the model is written to reproduce the deck's stated
   endpoints exactly and is labelled on screen as an illustration of the
   stated behaviour, not as a measured curve.
   ============================================================ */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function fmtV(v){ return v>=1000 ? (v/1000).toFixed(v>=10000?0:1)+" kV" : Math.round(v)+" V"; }
function pct(x){ return Math.round(x*100)+"%"; }

/* ---- M1 · the electron gun (slides 4-7, 11) ---- */
const GUN_PARTS = [
  {id:"heater",  name:"Heater",          pot:"&mdash;",
   role:"Used to heat the cathode."},
  {id:"cathode", name:"Cathode",         pot:"&mdash;",
   role:"Emits electrons from a very small source when heated; the electrons form a mist in front of the cathode."},
  {id:"grid",    name:"Control grid",    pot:"NEGATIVE with respect to the cathode",
   role:"Controls the amount of electron flow down the tube."},
  {id:"anodes",  name:"1st &amp; 2nd anode", pot:"POSITIVE",
   role:"Accelerate and focus the electrons into a beam."},
  {id:"final",   name:"Final anode",     pot:"POSITIVE (HT supply)",
   role:"A graphite coating on the inside flared part of the tube, connected via its own terminal to the HT supply."},
  {id:"screen",  name:"Screen",          pot:"&mdash;",
   role:"Front of the tube coated in phosphor, which illuminates when bombarded by electrons."}
];
const GUN_ASSEMBLY = ["cathode","heater","grid","anodes"];   /* the parts that form the electron gun */

function gunOutcome(on){
  if(!on.heater)  return {v:"blank", part:"heater",  hd:"Nothing on the screen",
    why:"The cathode is cold. A cold cathode emits no electrons at all, so there is no beam to accelerate, focus or deflect."};
  if(!on.cathode) return {v:"blank", part:"cathode", hd:"Nothing on the screen",
    why:"With no emitting cathode there are no electrons, however hot the heater is."};
  if(!on.screen)  return {v:"blank", part:"screen",  hd:"Nothing on the screen",
    why:"Electrons are arriving with full energy, but there is no phosphor for them to illuminate."};
  if(!on.final)   return {v:"dim",   part:"final",   hd:"Very dim, barely visible",
    why:"Without the final anode's HT the electrons are never accelerated to enough energy to excite the phosphor properly."};
  if(!on.anodes)  return {v:"blur",  part:"anodes",  hd:"Bright but hopelessly blurred",
    why:"The electron mist was never focused into a beam, so it arrives spread out over a wide area instead of as a spot."};
  if(!on.grid)    return {v:"uncon", part:"grid",    hd:"Sharp, but stuck at full brightness",
    why:"Nothing is restricting the amount of electron flow down the tube, so there is no control over brightness."};
  return {v:"ok", part:null, hd:"A sharp, controllable spot",
    why:"Cathode, heater, control grid and anode assembly form the electron gun, producing a beam focused on the rear phosphor coating of the screen."};
}

/* ---- M2 · deflection (slides 8-10) ---- */
const DEFLECTION = {
  electrostatic:{
    name:"Electrostatic", uses:"electric charge",
    where:"X-plates and Y-plates inside the tube",
    app:"small CRT displays such as an oscilloscope"},
  electromagnetic:{
    name:"Electromagnetic", uses:"an externally applied magnetic field",
    where:"2 sets of coils placed externally around the neck of the CRT",
    app:"computer monitors and TV screens"}
};
/* the crossed rule: vertical movement <- horizontal field, horizontal movement <- vertical field */
function movementFromField(fieldOrientation){ return fieldOrientation === "horizontal" ? "vertical" : "horizontal"; }
function fieldForMovement(movement){        return movement === "vertical" ? "horizontal" : "vertical"; }
/* plates are NOT crossed: X-plates deflect horizontally, Y-plates vertically */
function movementFromPlate(plate){ return plate === "X" ? "horizontal" : "vertical"; }
function plateForMovement(movement){ return movement === "horizontal" ? "X" : "Y"; }

function faultComponent(method, lostMovement){
  return method === "electrostatic"
    ? plateForMovement(lostMovement) + "-plates"
    : fieldForMovement(lostMovement) + "-field coil set";
}
function faultSymptom(lostH, lostV){
  if(lostH && lostV) return "a stationary bright dot";
  if(lostV)          return "a single bright horizontal line";
  if(lostH)          return "a single bright vertical line";
  return "a normal picture";
}

/* ---- M3 · scanning and interlacing (slides 12-20) ---- */
const SCAN = {
  raster:{
    name:"Raster", how:"line by line",
    sweep:"a sweep generator (oscillator) whose output is a saw tooth wave, applied to the X-plates",
    advantage:"covers large areas of screen with image",
    disadvantage:"the display will flicker",
    apps:["the weather scope","the Navigation Display / EHSI","the blue &amp; brown backgrounds on the ADI"]},
  stroke:{
    name:"Stroke", how:"the (X,Y) coordinate method, repeated to maintain picture persistence",
    sweep:"no sweep generator &mdash; the beam is driven directly to each coordinate",
    advantage:"the image is sharper &amp; brighter, due to the slow beam speed across the CRT face",
    disadvantage:"a burn mark",
    apps:["head-up display CRTs","helmet-mounted display CRTs"]}
};
const FIELDS = {
  interlaced:{name:"Interlaced", fields:2,
    how:"each full screen is composed of 2 separate fields &mdash; the odd lines and the even lines",
    effect:"the appearance and disappearance of the odd and even fields causes noticeable flickering of thin horizontal lines",
    app:"TV display"},
  progressive:{name:"Non-interlaced (progressive)", fields:1,
    how:"lines are painted progressively, left to right, top to bottom, in a single pass",
    effect:"no flickering problem",
    app:"PC computer display"}
};
/* illustrative: how much of a frame is spent on any one lit spot, and therefore
   which fault that method suffers. Raster visits everywhere; stroke visits only the symbol. */
function dwellShare(method, litFraction){
  const f = clamp(litFraction, 0.01, 1);
  return method === "raster" ? f : 1;      /* stroke spends the whole frame on the symbol */
}
function scanFault(method){ return method === "raster" ? "flicker" : "burn"; }

/* ---- M4 · the colour CRT (slides 21-23) ---- */
const COLOUR = {
  guns:3, primaries:["red","green","blue"],
  maskName:"shadow mask", maskIs:"a perforated steel sheet", maskAt:"adjacent to the screen",
  triadName:"triad", triadAlso:"pixel"
};
function resolutionFromPitch(pitchMm){                 /* triads per square inch */
  const perInch = 25.4 / pitchMm;
  return perInch * perInch;
}
/* Mask misregistration: each dot occupies a third of the triad pitch. A beam displaced
   by d lands proportionally on the neighbouring dot. Illustrative geometry, stated on screen. */
function beamPurity(offsetMm, pitchMm){
  const dotW = pitchMm / 3;
  return clamp(1 - Math.abs(offsetMm) / dotW, 0, 1);
}
function triadOutput(offsetMm, pitchMm, drive){        /* drive = {red,green,blue} 0..1 */
  const p = beamPurity(offsetMm, pitchMm);
  const spill = 1 - p;
  const dir = offsetMm >= 0 ? 1 : -1;
  const out = {red:0, green:0, blue:0};
  COLOUR.primaries.forEach((c,i)=>{
    out[c] += drive[c] * p;
    const j = (i + dir + 3) % 3;
    out[COLOUR.primaries[j]] += drive[c] * spill;
  });
  return out;
}

/* ---- M5 · CRT correction (slides 24-27) ---- */
const CORRECTIONS = [
  {id:"cushion", name:"Cushion", kind:"geometry",
   cause:"curvature of the screen",
   remedy:"the deviation coil current"},
  {id:"linearity", name:"Linearity", kind:"geometry",
   cause:"the geometrical shape of the object is distorted",
   remedy:"the deviation coil current"},
  {id:"gamma", name:"Gamma", kind:"brightness",
   cause:"the CRT does not produce a luminance proportional to the input voltage &mdash; it is proportional to the input voltage raised to the power gamma",
   remedy:"gamma correction, introduced to make the relationship linear"}
];
const CORR_BY_ID = {}; CORRECTIONS.forEach(c=>CORR_BY_ID[c.id]=c);

function luminance(v, gamma){ return Math.pow(clamp(v,0,1), gamma); }
function gammaPredistort(v, gamma){ return Math.pow(clamp(v,0,1), 1/gamma); }
function screenLuminance(v, gamma, correctionOn){
  return correctionOn ? luminance(gammaPredistort(v,gamma), gamma) : luminance(v, gamma);
}
/* cushion: sides bow inwards, symmetrical, error grows towards the corners */
function cushionWarp(u, w, k){ return [ u*(1 - k*w*w), w*(1 - k*u*u) ]; }
/* linearity: one side stretched, the other compressed — asymmetric */
function linearityWarp(u, w, a){ return [ u + a*(u*u - 1/3), w ]; }

const CRT_ADV = ["inherent wider viewing angle","text &amp; graphics display modes",
  "extremely bright colour display available","speed of updating &amp; retention of image is good"];
const CRT_DIS = ["large size &amp; weight","high voltage &amp; power consumption",
  "generates a high amount of heat","fragile &mdash; made of glass vacuum tubes"];

/* ---- M6 · the LCD light path (slides 29-34) ---- */
const LCD_SOURCE = "a cold cathode fluorescent lamp situated behind the LCD panel";
function lcdSegment(voltageOn){
  return voltageOn
    ? {twistDeg:0,  passes:false, visible:true,
       hd:"Segment BLACK &mdash; visible",
       why:"The molecules align themselves with the field, so the light is no longer twisted. It arrives at the second polariser still crossed with it and cannot pass through, so the segment turns black."}
    : {twistDeg:90, passes:true,  visible:false,
       hd:"Segment NOT visible",
       why:"The crystal twists the light by 90 degrees, which allows it to pass through the second polariser and be reflected back via the mirror. Light returns, so the segment looks the same as its surroundings."};
}
/* grey levels: partial voltage gives partial alignment, so partial rotation.
   Malus' law across the crossed pair reproduces the deck's two stated endpoints exactly. */
function lcdTransmission(vFrac){
  const v = clamp(vFrac,0,1);
  return Math.pow(Math.cos(v * Math.PI/2), 2);
}
const LCD_ADV = ["low power consumption","physically thin","low heat dissipation","screen perfectly flat",
  "image perfectly sharp","zero geometric distortion","high peak intensity produces very bright images"];
const LCD_DIS = ["slow response time","lower contrast than CRT"];

/* ---- M7 · viewing modes and matrices (slides 35-39, 43-46) ---- */
const MODES = {
  transmissive:{name:"Transmissive", source:"a backlight",
    use:"widely used in portable computers; excellent viewing indoors",
    limit:"must be used outdoors in the shade, because direct sunlight overwhelms the backlight"},
  reflective:{name:"Reflective", source:"the ambient light in the vicinity",
    use:"light passes through the LCD layer to a mirror which reflects it back to the viewer; the least costly mode",
    limit:"requires bright light &mdash; viewing is difficult in dark rooms or outside at night"}
};
/* Illustrative readability model. It is built to land on the deck's four stated
   verdicts: transmissive excellent indoors and needing shade outdoors; reflective
   good in bright light and difficult in the dark. Stated on screen as illustrative. */
function readability(mode, lux, backlightOn){
  let s;
  if(mode === "transmissive"){
    if(!backlightOn) return {score:0, verdict:"unreadable",
      why:"A transmissive panel has no light of its own beyond the backlight. With the lamp out there is nothing to modulate."};
    s = 1 / (1 + lux/8000);
  }else{
    s = (Math.log10(Math.max(lux,1)) - 1) / (Math.log10(20000) - 1);
  }
  s = clamp(s, 0, 1);
  const verdict = s >= 0.6 ? "excellent" : (s >= 0.3 ? "usable" : "unreadable");
  return {score:s, verdict:verdict, why:null};
}

function ledState(vf, forward){
  if(!forward)          return {lit:false, reason:"reverse",
    why:"An LED emits light only when biased in the forward direction of its p-n junction. Reversed, the junction does nothing."};
  if(vf < LED.vfMin)    return {lit:false, reason:"below",
    why:"Below the typical forward bias range of "+LED.vfMin+" V to "+LED.vfMax+" V, the junction is not conducting enough to emit."};
  return {lit:true, reason:"ok",
    why:"Forward biased within the typical "+LED.vfMin+" V to "+LED.vfMax+" V range, with about "+LED.iTyp+" mA flowing &mdash; electroluminescence."};
}

/* ---------------- M1 · GUN ASSEMBLY BENCH ---------------- */
LABS.m1 = function(host, id, tier){
  const box = labShell("Gun assembly bench","Switch each part out in turn and watch the beam fail a different way");
  const B = box._body;
  host.appendChild(box);

  const on = {heater:1, cathode:1, grid:1, anodes:1, final:1, screen:1};
  let gridV = 60;                         /* 0 = fully cut off, 100 = wide open */

  const cols = el("div",{class:"lab-cols wide-left"});
  const left = el("div"), right = el("div");
  cols.appendChild(left); cols.appendChild(right);
  B.appendChild(cols);

  const anim = el("div"); left.appendChild(anim);
  const ro   = el("div",{style:"margin-top:14px"}); left.appendChild(ro);
  const note = el("div",{style:"margin-top:12px"}); left.appendChild(note);

  right.appendChild(el("div",{class:"eyebrow"},"Parts fitted"));
  const partRow = el("div",{style:"margin-bottom:14px"});
  right.appendChild(partRow);
  const partBtns = GUN_PARTS.map(p=>
    toggleBtn(partRow, p.name, p.name+" REMOVED", ()=>!!on[p.id], v=>{ on[p.id]=v?1:0; }, ()=>{ draw(); labTouch(id,8); }));

  right.appendChild(el("div",{class:"eyebrow"},"Control grid drive"));
  const gv = ctrl("Grid opening","m1gv", range("m1g",0,100,1,gridV));
  right.appendChild(gv);
  $("#m1g").addEventListener("input", e=>{ gridV = +e.target.value; draw(); labTouch(id,8); });

  const TASKS = {
    foundation:[
      {q:"With every part fitted, set the grid drive so the spot is at <b>full brightness</b>.",
       test:s=>s.all && s.gridV>=95},
      {q:"Remove the <b>heater</b> and read what happens to the beam.",
       test:s=>!s.on.heater},
      {q:"Refit the heater, then remove the <b>screen</b>. Note that this failure looks identical from the front.",
       test:s=>s.on.heater && s.on.cathode && !s.on.screen}
    ],
    developing:[
      {q:"Produce a picture that is <b>bright but hopelessly blurred</b>. Only one part does this.",
       test:s=>s.out.v==="blur"},
      {q:"Now produce one that is <b>sharp but stuck at full brightness</b>.",
       test:s=>s.out.v==="uncon"},
      {q:"Remove the <b>final anode</b> only, and read what its HT supply was doing.",
       test:s=>s.out.v==="dim"}
    ],
    proficient:[
      {q:"Find <b>all three</b> ways to get a completely blank screen, one after another. Start with the first.",
       test:s=>s.out.v==="blank" && !s.on.heater},
      {q:"Good. Now the second: refit the heater and blank the screen a different way.",
       test:s=>s.out.v==="blank" && s.on.heater && !s.on.cathode},
      {q:"And the third: restore the gun completely and blank it at the far end of the tube instead.",
       test:s=>s.out.v==="blank" && s.on.heater && s.on.cathode && s.on.grid && s.on.anodes && s.on.final},
      {q:"Finally, rebuild the tube completely and cut the beam off with the <b>grid</b> alone.",
       test:s=>s.all && s.gridV<=4}
    ]
  };

  function state(){
    const out = gunOutcome(on);
    const all = GUN_PARTS.every(p=>on[p.id]);
    let bright = 0;
    if(out.v==="ok")        bright = gridV/100;
    else if(out.v==="uncon")bright = 1;
    else if(out.v==="blur") bright = 0.85;
    else if(out.v==="dim")  bright = 0.12;
    return {on:Object.assign({},on), gridV, out, all, bright};
  }

  function draw(){
    const s = state(), o = s.out;
    partBtns.forEach(b=>b._sync());
    $("#m1gv").textContent = s.on.grid ? (gridV + "%") : "no grid fitted";

    const W = 470, H = 210;
    const nx = 40, ny = 74, nh = 44;          /* neck */
    const fx = 250, sx = 424;                 /* flare start, screen */
    let g = "";
    /* envelope */
    g += `<path d="M${nx},${ny} L${fx},${ny} L${sx},${28} L${sx},${182} L${fx},${ny+nh} L${nx},${ny+nh} Z"
            fill="#0d1620" stroke="#2a3a4a" stroke-width="1.5"/>`;
    /* final anode graphite coating */
    if(s.on.final)
      g += `<path d="M${fx},${ny+4} L${sx-6},${34} M${fx},${ny+nh-4} L${sx-6},${176}"
              stroke="#6b7a89" stroke-width="6" stroke-linecap="round" opacity=".75"/>
            <text x="${(fx+sx)/2}" y="${22}" class="cs" text-anchor="middle">graphite coating &middot; HT</text>`;
    /* gun parts */
    const mk=(x,w,col,lab,onq)=>{
      g += `<rect x="${x}" y="${ny+6}" width="${w}" height="${nh-12}" rx="3" fill="${onq?col:"#1b2836"}"
              stroke="${onq?col:"#33475c"}" stroke-width="1" opacity="${onq?.9:.45}"/>`;
      g += `<text x="${x+w/2}" y="${ny+nh+16}" class="cs" text-anchor="middle" fill="${onq?"#8fa3b5":"#5a6b7d"}">${lab}</text>`;
      if(!onq) g += `<line x1="${x}" y1="${ny+6}" x2="${x+w}" y2="${ny+nh-6}" stroke="${ACC}" stroke-width="1.6"/>`;
    };
    mk(nx+6, 14, AMB, "htr", s.on.heater);
    mk(nx+26, 12, CYN, "cath", s.on.cathode);
    mk(nx+46, 10, ACC, "grid", s.on.grid);
    mk(nx+66, 30, HI,  "anodes", s.on.anodes);
    /* beam */
    const spotY = 105;
    if(o.v !== "blank" || !s.on.screen){
      const emitting = s.on.heater && s.on.cathode;
      if(emitting){
        const spread = (o.v==="blur") ? 46 : 6;
        const alpha  = s.bright;
        g += `<path d="M${nx+100},${spotY} L${sx-4},${spotY-spread} L${sx-4},${spotY+spread} Z"
                fill="${CYN}" opacity="${0.10 + 0.35*alpha}"/>`;
        g += `<line x1="${nx+100}" y1="${spotY}" x2="${sx-4}" y2="${spotY}" stroke="${CYN}"
                stroke-width="${o.v==="blur"?1:2}" opacity="${0.25 + 0.6*alpha}"/>`;
      }
    }
    /* screen face */
    if(s.on.screen){
      g += `<rect x="${sx}" y="28" width="10" height="154" fill="#16232f" stroke="#33475c"/>`;
      if(o.v!=="blank"){
        const r = (o.v==="blur") ? 40 : 7;
        g += `<ellipse cx="${sx+5}" cy="${spotY}" rx="4" ry="${r}" fill="#eafff4"
                opacity="${Math.max(0.06, s.bright)}"/>`;
      }
      g += `<text x="${sx+5}" y="196" class="cs" text-anchor="middle">screen</text>`;
    }else{
      g += `<text x="${sx-4}" y="${spotY}" class="cs" text-anchor="middle" fill="${ACC}">no phosphor</text>`;
    }
    g += `<text x="${nx}" y="${H-6}" class="cs" fill="${o.v==="ok"?HI:AMB}">${o.hd}</text>`;

    anim.innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}">
      <style>.cs{fill:#8fa3b5;font:600 9.5px system-ui}</style>${g}</svg>`;

    ro.innerHTML = "";
    ro.appendChild(readout([
      {k:"Emission",   v:(s.on.heater&&s.on.cathode)?"yes":"none", cls:(s.on.heater&&s.on.cathode)?"g":"r"},
      {k:"Focus",      v:s.on.anodes?"focused beam":"unfocused mist", cls:s.on.anodes?"g":"r"},
      {k:"Acceleration",v:s.on.final?"HT applied":"no HT", cls:s.on.final?"g":"r"},
      {k:"Brightness control", v:s.on.grid?(gridV+"%"):"none", cls:s.on.grid?"":"r"},
      {k:"On the screen", v:o.hd, cls:o.v==="ok"?"g":(o.v==="blank"?"r":"c")}
    ]));

    note.innerHTML = "";
    const cls = o.v==="ok" ? "" : (o.v==="blank" ? "err" : "warn");
    let body = "<b>"+o.hd+".</b> "+o.why;
    if(o.v==="ok" && gridV<=4)
      body = "<b>Cut off by the grid.</b> Every part is fitted and working, but the control grid is at its most "+
             "negative setting, repelling the electrons back before they get down the tube. This is not a fault "+
             "&mdash; it is the grid doing exactly its stated job of controlling the <b>amount</b> of electron flow.";
    if(o.part){
      const p = GUN_PARTS.find(x=>x.id===o.part);
      if(p) body += "<br><br><span class='tiny muted'>"+p.name+" &mdash; "+p.role+
        (p.pot!=="&mdash;" ? " Potential: <b>"+p.pot+"</b>." : "")+"</span>";
    }
    note.appendChild(el("div",{class:"note "+cls, style:"margin-bottom:0"}, body));
    redrawTask && redrawTask();
  }

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>`${GUN_PARTS.filter(p=>!s.on[p.id]).map(p=>p.name).join(", ")||"all parts fitted"} &middot; grid ${s.gridV}% &rarr; ${s.out.hd.toLowerCase()}`,
    id);
  draw();
};
