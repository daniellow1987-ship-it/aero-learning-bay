<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic 5 — Databuses | Interactive Learning Bay</title>
<style>
/* ============================================================
   Topic 5 — Databuses: ARINC 429 & ARINC 629
   Interactive learning environment · Temasek Polytechnic
   Self-contained: no external fonts, scripts, styles or images.
   ============================================================ */

:root{
  --bg:#080d13;
  --bg-2:#0e151d;
  --panel:#121b25;
  --panel-2:#17222e;
  --panel-3:#1d2b39;
  --line:#26384a;
  --line-soft:#1c2937;
  --ink:#e3edf6;
  --ink-2:#a8bccd;
  --ink-3:#6f8598;
  --tp:#e02b3c;
  --tp-deep:#a8121f;
  --grn:#3ad68b;
  --amb:#f5b431;
  --red:#ff5a5f;
  --cyn:#38c6d9;
  --vio:#9b8cff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1200px 700px at 78% -10%, #16283a 0%, transparent 60%),
    radial-gradient(900px 600px at 0% 100%, #14202c 0%, transparent 55%),
    var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.02rem}h4{font-size:.9rem}
p{margin:0 0 .85em}
a{color:var(--cyn)}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono)}

/* ---------- app frame ---------- */
.app{display:flex;min-height:100vh}

/* ---------- rail ---------- */
.rail{
  width:262px;flex:0 0 262px;background:linear-gradient(180deg,#0d141c,#0a1018);
  border-right:1px solid var(--line-soft);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.rail-head{padding:18px 18px 14px;border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.brand-mark{
  width:26px;height:26px;border-radius:6px;flex:0 0 26px;
  background:linear-gradient(145deg,var(--tp),var(--tp-deep));
  display:grid;place-items:center;font-weight:800;font-size:.72rem;color:#fff;letter-spacing:.02em;
}
.brand-txt{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.rail-title{font-size:.98rem;font-weight:650;line-height:1.3}
.rail-sub{font-size:.72rem;color:var(--ink-3);margin-top:3px}

.rail-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-label{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:10px 8px 6px;font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:8px;
  padding:8px 9px;margin-bottom:2px;cursor:pointer;color:var(--ink-2);
  font-size:.845rem;transition:background .13s,color .13s,border-color .13s;
}
.nav-item:hover{background:#141f2b;color:var(--ink)}
.nav-item.active{background:#182739;border-color:#2b4560;color:#fff;font-weight:600}
.nav-num{
  width:21px;height:21px;flex:0 0 21px;border-radius:5px;background:#1b2836;
  display:grid;place-items:center;font-size:.68rem;font-family:var(--mono);color:var(--ink-3);
  border:1px solid var(--line-soft);
}
.nav-item.active .nav-num{background:var(--tp);color:#fff;border-color:transparent}
.nav-item.done .nav-num{background:rgba(58,214,139,.15);color:var(--grn);border-color:rgba(58,214,139,.35)}
.nav-txt{flex:1;min-width:0}
.nav-tier{
  font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:2px 6px;border-radius:20px;white-space:nowrap;
}
.tier-foundation{background:rgba(56,198,217,.14);color:var(--cyn)}
.tier-developing{background:rgba(245,180,49,.14);color:var(--amb)}
.tier-proficient{background:rgba(58,214,139,.14);color:var(--grn)}

.rail-foot{padding:12px;border-top:1px solid var(--line-soft)}
.progress-wrap{margin-bottom:10px}
.progress-line{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-3);margin-bottom:5px}
.bar{height:5px;border-radius:5px;background:#18222d;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--tp),#ff7a5c);border-radius:5px;transition:width .35s ease}
.ghost-btn{
  width:100%;background:#141e29;border:1px solid var(--line);border-radius:8px;
  padding:7px;font-size:.76rem;color:var(--ink-2);cursor:pointer;transition:.13s;
}
.ghost-btn:hover{background:#1a2734;color:var(--ink)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 26px;border-bottom:1px solid var(--line-soft);
  background:rgba(9,14,20,.82);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;
}
.crumb{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.topbar h2{margin:2px 0 0;font-size:1.06rem}
.view{padding:26px;max-width:1120px;width:100%;margin:0 auto;flex:1}

/* ---------- generic pieces ---------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.card.tight{padding:14px 16px}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.card-h .dot{width:7px;height:7px;border-radius:50%;background:var(--tp);flex:0 0 7px}
.card-h h3{margin:0}
.eyebrow{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:6px}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:18px 0}

.btn{
  background:linear-gradient(180deg,#e33c4c,var(--tp-deep));border:0;border-radius:8px;
  padding:9px 16px;font-weight:600;font-size:.86rem;color:#fff;cursor:pointer;
  box-shadow:0 3px 10px rgba(224,43,60,.24);transition:filter .13s,transform .06s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#1c2836;border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.sec:hover{background:#243444}
.btn.ok{background:linear-gradient(180deg,#43dd95,#1e9e63);box-shadow:0 3px 10px rgba(58,214,139,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;background:#1b2836;color:var(--ink-2);border:1px solid var(--line-soft)}
.pill.g{background:rgba(58,214,139,.12);color:var(--grn);border-color:rgba(58,214,139,.28)}
.pill.a{background:rgba(245,180,49,.12);color:var(--amb);border-color:rgba(245,180,49,.28)}
.pill.r{background:rgba(255,90,95,.12);color:var(--red);border-color:rgba(255,90,95,.28)}
.pill.c{background:rgba(56,198,217,.12);color:var(--cyn);border-color:rgba(56,198,217,.28)}

.note{border-left:3px solid var(--cyn);background:#101c26;padding:11px 14px;border-radius:0 8px 8px 0;font-size:.87rem;margin:12px 0}
.note.warn{border-left-color:var(--amb);background:#1d1a10}
.note.err{border-left-color:var(--red);background:#201415}
.note.ok{border-left-color:var(--grn);background:#101f18}
.note b{color:var(--ink)}

/* ---------- lab shell ---------- */
.lab{background:linear-gradient(180deg,#101a24,#0c141c);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.lab-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 16px;background:#0d161f;border-bottom:1px solid var(--line-soft);
}
.lab-head .t{display:flex;align-items:center;gap:9px;font-weight:650;font-size:.92rem}
.lab-head .t svg{opacity:.85}
.lab-body{padding:18px}
.lab-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.lab-cols.wide-left{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}

.ctrl{margin-bottom:14px}
.ctrl label{display:flex;justify-content:space-between;align-items:baseline;font-size:.79rem;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.ctrl label .v{font-family:var(--mono);color:var(--ink);font-size:.86rem;background:#182430;padding:1px 7px;border-radius:5px;border:1px solid var(--line-soft)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;
  background:#22303e;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--tp);cursor:pointer;border:2px solid #0e151d;box-shadow:0 0 0 1px var(--tp);
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--tp);cursor:pointer;border:2px solid #0e151d;
}
input[type=text],input[type=number],select,textarea{
  width:100%;background:#0c141d;border:1px solid var(--line);border-radius:7px;
  padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:.88rem;
}
input:focus,select,textarea:focus{outline:2px solid rgba(56,198,217,.4);outline-offset:-1px}
textarea{font-family:var(--sans);line-height:1.6;resize:vertical;min-height:120px}
select{font-family:var(--sans)}

.seg{display:flex;gap:4px;background:#0d161f;padding:4px;border-radius:9px;border:1px solid var(--line-soft);flex-wrap:wrap}
.seg button{
  flex:1;min-width:62px;background:transparent;border:0;border-radius:6px;padding:7px 8px;
  font-size:.79rem;color:var(--ink-2);cursor:pointer;font-weight:600;transition:.12s;
}
.seg button:hover{background:#182432;color:var(--ink)}
.seg button.on{background:var(--tp);color:#fff}

/* input toggles (logic switches) */
.switches{display:flex;gap:10px;flex-wrap:wrap}
.sw{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:#0d161f;border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;
  min-width:66px;transition:.13s;user-select:none;
}
.sw:hover{border-color:#33506b}
.sw .nm{font-size:.72rem;color:var(--ink-3);font-weight:700;letter-spacing:.05em}
.sw .lamp{
  width:30px;height:30px;border-radius:50%;background:#16212c;border:2px solid #24313d;
  display:grid;place-items:center;font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--ink-3);
  transition:.16s;
}
.sw.on .lamp{background:rgba(58,214,139,.2);border-color:var(--grn);color:var(--grn);box-shadow:0 0 12px rgba(58,214,139,.35)}
.sw.out{cursor:default}
.sw.out.on .lamp{background:rgba(245,180,49,.2);border-color:var(--amb);color:var(--amb);box-shadow:0 0 14px rgba(245,180,49,.4)}

/* truth table */
table.tt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.85rem}
table.tt th,table.tt td{border:1px solid var(--line-soft);padding:6px 10px;text-align:center}
table.tt th{background:#16212c;color:var(--ink-2);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-family:var(--sans);font-weight:700}
table.tt td.out{color:var(--amb);font-weight:700}
table.tt tr.hi td{background:rgba(224,43,60,.14);outline:1px solid rgba(224,43,60,.45)}
table.tt tr.hi td.out{color:#ff9a5c}
/* prose table (SSM / comparison) */
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem;margin:8px 0 2px}
table.tbl th,table.tbl td{border:1px solid var(--line-soft);padding:7px 10px;text-align:left;vertical-align:top}
table.tbl th{background:#16212c;color:var(--ink-2);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
table.tbl td:first-child,table.tbl th:first-child{white-space:nowrap}
table.tbl td b{color:var(--ink)}
.tblwrap{overflow-x:auto}

/* readouts */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px}
.ro{background:#0d161f;border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px}
.ro .k{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:3px}
.ro .v{font-family:var(--mono);font-size:1.02rem;color:var(--ink);word-break:break-all}
.ro.hl .v{color:var(--amb)}
.ro.g .v{color:var(--grn)}
.ro.c .v{color:var(--cyn)}

svg.viz{display:block;width:100%;height:auto;background:#0a1119;border:1px solid var(--line-soft);border-radius:9px}

/* bit boxes */
.bits{display:flex;gap:6px;flex-wrap:wrap}
.bit{
  width:46px;text-align:center;background:#0d161f;border:1px solid var(--line);border-radius:8px;
  padding:7px 0 5px;cursor:pointer;transition:.12s;user-select:none;
}
.bit:hover{border-color:#3a5b78}
.bit .b{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--ink-3);line-height:1.1}
.bit.on{background:rgba(224,43,60,.14);border-color:var(--tp)}
.bit.on .b{color:#ff8b8b}
.bit .w{font-size:.6rem;color:var(--ink-3);font-family:var(--mono);margin-top:2px}
.bit.on .w{color:var(--amb)}
.bit.flip{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}

/* q&a */
.q{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:15px 17px;margin-bottom:12px}
.q .stem{font-weight:600;margin-bottom:11px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;align-items:flex-start;gap:10px;background:#0e1720;border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;cursor:pointer;transition:.12s;font-size:.89rem;
}
.opt:hover{border-color:#3a5b78;background:#122030}
.opt .k{
  width:20px;height:20px;flex:0 0 20px;border-radius:5px;background:#1b2836;border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;color:var(--ink-3);font-weight:700;
}
.opt.sel{border-color:var(--cyn);background:#0f1e26}
.opt.sel .k{background:var(--cyn);color:#04141a;border-color:transparent}
.opt.right{border-color:var(--grn);background:#0e1e17}
.opt.right .k{background:var(--grn);color:#052014;border-color:transparent}
.opt.wrong{border-color:var(--red);background:#1e1315}
.opt.wrong .k{background:var(--red);color:#2a0b0c;border-color:transparent}
.opt.locked{cursor:default}
.fb{margin-top:11px;font-size:.86rem;padding:10px 13px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.good{background:#0e1e17;border:1px solid rgba(58,214,139,.3)}
.fb.bad{background:#1e1315;border:1px solid rgba(255,90,95,.3)}

/* stepper */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;padding-bottom:14px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:1px;background:var(--line)}
.step .n{
  width:23px;height:23px;flex:0 0 23px;border-radius:50%;background:#1b2836;border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;color:var(--ink-2);z-index:1;
}
.step.done .n{background:var(--grn);color:#052014;border-color:transparent}
.step .c{flex:1;font-size:.88rem;padding-top:1px}

/* tier banner */
.tier-banner{
  display:flex;align-items:center;gap:14px;padding:13px 17px;border-radius:10px;margin-bottom:16px;
  background:linear-gradient(90deg,#131f2b,#101820);border:1px solid var(--line);
}
.tier-banner .ic{
  width:36px;height:36px;flex:0 0 36px;border-radius:9px;display:grid;place-items:center;font-size:1.05rem;font-weight:800;
}
.tb-foundation .ic{background:rgba(56,198,217,.16);color:var(--cyn)}
.tb-developing .ic{background:rgba(245,180,49,.16);color:var(--amb)}
.tb-proficient .ic{background:rgba(58,214,139,.16);color:var(--grn)}
.tier-banner .tx{flex:1;min-width:0}
.tier-banner .tx b{display:block;font-size:.92rem}
.tier-banner .tx span{font-size:.79rem;color:var(--ink-2)}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:.87rem;cursor:pointer}
.chk .box{
  width:19px;height:19px;flex:0 0 19px;border-radius:5px;border:1px solid var(--line);background:#0e1720;
  display:grid;place-items:center;font-size:.72rem;color:transparent;transition:.12s;margin-top:1px;
}
.chk.on .box{background:var(--grn);border-color:var(--grn);color:#052014}

/* module footer nav */
.modfoot{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft)}

/* summary print */
.sum-block{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.sum-block h4{margin:0 0 8px;font-size:.95rem;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:.86rem}
.kv .k{color:var(--ink-3)}
.quoted{background:#0d151d;border-left:3px solid var(--vio);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.87rem;white-space:pre-wrap;color:var(--ink-2)}

/* misc */
.badge-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.hidden{display:none !important}
.center{text-align:center}
.stack>*+*{margin-top:12px}
ul.tick{list-style:none;padding:0;margin:0}
ul.tick li{padding-left:22px;position:relative;margin-bottom:7px;font-size:.88rem}
ul.tick li::before{content:"▸";position:absolute;left:4px;color:var(--tp);font-size:.8rem}
ul.plain{margin:0 0 .8em;padding-left:20px}
ul.plain li{margin-bottom:5px;font-size:.89rem}

.hero{
  background:linear-gradient(135deg,#16232f 0%,#101820 60%);
  border:1px solid var(--line);border-radius:14px;padding:28px 30px;margin-bottom:18px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(224,43,60,.16),transparent 68%);
}
.hero h1{font-size:1.75rem;margin-bottom:8px;position:relative}
.hero p{max-width:640px;position:relative;color:var(--ink-2)}

.mod-card{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:11px;padding:15px 16px;
  cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;
}
.mod-card:hover{border-color:#33506b;background:var(--panel-2);transform:translateY(-1px)}
.mod-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mod-card .idx{font-family:var(--mono);font-size:.7rem;color:var(--ink-3)}
.mod-card b{font-size:.94rem}
.mod-card p{font-size:.8rem;color:var(--ink-3);margin:0}

@media (max-width:1080px){
  .lab-cols,.lab-cols.wide-left,.split{grid-template-columns:1fr}
  .g2,.g3{grid-template-columns:1fr}
}
@media (max-width:820px){
  .rail{position:fixed;left:-262px;z-index:60;transition:left .2s;box-shadow:var(--shadow)}
  .rail.open{left:0}
  .menu-btn{display:inline-flex !important}
  .view{padding:18px 16px}
}
.menu-btn{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#182432;border:1px solid var(--line);cursor:pointer}

@media print{
  .rail,.topbar,.modfoot,.no-print{display:none !important}
  body{background:#fff;color:#111}
  .sum-block,.card{background:#fff;border:1px solid #ccc;color:#111;break-inside:avoid}
  .quoted{background:#f5f5f5;color:#222}
  .kv .k{color:#555}
}
</style>
</head>
<body>
<div class="app">

  <!-- ================= RAIL ================= -->
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="brand">
        <div class="brand-mark">TP</div>
        <div class="brand-txt">School of Engineering</div>
      </div>

const STORE_KEY = "tp_topic5_lb_v1";

const BLANK = {
  started:false,
  diagnosticDone:false,
  diagAnswers:{},                  // qid -> chosen index
  tiers:{},                        // modId -> 'foundation'|'developing'|'proficient'
  progress:{},                     // modId -> {concept,lab,practice,feynman}
  feynman:{},                      // modId -> text

  practice:{},                     // modId -> {qid:{choice,correct}}

  predictions:{}                   // key -> {guess, actual, hit}
};

let S = clone(BLANK);

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ S = Object.assign(clone(BLANK), JSON.parse(raw)); }
  }catch(e){ /* storage blocked (private window / sandboxed iframe) — run in memory */ }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch(e){ /* non-fatal: session continues in memory */ }
}
function resetAll(){
  S = clone(BLANK);
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  go("home");
}

function prog(id){
  if(!S.progress[id]) S.progress[id] = {concept:false,lab:false,practice:false,feynman:false};
  return S.progress[id];
}
function markProg(id, key){
  const p = prog(id);
  if(!p[key]){ p[key]=true; save(); renderNav(); }
}
function tierOf(id){ return S.tiers[id] || "developing"; }
function flag(id, name){
  if(!S.labFlags[id]) S.labFlags[id] = {};
  if(!S.labFlags[id][name]){ S.labFlags[id][name] = true; save(); }
}
function hasFlag(id,name){ return !!(S.labFlags[id] && S.labFlags[id][name]); }
function addMisconception(mod, text){
  if(!S.misconceptions.some(m=>m.mod===mod && m.text===text)){
    S.misconceptions.push({mod,text}); save();
  }
}

/* ============================================================
   2 · SMALL DOM HELPERS
   ============================================================ */
const $  = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
function el(tag, attrs, html){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(attrs[k]===undefined || attrs[k]===null) continue;
    if(k==="class") n.className = attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  if(html!=null) n.innerHTML = html;
  return n;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

const DIAG = [
  {id:"d1", mod:"m1", stem:"In a SERIAL data bus, the bits of a word are sent:",
   opts:["All at once, on separate lines","One at a time, on the same line","Only in one direction, never two"], ans:1,
   why:"Serial sends one bit at a time down a single line. Parallel is the one that puts 8 to 32 bits on separate lines simultaneously. Direction is a separate question from serial versus parallel."},
  {id:"d2", mod:"m1", stem:"A channel that can carry data both ways, but only one way at a time, is:",
   opts:["Simplex","Half-duplex","Full-duplex"], ans:1,
   why:"Half-duplex shares one channel in both directions, taking turns. Simplex is one direction only, like a broadcast. Full-duplex carries both directions at the same time."},

  {id:"d3", mod:"m2", stem:"What is a communications protocol?",
   opts:["The physical connector on an LRU","A set of rules governing data format and physical connections","The speed at which data travels"], ans:1,
   why:"A protocol is the agreed rulebook &mdash; data format, timing, voltage levels, connections &mdash; that lets multiple devices on the same bus exchange data efficiently."},
  {id:"d4", mod:"m2", stem:"In a STAR topology, one receiving LRU fails. What happens to the other receivers?",
   opts:["They all stop receiving","They are unaffected","Only the next one downstream stops"], ans:1,
   why:"Each receiver in a star has its own dedicated run from the transmitter, so a failure is contained. The one failure that takes everyone down is the transmitter itself."},

  {id:"d5", mod:"m3", stem:"ARINC 429 data is carried on:",
   opts:["78 &ohm; twisted shielded pair, grounded at both ends","A single coaxial cable","Fibre optic cable only"], ans:0,
   why:"ARINC 429 specifies a 78 &ohm; twisted shielded pair of wires with the shield grounded at both ends, which rejects the electromagnetic noise of an aircraft."},
  {id:"d6", mod:"m3", stem:"ARINC 429 uses three voltage states. What are they?",
   opts:["+5 V, 0 V, &minus;5 V","+10 V (High), 0 V (Null), &minus;10 V (Low)","+28 V, +14 V, 0 V"], ans:1,
   why:"Tri-level, bipolar return-to-zero: High is +10 V, Null is 0 V and Low is &minus;10 V. Every bit returns to null before the next one, which is how the receiver stays in step."},

  {id:"d7", mod:"m4", stem:"How many bits are there in each ARINC 429 word?",
   opts:["8 bits","16 bits","32 bits"], ans:2,
   why:"32 bits, arranged in five fields: parity, SSM, data, SDI and label."},
  {id:"d8", mod:"m4", stem:"Which of these is NOT one of the ARINC 429 data groups?",
   opts:["BCD","BNR","Hexadecimal"], ans:2,
   why:"The five groups are BCD, BNR, Discrete, Acknowledge (AIM) and Alphanumeric. Hexadecimal is a numbering system, not an ARINC 429 data group."},

  {id:"d9", mod:"m5", stem:"The ARINC 429 label field occupies which bits, and in what base is it written?",
   opts:["Bits 1&ndash;8, written in octal","Bits 9&ndash;10, written in binary","Bits 25&ndash;32, written in decimal"], ans:0,
   why:"The label is the 8 bits from bit 1 to bit 8, and it is written as three octal digits. That gives 256 possible labels, 000 to 377."},
  {id:"d10", mod:"m5", stem:"With SDI bits 10 and 9 set to 0 0, the word is addressed to:",
   opts:["System 1 only","All systems (All Call)","No system"], ans:1,
   why:"0 0 is All Call &mdash; every system accepts the word. 0 1, 1 0 and 1 1 address systems 1, 2 and 3 respectively."},

  {id:"d11", mod:"m6", stem:"What does the Sign Status Matrix (SSM) tell the receiving equipment?",
   opts:["The bit rate of the bus","The direction, sign, value and status of the transmitting LRU","Which connector the word arrived on"], ans:1,
   why:"The SSM carries the sign or direction of the data (plus/minus, north/south, left/right) together with the health of the transmitting LRU &mdash; normal, functional test, no computed data or failure warning."},
  {id:"d12", mod:"m6", stem:"What type of parity does ARINC 429 use?",
   opts:["Even","Odd","None"], ans:1,
   why:"Odd parity. Bit 32 is set so that the total number of ones across the whole 32-bit word is odd. If a receiver counts an even number of ones, the word is corrupt and is discarded."},

  {id:"d13", mod:"m7", stem:"Compared with ARINC 429, ARINC 629 is:",
   opts:["Simplex and slower","Half-duplex, multi-source multi-sink, and much faster","Identical but with a different connector"], ans:1,
   why:"ARINC 629 is a bi-directional half-duplex bus running at 2 Mbps with up to 120 terminals, and any terminal can transmit. ARINC 429 is simplex: one transmitter, up to 20 listeners, 100 kbps at best."},
  {id:"d14", mod:"m7", stem:"When an ARINC 429 word is transmitted, which part goes out first?",
   opts:["The parity bit","The label","The data field"], ans:1,
   why:"The least significant bit of the word is transmitted first, and bit 1 is the start of the label. So the receiver knows what the word contains before the data arrives &mdash; it can stop listening if the label is not one it cares about."}

function scoreDiagnostic(){
  const byMod = {};
  DIAG.forEach(q=>{
    if(!byMod[q.mod]) byMod[q.mod] = {right:0, total:0, wrong:[]};
    byMod[q.mod].total++;
    if(S.diagAnswers[q.id]===q.ans) byMod[q.mod].right++;
    else byMod[q.mod].wrong.push(q);
  });
  MODULES.forEach(m=>{
    const r = byMod[m.id] ? byMod[m.id].right : 0;
    S.tiers[m.id] = r===2 ? "proficient" : (r===1 ? "developing" : "foundation");
  });
  S.diagnosticDone = true;
  save();
  showDiagResult(byMod);
}

const CONTENT = {

/* ---------------- MODULE 1 · WHAT A DATA BUS IS ---------------- */
m1:{
 takeaways:[
  "A data bus connects the avionics LRUs and carries the data they exchange &mdash; it is the wiring plus the rules.",
  "Serial sends one bit at a time on one line; parallel sends 8 to 32 bits at once on separate lines.",
  "Unidirectional means data flows one way only; bidirectional means it can flow both ways.",
  "Simplex is one direction only. Half-duplex is both directions but one at a time. Full-duplex is both at once.",
  "Single source single sink is a dedicated link; single source multiple sink is ARINC 429; multiple source multiple sink is ARINC 629."
 ],
 concept:{
  foundation:`
   <p>Start with the problem. A modern aircraft carries dozens of <b>LRUs</b> &mdash; primary flight computers,
   autopilot director computers, the air data reference unit, engine data interfaces, flap and slat electronics,
   proximity electronics. They all need each other's numbers. Wiring every box directly to every other box would
   need thousands of wires and weigh a fortune.</p>
   <div class="note"><b>So: a data bus.</b> A shared set of wires that every LRU connects to, used for
   <b>communication and exchanging data between all the avionics equipment in the aircraft</b>. Fewer wires, less
   weight, and a box can be replaced without rewiring the aeroplane.</div>
   <p>Buses are described by three independent choices. Get these three words straight and the rest of the topic
   follows.</p>
   <div class="note"><b>1 &middot; Serial or parallel.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Serial</b> &mdash; 1 bit of data transmitted at a time, down one line. Slower per bit, but very few wires.</li>
     <li><b>Parallel</b> &mdash; 8 to 32 bits appear as a group on a number of data lines <i>at the same time</i>. Fast,
     but you need one wire per bit.</li>
   </ul></div>
   <div class="note"><b>2 &middot; One way or two.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Unidirectional</b> &mdash; one way. The transmitter talks, the receivers listen, and that is all.</li>
     <li><b>Bidirectional</b> &mdash; two way. Data can travel in either direction along the same link.</li>
   </ul></div>
   <div class="note warn"><b>3 &middot; Transmission mode.</b> This is the one students mix up.
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Simplex</b> &mdash; communication in <b>one direction only</b>. A to B, never B to A. Think television or
     a radio broadcast: the transmitter never hears you.</li>
     <li><b>Half-duplex</b> &mdash; the channel is used in <b>both directions, but only one direction at a time</b>.
     Think of a hand-held radio where you press to talk and release to listen.</li>
     <li><b>Full-duplex</b> &mdash; the channel is used in <b>both directions at the same time</b>. Think of a
     telephone call, where both people can talk at once.</li>
   </ul></div>`,

  developing:`
   <p>You know the three word-pairs. Now notice that they are <i>independent</i> &mdash; a bus is described by one
   choice from each list, and the combination is what gives it its character.</p>
   <div class="note"><b>Why aircraft buses are mostly serial.</b> A parallel bus is faster for the same clock rate,
   but 32 bits means 32 wires, 32 pins, 32 things to chafe and 32 things to corrode. In an aircraft, weight and
   connector reliability beat raw speed, so the serial bus wins &mdash; and you get the speed back by clocking it
   faster.</div>
   <div class="note"><b>The three source/sink arrangements.</b> "Source" means a transmitter; "sink" means a receiver.
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Single source, single sink</b> &mdash; a dedicated link from one piece of equipment to another. Simple,
     private, and expensive in wire if you need many of them.</li>
     <li><b>Single source, multiple sink</b> &mdash; one transmitting LRU sends to a number of recipients.
     <b>This is ARINC 429.</b></li>
     <li><b>Multiple source, multiple sink</b> &mdash; several transmitters may send to several receivers on the same
     bus. <b>This is ARINC 629.</b></li>
   </ul></div>
   <div class="note warn"><b>The trap.</b> "Bidirectional" and "full-duplex" are not the same claim. ARINC 629 is
   bidirectional &mdash; and it is <b>half</b>-duplex, because only one terminal may transmit at any instant.
   Bidirectional says which way data <i>can</i> go; duplex says whether both ways can happen <i>simultaneously</i>.</div>`,

  proficient:`
   <p>The design questions behind the vocabulary. Every one of these choices is a trade the airframer made
   deliberately, and being able to say <i>why</i> is what separates recall from understanding.</p>
   <ul class="plain">
     <li><b>Simplex buys you determinism.</b> If only one box can ever transmit on a wire, there is no arbitration,
     no collision, no negotiation, and no possibility that a babbling receiver corrupts the source. The receiver
     cannot ask for a repeat &mdash; so the transmitter simply sends the same parameter again, continuously, at a
     fixed rate. Data integrity comes from repetition rather than acknowledgement.</li>
     <li><b>The cost of simplex is wire count.</b> One transmitter per bus means that if 30 LRUs each publish data,
     you need 30 buses. This is precisely why ARINC 629 exists.</li>
     <li><b>Half-duplex on a shared bus needs a protocol for taking turns.</b> Somebody has to decide who transmits
     next. That mechanism &mdash; not the wire &mdash; is the hard part of a multi-transmitter bus, and it is why
     ARINC 629 terminals are considerably more complex than 429 ones.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> An air data reference unit publishes altitude, airspeed and total air
   temperature to six other LRUs. Argue for a single-source multiple-sink serial simplex bus over (a) six dedicated
   point-to-point links and (b) one shared bidirectional bus. Give one failure mode that your chosen answer handles
   badly.</div>`
 },

/* ---------------- MODULE 2 · PROTOCOLS, STANDARDS & TOPOLOGY ---------------- */
m2:{
 takeaways:[
  "A bus system requires a communications protocol: a set of rules and specifications governing data format and physical connections.",
  "The protocol is what enables efficient exchange of data between multiple devices on the same bus.",
  "The aircraft standards family includes ARINC 429, 561, 573, 615, 629, 708, MIL-STD-1553B/1773B, CSDB, ASCB and FDDI.",
  "ARINC 429 uses either a star topology or a bus-drop topology.",
  "Star: reliable, easy to modify, and a failure does not affect the others unless it is the transmitter.",
  "Bus drop: simple to set up, but a failure may affect many users and it is difficult to troubleshoot."
 ],
 concept:{
  foundation:`
   <p>Wire alone is not a bus. If two boxes are joined by copper but disagree about what a 1 looks like, how long a
   bit lasts, or where the data starts, nothing useful happens. What turns wire into a bus is the <b>protocol</b>.</p>
   <div class="note"><b>A communications protocol</b> consists of a <b>set of rules and specifications</b> governing,
   amongst other things, <b>data format and physical connections</b>. It exists so that data can be exchanged
   <b>efficiently between multiple devices connected to the same bus</b>.</div>
   <p>Different aircraft and different eras use different standards. You are not expected to know all of them, but you
   should recognise the family:</p>
   <ul class="plain">
     <li><b>ARINC 429</b> &mdash; the one this topic is built around</li>
     <li>ARINC 561, ARINC 573, ARINC 615, <b>ARINC 629</b>, ARINC 708</li>
     <li>MIL-STD-1553B / 1773B &mdash; the military equivalents</li>
     <li>CSDB and ASCB &mdash; general aviation</li>
     <li>FDDI &mdash; fibre distributed data interface</li>
   </ul>
   <div class="note"><b>ARINC 429 in one line.</b> A <b>2-wire unidirectional digital data bus</b>, also called the
   <b>Mark 33 Digital Information Transfer System (DITS)</b>. You will see it in flight control systems, flight data,
   in-flight entertainment and VHF communication systems.</div>
   <p>Once you have a transmitter and several receivers, you have to decide how to run the wire. There are two
   patterns.</p>
   <div class="note"><b>Star topology.</b> The transmitter has a separate run out to each receiver, like spokes from
   a hub. Advantages: <b>reliable</b>, <b>easy to modify</b>, and <b>failures do not affect the others unless the
   failure is the transmitter itself</b>.</div>
   <div class="note warn"><b>Bus drop topology.</b> One line leaves the transmitter and each receiver taps off it.
   Advantage: <b>simple to set up</b>. Disadvantages: a <b>failure may affect many users</b>, and it is
   <b>difficult to troubleshoot</b> &mdash; because a fault anywhere on the run can look identical from every tap.</div>`,

  developing:`
   <p>The protocol point matters more than it first appears. Everything else in this topic &mdash; 32-bit words,
   octal labels, odd parity, the 4-bit gap &mdash; <i>is</i> the ARINC 429 protocol. Each rule exists so that a
   receiver built by one manufacturer can decode a word from a transmitter built by another.</p>
   <div class="note"><b>Reading the topology diagrams like a maintainer.</b> Ask one question of each: <i>if I cut
   this wire here, who stops receiving?</i>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Star</b>, cut one spoke &rarr; exactly one receiver goes quiet. The fault is located the moment you know
     which box lost data.</li>
     <li><b>Bus drop</b>, cut the trunk &rarr; everything downstream of the cut goes quiet. Everything upstream is
     fine. So the symptom tells you roughly <i>where</i>, but every tap between there and the end reports the same
     thing.</li>
     <li><b>Either topology</b>, lose the transmitter &rarr; everybody goes quiet. That is the single point of
     failure a simplex bus cannot design away.</li>
   </ul></div>
   <div class="note warn"><b>Why star is "easy to modify".</b> Adding a receiver to a star means running one new
   spoke, and nothing existing is disturbed. Adding a tap to a bus drop means breaking into a live trunk, which
   affects every user on it. That is a maintenance argument, not an electrical one &mdash; and maintenance arguments
   are usually the ones that decide the design.</div>`,

  proficient:`
   <p>Topology is a reliability and diagnosability decision. Push on it.</p>
   <ul class="plain">
     <li><b>Star costs wire; bus drop costs certainty.</b> The star's advantage is fault isolation: a failure
     produces a symptom that identifies its own location. The bus drop's advantage is length of copper. On a large
     airframe those two costs are directly comparable, and different manufacturers have answered differently.</li>
     <li><b>"Difficult to troubleshoot" has a specific meaning.</b> On a bus drop, an intermittent short or a
     degraded stub loads the whole line. Every receiver sees marginal data, so no single receiver's symptom points
     at the culprit. You end up disconnecting stubs one at a time &mdash; which is why the loading and stub-length
     rules in the standard are not optional guidance.</li>
     <li><b>Neither topology changes the simplex rule.</b> Star wiring can look like it should permit a reply,
     because each spoke is a private wire. It does not. The standard, not the wiring pattern, forbids the receiver
     from transmitting.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> An intermittent fault causes three of five receivers on one ARINC 429 bus
   to log occasional missing words, always the same three. State which topology is in use and where you would look
   first, and explain what the symptom would have looked like instead in the other topology.</div>`
 },

/* ---------------- MODULE 3 · ARINC 429 PHYSICAL LAYER ---------------- */
m3:{
 takeaways:[
  "ARINC 429 uses a 78 &ohm; twisted shielded pair of wires, grounded at both ends.",
  "It is a simplex bus with unidirectional data flow: one transmitter, minimum 1 and maximum 20 receivers.",
  "Data is tri-level: High = +10 V, Null = 0 V, Low = &minus;10 V.",
  "The waveform is bipolar return-to-zero. Each bit lasts 83 &micro;s at low speed or 10 &micro;s at high speed.",
  "Low speed is 12 to 14.5 kbit/s; high speed is 100 kbit/s.",
  "Words are synchronised by a gap of 4 bit times at the null state."
 ],
 concept:{
  foundation:`
   <p>Before you can read a word you have to know what the wire looks like.</p>
   <div class="note"><b>The cable.</b> A <b>78 &ohm; twisted shielded pair</b> of wires, <b>grounded at both ends</b>.
   Twisting cancels magnetic pickup; the shield catches electric field noise; grounding both ends of that shield is
   what the standard specifies. An aircraft is an electrically filthy place and this cable is the answer to it.</div>
   <div class="note"><b>The direction.</b> ARINC 429 is a <b>simplex bus with unidirectional data flow</b>. One
   transmitter puts data on the line. There is a <b>minimum of 1 and a maximum of 20 receivers</b> listening.</div>
   <div class="note warn"><b>Three voltage levels, not two.</b> The data is in a <b>tri-level state</b>:
   <ul class="plain" style="margin:8px 0 0">
     <li><b>High = +10 V</b></li>
     <li><b>Null = 0 V</b></li>
     <li><b>Low = &minus;10 V</b></li>
   </ul>
   The waveform is <b>bipolar return-to-zero</b>. That means: to send a 1 the line goes to +10 V and then
   <i>returns to zero</i>; to send a 0 it goes to &minus;10 V and returns to zero. Every bit ends at null.</div>
   <p>Why bother returning to zero? Because it makes each bit visibly separate. A run of twenty 1s is twenty distinct
   pulses instead of one long high level, so the receiver can never lose count.</p>
   <div class="note"><b>Speed and bit time.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Low speed</b>: 12 to 14.5 kbit/s. Each bit lasts <b>83 &micro;s</b>.</li>
     <li><b>High speed</b>: 100 kbit/s. Each bit lasts <b>10 &micro;s</b>.</li>
   </ul></div>
   <div class="note"><b>Where one word ends.</b> Words are <b>synchronised by a gap of 4 bit times at the null
   state</b>. Four bit times of nothing means "that word is finished; the next bit you see is bit 1 of a new word".</div>`,

  developing:`
   <p>Turn the physical layer into numbers you can calculate with.</p>
   <div class="note"><b>Bit time and bit rate are the same fact.</b> High speed: 100 kbit/s means 1/100000 s per bit
   = 10 &micro;s. Low speed: 83 &micro;s per bit gives 1/0.000083 &asymp; 12 kbit/s, which is the bottom of the
   12&ndash;14.5 kbit/s band. If you remember one, you can derive the other.</div>
   <div class="note"><b>How long is a word?</b> 32 bits of word plus the 4-bit-time gap = <b>36 bit times</b>.
   <ul class="plain" style="margin:8px 0 0">
     <li>High speed: 36 &times; 10 &micro;s = <b>360 &micro;s</b> per word, so about <b>2778 words per second</b>.</li>
     <li>Low speed: 36 &times; 83 &micro;s = <b>2.988 ms</b> per word, so about <b>335 words per second</b>.</li>
   </ul>
   That is the real answer to "how fast is this bus" &mdash; not the bit rate, but how often a given parameter can be
   refreshed.</div>
   <div class="note warn"><b>Predict before you check.</b> If a transmitter is publishing 12 different parameters in
   rotation on one high-speed bus, how often does each one get updated? Work it out before you open the lab.</div>
   <p><b>The 20-receiver limit is electrical.</b> Each receiver presents a load to the line. Twenty is the point at
   which the transmitter can no longer guarantee that everybody sees a clean &plusmn;10 V. It is not an arbitrary
   number and it is not a suggestion.</p>`,

  proficient:`
   <p>Physical-layer reasoning at maintenance level.</p>
   <ul class="plain">
     <li><b>Return-to-zero costs bandwidth and buys robustness.</b> Every bit spends part of its time at null, so
     RZ needs roughly twice the bandwidth of a non-return-to-zero scheme at the same bit rate. What it buys is
     self-clocking: the receiver re-synchronises on every single bit, so a long run of identical bits cannot cause
     drift. On a bus with no return path and no retransmission request, that is worth paying for.</li>
     <li><b>Tri-level makes a broken wire visible.</b> With two levels, a stuck line is indistinguishable from valid
     data. With three, the idle state is a real state &mdash; null &mdash; and a line stuck at +10 V or &minus;10 V
     is obviously not a bus.</li>
     <li><b>The 4-bit gap is the only framing there is.</b> There is no start byte and no preamble. A receiver that
     joins mid-word has no way to tell where it is until it sees four bit times of null. That is why an
     intermittent connection produces garbage for a whole word and then recovers cleanly.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A high-speed 429 bus is found to be running at &plusmn;5 V instead of
   &plusmn;10 V at the far receiver, with the near receivers reading correctly. Give two physical causes, and say
   what you would expect to happen to the parity error count at the far receiver as the level degrades further.</div>`
 },

/* ---------------- MODULE 4 · THE 32-BIT WORD ---------------- */
m4:{
 takeaways:[
  "Every ARINC 429 word is 32 bits long and is divided into five fields.",
  "The fields are: Parity (bit 32), SSM, Data, SDI (bits 10&ndash;9) and Label (bits 8&ndash;1).",
  "Bit 32 is the MSB of the word and bit 1 is the LSB.",
  "There are five data groups: BCD, BNR, Discrete, Acknowledge (AIM) and Alphanumeric.",
  "BCD uses a 2-bit SSM (bits 31&ndash;30). BNR uses a 3-bit SSM (bits 31&ndash;29), so its data field is one bit shorter.",
  "Discrete and AIM words use the same overall five-field format."
 ],
 concept:{
  foundation:`
   <p>Every ARINC 429 word is exactly <b>32 bits</b>, and those 32 bits are always divided into the <b>same five
   fields, in the same order</b>. Learn the map once and every word you ever meet reads the same way.</p>
   <div class="note"><b>The five fields, from bit 32 down to bit 1:</b>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Bit 32 &mdash; P, the parity bit.</b> This is the <b>MSB</b> of the word.</li>
     <li><b>SSM &mdash; Sign Status Matrix.</b> Bits 31&ndash;30 (or 31&ndash;29, see below).</li>
     <li><b>Data field.</b> The actual number or state being sent, MSB first.</li>
     <li><b>SDI &mdash; Source Destination Identifier.</b> Bits 10 and 9.</li>
     <li><b>Label.</b> Bits 8 down to 1, written as three octal digits. Bit 1 is the <b>LSB</b> of the word.</li>
   </ul></div>
   <p>Notice the shape of that: the <b>label is at the bottom of the word</b>, and the parity is at the top. That
   detail will matter again in Module 7, because the LSB goes out on the wire first.</p>
   <div class="note"><b>The five data groups.</b> The word format is fixed, but what the data field <i>means</i>
   depends on which group the word belongs to:
   <ul class="plain" style="margin:8px 0 0">
     <li><b>BCD</b> &mdash; Binary Coded Decimal</li>
     <li><b>BNR</b> &mdash; fractional Binary Notation</li>
     <li><b>Discrete</b> &mdash; individual on/off states</li>
     <li><b>Acknowledge (AIM)</b></li>
     <li><b>Alphanumeric</b></li>
   </ul></div>
   <div class="note warn"><b>The one difference that changes the layout.</b> A <b>BCD</b> word has a <b>2-bit SSM</b>
   in bits 31 and 30. A <b>BNR</b> word has a <b>3-bit SSM</b> in bits 31, 30 and 29. So a BNR word gives up one bit
   of data field to gain a third SSM bit. Discrete and AIM words use the same five-field format.</div>`,

  developing:`
   <p>Field boundaries are not decoration &mdash; misreading one by a single bit gives you a number that is wrong by
   a factor of two and still looks plausible.</p>
   <div class="note"><b>Count the bits.</b> For a BCD word: 1 parity + 2 SSM + 19 data (bits 29&ndash;11) + 2 SDI +
   8 label = 32. For a BNR word: 1 parity + 3 SSM + 18 data (bits 28&ndash;11) + 2 SDI + 8 label = 32. The data field
   absorbs the difference; every other field is fixed.</div>
   <div class="note"><b>Why BNR needs the extra bit.</b> BNR carries a signed fractional binary number, so it needs a
   dedicated <b>sign</b> bit (bit 29) as well as the two status bits. BCD folds sign and status into the same two
   bits, which is why its SSM table has only four entries. You will see both tables in Module 6.</div>
   <div class="note warn"><b>Predict before you check.</b> If a BNR word and a BCD word both carry a value in the
   data field, which one can represent the larger range of numbers &mdash; and by what factor? Decide before you
   open the word builder.</div>
   <p><b>MSB and LSB inside the data field.</b> The data field itself is written MSB at the high-numbered bit end,
   LSB at the low-numbered end, in the normal way. It is only the <i>transmission order</i> that runs the other way,
   and that is a separate idea covered in Module 7.</p>`,

  proficient:`
   <p>The word format is a compromise between three competing demands, and you can see all three in the layout.</p>
   <ul class="plain">
     <li><b>Route early, decode late.</b> Label and SDI &mdash; the two fields that tell a receiver whether the word
     is for it at all &mdash; sit at the bottom of the word, and the bottom goes out first. A receiver can reject a
     word it does not want after 10 of 32 bits. On a bus with 20 listeners that is a real saving in receiver
     complexity.</li>
     <li><b>Validate last.</b> Parity is bit 32, the last bit transmitted, because it cannot be computed until every
     other bit is known. The word is therefore only trustworthy after it is complete &mdash; which is why a receiver
     buffers the whole word before acting on it.</li>
     <li><b>Status travels with the data, not separately.</b> The SSM is inside the same word as the value it
     qualifies. There is no separate health message that could arrive late or go missing, so a receiver can never act
     on a number while believing stale status about it. That is a safety property, and it is the reason the SSM
     costs data-field bits rather than being sent on its own label.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A designer proposes moving the label to bits 32&ndash;25 so it reads
   naturally at the left of a printout. State what this costs at the receiver, and what would have to change in the
   transmission-order rule to get the benefit back.</div>`
 },

/* ---------------- MODULE 5 · LABEL & SDI ---------------- */
m5:{
 takeaways:[
  "The label is the 8 bits from bit 8 down to bit 1, and it identifies the type of information the word contains.",
  "It is written in octal, so there are 256 possible labels, from 000 to 377.",
  "To read it: group the bits, weight them 1-2-4 within each group, then REVERSE the three digits.",
  "Equivalently: read the bits from bit 1 to bit 8 as an ordinary 8-bit number and write it in octal.",
  "The SDI is bits 10 and 9. 00 = All Call, 01 = system 1, 10 = system 2, 11 = system 3.",
  "The SDI encodes the desired receiver's system number in a multi-system installation."
 ],
 concept:{
  foundation:`
   <p>A receiver on an ARINC 429 bus sees a stream of words with no header telling it what each one is. The
   <b>label</b> is what solves that.</p>
   <div class="note"><b>The label identifies the type of information contained in each word.</b> It is the
   <b>8 bits</b> of the word from <b>bit 8 down to bit 1</b>, and it is written in <b>octal</b> &mdash; three digits.
   Eight bits gives <b>256 different octal labels, ranging from 000 to 377</b>.</div>
   <p>Now the part that catches everybody. The label is not simply the bit pattern read left to right. There is a
   <b>reversal</b> in the middle of the procedure.</p>
   <div class="note"><b>Worked example &mdash; bits to label.</b> Take the label field bits, bit 8 on the left down to
   bit 1 on the right: <b>0 0 1 1 1 1 1 1</b>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Step 1 &mdash; determine the weight of each bit.</b> The weights repeat 1, 2, 4 across each group of
     three: bits 8-7-6 weigh 1-2-4, bits 5-4-3 weigh 1-2-4, and bits 2-1 weigh 1-2.
       <ul class="plain" style="margin:6px 0 0">
         <li>Bits 8,7,6 = 0,0,1 &rarr; 0(1) + 0(2) + 1(4) = <b>4</b></li>
         <li>Bits 5,4,3 = 1,1,1 &rarr; 1(1) + 1(2) + 1(4) = <b>7</b></li>
         <li>Bits 2,1 = 1,1 &rarr; 1(1) + 1(2) = <b>3</b></li>
       </ul>
       That gives <b>4 7 3</b>.</li>
     <li><b>Step 2 &mdash; determine the label by reversing the order.</b> 4 7 3 becomes <b>3 7 4</b>.</li>
   </ul>
   <b>The label is 374<sub>8</sub>.</b></div>
   <div class="note warn"><b>Now the reverse process.</b> Given the label <b>233<sub>8</sub></b> (Air Temperature in
   your notes), find the bits:
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Step 1 &mdash; reverse the label.</b> 2 3 3 becomes <b>3 3 2</b>.</li>
     <li><b>Step 2 &mdash; write each digit back into its group using the 1-2-4 weights.</b>
     3 &rarr; bits 8,7,6 = 1,1,0. 3 &rarr; bits 5,4,3 = 1,1,0. 2 &rarr; bits 2,1 = 0,1.</li>
     <li><b>Step 3 &mdash; read the bit pattern.</b> <b>1 1 0 1 1 0 0 1</b></li>
   </ul></div>
   <div class="note"><b>The SDI &mdash; Source Destination Identifier.</b> Bits <b>10 and 9</b>. It encodes the
   desired receiver's <b>system number</b>, so that in a multi-system installation the same bus can carry words meant
   for different units:
   <ul class="plain" style="margin:8px 0 0">
     <li>0 0 &rarr; <b>All Call</b> &mdash; everybody takes it</li>
     <li>0 1 &rarr; system <b>1</b></li>
     <li>1 0 &rarr; system <b>2</b></li>
     <li>1 1 &rarr; system <b>3</b></li>
   </ul></div>`,

  developing:`
   <p>There is a much faster way to do the label conversion, and it is worth having both methods: the grouped
   1-2-4 method is what you show in an exam, and the shortcut is what you use to check yourself.</p>
   <div class="note"><b>The shortcut.</b> Read the label bits <b>from bit 1 up to bit 8</b> as an ordinary 8-bit
   binary number, with bit 1 as the most significant bit, then convert to octal.
   <ul class="plain" style="margin:8px 0 0">
     <li>The bit pattern above, written bit 8&rarr;bit 1, was 0 0 1 1 1 1 1 1.</li>
     <li>Read bit 1&rarr;bit 8 it is <b>1 1 1 1 1 1 0 0</b> = 252 decimal = <b>374<sub>8</sub></b>. Same answer.</li>
   </ul>
   The "reversal" in the taught method is just this: the label is written with bit 1 as its MSB, but the word is drawn
   with bit 1 on the right.</div>
   <div class="note warn"><b>Predict before you check.</b> Label 001<sub>8</sub> is Distance to Go. Before you open
   the calculator, write down what its 8 bits look like drawn in the word from bit 8 to bit 1. Most people get this
   one wrong on the first try, because the intuition says a small number should have its ones on the right.</div>
   <div class="note"><b>Why 256 and why octal?</b> 8 bits is 2<sup>8</sup> = 256 combinations. Octal groups bits in
   threes, and 8 bits is not a whole number of octal digits &mdash; which is exactly why the first digit only ever
   reaches 3, and why the label range stops at 377 rather than 777.</div>
   <p><b>Using the SDI properly.</b> A triple-redundant installation has three identical units on one bus. The
   transmitter sends the same label three times with SDI 01, 10 and 11, and each unit takes only its own. Using
   All Call instead would make all three act on the same data, which defeats the redundancy.</p>`,

  proficient:`
   <p>Label and SDI together are the addressing scheme of a bus that has no addresses.</p>
   <ul class="plain">
     <li><b>The label is a data-type address, not a device address.</b> Nothing in the word says which LRU sent it or
     which LRU should read it &mdash; only what the number <i>is</i>. Any receiver that cares about altitude listens
     for the altitude label. Add a new consumer of altitude and the transmitter does not change at all. That is why a
     publish-style bus scales in a way a point-to-point protocol does not.</li>
     <li><b>256 labels is a hard ceiling, and it has been hit.</b> Real installations disambiguate with the equipment
     identifier and with the SDI, so the same octal label can mean different parameters on buses from different
     equipment types. This is why a label list is only meaningful alongside the equipment ID &mdash; a label table on
     its own is not a decoder ring.</li>
     <li><b>The SDI is doing two different jobs.</b> Read as a <i>destination</i> it selects which of up to three
     identical receivers should act. Read as a <i>source</i> it tells a receiver which of three identical
     transmitters a word came from, which is how a voting scheme knows whose vote it is holding.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> Two ADIRUs publish airspeed on the same label to a shared display. Explain
   how the display distinguishes them, what happens if both are configured with SDI 00, and why that failure would be
   difficult to spot in a functional check on the ground.</div>`
 },

  "The SSM identifies the direction, sign, value and the status of the transmitting LRU.",
  "BCD SSM is bits 31&ndash;30, with 4 designations: 00 plus/north/east/right/to/above, 01 no computed data, 10 functional test, 11 minus/south/west/left/from/below.",
  "BNR SSM is bits 31&ndash;29, with 6 designations. Bit 29 alone carries sign and direction.",

 concept:{
  foundation:`
   <p>Two fields protect the receiver from believing something it should not. The SSM says <i>how much to trust this
   number and which way it points</i>. Parity says <i>did this word arrive intact</i>.</p>
   <div class="note"><b>The SSM &mdash; Sign Status Matrix.</b> It <b>identifies the direction, sign, value and the
   status of the transmitting LRU</b>. Its width depends on the data group.</div>
   <div class="note"><b>BCD SSM &mdash; bits 31 and 30, four designations.</b>
   <table class="tbl"><thead><tr><th>Bit 31</th><th>Bit 30</th><th>Designation</th><th>Meaning</th></tr></thead><tbody>
   <tr><td>0</td><td>0</td><td>Plus, North, East, Right, To, Above</td><td>Positive data</td></tr>
   <tr><td>0</td><td>1</td><td>No Computed Data</td><td>Source cannot compute reliable data, for reasons other than system failure</td></tr>
   <tr><td>1</td><td>0</td><td>Functional Test</td><td>Data in the word is test results only</td></tr>
   <tr><td>1</td><td>1</td><td>Minus, South, West, Left, From, Below</td><td>Negative data</td></tr>
   </tbody></table></div>
   <div class="note"><b>BNR SSM &mdash; bits 31, 30 and 29, six designations.</b> Bit 29 does the sign on its own, and
   bits 31&ndash;30 do the status:
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Bit 29 = 0</b> &rarr; Plus, North, East, Right, To, Above</li>
     <li><b>Bit 29 = 1</b> &rarr; Minus, South, West, Left, From, Below</li>
   </ul>
   <table class="tbl" style="margin-top:10px"><thead><tr><th>Bit 31</th><th>Bit 30</th><th>Designation</th></tr></thead><tbody>

   <tr><td>1</td><td>1</td><td>Normal Operation</td></tr>
   </tbody></table></div>
   <div class="note warn"><b>Parity.</b> ARINC 429 uses <b>ODD parity</b> for error checking. That means
   <b>the total number of ones in the 32-bit word must be odd</b>.
   <ul class="plain" style="margin:8px 0 0">
     <li>Count the ones in bits 1 to 31.</li>
     <li>If that count is already <b>odd</b>, parity bit 32 must be <b>0</b>.</li>
     <li>If it is <b>even</b>, parity bit 32 must be <b>1</b>.</li>
   </ul>
   Either way, the finished word has an odd number of ones. A receiver that counts an even number knows the word is
   corrupt and discards it.</div>`,

  developing:`
   <p>The two SSM tables look similar and are not. Learning them as one table with an exception is the reliable way.</p>
   <div class="note"><b>The one row that is identical in both.</b> <b>1 0 = Functional Test</b> appears in the BCD
   table and the BNR table, meaning the same thing in each. Every other row differs, which is why you must know which
   data group you are reading <i>before</i> you decode the SSM.</div>
   <div class="note warn"><b>The dangerous confusion.</b> In BCD, <b>1 1 means negative data</b> &mdash; a perfectly
   healthy word carrying a minus sign. In BNR, <b>1 1 means Normal Operation</b> &mdash; a status, with the sign held
   separately in bit 29. Read a BNR word with the BCD table and you will turn "everything is fine" into "the value is
   negative".</div>
   <div class="note"><b>"No Computed Data" is not a failure.</b> It says the source is unable to compute reliable
   data <i>for reasons other than system failure</i> &mdash; for example an air data computer that has valid
   electronics but no usable air data on the ground. The equipment is serviceable; the number is not available. A
   maintenance message that reports NCD as a fault is reporting the wrong thing.</div>
   <div class="note"><b>Parity, done quickly.</b> You do not need to count all 31 bits carefully. Count in pairs and
   discard them &mdash; two ones cancel. Whatever is left over, 0 or 1, is your answer for whether the count is even
   or odd. Parity bit 32 is then simply whichever value makes the whole word odd.</div>
   <p><b>Predict before you check.</b> Take any word and flip exactly one bit anywhere in it. Will the parity check
   fail? Now flip two bits. Decide before you open the bench.</p>`,

   <p>What these two fields can and cannot do is a genuine integrity question, not a memory one.</p>
   <ul class="plain">
     <li><b>Odd parity detects any odd number of bit errors and misses every even number.</b> One corrupted bit is
     caught. Two corrupted bits in the same word pass the check and deliver wrong data with a valid-looking word.
     ARINC 429 accepts that risk because the bus is short, shielded, slow and the same parameter is repeated a few
     milliseconds later &mdash; not because double errors are impossible.</li>
     <li><b>Odd parity, not even, is chosen deliberately.</b> An all-zeros word &mdash; which is what a dead
     transmitter or a shorted line produces &mdash; has an even number of ones, namely none. Under odd parity that
     pattern is always invalid, so a failed-silent bus can never be mistaken for a stream of zero-valued data. Even
     parity would have accepted it.</li>
     <li><b>The SSM protects against a different failure than parity does.</b> Parity guards the <i>transmission</i>;
     the SSM guards the <i>computation</i>. A word can be perfectly received and still be worthless, and only the SSM
     will tell you so. A receiver that checks parity and ignores the SSM will happily display a number its source has
     already disowned.</li>

 concept:{
  foundation:`
   <p>Two loose ends: what the word looks like as it actually leaves the wire, and what happens when one transmitter
   per bus is no longer enough.</p>
   <div class="note"><b>Order of transmission.</b> <b>The LSB of the ARINC word is transmitted first.</b> Bit 1 goes
   out, then bit 2, and so on up to bit 32. Since the label lives in bits 8&ndash;1, <b>the label is transmitted
   first</b> &mdash; in the example on your slides, label 041<sub>8</sub> leaves the wire before anything else.
   Transmission is <b>the same for the BCD, BNR, Discrete and AIM word formats</b>.</div>
   <p>That is why the field order looked upside down in Module 4. Drawn on paper the word runs bit 32 on the left to
   bit 1 on the right; sent down the wire it runs bit 1 first. The label arrives at the front so the receiver knows
   immediately whether the rest is worth listening to.</p>
   <div class="note"><b>ARINC 629 &mdash; the answer to the wire count.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li>Uses a <b>bi-directional bus &mdash; half duplex</b></li>
     <li><b>Multi source, multi sink</b> &mdash; any terminal may transmit</li>
     <li>Up to <b>120 terminals</b></li>
     <li>Transmission rate <b>2 Mbps</b></li>
   </ul>
   Terminals attach to the data bus through a <b>bus coupler</b> and a <b>stub</b>, rather than being wired in
   directly.</div>
   <div class="note warn"><b>The comparison you must be able to give.</b>
   <table class="tbl"><thead><tr><th></th><th>ARINC 429</th><th>ARINC 629</th></tr></thead><tbody>
   <tr><td><b>Bus architecture</b></td><td>Simplex (unidirectional)</td><td>Half-duplex (bidirectional)</td></tr>
   <tr><td><b>Data bit rate</b></td><td>12&ndash;14.5 kbps low speed, 100 kbps high speed</td><td>2 Mbps</td></tr>
   <tr><td><b>Number of terminals</b></td><td>1 transmitter + 20 receivers</td><td>120 devices</td></tr>
   <tr><td><b>Sources / sinks</b></td><td>Single source, multiple sinks</td><td>Multiple sources, multiple sinks</td></tr>
   </tbody></table></div>`,

  developing:`
   <p>Put numbers on the difference and it stops being a table to memorise.</p>
   <div class="note"><b>Twenty times the speed, six times the devices.</b> 2 Mbps against 100 kbps is a factor of 20.
   120 terminals against 21 is a factor of about 6. Multiply those and one ARINC 629 bus does the work of something
   like a hundred high-speed 429 buses &mdash; which is the whole argument, expressed as weight of copper.</div>
   <div class="note"><b>What half-duplex costs.</b> Any terminal may transmit, so something has to stop two of them
   transmitting at once. That arbitration is the price of the bandwidth: an ARINC 629 terminal is a substantially
   more complex and expensive device than a 429 receiver, which needs only a line receiver and a shift register.</div>
   <div class="note warn"><b>Predict before you check.</b> A system publishes one parameter that must be refreshed
   every 5 ms. Can a low-speed ARINC 429 bus do it? Work out the word time first &mdash; you calculated it in
   Module 3 &mdash; then check in the lab.</div>
   <p><b>Choosing between them is not always "629 wins".</b> A single sensor feeding three displays needs one
   transmitter, three listeners and no arbitration. On that job ARINC 429 is lighter, cheaper, simpler to certify and
   easier to troubleshoot. ARINC 629 earns its complexity only when many boxes must publish to many others.</p>`,

  proficient:`
   <p>The architectural argument, which is what an interview or an exam discussion actually rewards.</p>
   <ul class="plain">
     <li><b>Simplex is deterministic by construction; half-duplex has to be made deterministic.</b> On a 429 bus,
     latency is fixed and calculable: the transmitter's rotation is the only thing that matters. On a shared bus,
     worst-case latency depends on what every other terminal is doing, so the arbitration scheme must be designed to
     bound it. Certification cares about the bound, not the average.</li>
     <li><b>Failure containment moves.</b> On 429 a babbling transmitter can corrupt only its own bus, and there is
     exactly one of them. On a shared bus a babbling terminal can deny service to all 120, so the terminal needs
     independent protection against transmitting when it should not. That protection is part of why the terminal is
     expensive.</li>
     <li><b>The LSB-first rule is not a detail.</b> It is what lets a receiver filter on label before the data
     arrives. Any redesign that moves the label away from the transmitted front either loses that filtering or forces
     the receiver to buffer every word on the bus &mdash; which, with 20 listeners and continuous publication, is the
     difference between a shift register and a computer.</li>
   </ul>

   worst-case refresh requirement of 20 ms. Argue for either 30 high-speed ARINC 429 buses or one ARINC 629 bus.

function renderPractice(host, modId, qs){
  if(!S.practice[modId]) S.practice[modId] = {};

  qs.forEach((q,i)=>{
    const box = el("div",{class:"q"});
    box.appendChild(el("div",{class:"stem"}, `<span class="tiny muted">Question ${i+1}</span><br>${q.stem}`));
    const opts = el("div",{class:"opts"});
    const fb = el("div",{class:"fb"});

    const paint = ()=>{
      const r = rec[q.id];
      $$(".opt",opts).forEach((b,bi)=>{
        b.className = "opt locked";
        if(r){
          if(bi===q.ans) b.classList.add("right");
          else if(bi===r.choice) b.classList.add("wrong");
        }else{
          b.className = "opt";
        }
      });
      if(r){
        fb.className = "fb show "+(r.correct?"good":"bad");
        fb.innerHTML = (r.correct?"<b>Correct.</b> ":"<b>Not quite.</b> ")+q.why;
      }
    };

    q.opts.forEach((o,oi)=>{
      const b = el("button",{class:"opt", onclick:()=>{
        if(rec[q.id]) return;
        const ok = oi===q.ans;

      opts.appendChild(b);

}

   ============================================================ */
function analyseFeynman(text, ideas){
  const t = " "+text.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ")+" ";
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const covered = [], missing = [];
  ideas.forEach(idea=>{
    const hit = idea.terms.some(term=> t.indexOf(" "+term.toLowerCase()) !== -1 || t.indexOf(term.toLowerCase()) !== -1);
    (hit?covered:missing).push(idea.k);
  });
  // sentence count as a rough proxy for whether it is an explanation or a label
  const sentences = (text.match(/[.!?]+/g)||[]).length;
  return {words, sentences, covered, missing, pct: Math.round(covered.length/ideas.length*100)};
}

    front of you has never seen this topic &mdash; no formulas you have not explained, no jargon you have not unpacked.</p>
    <div class="note">${F.prompt}</div>`;

  const ta = el("textarea",{placeholder:F.starter, id:"fey_"+modId});
  ta.value = S.feynman[modId] || "";
  card.appendChild(ta);

  const meta = el("div",{class:"small muted", style:"margin-top:6px"});
  const out = el("div",{style:"margin-top:14px"});

  const refresh = ()=>{
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    meta.textContent = n+" words"+(n<40?" — aim for roughly 60–120":"");
  };
  ta.addEventListener("input", refresh);
  refresh();
  card.appendChild(meta);

  const row = el("div",{class:"btn-row no-print", style:"margin-top:12px"});
  const chk = el("button",{class:"btn", onclick:()=>{
    const text = ta.value.trim();
    S.feynman[modId] = text; save();
    const a = analyseFeynman(text, F.ideas);
    S.feynmanScore[modId] = {covered:a.covered, missing:a.missing, words:a.words, pct:a.pct};
    save();
    out.innerHTML = "";

    if(a.words < 25){
      out.appendChild(el("div",{class:"note warn"},
        "<b>Too short to check.</b> A one-line answer is a label, not an explanation. Write it as you would say it out "+
        "loud to someone standing next to you &mdash; roughly 60 to 120 words."));
      return;
    }

    const head = el("div",{class:"note "+(a.pct>=80?"ok":(a.pct>=50?"warn":"err"))});
    head.innerHTML = `<b>${a.covered.length} of ${F.ideas.length} key ideas covered (${a.pct}%).</b> `+
      (a.pct>=80 ? "That is a solid explanation &mdash; someone could learn the idea from it."
       : a.pct>=50 ? "You have the shape of it. The gaps below are the parts your listener would still be confused about."
       : "Most of the key ideas are missing. Read the concept section again, then rewrite &mdash; do not just add the words in.");
    out.appendChild(head);

    const g = el("div",{class:"grid g2"});
    const cvd = el("div");
    cvd.innerHTML = `<div class="eyebrow">You covered</div>`+
      (a.covered.length? "<ul class='tick'>"+a.covered.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"
                       : "<p class='small muted'>Nothing yet.</p>");
    const mis = el("div");
    mis.innerHTML = `<div class="eyebrow">Still missing</div>`+
      (a.missing.length? "<ul class='tick'>"+a.missing.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"
                       : "<p class='small muted'>Nothing &mdash; all key ideas present.</p>");
    g.appendChild(cvd); g.appendChild(mis);
    out.appendChild(g);

    out.appendChild(el("div",{class:"note small"},
      "<b>Careful:</b> this check looks for the ideas, not for the exact words. Dropping a missing keyword into your "+
      "text will tick the box without teaching anyone anything. Rewrite the sentence so the idea is actually explained."));

    markProg(modId,"feynman");
  }},"Check my explanation");
  row.appendChild(chk);
  row.appendChild(el("button",{class:"btn sec", onclick:()=>{ ta.value=""; refresh(); out.innerHTML=""; }},"Clear"));
  card.appendChild(row);
  card.appendChild(out);
  return card;
}

/* ============================================================
   13b · ARINC 429 MATHS  (one source of truth for every lab)
   ============================================================ */

/* Bit arrays are indexed b[0] = bit 1 ... b[7] = bit 8 for the label,
   and b[0] = bit 1 ... b[31] = bit 32 for a whole word.
   Drawn on paper the word runs bit 32 on the LEFT to bit 1 on the RIGHT,
   which is the reverse of the array order. */

const LBITS = 8;

/* label bits (b[0]=bit1 .. b[7]=bit8) -> octal string, bit 1 is the MSB */
function labelOctalFromBits(b){
  let v = 0;
  for(let i=0;i<LBITS;i++) v = v*2 + (b[i]?1:0);
  return v.toString(8).padStart(3,"0");
}
/* octal string -> label bits (b[0]=bit1 .. b[7]=bit8) */
function labelBitsFromOctal(oct){
  let v = parseInt(oct,8);
  if(!(v>=0 && v<=255)) v = 0;
  const b = new Array(LBITS);
  for(let i=LBITS-1;i>=0;i--){ b[i] = v & 1; v >>= 1; }
  return b;
}
/* the three 1-2-4 weighted group digits, in calculation order (before reversal) */
function labelGroupDigits(b){
  // group A = bits 8,7,6 weighted 1,2,4 ; group B = bits 5,4,3 ; group C = bits 2,1 weighted 1,2
  const A = (b[7]?1:0) + (b[6]?2:0) + (b[5]?4:0);
  const B = (b[4]?1:0) + (b[3]?2:0) + (b[2]?4:0);
  const C = (b[1]?1:0) + (b[0]?2:0);
  return [A,B,C];
}
/* draw order: bit 8 first, bit 1 last */
function bitsDrawn(b){ return b.slice().reverse(); }

/* SDI */
const SDI_TABLE = [
  {bits:"00", sys:"All Call", note:"every system accepts the word"},
  {bits:"01", sys:"System 1", note:""},
  {bits:"10", sys:"System 2", note:""},
  {bits:"11", sys:"System 3", note:""}
];

/* SSM */
const SSM_BCD = [
  {bits:"00", d:"Plus, North, East, Right, To, Above", m:"Positive data"},
  {bits:"01", d:"No Computed Data",                    m:"Source cannot compute reliable data, for reasons other than system failure"},
  {bits:"10", d:"Functional Test",                     m:"Data in the transmitted word is test results only"},
  {bits:"11", d:"Minus, South, West, Left, From, Below", m:"Negative data"}
];
const SSM_BNR_STATUS = [
  {bits:"00", d:"Failure Warning"},
  {bits:"01", d:"No Computed Data"},
  {bits:"10", d:"Functional Test"},
  {bits:"11", d:"Normal Operation"}
];
const SSM_BNR_SIGN = [
  {bit:"0", d:"Plus, North, East, Right, To, Above"},
  {bit:"1", d:"Minus, South, West, Left, From, Below"}
];

/* odd parity: bit 32 is set so the whole 32-bit word has an odd number of ones */
function onesIn(bits){ let n=0; for(let i=0;i<bits.length;i++) if(bits[i]) n++; return n; }
function parityBitFor(bits1to31){ return (onesIn(bits1to31) % 2 === 1) ? 0 : 1; }
function parityOK(bits1to32){ return onesIn(bits1to32) % 2 === 1; }

/* physical layer */
const SPEEDS = {
  low:  {name:"Low speed",  rate:"12 &ndash; 14.5 kbit/s", bitUs:83, bps:12048},
  high: {name:"High speed", rate:"100 kbit/s",             bitUs:10, bps:100000}
};
const GAP_BITS = 4, WORD_BITS = 32;
function wordTimeUs(sp){ return (WORD_BITS + GAP_BITS) * SPEEDS[sp].bitUs; }
function wordsPerSec(sp){ return 1e6 / wordTimeUs(sp); }

/* label reference — a teaching subset, not the full 256 */
const LABEL_TABLE = {
  "001":"Distance to Go",           "002":"Time to Go",
  "010":"Present Position &ndash; Latitude",  "011":"Present Position &ndash; Longitude",
  "012":"Ground Speed",             "013":"Track Angle &ndash; True",
  "014":"Magnetic Heading",         "015":"Wind Speed",
  "016":"Wind Direction &ndash; True",
  "041":"Set Latitude",             "042":"Set Longitude",
  "100":"Selected Course",          "101":"Selected Heading",
  "102":"Selected Altitude",        "103":"Selected Airspeed",
  "203":"Pressure Altitude",        "204":"Baro Corrected Altitude",
  "205":"Mach Number",              "206":"Computed Airspeed",
  "210":"True Airspeed",            "211":"Total Air Temperature",
  "212":"Altitude Rate",            "213":"Static Air Temperature",
  "233":"Air Temperature",
  "270":"Discrete Data 1",          "377":"Equipment Identification"
};
function labelName(oct){ return LABEL_TABLE[oct] || null; }

/* bit-row renderer: draws bits 8..1 (or any slice) as boxes, bit 8 on the left */
function bitRow(bits, opts){
  opts = opts || {};
  const drawn = bitsDrawn(bits);                 // highest bit number first
  const n = drawn.length;
  const first = opts.firstBitNo || n;            // bit number of the leftmost box
  const w = opts.cell || 34, h = 30, W = n*w + 2, H = h + 34;
  let g = "";
  for(let i=0;i<n;i++){
    const x = 1 + i*w, no = first - i, on = drawn[i];
    const hot = opts.hot && opts.hot.indexOf(no) >= 0;
    g += `<rect x="${x}" y="16" width="${w-2}" height="${h}" rx="3"
            fill="${on?'rgba(58,214,139,.16)':'#141e28'}"
            stroke="${hot?AMB:(on?HI:'#2a3a4a')}" stroke-width="${hot?2:1.2}"/>
          <text x="${x+(w-2)/2}" y="${16+h/2+5}" class="bv" fill="${on?HI:'#7d94a8'}">${on?1:0}</text>
          <text x="${x+(w-2)/2}" y="11" class="bn">${no}</text>`;
    if(opts.groups && opts.groups[i]!==undefined && opts.groups[i]!==null){
      g += `<text x="${x+(w-2)/2}" y="${16+h+18}" class="bg" fill="${AMB}">${opts.groups[i]}</text>`;
    }
  }
  return `<svg class="viz" viewBox="0 0 ${W} ${H}" style="max-width:${Math.min(W,560)}px">
    <style>.bv{font:700 13px ui-monospace,monospace;text-anchor:middle}
           .bn{font:600 8px ui-monospace,monospace;fill:#6f8598;text-anchor:middle}
           .bg{font:700 11px ui-monospace,monospace;text-anchor:middle}</style>${g}</svg>`;
}
