  const B = box._body;
  host.appendChild(box);

  let ia = 4;   /* Human hair */
  let ib = 8;   /* Paper      */

  const cols = el("div",{class:"lab-cols wide-left"});
  const left = el("div"), right = el("div");
  cols.appendChild(left); cols.appendChild(right);
  B.appendChild(cols);

  const ladder = el("div"); left.appendChild(ladder);
  const ro     = el("div",{style:"margin-top:14px"}); left.appendChild(ro);
  const note   = el("div",{style:"margin-top:12px"}); left.appendChild(note);

  function selector(label, get, set){
    const wrap = el("div",{style:"margin-bottom:14px"});
    wrap.appendChild(el("div",{class:"eyebrow"}, label));
    const sel = el("select",{style:"width:100%;background:#0f1821;border:1px solid #2a3a4a;color:#e3edf6;padding:9px 10px;border-radius:6px;font-size:.9rem"});
    TRIBO.forEach((m,i)=>{
      const o = el("option",{value:i}, m + " · " + triboRegion(i));
      if(i===get()) o.setAttribute("selected","selected");
      sel.appendChild(o);
    });
    sel.addEventListener("change",()=>{ set(+sel.value); draw(); labTouch(id,7); });
    wrap.appendChild(sel);
    return wrap;
  }
  right.appendChild(selector("Material A", ()=>ia, v=>{ia=v;}));
  right.appendChild(selector("Material B", ()=>ib, v=>{ib=v;}));

  const presets = el("div",{class:"btn-row", style:"margin-bottom:14px"});
  [["Slide 9 · hair + paper",4,8],["Slide 10 · wood + silicon",11,17],["Hands + Teflon",1,18]].forEach(p=>{
    presets.appendChild(el("button",{class:"btn sec", style:"font-size:.74rem;padding:7px 9px",
      onclick:()=>{ ia=p[1]; ib=p[2]; rebuild(); labTouch(id,7); }}, p[0]));
  });
  right.appendChild(presets);

  const TASKS = {
    foundation:[
      {q:"Rub <b>glass</b> against <b>silicon</b> and read which one ends up negative.",
       test:s=>((s.ia===3&&s.ib===17)||(s.ia===17&&s.ib===3))},
      {q:"Find the pairing that transfers the <b>most</b> charge on this ladder.",
       test:s=>((s.ia===0&&s.ib===18)||(s.ia===18&&s.ib===0))},
      {q:"Pick <b>cotton and steel</b> and see what two neutral materials do.",
       test:s=>((s.ia===9&&s.ib===10)||(s.ia===10&&s.ib===9))}
    ],
    developing:[
      {q:"Reproduce the slide-9 example: <b>human hair and paper</b>, both from the positive side.",
       test:s=>((s.ia===4&&s.ib===8)||(s.ia===8&&s.ib===4))},
      {q:"Reproduce the slide-10 example: <b>wood and silicon</b>, both from the negative side.",
       test:s=>((s.ia===11&&s.ib===17)||(s.ia===17&&s.ib===11))},
      {q:"Find a pairing where <b>a negative-region material ends up positively charged</b>.",
       test:s=>s.sameSide && s.side==="negative" && triboRegion(s.pair.positive)==="negative"}
    ],
    proficient:[
      {q:"Pick two <b>adjacent</b> materials and note how little transfers.",
       test:s=>Math.abs(s.ia-s.ib)===1},
      {q:"Show that <b>human hands and Teflon</b> is close to the worst realistic hangar pairing.",
       test:s=>((s.ia===1&&s.ib===18)||(s.ia===18&&s.ib===1))},
      {q:"Find the pairing that leaves <b>silicon positively charged</b>, and explain why it is unlikely in practice.",
       test:s=>((s.ia===17||s.ib===17) && s.pair.positive===17)}
    ]
  };

  function state(){
    const p = triboPair(ia, ib);
    return {ia, ib, pair:p, sameSide:p.sameSide, side:p.side};
  }

  function draw(){
    const s = state(), p = s.pair;
    /* ladder */
    const rowH = 19, W = 330, H = TRIBO.length*rowH + 30;
    let g = "";
    g += `<text x="6" y="12" class="hd">MOST POSITIVE</text>`;
    TRIBO.forEach((m,i)=>{
      const y = 22 + i*rowH;
      const isA = (i===ia), isB = (i===ib);
      const reg = triboRegion(i);
      const bg = reg==="positive" ? "rgba(224,43,60,.10)" : reg==="negative" ? "rgba(56,198,217,.10)" : "rgba(245,180,49,.12)";
      g += `<rect x="4" y="${y-13}" width="${W-8}" height="${rowH-3}" rx="3" fill="${bg}"
              stroke="${(isA||isB)?AMB:"transparent"}" stroke-width="${(isA||isB)?1.6:0}"/>
            <text x="12" y="${y}" class="mn" fill="${(isA||isB)?"#e3edf6":"#8fa3b5"}">${m}</text>`;
      if(isA) g += `<text x="${W-14}" y="${y}" class="tag" fill="${AMB}" text-anchor="end">A</text>`;
      if(isB) g += `<text x="${W-14}" y="${y}" class="tag" fill="${AMB}" text-anchor="end">${isA?"+B":"B"}</text>`;
      if(i===TRIBO_POS_END) g += `<line x1="4" y1="${y+5}" x2="${W-4}" y2="${y+5}" stroke="${AMB}" stroke-dasharray="3 3" stroke-width="1"/>`;
      if(i===TRIBO_NEG_START-1) g += `<line x1="4" y1="${y+5}" x2="${W-4}" y2="${y+5}" stroke="${AMB}" stroke-dasharray="3 3" stroke-width="1"/>`;
    });
    g += `<text x="6" y="${H-4}" class="hd">MOST NEGATIVE</text>`;
    ladder.innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}" style="max-width:340px">
      <style>.mn{font:600 10.5px system-ui}.hd{fill:#6f8598;font:700 8px system-ui;letter-spacing:.08em}
             .tag{font:800 10px ui-monospace,monospace}</style>${g}</svg>`;

    ro.innerHTML = "";
    if(p.same){
      ro.appendChild(readout([
        {k:"Gives up electrons", v:"neither"},
        {k:"Ends positive", v:"&mdash;"},
        {k:"Ends negative", v:"&mdash;"},
        {k:"Charge transferred", v:"none", cls:"c"}
      ]));
    }else{
      const pct = Math.round(p.strength*100);
      ro.appendChild(readout([
        {k:"Gives up electrons", v:TRIBO[p.giver], cls:"hl"},
        {k:"Ends POSITIVE", v:TRIBO[p.positive], cls:"r"},
        {k:"Ends NEGATIVE", v:TRIBO[p.negative], cls:"c"},
        {k:"Relative transfer", v:p.bothNeutral ? "negligible" : pct+"% of maximum", cls:pct>60?"r":pct>25?"":"g"}
      ]));
    }

    note.innerHTML = "";
    let msg;
    if(p.same){
      msg = ["err", "<b>Identical materials.</b> Both hold their electrons with the same strength, so nothing "+
        "transfers &mdash; the same result you saw in Module 1 when you switched off the \"dissimilar\" condition."];
    }else if(p.bothNeutral){
      msg = ["warn", "<b>Both materials are in the neutral region.</b> Cotton and steel neither give up nor attract "+
        "electrons when rubbed with other materials, so almost nothing happens. This is exactly the property that "+
        "<b>anti-static materials</b> are engineered to have &mdash; they are defined in Module 6 as materials "+
        "neutral on the triboelectric scale."];
    }else if(!p.sameSide){
      msg = ["", `<b>Opposite sides &mdash; the straightforward case.</b> ${TRIBO[p.positive]} sits higher on the
        ladder, so it gives up electrons and becomes <b>positively charged</b>. ${TRIBO[p.negative]} attracts those
        electrons and becomes <b>negatively charged</b>. They are ${p.gap} places apart out of 18, so this is a
        ${p.strength>0.6?"very strong":p.strength>0.3?"moderate":"fairly weak"} charging pair.`];
    }else if(p.side === "positive"){
      msg = ["ok", `<b>Both from the positive side.</b> Your notes say the material with the <b>greatest ability to
        generate charge</b> becomes more positive. That is ${TRIBO[p.positive]}, because it sits higher on the
        ladder &mdash; so it gives up electrons to ${TRIBO[p.negative]}, exactly as human hair does to paper on
        slide 9.`];
    }else{
      msg = ["ok", `<b>Both from the negative side.</b> Your notes say the one with the <b>greatest tendency to
        attract charge</b> becomes more negative. That is ${TRIBO[p.negative]}, the lower of the two &mdash; so
        ${TRIBO[p.positive]} gives up electrons and ends up positive, exactly as wood does to silicon on slide 10.
        Note that a negative-region material has ended up <b>positively charged</b>: the region tells you a
        tendency, the relative position decides the outcome.`];
    }
    note.appendChild(el("div",{class:"note "+msg[0], style:"margin-bottom:10px"}, msg[1]));
    note.appendChild(el("div",{class:"note small", style:"margin-bottom:0"},
      "<b>One rule covers all three cases.</b> Whichever material sits <b>higher in the list gives up electrons</b> "+
      "and ends up positive. You do not need to remember the same-side rules separately &mdash; they are the same "+
      "rule, applied to two materials that happen to share a region."));
    redrawTask && redrawTask();
  }

  function rebuild(){
    right.innerHTML = "";
    right.appendChild(selector("Material A", ()=>ia, v=>{ia=v;}));
    right.appendChild(selector("Material B", ()=>ib, v=>{ib=v;}));
    right.appendChild(presets);
    right.appendChild(taskCard);
    draw();
  }

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>s.pair.same ? "identical materials, nothing transferred"
      : `${TRIBO[s.pair.positive]} ends positive, ${TRIBO[s.pair.negative]} ends negative, ${s.pair.gap} places apart`,
    id);
  const taskCard = right.lastChild;
  draw();
};
/* ---------------- M3 · CHARGE MAGNITUDE BENCH ---------------- */
LABS.m3 = function(host, id, tier){
  const box = labShell("Charge magnitude bench","Your deck's table, made continuous &mdash; and read against what a device can survive");
  const B = box._body;
  host.appendChild(box);

  let sitId = "carpet", humidity = 20, rate = "normal", cls = "2";

  const cols = el("div",{class:"lab-cols wide-left"});
  const left = el("div"), right = el("div");
  cols.appendChild(left); cols.appendChild(right);
  B.appendChild(cols);

  const chart = el("div"); left.appendChild(chart);
  const ro    = el("div",{style:"margin-top:14px"}); left.appendChild(ro);
  const note  = el("div",{style:"margin-top:12px"}); left.appendChild(note);
  const table = el("div",{style:"margin-top:14px"}); left.appendChild(table);

  right.appendChild(el("div",{class:"eyebrow"},"Situation"));
  const sitSel = el("select",{style:"width:100%;margin-bottom:14px;background:#0f1821;border:1px solid #2a3a4a;color:#e3edf6;padding:9px 10px;border-radius:6px;font-size:.86rem"});
  SITUATIONS.forEach(s=>{
    const o = el("option",{value:s.id}, s.name);
    if(s.id===sitId) o.setAttribute("selected","selected");
    sitSel.appendChild(o);
  });
  sitSel.addEventListener("change",()=>{ sitId = sitSel.value; draw(); labTouch(id,7); });
  right.appendChild(sitSel);

  const rH = range("eH",20,80,1,humidity);
  right.appendChild(ctrl("Relative humidity","vEH",rH));

  right.appendChild(el("div",{class:"eyebrow"},"Rate of separation"));
  right.appendChild(segBar(SEP_RATES.map(r=>[r.id,r.name]), rate,
    v=>{ rate=v; draw(); labTouch(id,7); }, "margin-bottom:14px"));

  right.appendChild(el("div",{class:"eyebrow"},"Device sensitivity (JEDEC HBM)"));
  const clsSel = el("select",{style:"width:100%;margin-bottom:14px;background:#0f1821;border:1px solid #2a3a4a;color:#e3edf6;padding:9px 10px;border-radius:6px;font-size:.86rem"});
  HBM.forEach(c=>{
    const o = el("option",{value:c.id}, c.name + " — " + withstandLabel(c));
    if(c.id===cls) o.setAttribute("selected","selected");
    clsSel.appendChild(o);
  });
  clsSel.addEventListener("change",()=>{ cls = clsSel.value; draw(); labTouch(id,7); });
  right.appendChild(clsSel);

  const TASKS = {
    foundation:[
      {q:"Set the humidity to <b>20%</b> and read the voltage for walking over a wool/nylon carpet.",
       test:s=>s.humidity===20 && s.sitId==="carpet" && s.rate==="normal"},
      {q:"Now slide the humidity to <b>80%</b> and see how far it falls.",
       test:s=>s.humidity===80 && s.sitId==="carpet" && s.rate==="normal"},
      {q:"Find the <b>mildest</b> situation in the list at <b>80%</b> humidity, and check whether it is still dangerous.",
       test:s=>s.sitId==="bench" && s.humidity===80}
    ],
    developing:[
      {q:"Show that <b>working at a bench wearing overalls at 80%</b> humidity still destroys a <b>Class 0</b> device.",
       test:s=>s.sitId==="bench" && s.humidity===80 && s.cls==="0" && s.damaged},
      {q:"Find a combination that a <b>Class 3B</b> device survives.",
       test:s=>s.cls==="3B" && !s.damaged},
      {q:"Set the humidity to <b>60%</b> on vinyl flooring and read the interpolated figure.",
       test:s=>s.humidity===60 && s.sitId==="vinyl"}
    ],
    proficient:[
      {q:"Find the humidity at which walking on <b>vinyl flooring</b> stops destroying a <b>Class 2</b> device.",
       test:s=>s.sitId==="vinyl" && s.cls==="2" && !s.damaged && s.rate==="normal"},
      {q:"Show a case where <b>every one of the seven HBM classes</b> is destroyed.",
       test:s=>s.destroyed===7},
      {q:"Demonstrate that rate of separation <b>alone</b> can change the verdict: a device that survives a slow separation but not a normal one.",
       test:s=>s.rate==="slow" && !s.damaged && s.damagedAtNormal}
    ]
  };

  function state(){
    const sit = SIT_BY_ID[sitId];
    const base = voltageAt(sit, humidity);
    const v = base * sepMult(rate);
    const dmg = damageOutcome(v, cls);
    const atNormal = damageOutcome(base, cls);
    return {sitId, sit, humidity, rate, cls, base, v,
            withstand:dmg.withstand, outcome:dmg.outcome,
            damaged: dmg.outcome !== "survived",
            damagedAtNormal: atNormal.outcome !== "survived",
            destroyed: classesDestroyedBy(v)};
  }

  function draw(){
    humidity = +rH.value;
    $("#vEH").textContent = humidity + "% RH";
    const s = state();

    /* curve of voltage against humidity, log scale, with the two measured anchors marked */
    const W = 560, H = 240, L = 56, T = 20, Rp = 16, Bm = 34;
    const pw = W-L-Rp, ph = H-T-Bm;
    const vmin = 100, vmax = 40000;
    const sx = h => L + (h-20)/60*pw;
    const sy = v => T + ph - (Math.log10(Math.max(vmin,Math.min(vmax,v)))-Math.log10(vmin))/(Math.log10(vmax)-Math.log10(vmin))*ph;
    let g = "";
    [100,250,1000,4000,10000,40000].forEach(v=>{
      const y = sy(v);
      g += `<line x1="${L}" y1="${y}" x2="${L+pw}" y2="${y}" stroke="${GRID}" stroke-width="1"/>
            <text x="${L-6}" y="${y+3.5}" class="ax" text-anchor="end">${fmtV(v)}</text>`;
    });
    [20,35,50,65,80].forEach(h=>{
      const x = sx(h);
      g += `<line x1="${x}" y1="${T}" x2="${x}" y2="${T+ph}" stroke="${GRID}" stroke-width="1"/>
            <text x="${x}" y="${H-12}" class="ax" text-anchor="middle">${h}%</text>`;
    });
    /* device withstand line */
    if(s.withstand <= vmax){
      const wy = sy(s.withstand);
      g += `<line x1="${L}" y1="${wy}" x2="${L+pw}" y2="${wy}" stroke="${HI}" stroke-width="1.8" stroke-dasharray="6 4"/>
            <text x="${L+pw-3}" y="${wy-6}" class="ax" fill="${HI}" text-anchor="end">${HBM_BY_ID[s.cls].name} ${withstandLabel(HBM_BY_ID[s.cls])}</text>`;
    }
    /* every situation, faint; the selected one bold */
    SITUATIONS.forEach(sit=>{
      let d = "";
      for(let h=20; h<=80; h++){
        const v = voltageAt(sit, h) * sepMult(rate);
        d += (h===20?"M":" L") + sx(h).toFixed(1) + "," + sy(v).toFixed(1);
      }
      const on = sit.id === sitId;
      g += `<path d="${d}" fill="none" stroke="${on?ACC:"#33465a"}" stroke-width="${on?2.6:1.2}"/>`;
    });
    /* the deck's two measured anchors for the selected situation */
    [[20,s.sit.v20],[80,s.sit.v80]].forEach(a=>{
      g += `<circle cx="${sx(a[0])}" cy="${sy(a[1]*sepMult(rate))}" r="4" fill="none" stroke="${AMB}" stroke-width="2"/>`;
    });
    /* operating point */
    g += `<line x1="${sx(humidity)}" y1="${T}" x2="${sx(humidity)}" y2="${T+ph}" stroke="${AMB}" stroke-dasharray="3 3" stroke-width="1"/>
          <circle cx="${sx(humidity)}" cy="${sy(s.v)}" r="5.5" fill="${AMB}"/>`;
    g += `<text x="${L}" y="${T-6}" class="tt">Voltage generated against humidity &mdash; log scale, circles are the deck's measured 20% and 80% figures</text>`;
    chart.innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}">
      <style>.ax{fill:#7d94a8;font:600 9px ui-monospace,monospace}.tt{fill:#8fa3b5;font:700 9px system-ui}</style>${g}</svg>`;

    ro.innerHTML = "";
    ro.appendChild(readout([
      {k:"Voltage generated", v:fmtV(s.v), cls:"hl"},
      {k:"Device", v:HBM_BY_ID[s.cls].name+" · "+withstandLabel(HBM_BY_ID[s.cls])},
      {k:"Outcome", v:s.outcome==="survived"?"SURVIVES":s.outcome==="latent"?"LATENT DAMAGE":"CATASTROPHIC",
       cls:s.outcome==="survived"?"g":s.outcome==="latent"?"":"r"},
      {k:"HBM classes destroyed", v:s.destroyed+" of 7", cls:s.destroyed>=5?"r":s.destroyed>0?"":"g"}
    ]));

    note.innerHTML = "";
    if(s.damaged){
      note.appendChild(el("div",{class:"note err", style:"margin-bottom:10px"},
        `<b>${fmtV(s.v)} against a device with ${withstandLabel(HBM_BY_ID[s.cls])}.</b> That is
         ${(s.v/s.withstand).toFixed(1)}&times; its rating, and it destroys <b>${s.destroyed} of the 7</b> HBM
         classes. ${s.outcome==="latent"
           ? "At this margin the likely result is <b>latent damage</b> &mdash; the device still works, passes its test, and fails later. Module 4 is about why that is the worse outcome."
           : "At this margin the likely result is <b>catastrophic failure</b> &mdash; at least you find this one on the bench."}`));
    }else{
      note.appendChild(el("div",{class:"note ok", style:"margin-bottom:10px"},
        `<b>${fmtV(s.v)} against a device with ${withstandLabel(HBM_BY_ID[s.cls])}.</b> This device survives this event &mdash;
         but note how narrow the margin is, and that ${s.destroyed} of the 7 classes would not have.`));
    }
    if(humidity >= 70){
      note.appendChild(el("div",{class:"note warn", style:"margin-bottom:10px"},
        "<b>Humidity is mitigation, not protection.</b> You have reduced the voltage by an order of magnitude, "+
        "which is real. But your notes say <i>avoidance of very dry environments <b>if possible</b></i>, and the "+
        "residual is still enough to destroy the more sensitive classes. Humidity shrinks the problem; the wrist "+
        "strap removes it."));
    }
    note.appendChild(el("div",{class:"note small", style:"margin-bottom:0"},
      "<b>Where these numbers come from.</b> The two circled points are measured figures from your slide-11 table. "+
      "The curve between them is a <b>log-linear interpolation</b>, not measured data, and the bench never "+
      "extrapolates outside 20&ndash;80%. The rate-of-separation setting is an <b>illustrative multiplier</b>: your "+
      "deck states the direction but gives no figures for it. The HBM classes are <b>JEDEC JS-001</b>, the industry "+
      "standard, and are not from your slides."));

    /* the deck's table, with the current row highlighted */
    table.innerHTML = `<div class="eyebrow">Slide 11 &mdash; typical electrostatic voltage generated</div>
      <div class="tblwrap"><table class="tbl">
      <thead><tr><th>Situation</th><th>20% RH</th><th>80% RH</th></tr></thead><tbody>${
        SITUATIONS.map(x=>`<tr${x.id===sitId?' style="background:rgba(224,43,60,.14)"':''}>
          <td>${x.name}</td><td>${fmtV(x.v20)}</td><td>${fmtV(x.v80)}</td></tr>`).join("")
      }</tbody></table></div>`;
    redrawTask && redrawTask();
  }

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>`${fmtV(s.v)} at ${s.humidity}% RH vs ${HBM_BY_ID[s.cls].name} (${fmtV(s.withstand)}) &rarr; ${s.outcome}, ${s.destroyed} of 7 classes destroyed`,
    id);
  rH.addEventListener("input",()=>{ draw(); labTouch(id,9); });
  draw();
};

/* ---------------- M4 · DAMAGE BENCH ---------------- */
LABS.m4 = function(host, id, tier){
  const box = labShell("Damage bench","Handle a batch with and without precautions, then see what leaves the hangar");
  const B = box._body;
  host.appendChild(box);

  let sitId = "bench", humidity = 20, cls = "2", n = 20, grounded = false;

  const cols = el("div",{class:"lab-cols wide-left"});
  const left = el("div"), right = el("div");
  cols.appendChild(left); cols.appendChild(right);
  B.appendChild(cols);

  const bars = el("div"); left.appendChild(bars);
  const ro   = el("div",{style:"margin-top:14px"}); left.appendChild(ro);

  const causes = el("div",{style:"margin-top:14px"}); left.appendChild(causes);

  right.appendChild(el("div",{class:"eyebrow"},"Charging event"));

  SITUATIONS.forEach(s=>{
    const o = el("option",{value:s.id}, s.name);

  });

  right.appendChild(sitSel);

  const rH2 = range("dH",20,80,1,humidity);
  const rN  = range("dN",5,50,1,n);
  right.appendChild(ctrl("Relative humidity","vDH",rH2));
  right.appendChild(ctrl("Devices handled","vDN",rN));

  right.appendChild(el("div",{class:"eyebrow"},"Device sensitivity"));
  const clsSel = el("select",{style:"width:100%;margin-bottom:14px;background:#0f1821;border:1px solid #2a3a4a;color:#e3edf6;padding:9px 10px;border-radius:6px;font-size:.86rem"});
  HBM.forEach(c=>{
    const o = el("option",{value:c.id}, c.name + " — " + withstandLabel(c));
    if(c.id===cls) o.setAttribute("selected","selected");
    clsSel.appendChild(o);
  });
  clsSel.addEventListener("change",()=>{ cls=clsSel.value; draw(); labTouch(id,7); });
  right.appendChild(clsSel);

  const gBtn = el("button",{class:"btn sec", style:"width:100%;margin-bottom:14px",
    onclick:()=>{ grounded=!grounded; draw(); labTouch(id,7); }},"Wrist strap");
  right.appendChild(gBtn);

  const TASKS = {
    foundation:[
      {q:"Handle a batch <b>ungrounded</b> and read how many failed the functional test.",
       test:s=>!s.grounded && s.res.catastrophic>0},
      {q:"Read how many were <b>latently damaged</b> &mdash; those passed the test and left the hangar.",
       test:s=>!s.grounded && s.res.latent>0},
      {q:"Now put the <b>wrist strap</b> on and handle the same batch.",
       test:s=>s.grounded}
    ],
    developing:[
      {q:"Find a setting where <b>more devices are latently damaged than catastrophically</b> &mdash; the ones you never find.",
       test:s=>!s.grounded && s.res.latent > s.res.catastrophic && s.res.latent>0},
      {q:"Find a setting where <b>every device in the batch</b> is destroyed outright.",
       test:s=>!s.grounded && s.res.catastrophic===s.n},
      {q:"Raise the humidity until at least one device <b>survives</b>, without using the strap.",
       test:s=>!s.grounded && s.res.survived>0}
    ],
    proficient:[
      {q:"Produce a batch where devices <b>survive, are latently damaged and are destroyed</b> all at once.",
       test:s=>s.res.survived>0 && s.res.latent>0 && s.res.catastrophic>0},
      {q:"Show a case where the bench test finds <b>nothing</b> and yet devices were damaged.",
       test:s=>s.res.catastrophic===0 && s.res.latent>0},
      {q:"Demonstrate that the wrist strap makes the batch size irrelevant.",
       test:s=>s.grounded && s.n>=40 && s.res.survived===s.n}
    ]
  };

  function state(){
    const sit = SIT_BY_ID[sitId];
    const v = grounded ? 0 : voltageAt(sit, humidity);
    const res = grounded
      ? {survived:n, latent:0, catastrophic:0, list:[]}
      : batchOutcomes(v, cls, n);
    return {sitId, humidity, cls, n, grounded, v, res,
            withstand: HBM_BY_ID[cls].withstand,
            found: res.catastrophic, escaped: res.latent};
  }

  function draw(){
    humidity = +rH2.value; n = +rN.value;
    $("#vDH").textContent = humidity + "% RH";
    $("#vDN").textContent = n + " devices";
    gBtn.innerHTML = grounded ? "&#10003; Wrist strap ON and grounded" : "&#10007; No wrist strap";
    gBtn.style.borderColor = grounded ? HI : ACC;
    gBtn.style.color = grounded ? HI : ACC;
    const s = state();

    /* stacked outcome bar + the fleet picture */
    const W = 540, H = 150;
    const total = s.n;
    const segs = [
      {k:"survived",    n:s.res.survived,     c:HI,  label:"Survived"},
      {k:"latent",      n:s.res.latent,       c:AMB, label:"Latent damage"},
      {k:"catastrophic",n:s.res.catastrophic, c:ACC, label:"Catastrophic"}
    ];
    let g = "", x = 10;
    const bw = W-20;
    segs.forEach(sg=>{
      const w = total ? bw * sg.n/total : 0;
      if(w>0){
        g += `<rect x="${x}" y="20" width="${w}" height="34" fill="${sg.c}" opacity=".85"/>`;
        if(w>34) g += `<text x="${x+w/2}" y="42" class="cnt">${sg.n}</text>`;
      }
      x += w;
    });
    g += `<text x="10" y="14" class="tt">Outcome for ${total} device${total===1?"":"s"}</text>`;
    /* legend */
    let lx = 10;
    segs.forEach(sg=>{
      g += `<rect x="${lx}" y="66" width="10" height="10" fill="${sg.c}"/>
            <text x="${lx+15}" y="75" class="lg">${sg.label} (${sg.n})</text>`;
      lx += 30 + sg.label.length*6.4;
    });
    /* what the bench test finds vs what leaves */
    g += `<rect x="10" y="96" width="${bw*0.48}" height="42" rx="4" fill="rgba(224,43,60,.12)" stroke="${ACC}" stroke-width="1.4"/>
          <text x="${10+bw*0.24}" y="114" class="hd2" fill="${ACC}">FOUND ON TEST</text>
          <text x="${10+bw*0.24}" y="132" class="big" fill="${ACC}">${s.found}</text>
          <rect x="${10+bw*0.52}" y="96" width="${bw*0.48}" height="42" rx="4" fill="rgba(245,180,49,.12)" stroke="${AMB}" stroke-width="1.4"/>
          <text x="${10+bw*0.76}" y="114" class="hd2" fill="${AMB}">DAMAGED, LEFT THE HANGAR</text>
          <text x="${10+bw*0.76}" y="132" class="big" fill="${AMB}">${s.escaped}</text>`;
    bars.innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}">
      <style>.tt{fill:#8fa3b5;font:700 9px system-ui}.cnt{fill:#0b1219;font:800 13px ui-monospace,monospace;text-anchor:middle}
             .lg{fill:#8fa3b5;font:600 9px system-ui}.hd2{font:700 8px system-ui;letter-spacing:.07em;text-anchor:middle}
             .big{font:800 16px ui-monospace,monospace;text-anchor:middle}</style>${g}</svg>`;

    ro.innerHTML = "";
    ro.appendChild(readout([
      {k:"Discharge", v:s.grounded?"0 V (grounded)":fmtV(s.v), cls:s.grounded?"g":"r"},
      {k:"Guaranteed withstand", v:s.withstand?fmtV(s.withstand):"none"},
      {k:"Failed on test", v:s.found, cls:s.found?"r":"g"},
      {k:"Latent &mdash; not detected", v:s.escaped, cls:s.escaped?"r":"g"}
    ]));

    note.innerHTML = "";
    if(s.grounded){
      note.appendChild(el("div",{class:"note ok", style:"margin-bottom:10px"},
        "<b>All "+s.n+" survived.</b> With the technician bonded to ground through a 1 M&ohm; strap there is no "+
        "stored charge to discharge, so the batch size makes no difference at all. This is the entire argument for "+
        "the procedure in Module 6: it does not reduce the damage rate, it removes the mechanism."));
    }else if(s.found === 0 && s.escaped > 0){
      note.appendChild(el("div",{class:"note err", style:"margin-bottom:10px"},
        `<b>Nothing failed the test, and ${s.escaped} devices are damaged.</b> This is the worst case in the whole
         topic: a clean bench record and degraded parts in the aircraft. Nobody in the hangar has any reason to
         suspect a problem, so nothing about the practice changes.`));
    }else if(s.escaped > s.found){
      note.appendChild(el("div",{class:"note err", style:"margin-bottom:10px"},
        `<b>You found ${s.found}. You damaged ${s.found + s.escaped}.</b> The ${s.escaped} latently damaged devices
         are <i>partially degraded yet can still perform their intended function</i> &mdash; so they pass the
         functional test, get fitted, and fail in service weeks or months later. The rejects on your bench are a
         <b>lower bound</b> on the damage you caused, never a count of it.`));
    }else if(s.found > 0){
      note.appendChild(el("div",{class:"note warn", style:"margin-bottom:10px"},
        `<b>${s.found} failed outright and ${s.escaped} are latently damaged.</b> At this discharge level most
         devices are destroyed rather than degraded, which is expensive but at least visible. Reduce the discharge
         &mdash; raise the humidity or pick a milder event &mdash; and watch the balance shift towards latent
         damage, which is the more dangerous regime.`));
    }else{
      note.appendChild(el("div",{class:"note ok", style:"margin-bottom:10px"},
        "<b>All survived.</b> This device class tolerates this discharge &mdash; but change the class or dry the "+
        "air out and see how quickly that stops being true."));
    }
    note.appendChild(el("div",{class:"note small", style:"margin-bottom:0"},
      "<b>About the model.</b> The survive/damage boundary is the device's rated withstand voltage from JEDEC "+
      "JS-001. The split between <b>latent</b> and <b>catastrophic</b> above that boundary is <b>illustrative</b> "+
      "&mdash; neither your deck nor the standard quantifies it &mdash; and is set here by how far the discharge "+
      "exceeds the rating. The point it is making is not the exact ratio; it is that <b>the damage you find is "+
      "not the damage you cause</b>."));

    causes.innerHTML = `<div class="eyebrow">The two causes, slide 15</div>
      <div class="tblwrap"><table class="tbl"><tbody>
      <tr><td><b>1 &mdash; Discharge from human body or charged material</b></td>
          <td>When one walks across a floor, and due to the high voltage potential of the static charge in
          insulators and semiconductor junctions</td></tr>
      <tr><td><b>2 &mdash; Device electrostatic discharge</b></td>
          <td>Movement across a surface, or vibration in a package &mdash; no person involved, which is why storage
          and transportation are named alongside handling</td></tr>
      </tbody></table></div>`;
    redrawTask && redrawTask();
  }

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>`${s.grounded?"grounded":fmtV(s.v)} on ${s.n} &times; ${HBM_BY_ID[s.cls].name}: ${s.res.survived} survived, ${s.res.latent} latent, ${s.res.catastrophic} destroyed`,
    id);
  [rH2,rN].forEach(r=>r.addEventListener("input",()=>{ draw(); labTouch(id,9); }));
  draw();
};
/* ---------------- M5 · DECAL IDENTIFIER ---------------- */
LABS.m5 = function(host, id, tier){
  const box = labShell("Decal identifier","You are standing at an open rack. Name the decal before you touch anything.");
  const B = box._body;
  host.appendChild(box);

  /* Deterministic question order so a student and a marker see the same run. */
  const SCENARIOS = [
    {ans:"B", scene:"You are facing a racked LRU. A yellow label on its front panel reads ATTENTION &mdash; THIS UNIT CONTAINS STATIC SENSITIVE DEVICES, and tells you to connect a grounding wrist strap.",
     why:"Decal B is the large instructional label used on <b>LRU front panels</b>. It is the only decal that carries handling instructions as well as a warning."},
    {ans:"D", scene:"Beside the rack is a small round socket with a yellow label around it. The label reads ATTENTION ELECTROSTATIC GROUND JACK.",
     why:"Decal D marks the <b>grounding jack</b>. It marks the remedy, not the hazard &mdash; and finding it quickly is the point of labelling it at all."},
    {ans:"A", scene:"On the shelf sits a sealed metal box, an assembly with no front panel controls. A yellow CAUTION decal is fixed to the casing.",
     why:"Decal A is used on <b>metal encased units (boxes) and assemblies</b> &mdash; the box seen from the outside."},
    {ans:"C", scene:"A yellow-marked hand tool hangs on the bench. It is the lever-type tool used to lift boards out of a card cage.",
     why:"Decal C marks the <b>circuit board extractor</b>. The tool is labelled because using it carelessly, or using the wrong one, is itself a charging event."},
    {ans:"E", scene:"A tiny connector shell on a wiring loom carries three miniature yellow symbols. There is no room for any wording at all.",
     why:"Decal E is used in <b>areas too small to accommodate any of the above decals</b>. It carries the same warning on a smaller area &mdash; not a lesser one."},
    {ans:"B", scene:"An LRU is out of the rack on the bench. Its front face carries a full-size yellow label with several lines of instruction text.",
     why:"Front face of an LRU with instruction text: decal <b>B</b> again. The unit being out of the rack does not change which decal it carries."},
    {ans:"A", scene:"A large sealed avionics box has arrived from stores, still in its transit case. A yellow CAUTION decal is on the box casing itself.",
     why:"A sealed box or assembly takes decal <b>A</b>, regardless of where it is or what it is packed in."},
    {ans:"D", scene:"You are looking for somewhere to plug your wrist strap. A yellow-ringed socket is fitted at the lower right of the unit.",
     why:"Decal <b>D</b> again &mdash; grounding jacks. Your notes describe the ground jack as being located at the lower right hand side of the unit."}
  ];

  let qi = 0, answered = false, chosen = null, score = 0, attempts = 0;

  const cols = el("div",{class:"lab-cols"});
  const left = el("div"), right = el("div");
  cols.appendChild(left); cols.appendChild(right);
  B.appendChild(cols);

  const scene  = el("div"); left.appendChild(scene);
  const opts   = el("div",{style:"margin-top:14px"}); left.appendChild(opts);
  const fb     = el("div",{style:"margin-top:12px"}); left.appendChild(fb);
  const ref    = el("div"); right.appendChild(ref);
  const colour = el("div",{style:"margin-top:14px"}); right.appendChild(colour);
  const sc     = el("div",{style:"margin-top:14px"}); right.appendChild(sc);

  function decalSVG(letter, hot){
    /* A generic ESD warning decal: caution yellow ground, black characters,
       the standard hand-and-triangle motif drawn from primitives. */
    return `<svg viewBox="0 0 90 60" style="width:100%;max-width:90px">
      <rect x="1" y="1" width="88" height="58" rx="4" fill="#f5c518" stroke="${hot?"#0b1219":"#8a7118"}" stroke-width="${hot?2.5:1.4}"/>
      <path d="M45,10 L60,36 L30,36 Z" fill="none" stroke="#111" stroke-width="2.4"/>
      <path d="M45,17 L45,28" stroke="#111" stroke-width="2.4"/>
      <path d="M32,44 q6,-5 13,-2 q7,3 13,-2" fill="none" stroke="#111" stroke-width="2.2"/>
      <text x="45" y="56" style="font:700 8px system-ui;fill:#111;text-anchor:middle">${letter}</text>
    </svg>`;
  }

  function draw(){
    const q = SCENARIOS[qi];
    scene.innerHTML = `<div class="eyebrow">Scenario ${qi+1} of ${SCENARIOS.length}</div>
      <div class="note" style="margin-bottom:0">${q.scene}</div>`;

    opts.innerHTML = "";
    const grid = el("div",{style:"display:grid;grid-template-columns:repeat(5,1fr);gap:8px"});
    DECALS.forEach(d=>{
      const isChosen = chosen === d.id;
      const isRight  = d.id === q.ans;
      let border = "#2a3a4a", col = "#8fa3b5";
      if(answered && isRight){ border = HI; col = HI; }
      else if(answered && isChosen){ border = ACC; col = ACC; }
      else if(isChosen){ border = AMB; col = AMB; }
      const b = el("button",{class:"btn sec",
        style:"padding:10px 4px;border-color:"+border+";color:"+col+";display:flex;flex-direction:column;align-items:center;gap:6px",
        onclick:()=>{
          if(answered) return;
          chosen = d.id; answered = true; attempts++;
          if(isRight) score++;
          else addMisconception(id, "Matched decal "+d.id+" to a "+q.ans+" situation");
          labTouch(id,5); draw();
        }});
      b.innerHTML = decalSVG(d.id, isChosen || (answered && isRight)) +
        `<span style="font:800 12px ui-monospace,monospace">${d.id}</span>`;
      grid.appendChild(b);
    });
    opts.appendChild(grid);

    fb.innerHTML = "";
    if(answered){
      const right2 = chosen === q.ans;
      fb.appendChild(el("div",{class:"note "+(right2?"ok":"err")},
        `<b>${right2?"Correct — decal "+q.ans+".":"Not quite. The answer is decal "+q.ans+"."}</b> ${q.why}`));
      const row = el("div",{class:"btn-row"});
      if(qi < SCENARIOS.length-1){
        row.appendChild(el("button",{class:"btn", onclick:()=>{ qi++; answered=false; chosen=null; draw(); labTouch(id,5); }},"Next scenario"));
      }else{
        row.appendChild(el("button",{class:"btn", onclick:()=>{ qi=0; answered=false; chosen=null; score=0; attempts=0; draw(); }},"Run through again"));
        markProg(id,"lab");
      }
      fb.appendChild(row);
      if(score >= 6) markProg(id,"lab");
    }

    ref.innerHTML = `<div class="eyebrow">Decal reference &mdash; slide 12</div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Decal</th><th>Usage</th></tr></thead><tbody>${
        DECALS.map(d=>`<tr${(answered && d.id===SCENARIOS[qi].ans)?' style="background:rgba(58,214,139,.14)"':''}>
          <td><b>${d.id}</b></td><td>${d.usage}</td></tr>`).join("")
      }</tbody></table></div>`;

    colour.innerHTML = `<div class="eyebrow">The colour</div>
      <div style="display:flex;gap:10px;align-items:center;background:#f5c518;border-radius:6px;padding:10px 12px">
        <div style="font:800 13px system-ui;color:#111">ATTENTION</div>
        <div style="font:600 10px system-ui;color:#111;line-height:1.25">OBSERVE PRECAUTIONS FOR HANDLING<br>ELECTROSTATIC SENSITIVE DEVICES</div>
      </div>
      <p class="tiny muted" style="margin:8px 0 0"><b>Caution yellow</b> background, <b>black</b> characters.
      Learn the colour before the wording &mdash; in a dim avionics bay at an angle, the colour is all you will
      reliably see.</p>`;

    sc.innerHTML = "";
    sc.appendChild(readout([
      {k:"Scenario", v:(qi+1)+" of "+SCENARIOS.length},
      {k:"Correct", v:score+" / "+attempts, cls:attempts&&score===attempts?"g":(attempts?"":"")}
    ]));
  }
  draw();
};

/* ---------------- M6 · HANDLING PROCEDURE SIMULATOR ---------------- */
LABS.m6 = function(host, id, tier){
  const box = labShell("Handling procedure simulator","Build the sequence, then run the job and see what survives");
  const B = box._body;
  host.appendChild(box);

  let seq = [], cls = "2", result = null;

  const cols = el("div",{class:"lab-cols wide-left"});
  const left = el("div"), right = el("div");
  cols.appendChild(left); cols.appendChild(right);
  B.appendChild(cols);

  const seqBox = el("div"); left.appendChild(seqBox);
  const trace  = el("div",{style:"margin-top:14px"}); left.appendChild(trace);
  const ro     = el("div",{style:"margin-top:12px"}); left.appendChild(ro);
  const note   = el("div",{style:"margin-top:12px"}); left.appendChild(note);
  const prot   = el("div",{style:"margin-top:14px"}); left.appendChild(prot);

  right.appendChild(el("div",{class:"eyebrow"},"Available actions"));
  const pool = el("div",{style:"margin-bottom:14px"});
  right.appendChild(pool);

  right.appendChild(el("div",{class:"eyebrow"},"Device sensitivity"));
  const clsSel = el("select",{style:"width:100%;margin-bottom:14px;background:#0f1821;border:1px solid #2a3a4a;color:#e3edf6;padding:9px 10px;border-radius:6px;font-size:.86rem"});
  HBM.forEach(c=>{
    const o = el("option",{value:c.id}, c.name + " — " + withstandLabel(c));
    if(c.id===cls) o.setAttribute("selected","selected");
    clsSel.appendChild(o);
  });
  clsSel.addEventListener("change",()=>{ cls=clsSel.value; result=null; draw(); labTouch(id,7); });
  right.appendChild(clsSel);

  const btns = el("div",{class:"btn-row", style:"margin-bottom:14px"});
  btns.appendChild(el("button",{class:"btn", onclick:()=>{ run(); labTouch(id,5); }},"Run the job"));
  btns.appendChild(el("button",{class:"btn sec", onclick:()=>{ seq=[]; result=null; draw(); }},"Clear"));
  right.appendChild(btns);

  const TASKS = {
    foundation:[
      {q:"Remove the board with <b>no precautions at all</b> &mdash; just open the bag and take it out.",
       test:s=>s.result && s.result.worstDischarge>0},
      {q:"Now put the strap on and connect it to the ground jack <b>before</b> opening the bag, and run again.",
       test:s=>s.result && s.result.outcome==="survived" && s.seq.indexOf("ground")<s.seq.indexOf("openbag") && s.seq.indexOf("ground")>=0},
      {q:"Complete the whole job with <b>no procedural errors</b>.",
       test:s=>s.result && s.result.errors.length===0}
    ],
    developing:[
      {q:"Put the strap on but <b>do not connect it to the ground jack</b>, then remove the board. Is the strap enough?",
       test:s=>s.result && s.seq.indexOf("strap")>=0 && s.seq.indexOf("ground")<0 && s.result.worstDischarge>0},
      {q:"Do everything right, but <b>after</b> taking the board out of the bag. Order matters &mdash; prove it.",
       test:s=>s.result && s.seq.indexOf("remove")>=0 && s.seq.indexOf("ground")>s.seq.indexOf("remove") && s.result.outcome!=="survived"},
      {q:"Ground yourself, then <b>walk across the hangar</b> mid-job, and confirm you are still protected.",
       test:s=>s.result && s.seq.indexOf("walk")>s.seq.indexOf("ground") && s.seq.indexOf("ground")>=0 && s.result.outcome==="survived"}
    ],
    proficient:[
      {q:"Produce a run where the device <b>survives</b> but the bench still reports procedural errors.",
       test:s=>s.result && s.result.outcome==="survived" && s.result.errors.length>0},
      {q:"Find the single earliest action that, if moved, changes the outcome from survived to damaged.",
       test:s=>s.result && s.result.outcome!=="survived" && s.seq.indexOf("ground")>=0},
      {q:"Complete the full correct procedure for a <b>Class 0</b> device with zero errors.",
       test:s=>s.result && s.cls==="0" && s.result.errors.length===0 && s.result.outcome==="survived"}
    ]
  };

  function state(){ return {seq:seq.slice(), cls, result}; }

  function run(){
    result = runProcedure(seq, cls);
    if(result.errors.length===0 && result.outcome==="survived") markProg(id,"lab");
    draw();
  }

  function drawPool(){
    pool.innerHTML = "";
    STEPS.forEach(st=>{
      const used = seq.indexOf(st.id) >= 0;
      const b = el("button",{class:"btn sec",
        style:"width:100%;margin-bottom:6px;text-align:left;font-size:.78rem;padding:9px 10px;"+
              (used?"opacity:.45":""),
        onclick:()=>{ seq.push(st.id); result=null; draw(); labTouch(id,7); }},
        (used?"&#8635; ":"&#43; ")+st.label);
      pool.appendChild(b);
    });
    pool.appendChild(el("p",{class:"tiny muted", style:"margin:6px 0 0"},
      "Actions can be used more than once. One of them is a trap."));
  }

  function draw(){
    seqBox.innerHTML = "";
    seqBox.appendChild(el("div",{class:"eyebrow"},"Your sequence"));
    if(!seq.length){
      seqBox.appendChild(el("div",{class:"note small", style:"margin-bottom:0"},
        "Nothing chosen yet. Build the sequence from the actions on the right, in the order you would actually do "+
        "them, then press <b>Run the job</b>. The bench tracks the charge on your body the whole way through."));
    }else{
      const list = el("div",{style:"display:flex;flex-wrap:wrap;gap:6px"});
      seq.forEach((sid,i)=>{
        const st = STEPS.find(x=>x.id===sid);
        const chip = el("button",{class:"btn sec",
          style:"font-size:.72rem;padding:6px 9px",
          onclick:()=>{ seq.splice(i,1); result=null; draw(); }},
          (i+1)+". "+st.label+" &times;");
        list.appendChild(chip);
      });
      seqBox.appendChild(list);
    }

    trace.innerHTML = ""; ro.innerHTML = ""; note.innerHTML = "";
    if(result){
      /* charge trace */
      const W = 540, H = 150, L = 40, T = 22, Bm = 44;
      const pts = result.trace;
      const maxV = Math.max(1000, ...pts.map(p=>p.techV));
      const pw = W-L-14, ph = H-T-Bm;
      const sx = i => L + (pts.length<2 ? 0 : i/(pts.length-1)*pw);
      const sy = v => T + ph - (v/maxV)*ph;
      let g = "", d = "";
      pts.forEach((p,i)=>{ d += (i?" L":"M") + sx(i).toFixed(1) + "," + sy(p.techV).toFixed(1); });
      const wy = sy(Math.min(maxV, result.withstand));
      if(result.withstand <= maxV){
        g += `<line x1="${L}" y1="${wy}" x2="${L+pw}" y2="${wy}" stroke="${ACC}" stroke-width="1.6" stroke-dasharray="5 4"/>
              <text x="${L+pw}" y="${wy-5}" class="ax" fill="${ACC}" text-anchor="end">device fails above ${result.withstand?fmtV(result.withstand):"0 V"}</text>`;
      }
      g += `<path d="${d}" fill="none" stroke="${AMB}" stroke-width="2.4"/>`;
      pts.forEach((p,i)=>{
        g += `<circle cx="${sx(i)}" cy="${sy(p.techV)}" r="3.5" fill="${p.techV>result.withstand?ACC:HI}"/>`;
        g += `<text x="${sx(i)}" y="${T+ph+12}" class="stp" transform="rotate(28 ${sx(i)} ${T+ph+12})">${i}</text>`;
      });
      g += `<text x="${L}" y="${T-6}" class="tt">Charge on the technician through the job (peak ${fmtV(maxV)})</text>`;
      g += `<text x="${L}" y="${H-6}" class="ax">step number</text>`;
      trace.innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}">
        <style>.ax{fill:#7d94a8;font:600 9px ui-monospace,monospace}.tt{fill:#8fa3b5;font:700 9px system-ui}
               .stp{fill:#6f8598;font:600 8px ui-monospace,monospace;text-anchor:middle}</style>${g}</svg>`;

      ro.appendChild(readout([
        {k:"Worst discharge", v:result.worstDischarge?fmtV(result.worstDischarge):"none", cls:result.worstDischarge?"r":"g"},
        {k:"Guaranteed withstand", v:result.withstand?fmtV(result.withstand):"none"},
        {k:"Outcome", v:result.outcome==="survived"?"SURVIVED":result.outcome==="latent"?"LATENT DAMAGE":"CATASTROPHIC",
         cls:result.outcome==="survived"?"g":"r"},
        {k:"Procedural errors", v:result.errors.length, cls:result.errors.length?"r":"g"}
      ]));

      if(result.outcome==="survived" && result.errors.length===0){
        note.appendChild(el("div",{class:"note ok", style:"margin-bottom:10px"},
          "<b>Clean job.</b> You were bonded to ground before you touched anything, the board sat on a dissipative "+
          "surface, the connectors were blanked and it went into a labelled conductive container. Every one of "+
          "those steps defeats one of the three conditions from Module 1 &mdash; and the order is what made it work."));
      }else if(result.outcome==="survived"){
        note.appendChild(el("div",{class:"note warn", style:"margin-bottom:10px"},
          "<b>The device survived, but the job was not clean.</b> Surviving is not the same as complying: the "+
          "errors below are the ones that would have mattered with a more sensitive device, or on a day when "+
          "something else went wrong too."));
      }else{
        note.appendChild(el("div",{class:"note err", style:"margin-bottom:10px"},
          `<b>${result.outcome==="latent"?"Latent damage":"Catastrophic failure"} &mdash; ${fmtV(result.worstDischarge)}
           into a device with ${result.withstand?"a "+fmtV(result.withstand)+" guarantee":"no guaranteed withstand"}.</b> ${result.outcome==="latent"
           ? "It still works. It will pass its functional test, be fitted, and fail in service. Nobody will connect that failure to this morning."
           : "At least this one fails on the bench where you can see it."}`));
      }
      if(result.errors.length){
        const ul = result.errors.map(e=>"<li>"+e+"</li>").join("");
        note.appendChild(el("div",{class:"note", style:"margin-bottom:0"},
          "<div class='eyebrow'>What went wrong</div><ul class='tick'>"+ul+"</ul>"));
      }
    }

    prot.innerHTML = `<div class="eyebrow">Three classes of protection &mdash; slide 16</div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>Class</th><th>Example</th><th>How it works</th></tr></thead>
      <tbody>${PROTECTION.map(p=>`<tr><td><b>${p.name}</b></td><td>${p.eg}</td><td class="muted">${p.how}</td></tr>`).join("")}</tbody>
      </table></div>
      <div class="note small" style="margin-top:10px;margin-bottom:0"><b>The wrist strap is 1 M&ohm;</b> &mdash;
      high enough to limit the current if you touch something live, low enough to bleed static away in a fraction of
      a second. It protects the device <i>and</i> you, which is why it must never be replaced with plain wire.</div>`;

    drawPool();
    redrawTask && redrawTask();
  }

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>s.result ? `${s.seq.length} steps, worst discharge ${s.result.worstDischarge?fmtV(s.result.worstDischarge):"none"}, ${s.result.outcome}, ${s.result.errors.length} error${s.result.errors.length===1?"":"s"}`
                : `${s.seq.length} steps chosen &mdash; press Run the job`,
    id);
  draw();
};

   15 · BOOT
   ============================================================ */
(function init(){
  load();
  $("#resetBtn").onclick = ()=>{
    if(confirm("Clear all your answers, explanations and progress on this device?")) resetAll();
  };
  $("#menuBtn").onclick = ()=> $("#rail").classList.toggle("open");
  go(S.diagnosticDone ? "m1" : "home");
})();
</script>
