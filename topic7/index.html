<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic 7 — Electrostatic Sensitive Devices | Interactive Learning Bay</title>
<style>
/* ============================================================
   Topic 7 — Electrostatic Sensitive Devices
   Interactive learning environment · Temasek Polytechnic
   Self-contained: no external fonts, scripts, styles or images.
   ============================================================ */

:root{
  --bg:#080d13;
  --bg-2:#0e151d;
  --panel:#121b25;
  --panel-2:#17222e;
  --panel-3:#1d2b39;
  --line:#26384a;
  --line-soft:#1c2937;
  --ink:#e3edf6;
  --ink-2:#a8bccd;
  --ink-3:#6f8598;
  --tp:#e02b3c;
  --tp-deep:#a8121f;
  --grn:#3ad68b;
  --amb:#f5b431;
  --red:#ff5a5f;
  --cyn:#38c6d9;
  --vio:#9b8cff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1200px 700px at 78% -10%, #16283a 0%, transparent 60%),
    radial-gradient(900px 600px at 0% 100%, #14202c 0%, transparent 55%),
    var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.02rem}h4{font-size:.9rem}
p{margin:0 0 .85em}
a{color:var(--cyn)}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono)}

/* ---------- app frame ---------- */
.app{display:flex;min-height:100vh}

/* ---------- rail ---------- */
.rail{
  width:262px;flex:0 0 262px;background:linear-gradient(180deg,#0d141c,#0a1018);
  border-right:1px solid var(--line-soft);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.rail-head{padding:18px 18px 14px;border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.brand-mark{
  width:26px;height:26px;border-radius:6px;flex:0 0 26px;
  background:linear-gradient(145deg,var(--tp),var(--tp-deep));
  display:grid;place-items:center;font-weight:800;font-size:.72rem;color:#fff;letter-spacing:.02em;
}
.brand-txt{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.rail-title{font-size:.98rem;font-weight:650;line-height:1.3}
.rail-sub{font-size:.72rem;color:var(--ink-3);margin-top:3px}

.rail-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-label{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:10px 8px 6px;font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:8px;
  padding:8px 9px;margin-bottom:2px;cursor:pointer;color:var(--ink-2);
  font-size:.845rem;transition:background .13s,color .13s,border-color .13s;
}
.nav-item:hover{background:#141f2b;color:var(--ink)}
.nav-item.active{background:#182739;border-color:#2b4560;color:#fff;font-weight:600}
.nav-num{
  width:21px;height:21px;flex:0 0 21px;border-radius:5px;background:#1b2836;
  display:grid;place-items:center;font-size:.68rem;font-family:var(--mono);color:var(--ink-3);
  border:1px solid var(--line-soft);
}
.nav-item.active .nav-num{background:var(--tp);color:#fff;border-color:transparent}
.nav-item.done .nav-num{background:rgba(58,214,139,.15);color:var(--grn);border-color:rgba(58,214,139,.35)}
.nav-txt{flex:1;min-width:0}
.nav-tier{
  font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:2px 6px;border-radius:20px;white-space:nowrap;
}
.tier-foundation{background:rgba(56,198,217,.14);color:var(--cyn)}
.tier-developing{background:rgba(245,180,49,.14);color:var(--amb)}
.tier-proficient{background:rgba(58,214,139,.14);color:var(--grn)}

.rail-foot{padding:12px;border-top:1px solid var(--line-soft)}
.progress-wrap{margin-bottom:10px}
.progress-line{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-3);margin-bottom:5px}
.bar{height:5px;border-radius:5px;background:#18222d;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--tp),#ff7a5c);border-radius:5px;transition:width .35s ease}
.ghost-btn{
  width:100%;background:#141e29;border:1px solid var(--line);border-radius:8px;
  padding:7px;font-size:.76rem;color:var(--ink-2);cursor:pointer;transition:.13s;
}
.ghost-btn:hover{background:#1a2734;color:var(--ink)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 26px;border-bottom:1px solid var(--line-soft);
  background:rgba(9,14,20,.82);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;
}
.crumb{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.topbar h2{margin:2px 0 0;font-size:1.06rem}
.view{padding:26px;max-width:1120px;width:100%;margin:0 auto;flex:1}

/* ---------- generic pieces ---------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.card.tight{padding:14px 16px}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.card-h .dot{width:7px;height:7px;border-radius:50%;background:var(--tp);flex:0 0 7px}
.card-h h3{margin:0}
.eyebrow{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:6px}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:18px 0}

.btn{
  background:linear-gradient(180deg,#e33c4c,var(--tp-deep));border:0;border-radius:8px;
  padding:9px 16px;font-weight:600;font-size:.86rem;color:#fff;cursor:pointer;
  box-shadow:0 3px 10px rgba(224,43,60,.24);transition:filter .13s,transform .06s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#1c2836;border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.sec:hover{background:#243444}
.btn.ok{background:linear-gradient(180deg,#43dd95,#1e9e63);box-shadow:0 3px 10px rgba(58,214,139,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;background:#1b2836;color:var(--ink-2);border:1px solid var(--line-soft)}
.pill.g{background:rgba(58,214,139,.12);color:var(--grn);border-color:rgba(58,214,139,.28)}
.pill.a{background:rgba(245,180,49,.12);color:var(--amb);border-color:rgba(245,180,49,.28)}
.pill.r{background:rgba(255,90,95,.12);color:var(--red);border-color:rgba(255,90,95,.28)}
.pill.c{background:rgba(56,198,217,.12);color:var(--cyn);border-color:rgba(56,198,217,.28)}

.note{border-left:3px solid var(--cyn);background:#101c26;padding:11px 14px;border-radius:0 8px 8px 0;font-size:.87rem;margin:12px 0}
.note.warn{border-left-color:var(--amb);background:#1d1a10}
.note.err{border-left-color:var(--red);background:#201415}
.note.ok{border-left-color:var(--grn);background:#101f18}
.note b{color:var(--ink)}

/* ---------- lab shell ---------- */
.lab{background:linear-gradient(180deg,#101a24,#0c141c);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.lab-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 16px;background:#0d161f;border-bottom:1px solid var(--line-soft);
}
.lab-head .t{display:flex;align-items:center;gap:9px;font-weight:650;font-size:.92rem}
.lab-head .t svg{opacity:.85}
.lab-body{padding:18px}
.lab-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.lab-cols.wide-left{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}

.ctrl{margin-bottom:14px}
.ctrl label{display:flex;justify-content:space-between;align-items:baseline;font-size:.79rem;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.ctrl label .v{font-family:var(--mono);color:var(--ink);font-size:.86rem;background:#182430;padding:1px 7px;border-radius:5px;border:1px solid var(--line-soft)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;
  background:#22303e;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--tp);cursor:pointer;border:2px solid #0e151d;box-shadow:0 0 0 1px var(--tp);
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--tp);cursor:pointer;border:2px solid #0e151d;
}
input[type=text],input[type=number],select,textarea{
  width:100%;background:#0c141d;border:1px solid var(--line);border-radius:7px;
  padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:.88rem;
}
input:focus,select,textarea:focus{outline:2px solid rgba(56,198,217,.4);outline-offset:-1px}
textarea{font-family:var(--sans);line-height:1.6;resize:vertical;min-height:120px}
select{font-family:var(--sans)}

.seg{display:flex;gap:4px;background:#0d161f;padding:4px;border-radius:9px;border:1px solid var(--line-soft);flex-wrap:wrap}
.seg button{
  flex:1;min-width:62px;background:transparent;border:0;border-radius:6px;padding:7px 8px;
  font-size:.79rem;color:var(--ink-2);cursor:pointer;font-weight:600;transition:.12s;
}
.seg button:hover{background:#182432;color:var(--ink)}
.seg button.on{background:var(--tp);color:#fff}

/* input toggles (logic switches) */
.switches{display:flex;gap:10px;flex-wrap:wrap}
.sw{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:#0d161f;border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;
  min-width:66px;transition:.13s;user-select:none;
}
.sw:hover{border-color:#33506b}
.sw .nm{font-size:.72rem;color:var(--ink-3);font-weight:700;letter-spacing:.05em}
.sw .lamp{
  width:30px;height:30px;border-radius:50%;background:#16212c;border:2px solid #24313d;
  display:grid;place-items:center;font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--ink-3);
  transition:.16s;
}
.sw.on .lamp{background:rgba(58,214,139,.2);border-color:var(--grn);color:var(--grn);box-shadow:0 0 12px rgba(58,214,139,.35)}
.sw.out{cursor:default}
.sw.out.on .lamp{background:rgba(245,180,49,.2);border-color:var(--amb);color:var(--amb);box-shadow:0 0 14px rgba(245,180,49,.4)}

/* truth table */
table.tt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.85rem}
table.tt th,table.tt td{border:1px solid var(--line-soft);padding:6px 10px;text-align:center}
table.tt th{background:#16212c;color:var(--ink-2);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-family:var(--sans);font-weight:700}
table.tt td.out{color:var(--amb);font-weight:700}
table.tt tr.hi td{background:rgba(224,43,60,.14);outline:1px solid rgba(224,43,60,.45)}
table.tt tr.hi td.out{color:#ff9a5c}
/* prose table (SSM / comparison) */
table.tbl{width:100%;border-collapse:collapse;font-size:.86rem;margin:8px 0 2px}
table.tbl th,table.tbl td{border:1px solid var(--line-soft);padding:7px 10px;text-align:left;vertical-align:top}
table.tbl th{background:#16212c;color:var(--ink-2);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
table.tbl td:first-child,table.tbl th:first-child{white-space:nowrap}
table.tbl td b{color:var(--ink)}
.tblwrap{overflow-x:auto}

/* readouts */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px}
.ro{background:#0d161f;border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px}
.ro .k{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:3px}
.ro .v{font-family:var(--mono);font-size:1.02rem;color:var(--ink);word-break:break-all}
.ro.hl .v{color:var(--amb)}
.ro.g .v{color:var(--grn)}
.ro.c .v{color:var(--cyn)}

svg.viz{display:block;width:100%;height:auto;background:#0a1119;border:1px solid var(--line-soft);border-radius:9px}

/* bit boxes */
.bits{display:flex;gap:6px;flex-wrap:wrap}
.bit{
  width:46px;text-align:center;background:#0d161f;border:1px solid var(--line);border-radius:8px;
  padding:7px 0 5px;cursor:pointer;transition:.12s;user-select:none;
}
.bit:hover{border-color:#3a5b78}
.bit .b{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--ink-3);line-height:1.1}
.bit.on{background:rgba(224,43,60,.14);border-color:var(--tp)}
.bit.on .b{color:#ff8b8b}
.bit .w{font-size:.6rem;color:var(--ink-3);font-family:var(--mono);margin-top:2px}
.bit.on .w{color:var(--amb)}
.bit.flip{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}

/* q&a */
.q{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:15px 17px;margin-bottom:12px}
.q .stem{font-weight:600;margin-bottom:11px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;align-items:flex-start;gap:10px;background:#0e1720;border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;cursor:pointer;transition:.12s;font-size:.89rem;
}
.opt:hover{border-color:#3a5b78;background:#122030}
.opt .k{
  width:20px;height:20px;flex:0 0 20px;border-radius:5px;background:#1b2836;border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;color:var(--ink-3);font-weight:700;
}
.opt.sel{border-color:var(--cyn);background:#0f1e26}
.opt.sel .k{background:var(--cyn);color:#04141a;border-color:transparent}
.opt.right{border-color:var(--grn);background:#0e1e17}
.opt.right .k{background:var(--grn);color:#052014;border-color:transparent}
.opt.wrong{border-color:var(--red);background:#1e1315}
.opt.wrong .k{background:var(--red);color:#2a0b0c;border-color:transparent}
.opt.locked{cursor:default}
.fb{margin-top:11px;font-size:.86rem;padding:10px 13px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.good{background:#0e1e17;border:1px solid rgba(58,214,139,.3)}
.fb.bad{background:#1e1315;border:1px solid rgba(255,90,95,.3)}

/* stepper */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;padding-bottom:14px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:1px;background:var(--line)}
.step .n{
  width:23px;height:23px;flex:0 0 23px;border-radius:50%;background:#1b2836;border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;color:var(--ink-2);z-index:1;
}
.step.done .n{background:var(--grn);color:#052014;border-color:transparent}
.step .c{flex:1;font-size:.88rem;padding-top:1px}

/* tier banner */
.tier-banner{
  display:flex;align-items:center;gap:14px;padding:13px 17px;border-radius:10px;margin-bottom:16px;
  background:linear-gradient(90deg,#131f2b,#101820);border:1px solid var(--line);
}
.tier-banner .ic{
  width:36px;height:36px;flex:0 0 36px;border-radius:9px;display:grid;place-items:center;font-size:1.05rem;font-weight:800;
}
.tb-foundation .ic{background:rgba(56,198,217,.16);color:var(--cyn)}
.tb-developing .ic{background:rgba(245,180,49,.16);color:var(--amb)}
.tb-proficient .ic{background:rgba(58,214,139,.16);color:var(--grn)}
.tier-banner .tx{flex:1;min-width:0}
.tier-banner .tx b{display:block;font-size:.92rem}
.tier-banner .tx span{font-size:.79rem;color:var(--ink-2)}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:.87rem;cursor:pointer}
.chk .box{
  width:19px;height:19px;flex:0 0 19px;border-radius:5px;border:1px solid var(--line);background:#0e1720;
  display:grid;place-items:center;font-size:.72rem;color:transparent;transition:.12s;margin-top:1px;
}
.chk.on .box{background:var(--grn);border-color:var(--grn);color:#052014}

/* module footer nav */
.modfoot{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft)}

/* summary print */
.sum-block{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.sum-block h4{margin:0 0 8px;font-size:.95rem;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:.86rem}
.kv .k{color:var(--ink-3)}
.quoted{background:#0d151d;border-left:3px solid var(--vio);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.87rem;white-space:pre-wrap;color:var(--ink-2)}

/* misc */
.badge-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.hidden{display:none !important}
.center{text-align:center}
.stack>*+*{margin-top:12px}
ul.tick{list-style:none;padding:0;margin:0}
ul.tick li{padding-left:22px;position:relative;margin-bottom:7px;font-size:.88rem}
ul.tick li::before{content:"▸";position:absolute;left:4px;color:var(--tp);font-size:.8rem}
ul.plain{margin:0 0 .8em;padding-left:20px}
ul.plain li{margin-bottom:5px;font-size:.89rem}

.hero{
  background:linear-gradient(135deg,#16232f 0%,#101820 60%);
  border:1px solid var(--line);border-radius:14px;padding:28px 30px;margin-bottom:18px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(224,43,60,.16),transparent 68%);
}
.hero h1{font-size:1.75rem;margin-bottom:8px;position:relative}
.hero p{max-width:640px;position:relative;color:var(--ink-2)}

.mod-card{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:11px;padding:15px 16px;
  cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;
}
.mod-card:hover{border-color:#33506b;background:var(--panel-2);transform:translateY(-1px)}
.mod-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mod-card .idx{font-family:var(--mono);font-size:.7rem;color:var(--ink-3)}
.mod-card b{font-size:.94rem}
.mod-card p{font-size:.8rem;color:var(--ink-3);margin:0}

@media (max-width:1080px){
  .lab-cols,.lab-cols.wide-left,.split{grid-template-columns:1fr}
  .g2,.g3{grid-template-columns:1fr}
}
@media (max-width:820px){
  .rail{position:fixed;left:-262px;z-index:60;transition:left .2s;box-shadow:var(--shadow)}
  .rail.open{left:0}
  .menu-btn{display:inline-flex !important}
  .view{padding:18px 16px}
}
.menu-btn{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#182432;border:1px solid var(--line);cursor:pointer}

@media print{
  .rail,.topbar,.modfoot,.no-print{display:none !important}
  body{background:#fff;color:#111}
  .sum-block,.card{background:#fff;border:1px solid #ccc;color:#111;break-inside:avoid}
  .quoted{background:#f5f5f5;color:#222}
  .kv .k{color:#555}
}
</style>
</head>
<body>
<div class="app">

  <!-- ================= RAIL ================= -->
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="brand">
        <div class="brand-mark">TP</div>
        <div class="brand-txt">School of Engineering</div>
      </div>

const $  = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
function el(tag, attrs, html){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(attrs[k]===undefined || attrs[k]===null) continue;
    if(k==="class") n.className = attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  if(html!=null) n.innerHTML = html;
  return n;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

    "think is most likely; a wrong answer here simply gets you more scaffolding later."));

  const form = el("div");
  DIAG.forEach((q,i)=>{
    const box = el("div",{class:"q"});
    box.appendChild(el("div",{class:"stem"}, `<span class="tiny muted">Q${i+1} &middot; Module ${MOD_BY_ID[q.mod].n}</span><br>${q.stem}`));
    const opts = el("div",{class:"opts"});
    q.opts.forEach((o,oi)=>{
      const chosen = S.diagAnswers[q.id]===oi;
      const b = el("button",{class:"opt"+(chosen?" sel":""), onclick:()=>{
        S.diagAnswers[q.id]=oi; save();
        $$(".opt",opts).forEach(x=>x.classList.remove("sel"));
        b.classList.add("sel");
        updateCount();
      }});
      b.innerHTML = `<span class="k">${"ABC"[oi]}</span><span>${o}</span>`;
      opts.appendChild(b);
    });
    box.appendChild(opts);
    form.appendChild(box);
  });
  host.appendChild(form);

  const foot = el("div",{class:"card"});
  foot.innerHTML = `<div class="btn-row"><button class="btn" id="scoreBtn">Score my check &amp; set my pathway</button>

  }

};

function scoreDiagnostic(){
  const byMod = {};
  DIAG.forEach(q=>{
    if(!byMod[q.mod]) byMod[q.mod] = {right:0, total:0, wrong:[]};
    byMod[q.mod].total++;
    if(S.diagAnswers[q.id]===q.ans) byMod[q.mod].right++;
    else byMod[q.mod].wrong.push(q);
  });
  MODULES.forEach(m=>{
    const r = byMod[m.id] ? byMod[m.id].right : 0;
    S.tiers[m.id] = r===2 ? "proficient" : (r===1 ? "developing" : "foundation");
  });
  S.diagnosticDone = true;
  save();
  showDiagResult(byMod);
}

/* ---------------- MODULE 1 · STATIC ELECTRICITY & TRIBOELECTRIC CHARGING ---------------- */
m1:{
 takeaways:[

 concept:{
  foundation:`
   <p>Everything in this topic starts with one everyday event: two things touch, rub, and come apart. Do that with
   the wrong pair of materials next to an avionics box and you can destroy it without leaving a mark.</p>
   <div class="note"><b>The definition.</b> Static electricity is produced when two <b>dissimilar</b>, initially
   <b>uncharged</b>, <b>non-conducting</b> materials are rubbed together. The friction is responsible for
   transferring charge from one material to the other, and thus <b>raising the electric potential between

   <p>Read that again and notice how many conditions it contains. All three matter, and the lab lets you switch each
   one off to see what happens:</p>
   <ul class="plain">
     <li><b>Dissimilar.</b> Two identical materials have the same grip on their electrons, so neither wins. Nothing
     transfers.</li>
     <li><b>Initially uncharged.</b> The definition describes charge being created where there was none.</li>
     <li><b>Non-conducting.</b> A conductor lets the charge flow straight back or away to earth as fast as it is
     made, so no potential builds up. This is exactly why anti-static protection works.</li>
   </ul>
   <div class="note warn"><b>Contact + Friction + Separation.</b> Three stages, and the last one is the stage people
   forget. While the two surfaces are still touching, the charges sit opposite each other and the voltage between
   them is small. It is <b>pulling them apart</b> that separates the charges and raises the potential. That is why
   peeling a device out of a bag is a charging event.</div>
   <div class="note"><b>Triboelectric charging</b> is the name for the process: <b>electron transfer as a result of
   2 objects coming into contact with each other and then separating</b>. The amount depends on factors like the
   <b>rate of separation</b> and the <b>humidity</b>.</div>
   <p>Why this matters here rather than in a physics class: modern avionics use semiconductor devices that are
   susceptible to damage from stray electric charges. The problem can affect a wide range of equipment fitted in an

   <p>You know the definition. Now separate the three stages properly, because they explain different maintenance

   sitting on top of each other.</div>
   <div class="note"><b>Friction.</b> Rubbing increases the effective contact area enormously, so far more electrons
   transfer than a single touch would move. This is the stage the word "rubbed" in the definition is doing.</div>
   <div class="note warn"><b>Separation &mdash; where the voltage appears.</b> Pull the surfaces apart and the
   positive and negative charges are physically separated. Capacitance falls as the gap opens, and since the charge
   Q is fixed, V rises. That is the whole mechanism in one line, and it explains why <b>rate of separation</b>
   matters: pull slowly and charge has time to recombine or leak away; pull fast and it does not.</div>

   <p>The maintenance consequences of the mechanism, which is where this stops being physics and starts being

/* ---------------- MODULE 2 · THE TRIBOELECTRIC SERIES ---------------- */
m2:{
 takeaways:[
  "The triboelectric series ranks materials from most positive (air) to most negative (Teflon).",
  "Materials in the positive region give up electrons and become positively charged.",
  "Materials in the negative region attract electrons and become negatively charged.",
  "Cotton and steel sit in the neutral region: they neither give up nor attract electrons.",
  "The further apart two materials sit in the series, the more charge is transferred.",
  "Same side, both positive: the one with the greatest ability to generate charge becomes more positive.",
  "Same side, both negative: the one with the greatest tendency to attract charge becomes more negative."
 ],
 concept:{
  foundation:`
   <p>Knowing that electrons move is not enough &mdash; you need to know <b>which way</b>. The triboelectric series
   is the ladder that tells you, and it is the single most useful page in this topic.</p>
   <div class="note"><b>Reading the ladder.</b> Materials are listed from <b>most positive</b> at the top to
   <b>most negative</b> at the bottom.
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Positive region</b> &mdash; these materials <b>give up electrons</b> and become <b>positively
     charged</b>. Air is the most positive, down through human hands, rabbit fur, glass, human hair, wool, silk,
     aluminium, to paper, which is the least positive.</li>
     <li><b>Neutral region</b> &mdash; <b>cotton</b> and <b>steel</b>. These materials do not give up or attract
     electrons when rubbed with other materials.</li>
     <li><b>Negative region</b> &mdash; these materials <b>attract electrons</b> and become <b>negatively
     charged</b>. Wood is the least negative, down through hard rubber, brass silver, gold platinum, polyester,
     PVC (vinyl), silicon, to Teflon, which is the most negative.</li>
   </ul></div>
   <div class="note warn"><b>The basic rule.</b> When two materials from <b>different sides</b> of the series come
   into contact, electrons move from the more positive one to the more negative one. The positive-side material
   ends up positively charged; the negative-side material ends up negatively charged. So rubbing <b>silicon</b>
   (near the bottom) against <b>glass</b> (near the top) leaves the silicon negative and the glass positive.</div>
   <p>Now the case that catches everybody: <b>what if both materials are from the same side?</b></p>
   <div class="note"><b>Both from the positive side.</b> When two materials from the positive side are rubbed
   together, the material with the <b>greatest ability to generate charge</b> becomes more positive in charge.
   Example from your notes: <b>human hair and paper</b>. Human hair sits higher up, so it gives up electrons and
   becomes positive; the paper takes them.</div>
   <div class="note"><b>Both from the negative side.</b> When two materials that are both from the negative side are
   rubbed together, the one with the <b>greatest tendency to attract charge</b> becomes more negative in charge.
   Example from your notes: <b>wood and silicon</b>. Wood is the least negative of the two, so wood gives up
   electrons and silicon becomes more negative.</div>
   <p>Both cases obey one simpler rule, which is worth carrying instead of two separate ones: <b>whichever material
   sits higher in the list gives up electrons.</b> Position on the ladder is all you need.</p>`,

  developing:`
   <p>Two things to add: <i>how much</i>, and why this table is the design basis for anti-static materials.</p>
   <div class="note"><b>Distance on the ladder sets the magnitude.</b> Two materials sitting next to each other
   transfer very little. Two at opposite ends transfer a great deal. Human hands against Teflon is close to the
   worst pairing available, which is one reason PTFE-sleeved tooling is not used bare-handed near sensitive
   devices.</div>
   <div class="note warn"><b>Where the avionics sit on this ladder.</b> <b>Silicon</b> is second from the bottom.
   Almost every material a technician touches &mdash; hands, hair, wool, cotton overalls, paper documentation
   &mdash; sits above it. That means silicon is on the receiving end of essentially every charging event in the
   hangar, and it is the material your devices are made from.</div>
   <div class="note"><b>This is why anti-static materials are defined the way they are.</b> Module 6 defines
   anti-static materials as "materials neutral on the triboelectric scale" &mdash; that is, materials placed in the
   cotton and steel band. A neutral material rubbed against anything transfers almost nothing, so the packaging
   itself never becomes the charging source. It is not a coating or a treatment; it is a position on this ladder.</div>
   <p><b>Predict before you check.</b> Rub wool against aluminium. Both are in the positive region. Which one ends
   up positive, and why? Decide before you open the bench.</p>`,

  proficient:`
   <p>The series is empirical, and treating it as more precise than it is will get you into trouble.</p>
   <ul class="plain">
     <li><b>It is an ordering, not a scale.</b> There is no unit and no guarantee that the gap between wool and
     silk equals the gap between silk and aluminium. Published series differ in their middle orderings because
     surface finish, contamination, oxidation and even the humidity during the test all shift results. Use it to
     answer "which way", and be cautious about "how much".</li>
     <li><b>Surface condition can invert a pair.</b> An oxidised aluminium surface behaves differently from a
     freshly machined one. This is why a bench that was safe last year with the same materials can stop being safe
     &mdash; the ladder describes idealised clean surfaces.</li>
     <li><b>The neutral band is the design target, not an accident.</b> Anti-static packaging aims for the cotton
     and steel position deliberately. It is a genuinely different strategy from the other two protection classes:
     conductive materials <i>carry charge away</i>, dissipative materials <i>carry it away slowly and controllably</i>,
     and anti-static materials <i>never generate it in the first place</i>. Three different mechanisms, and only the
     third one is explained by this ladder.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A conductive bag protects the device inside it from an external field,
   but the bag's own outer surface can still charge a device it is rubbed against. Explain why an anti-static
   material solves a problem that a conductive material does not, using the series to justify your answer.</div>`
 },

/* ---------------- MODULE 3 · HOW MUCH CHARGE ---------------- */
m3:{
 takeaways:[
  "The amount of charge generated depends on the rate of separation and the humidity.",
  "To increase the voltage generated: low humidity or dryer air, and a high rate of separation.",
  "Walking over a wool/nylon carpet generates 35 kV at 20% RH but only 1.5 kV at 80% RH.",
  "Working at a bench wearing overalls still generates 8 kV at 20% RH and 150 V at 80% RH.",
  "Humidity affects the amount of electrostatic voltage generated &mdash; that is the conclusion the table is there to support.",
  "Even the mildest activity at the highest humidity in the table exceeds the sensitivity of the most delicate devices."
 ],
 concept:{
  foundation:`
   <p>You know charge is generated. The question a technician actually needs answered is <b>how much</b>, and
   whether it is enough to matter.</p>
   <div class="note"><b>Two factors.</b> The amount of charge depends on factors like the <b>rate of separation</b>
   and the <b>humidity</b>.
   <p style="margin:8px 0 0"><b>What increases the electrostatic voltage generated?</b><br>
   &mdash; <b>Low humidity or dryer air</b><br>
   &mdash; <b>High rate of separation</b></p></div>
   <p>Your notes put numbers on the humidity effect. These are typical electrostatic voltages generated by ordinary
   activities, measured at two humidities:</p>
   <div class="tblwrap"><table class="tbl">
     <thead><tr><th>Situation</th><th>20% RH</th><th>80% RH</th></tr></thead>
     <tbody>
       <tr><td>Walking over a wool/nylon carpet</td><td><b>35 kV</b></td><td>1.5 kV</td></tr>
       <tr><td>Sliding a plastic box across a carpet</td><td><b>18 kV</b></td><td>1.2 kV</td></tr>
       <tr><td>Removing parts from a polystyrene bag</td><td><b>15 kV</b></td><td>1 kV</td></tr>
       <tr><td>Walking over vinyl flooring</td><td><b>11 kV</b></td><td>350 V</td></tr>
       <tr><td>Removing shrink wrap packaging</td><td><b>10 kV</b></td><td>250 V</td></tr>
       <tr><td>Working at a bench wearing overalls</td><td><b>8 kV</b></td><td>150 V</td></tr>
     </tbody></table></div>
   <div class="note warn"><b>The conclusion the table is there to support:</b> humidity affects the amount of
   electrostatic voltage generated. Look down the two columns &mdash; the same activity produces roughly
   <b>20 to 40 times more voltage</b> in dry air than in humid air.</div>
   <p>Two things to notice that students usually walk past. First, <b>every single entry is measured in kilovolts or
   hundreds of volts</b> &mdash; even the gentlest one. Second, the bottom row is a technician simply
   <b>working at a bench wearing overalls</b>. Doing nothing unusual. Touching nothing. That is 8 kV in dry air.</p>`,

  developing:`
   <p>Numbers are only frightening once you have something to compare them against, and your deck does not supply
   the comparison. This is where it comes from.</p>
   <div class="note"><b>Device sensitivity &mdash; JEDEC JS-001 Human Body Model classes.</b> The industry
   classifies parts by the discharge voltage they survive from a human-body-shaped source:
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Class 0</b> &mdash; below 250 V</li>
     <li><b>Class 1A</b> &mdash; 250 to under 500 V</li>
     <li><b>Class 1B</b> &mdash; 500 to under 1 kV</li>
     <li><b>Class 1C</b> &mdash; 1 kV to under 2 kV</li>
     <li><b>Class 2</b> &mdash; 2 kV to under 4 kV</li>
     <li><b>Class 3A</b> &mdash; 4 kV to under 8 kV</li>
     <li><b>Class 3B</b> &mdash; 8 kV and above</li>
   </ul>
   This classification is not in your slides &mdash; it is the standard scale the electronics industry uses, brought
   in so the deck's kilovolts mean something.</div>
   <div class="note warn"><b>Now re-read the table.</b> The <i>mildest</i> entry at the <i>most favourable</i>
   humidity &mdash; working at a bench wearing overalls at 80% RH &mdash; is <b>150 V</b>, which already destroys a
   Class 0 device. The worst entry, walking on carpet in dry air, is <b>35 kV</b>: more than four times the
   threshold of the toughest class in the list. There is no activity in the table that is safe for an unprotected
   sensitive device.</div>
   <div class="note"><b>Why humidity works.</b> Moist air leaves a microscopic film of water on surfaces. That film
   is weakly conductive, so charge bleeds away roughly as fast as it is generated and never accumulates to a
   damaging level. It is not that less charge is created &mdash; it is that less is retained.</div>
   <p><b>Predict before you check.</b> Your hangar sits at 60% relative humidity. Roughly what voltage would you
   expect from walking over vinyl flooring &mdash; nearer the 11 kV figure or the 350 V one? Commit to an answer
   before you open the bench.</p>`,

  proficient:`
   <p>Where the numbers stop being reliable, and what to do about it.</p>
   <ul class="plain">
     <li><b>Humidity control is mitigation, not protection.</b> Raising humidity reduces generated voltage by a
     factor of tens, and the table proves it. But the residual is still 150 V to 1.5 kV, which is fatal to Class 0
     and Class 1 parts. Your notes say "avoidance of very dry environments <i>if possible</i>" &mdash; that
     qualifier matters, and humidity is never the primary control.</li>
     <li><b>The rate-of-separation factor is directional, not quantified.</b> Your deck states that a high rate of
     separation increases the voltage, and gives no figures for it. Be careful with anyone who quotes a precise
     multiplier: it depends on materials, surface area, contact pressure and the leakage path. Direction is
     reliable; magnitude is not.</li>
     <li><b>These are typical values, not limits.</b> The table says "typical electrostatic voltage generated". A
     specific combination of synthetic overalls, a particular floor and a fast movement can exceed them. Designing
     handling procedures to the table's numbers rather than to the device's class is the wrong way round.</li>
     <li><b>You cannot feel most of this.</b> The human perception threshold for a static shock is around 3 kV, and
     that is a long way above Class 0, 1 and 2 devices. "I did not feel a shock, so I did not discharge anything"
     is a false inference, and it is the reason latent damage goes unnoticed.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A hangar proposes raising humidity to 80% instead of issuing wrist
   straps, arguing the table shows a 20-fold reduction. Give two reasons this is unsafe, using the HBM classes,
   and state what humidity control is actually good for.</div>`
 },

/* ---------------- MODULE 4 · ESD DAMAGE & ITS CAUSES ---------------- */
m4:{
 takeaways:[
  "Latent failure: a device that is partially degraded yet can still perform its intended function.",
  "Catastrophic failure: equipment malfunction.",
  "Cause 1 &mdash; discharge from the human body or a charged material, for example walking across a floor.",
  "Cause 2 &mdash; device electrostatic discharge: movement across a surface, or vibration in a package.",
  "Extensive and permanent damage can arise from mishandling and inappropriate methods of storage and transportation.",
  "An LRU can fail totally with no visible sign of damage."
 ],
 concept:{
  foundation:`
   <p>Electrostatic discharge damages a device in one of two ways, and the names are worth learning precisely
   because they behave completely differently in service.</p>
   <div class="note err"><b>Catastrophic failure &mdash; equipment malfunction.</b> The device is destroyed. It
   fails its functional test, you find it, you replace it. Expensive and annoying, but <b>visible</b>, and the
   aircraft never sees it.</div>
   <div class="note warn"><b>Latent failure &mdash; a device that is partially degraded yet can still perform its
   intended function.</b> The junction is damaged but not open. The device works. It passes every test you can
   throw at it. It goes into an LRU, the LRU goes into an aircraft, and the damage propagates under thermal and
   electrical stress until, weeks or months later, it fails in service.</div>
   <p>Stop and consider which of those two you should be more worried about. The catastrophic one costs money. The
   latent one leaves the hangar undetected and fails somewhere you cannot reach it. <b>The dangerous failure is the
   one that still works.</b></p>
   <p>And it is invisible: the problem can affect a wide range of electronic equipment fitted in an aircraft,
   <b>including total failure of the LRU but without any visible sign of damage</b>. There is no scorch mark, no
   smell, no cracked package. Extensive and permanent damage arises from <b>mishandling and inappropriate methods of
   storage and transportation</b>.</p>
   <div class="note"><b>The two causes.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>1 &mdash; Discharge from the human body or a charged material.</b> When one walks across a floor, and
     due to the high voltage potential of the static charge in insulators and semiconductor junctions.</li>
     <li><b>2 &mdash; Device electrostatic discharge.</b> Movement across a surface, or vibration in a package.</li>
   </ul></div>
   <p>Note what cause 2 means: <b>the device can charge and discharge itself</b>, with no person involved at all. A
   board sliding around inside the wrong container during transport, or vibrating in a box, is generating and
   dumping charge on its own. That is why storage and transportation are named alongside handling.</p>`,

  developing:`
   <p>Two things follow from the latent/catastrophic split that change how you work.</p>
   <div class="note warn"><b>Your test equipment cannot find latent damage.</b> A functional test asks "does it
   perform its intended function?" and a latently damaged device answers yes. That is the definition. So the number
   of ESD-damaged devices you catch is not the number you created &mdash; it is only the catastrophic fraction. The
   rest left the building.</div>
   <div class="note"><b>The consequence for statistics.</b> If a hangar records ten ESD-related rejects a year, the
   real number of damaged devices is larger, and the excess is out flying. This is why ESD control is written as a
   <i>process</i> discipline &mdash; wear the strap every time &mdash; rather than an inspection discipline. You
   cannot inspect for what you cannot detect.</div>
   <div class="note"><b>Cause 2 is why packaging is specified, not just handling.</b> A person is not needed to
   generate a discharge. A circuit board moving inside an ordinary polythene bag during a road journey is doing
   contact, friction and separation, thousands of times. This is the reason your notes require the correct
   <b>conductive bag or container</b> rather than any bag.</div>
   <p><b>Predict before you check.</b> Ten devices are handled without precautions. Roughly what fraction would you
   expect to fail the functional test on the bench, and what fraction to leave the hangar damaged? Commit to a
   guess, then run the batch in the lab.</p>`,

  proficient:`
   <p>The reliability engineering behind the two words.</p>
   <ul class="plain">
     <li><b>Latent damage is a reduction in margin, not a fault.</b> A partially punctured gate oxide or a partly
     melted metallisation track still conducts. What has changed is how much further stress the device can take
     before it opens. The part has spent most of its design life in a single event and nothing measures that.</li>
     <li><b>It defeats infant-mortality screening.</b> Burn-in and functional test are designed to catch parts that
     are already bad. A latently damaged part is not yet bad, so it passes screening and then fails during the
     flat part of the bathtub curve, where failures are supposed to be rare and are therefore least expected.</li>
     <li><b>"No visible signs" removes the feedback loop.</b> The technician who caused the damage gets no signal,
     so nothing about their practice changes. Every other hangar hazard teaches you when you get it wrong. This one
     does not, which is why the procedure has to be enforced rather than learned from experience.</li>
     <li><b>Cause 2 makes the device its own enemy.</b> Charged Device Model discharge &mdash; the device charging
     itself by movement and then discharging through a single pin when it touches something &mdash; is often faster
     and more damaging than a human-body discharge, because the whole charge leaves through one path in a few
     nanoseconds.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> An operator's reliability data shows an unexplained cluster of avionics
   failures 200 to 400 flight hours after a batch of LRUs was fitted, with no failures during acceptance testing.
   Explain how ESD handling in the workshop could produce exactly this signature, and state what evidence would
   confirm or rule it out.</div>`
 },

/* ---------------- MODULE 5 · RECOGNISING ESD DEVICES ---------------- */
m5:{
 takeaways:[
  "Caution yellow with black characters identifies an Electrostatic Sensitive Device.",
  "Decal A &mdash; metal encased units (boxes) and assemblies.",
  "Decal B &mdash; LRU front panels.",
  "Decal C &mdash; circuit board extractor.",
  "Decal D &mdash; grounding jacks.",
  "Decal E &mdash; areas too small to accommodate any of the above decals.",
  "Placards on the LRU tell you to take precautions when removing, installing and moving it.",
  "Printed circuit boards are identified with a static sensitive placard."
 ],
 concept:{
  foundation:`
   <p>Before any of the handling rules can help you, you have to know that the thing in front of you is sensitive.
   That is what the decals are for, and they are deliberately hard to miss.</p>
   <div class="note warn"><b>The colour is the first signal.</b> <b>Caution yellow</b> background with <b>black
   characters</b> identifies an Electrostatic Sensitive Device. Before you put a hand into a rack, scan for
   yellow.</div>
   <p>There are five decal types, and each has a defined place. The reason there are five is simply size and
   surface: a big metal box can carry a large label, a grounding jack cannot.</p>
   <div class="tblwrap"><table class="tbl">
     <thead><tr><th>Decal</th><th>Used on</th></tr></thead>
     <tbody>
       <tr><td><b>A</b></td><td>Metal encased units (boxes) and assemblies</td></tr>
       <tr><td><b>B</b></td><td>LRU front panels</td></tr>
       <tr><td><b>C</b></td><td>Circuit board extractor</td></tr>
       <tr><td><b>D</b></td><td>Grounding jacks</td></tr>
       <tr><td><b>E</b></td><td>Areas too small to accommodate any of the above decals</td></tr>
     </tbody></table></div>
   <div class="note"><b>Decal B is the one that carries instructions.</b> It is the larger label found on LRU front
   panels, and it tells you that the unit contains static sensitive devices and that you must connect a grounding
   wrist strap to the electrostatic ground jack located on the unit. The label tells you both <i>that</i> there is a
   hazard and <i>what to do about it</i>.</div>
   <div class="note"><b>Decal D marks the solution, not the hazard.</b> It identifies the <b>grounding jack</b>
   &mdash; the socket your wrist strap plugs into. Learning to spot it is worth as much as learning to spot the
   warnings.</div>
   <p><b>Placards on the LRU</b> show that you must take the necessary precautions from static discharges when
   <b>removing, installing and moving</b> the LRU. And the printed circuit boards inside are themselves identified
   with a <b>static sensitive placard</b>.</p>`,

  developing:`
   <p>Read the decal set as a system rather than five separate labels, and the logic becomes obvious.</p>
   <div class="note"><b>Three of the five mark a hazard, one marks a tool, one marks the remedy.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>A and B</b> mark the <i>equipment</i> &mdash; the box from the outside, and the LRU front panel you
     face when it is racked.</li>
     <li><b>C</b> marks a <i>tool</i>: the circuit board extractor. The tool is labelled because using the wrong
     one, or using it carelessly, is itself a charging event.</li>
     <li><b>D</b> marks the <i>remedy</i>: the grounding jack.</li>
     <li><b>E</b> is a size fallback, not a different meaning &mdash; the miniature symbols used where nothing
     larger will fit.</li>
   </ul></div>
   <div class="note warn"><b>The one that catches people.</b> Decal E means only "there was no room for a proper
   decal". It carries the same warning as the others, on a smaller area. A student who reads E as a lesser warning
   has it backwards: the small parts it appears on are frequently the most sensitive.</div>
   <div class="note"><b>Absence of a decal is not evidence of safety.</b> Decals fall off, get painted over, and
   are obscured by connectors and cable looms. The three questions to ask are: does this contain semiconductors,
   does the maintenance manual call for ESD precautions, and is there a grounding jack fitted nearby? A grounding
   jack on a unit is a very strong hint about what is inside it.</div>
   <p><b>Predict before you check.</b> You are handed a small circuit-board extractor tool with a tiny yellow symbol
   on the handle. Which decal is that, and why that one? Decide before you open the identifier.</p>`,

  proficient:`
   <p>Why the labelling scheme is built this way, and its limits.</p>
   <ul class="plain">
     <li><b>The colour convention is doing the heavy lifting.</b> Caution yellow is recognisable in poor light, at
     an angle, and in peripheral vision, which is how labels are actually read in a rack. A technician who has
     learned "yellow means stop and think" is protected even when the text is unreadable, and text on a decal in an
     avionics bay very often is.</li>
     <li><b>Labelling the ground jack is a design decision worth noticing.</b> Marking the remedy as prominently as
     the hazard shortens the gap between recognising the risk and acting on it. A warning that does not tell you
     where the jack is leaves you to search for it while holding a charged body next to an open rack.</li>
     <li><b>Decals mark what someone anticipated.</b> They are applied at design and manufacture. A modification, a
     repair, a locally-manufactured cable assembly, or a part fitted by a previous operator may carry no marking at
     all while being fully sensitive. This is why the maintenance manual, not the label, is the authority.</li>
     <li><b>Placards cover removal, installation and movement.</b> Not just "handling". The scope is deliberate:
     cause 2 damage happens during transport, so the requirement extends to moving a unit that is not being worked
     on at all.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A locally manufactured wiring harness with an embedded interface board
   carries no ESD decal. Argue what an engineer should do, name the authority you would consult, and say which
   decal would be appropriate once the assembly is marked.</div>`
 },

/* ---------------- MODULE 6 · PROTECTION & HANDLING ---------------- */
m6:{
 takeaways:[
  "Three classes of protection: conductive materials (metal foils), static dissipative materials, and anti-static materials (materials neutral on the triboelectric scale).",
  "Avoid very dry environments if possible, and use static dissipative floor and bench mats.",
  "Wrist or heel straps must be worn when handling ESD devices, and have a typical resistance of 1 M&ohm;.",
  "Use low-voltage soldering equipment, anti-static soldering stations, and anti-static insertion and removal tools for ICs.",
  "Ground jacks must be available; use anti-static packaging and grounded test equipment.",
  "Electrical connectors are to be covered using the correct conductive blanks.",
  "Connect the wrist strap into the Electrostatic Ground Jack or a recognised aircraft ground point.",
  "Keep electrostatic sensitive devices away from other material.",
  "LRUs and circuit boards go in the correct conductive bag or container, which must display an ESD label."
 ],
 concept:{
  foundation:`
   <p>Everything so far has been diagnosis. This module is the treatment, and it comes in two parts: what the
   materials around the device are made of, and what you do with your hands.</p>
   <div class="note"><b>Three classes of protective material.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Conductive materials</b> &mdash; example: <b>metal foils</b>. These carry charge away quickly and
     shield what is inside them.</li>
     <li><b>Static dissipative materials</b> &mdash; these carry charge away, but slowly and in a controlled way.</li>
     <li><b>Anti-static materials</b> &mdash; example: <b>materials neutral on the triboelectric scale</b>. These
     do not generate significant charge in the first place.</li>
   </ul>
   Three different jobs. Conductive drains fast, dissipative drains slowly, anti-static never charges. A good
   package uses more than one.</div>
   <div class="note"><b>Environment.</b> Avoidance of very dry environments if possible. Use of static dissipative
   floor and bench mats.</div>
   <div class="note warn"><b>The wrist strap, and the number to remember.</b> Wrist or heel straps <b>must be worn
   when handling electrostatic sensitive devices</b>, and have a <b>typical resistance of 1 M&ohm;</b>.
   <p style="margin:8px 0 0">Why one megohm, and not a plain wire? Because the strap connects <i>you</i> to
   aircraft ground. A zero-ohm connection would make you a very good conductor to earth, which is a lethal shock
   hazard if you then touch something live. One megohm is high enough to limit that current to a safe value, and low
   enough to bleed away static charge in a fraction of a second. It protects the device <i>and</i> you, and it is
   the reason a strap must never be replaced with ordinary wire.</p></div>
   <div class="note"><b>Equipment.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li>Low-voltage soldering equipment and anti-static soldering stations</li>
     <li>Anti-static insertion and removal tools for integrated circuits</li>
     <li>Availability of ground jacks</li>
     <li>Anti-static packaging</li>
     <li>Grounded test equipment</li>
   </ul></div>
   <div class="note"><b>The rules on the job.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li>The electrical connectors are to be covered using the <b>correct conductive blanks</b>.</li>
     <li>Connect the wrist strap into the <b>Electrostatic Ground Jack</b> or a <b>recognised aircraft ground
     point</b>.</li>
     <li>Keep electrostatic sensitive devices <b>away from other material</b>.</li>
     <li>LRUs or circuit boards are to be placed in the <b>correct conductive bag or container</b>, which must
     display an <b>Electrostatic Sensitive Device label</b>.</li>
   </ul></div>`,

  developing:`
   <p>The list is not arbitrary. Every item on it defeats one of the three conditions from Module 1, and grouping
   them that way is much easier than memorising nine bullet points.</p>
   <div class="note"><b>Attacks "non-conducting":</b> dissipative floor and bench mats, the 1 M&ohm; strap, ground
   jacks, grounded test equipment, conductive bags, conductive blanks over connectors. All of these give charge a
   controlled path away instead of letting it sit on an insulator.</div>
   <div class="note"><b>Attacks "dissimilar":</b> anti-static packaging and anti-static tools. Materials at the
   neutral point of the series barely exchange electrons with anything, so no charge is generated to begin
   with.</div>
   <div class="note"><b>Attacks the generation rate:</b> avoiding very dry environments, and handling deliberately

   ============================================================ */
function renderPractice(host, modId, qs){
  if(!S.practice[modId]) S.practice[modId] = {};
  const rec = S.practice[modId];

  qs.forEach((q,i)=>{
    const box = el("div",{class:"q"});
    box.appendChild(el("div",{class:"stem"}, `<span class="tiny muted">Question ${i+1}</span><br>${q.stem}`));
    const opts = el("div",{class:"opts"});
    const fb = el("div",{class:"fb"});

    const paint = ()=>{
      const r = rec[q.id];
      $$(".opt",opts).forEach((b,bi)=>{
        b.className = "opt locked";
        if(r){
          if(bi===q.ans) b.classList.add("right");
          else if(bi===r.choice) b.classList.add("wrong");
        }else{
          b.className = "opt";
        }
      });
      if(r){
        fb.className = "fb show "+(r.correct?"good":"bad");
        fb.innerHTML = (r.correct?"<b>Correct.</b> ":"<b>Not quite.</b> ")+q.why;
      }
    };

    q.opts.forEach((o,oi)=>{
      const b = el("button",{class:"opt", onclick:()=>{
        if(rec[q.id]) return;
        const ok = oi===q.ans;
        rec[q.id] = {choice:oi, correct:ok};
        if(!ok && q.mis) addMisconception(modId, q.mis);
        save();
        paint();
        if(qs.every(x=>rec[x.id])) markProg(modId,"practice");
      }});
      b.innerHTML = `<span class="k">${"ABC"[oi]}</span><span>${o}</span>`;
      opts.appendChild(b);
    });
    box.appendChild(opts);
    box.appendChild(fb);
    host.appendChild(box);
    paint();
  });

  const again = el("button",{class:"btn sec no-print", onclick:()=>{
    S.practice[modId] = {}; save(); host.innerHTML=""; renderPractice(host, modId, qs);
  }},"Clear my answers and try again");
  host.appendChild(el("div",{class:"btn-row", style:"margin-top:6px"})).appendChild(again);
}

   ============================================================ */
function analyseFeynman(text, ideas){
  const t = " "+text.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ")+" ";
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const covered = [], missing = [];
  ideas.forEach(idea=>{
    const hit = idea.terms.some(term=> t.indexOf(" "+term.toLowerCase()) !== -1 || t.indexOf(term.toLowerCase()) !== -1);
    (hit?covered:missing).push(idea.k);
  });
  // sentence count as a rough proxy for whether it is an explanation or a label
  const sentences = (text.match(/[.!?]+/g)||[]).length;
  return {words, sentences, covered, missing, pct: Math.round(covered.length/ideas.length*100)};
}

function renderFeynman(modId, F){
  const card = el("div",{class:"card"});
  card.innerHTML = `<div class="card-h"><span class="dot"></span><h3>4 &middot; Explain it back (Feynman method)</h3></div>
    <p class="small muted">If you cannot explain it simply, you do not understand it yet. Write it as if the person in
    front of you has never seen this topic &mdash; no formulas you have not explained, no jargon you have not unpacked.</p>
    <div class="note">${F.prompt}</div>`;

  const ta = el("textarea",{placeholder:F.starter, id:"fey_"+modId});
  ta.value = S.feynman[modId] || "";
  card.appendChild(ta);

  const meta = el("div",{class:"small muted", style:"margin-top:6px"});
  const out = el("div",{style:"margin-top:14px"});

  const refresh = ()=>{
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    meta.textContent = n+" words"+(n<40?" — aim for roughly 60–120":"");
  };
  ta.addEventListener("input", refresh);
  refresh();
  card.appendChild(meta);

  const row = el("div",{class:"btn-row no-print", style:"margin-top:12px"});
  const chk = el("button",{class:"btn", onclick:()=>{
    const text = ta.value.trim();
    S.feynman[modId] = text; save();
    const a = analyseFeynman(text, F.ideas);
    S.feynmanScore[modId] = {covered:a.covered, missing:a.missing, words:a.words, pct:a.pct};
    save();
    out.innerHTML = "";

    if(a.words < 25){
      out.appendChild(el("div",{class:"note warn"},
        "<b>Too short to check.</b> A one-line answer is a label, not an explanation. Write it as you would say it out "+
        "loud to someone standing next to you &mdash; roughly 60 to 120 words."));
      return;
    }

    const head = el("div",{class:"note "+(a.pct>=80?"ok":(a.pct>=50?"warn":"err"))});
    head.innerHTML = `<b>${a.covered.length} of ${F.ideas.length} key ideas covered (${a.pct}%).</b> `+
      (a.pct>=80 ? "That is a solid explanation &mdash; someone could learn the idea from it."
       : a.pct>=50 ? "You have the shape of it. The gaps below are the parts your listener would still be confused about."
       : "Most of the key ideas are missing. Read the concept section again, then rewrite &mdash; do not just add the words in.");
    out.appendChild(head);

    const g = el("div",{class:"grid g2"});
    const cvd = el("div");
    cvd.innerHTML = `<div class="eyebrow">You covered</div>`+
      (a.covered.length? "<ul class='tick'>"+a.covered.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"
                       : "<p class='small muted'>Nothing yet.</p>");
    const mis = el("div");
    mis.innerHTML = `<div class="eyebrow">Still missing</div>`+
      (a.missing.length? "<ul class='tick'>"+a.missing.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"
                       : "<p class='small muted'>Nothing &mdash; all key ideas present.</p>");
    g.appendChild(cvd); g.appendChild(mis);
    out.appendChild(g);

    out.appendChild(el("div",{class:"note small"},
      "<b>Careful:</b> this check looks for the ideas, not for the exact words. Dropping a missing keyword into your "+
      "text will tick the box without teaching anyone anything. Rewrite the sentence so the idea is actually explained."));

    markProg(modId,"feynman");
  }},"Check my explanation");
  row.appendChild(chk);
  row.appendChild(el("button",{class:"btn sec", onclick:()=>{ ta.value=""; refresh(); out.innerHTML=""; }},"Clear"));
  card.appendChild(row);
  card.appendChild(out);
  return card;
}

/* --- Triboelectric series, slide 8, most positive first --- */
const TRIBO = [
  "Air", "Human hands", "Rabbit fur", "Glass", "Human hair", "Wool", "Silk",
  "Aluminium", "Paper",                       /* 0-8  positive region */
  "Cotton", "Steel",                          /* 9-10 neutral region  */
  "Wood", "Hard rubber", "Brass silver", "Gold platinum", "Polyester",
  "PVC (vinyl)", "Silicon", "Teflon"          /* 11-18 negative region */
];
const TRIBO_POS_END = 8;      /* Paper — least positive  */
const TRIBO_NEG_START = 11;   /* Wood  — least negative  */

function triboRegion(i){
  if(i <= TRIBO_POS_END) return "positive";
  if(i >= TRIBO_NEG_START) return "negative";
  return "neutral";
}
/* Which material gives up electrons when i and j are rubbed together?
   Whichever sits HIGHER in the list (lower index) gives up electrons and
   becomes positive. This one rule covers the different-side case and both
   same-side cases from slides 9 and 10. */
function triboPair(i, j){
  if(i === j) return {same:true, giver:null, positive:null, negative:null, gap:0, strength:0};
  const hi = Math.min(i,j), lo = Math.max(i,j);
  const bothNeutral = (triboRegion(i)==="neutral" && triboRegion(j)==="neutral");
  const gap = lo - hi;
  return {
    same:false,
    giver: hi,                 /* gives up electrons */
    positive: hi,              /* ends positively charged */
    negative: lo,              /* ends negatively charged */
    gap: gap,
    strength: bothNeutral ? 0 : gap / (TRIBO.length - 1),
    sameSide: triboRegion(i) === triboRegion(j),
    side: triboRegion(i) === triboRegion(j) ? triboRegion(i) : "opposite",
    bothNeutral: bothNeutral
  };
}

/* --- Typical electrostatic voltage generated, slide 11 --- */
const SITUATIONS = [
  {id:"carpet",   name:"Walking over a wool/nylon carpet",        v20:35000, v80:1500},
  {id:"plastic",  name:"Sliding a plastic box across a carpet",   v20:18000, v80:1200},
  {id:"polybag",  name:"Removing parts from a polystyrene bag",   v20:15000, v80:1000},
  {id:"vinyl",    name:"Walking over vinyl flooring",             v20:11000, v80:350},
  {id:"shrink",   name:"Removing shrink wrap packaging",          v20:10000, v80:250},
  {id:"bench",    name:"Working at a bench wearing overalls",     v20:8000,  v80:150}
];
const SIT_BY_ID = {}; SITUATIONS.forEach(s=>SIT_BY_ID[s.id]=s);

/* Log-linear interpolation between the deck's two measured columns.
   Humidity is clamped to 20-80% so this only ever interpolates, never
   extrapolates beyond the measured data. */
function voltageAt(sit, humidity){
  const h = Math.max(20, Math.min(80, humidity));
  const f = (h - 20) / 60;
  return sit.v20 * Math.pow(sit.v80 / sit.v20, f);
}
/* Rate of separation: the deck states the direction but gives no figures,
   so this is an illustrative multiplier and the page says so on screen. */
const SEP_RATES = [
  {id:"slow",   name:"Slow, deliberate",  mult:0.6},
  {id:"normal", name:"Normal",            mult:1.0},
  {id:"fast",   name:"Fast, snatched",    mult:1.4}
];
function sepMult(id){ const r = SEP_RATES.find(x=>x.id===id); return r ? r.mult : 1; }

/* --- JEDEC JS-001 Human Body Model classes. NOT from the deck; cited on screen. --- */
/* A device's class is the highest level it PASSES, so the level it is guaranteed
   to survive is the LOWER bound of its band. Class 0 fails somewhere below 250 V,
   so it carries no guarantee at any level — which is why 150 V destroys one. */
const HBM = [
  {id:"0",  name:"Class 0",  lo:0,     hi:250,      withstand:0},
  {id:"1A", name:"Class 1A", lo:250,   hi:500,      withstand:250},
  {id:"1B", name:"Class 1B", lo:500,   hi:1000,     withstand:500},
  {id:"1C", name:"Class 1C", lo:1000,  hi:2000,     withstand:1000},
  {id:"2",  name:"Class 2",  lo:2000,  hi:4000,     withstand:2000},
  {id:"3A", name:"Class 3A", lo:4000,  hi:8000,     withstand:4000},
  {id:"3B", name:"Class 3B", lo:8000,  hi:Infinity, withstand:8000}
];
function withstandLabel(c){
  return c.withstand === 0 ? "no guaranteed level" : "guaranteed to " + fmtV(c.withstand);
}
const HBM_BY_ID = {}; HBM.forEach(c=>HBM_BY_ID[c.id]=c);

/* Which class band does a given voltage fall in? */
function hbmBandFor(v){
  for(let i=0;i<HBM.length;i++){ if(v < HBM[i].hi) return HBM[i]; }
  return HBM[HBM.length-1];
}
/* How many of the seven classes does a discharge of v destroy? */
function classesDestroyedBy(v){ return HBM.filter(c=>v > c.withstand).length; }

/* Damage outcome. The survive/damage boundary is the device's rated withstand.
   The latent/catastrophic split is ILLUSTRATIVE — neither the deck nor JS-001
   quantifies it — and the page says so wherever it is shown. */
function damageOutcome(dischargeV, classId){
  const c = HBM_BY_ID[classId] || HBM_BY_ID["2"];
  const w = c.withstand;
  const severe = 3 * Math.max(w, 250);      /* well past the band this class fails in */
  const ratio = dischargeV / Math.max(w, 1);
  if(dischargeV <= w)      return {outcome:"survived",     ratio, withstand:w, cls:c};
  if(dischargeV <= severe) return {outcome:"latent",       ratio, withstand:w, cls:c};
  return                        {outcome:"catastrophic", ratio, withstand:w, cls:c};
}
/* A deterministic spread of discharge events around a nominal value, so a
   batch result is reproducible rather than random. */
function batchOutcomes(nominalV, classId, n){
  const out = {survived:0, latent:0, catastrophic:0, list:[]};
  for(let i=0;i<n;i++){
    const f = 0.3 + 3.2 * (i / Math.max(1, n-1));     /* 0.3x to 3.5x, evenly spread */
    const v = nominalV * f;
    const r = damageOutcome(v, classId);
    out[r.outcome]++;
    out.list.push({v, outcome:r.outcome});
  }
  return out;
}

function fmtV(v){
  if(v >= 1000) return (v/1000).toFixed(v>=10000?0:1).replace(/\.0$/,"") + " kV";
  return Math.round(v) + " V";
}

/* --- Handling procedure model, slides 17-20 --- */
const STEPS = [
  {id:"strap",  label:"Put on the wrist strap"},
  {id:"ground", label:"Connect the strap to the Electrostatic Ground Jack"},
  {id:"mat",    label:"Set up the static dissipative bench mat"},
  {id:"walk",   label:"Walk across the hangar to fetch a tool"},
  {id:"openbag",label:"Open the conductive bag"},
  {id:"remove", label:"Remove the circuit board from the bag"},
  {id:"blanks", label:"Fit conductive blanks to the connectors"},
  {id:"store",  label:"Place the board in a labelled conductive container"}
];
const CORRECT_ORDER = ["mat","strap","ground","openbag","remove","blanks","store"];

/* Runs a chosen sequence and returns the technician voltage history, the
   device outcome, and the list of procedural errors. Fully deterministic. */
function runProcedure(seq, classId){
  const st = {strap:false, ground:false, mat:false, bagOpen:false, boardOut:false,
              blanks:false, stored:false, techV:8000, worstDischarge:0, errors:[], trace:[]};
  const note = (t)=>{ st.errors.push(t); };
  const rec  = (label)=>{ st.trace.push({label, techV:st.techV}); };
  rec("Arrived at the bench");

  seq.forEach(id=>{
    switch(id){
      case "strap":
        if(st.strap) note("Wrist strap put on twice.");
        st.strap = true;
        break;
      case "ground":
        if(!st.strap){ note("Strap connected to ground before it was put on &mdash; nothing is grounded."); break; }
        st.ground = true; st.techV = 0;
        break;
      case "mat":
        st.mat = true;
        break;
      case "walk":
        if(st.ground){ st.techV = 0; }
        else { st.techV += SIT_BY_ID.vinyl.v20; note("Walked across the hangar while ungrounded &mdash; charge added."); }
        break;
      case "openbag":
        st.bagOpen = true;
        if(!st.ground){ st.techV += SIT_BY_ID.polybag.v20;
          note("Bag opened while ungrounded &mdash; separating the bag is itself a charging event."); }
        break;
      case "remove":
        if(!st.bagOpen){ note("Tried to remove the board before opening the bag."); break; }
        st.boardOut = true;
        if(st.techV > st.worstDischarge) st.worstDischarge = st.techV;
        if(!st.ground) note("Board touched while ungrounded &mdash; this is the discharge that damages it.");
        if(!st.mat)    note("Board placed on an unprotected surface &mdash; it can hold and dump its own charge (cause 2).");
        break;
      case "blanks":
        if(!st.boardOut){ note("Blanks fitted before the board was out of the bag."); break; }
        st.blanks = true;
        break;
      case "store":
        if(!st.boardOut){ note("Nothing to store &mdash; the board was never removed."); break; }
        if(!st.blanks) note("Stored without fitting conductive blanks to the connectors.");
        st.stored = true;
        break;
    }
    rec(STEPS.find(s=>s.id===id).label);
  });

  if(!st.boardOut) note("The job was never completed &mdash; the board was not removed.");
  if(!st.stored && st.boardOut) note("Board left out of a labelled conductive container.");

  const dmg = damageOutcome(st.worstDischarge, classId);
  return {st, outcome: st.worstDischarge === 0 ? "survived" : dmg.outcome,
          worstDischarge: st.worstDischarge, withstand: dmg.withstand,
          errors: st.errors, trace: st.trace};
}

LABS.m1 = function(host, id, tier){
  const box = labShell("Contact &ndash; friction &ndash; separation","Switch off each condition in the definition and see what survives");
  const B = box._body;

  let stage = 0;                 /* 0 apart, 1 contact, 2 friction, 3 separated */

  const cols = el("div",{class:"lab-cols wide-left"});
  const left = el("div"), right = el("div");

  B.appendChild(cols);

  const note = el("div",{style:"margin-top:12px"}); left.appendChild(note);

  right.appendChild(el("div",{class:"eyebrow"},"Stage"));
  const stageSeg = segBar([[0,"Apart"],[1,"Contact"],[2,"Friction"],[3,"Separated"]], stage,
    v=>{ stage=+v; draw(); labTouch(id,7); }, "margin-bottom:14px");
  right.appendChild(stageSeg);

  right.appendChild(el("div",{class:"eyebrow"},"Conditions from the definition"));
  const condRow = el("div",{style:"margin-bottom:14px"});
  right.appendChild(condRow);

  right.appendChild(el("div",{class:"eyebrow"},"Rate of separation"));
  right.appendChild(segBar([[1,"Fast"],[0,"Slow"]], fast?1:0,
    v=>{ fast = (+v===1); draw(); labTouch(id,7); }, "margin-bottom:14px"));

  const TASKS = {
    foundation:[
      {q:"Step all the way through to <b>Separated</b> with all three conditions met, and read the voltage.",
       test:s=>s.stage===3 && s.dissimilar && s.insulating},
      {q:"Make the two materials <b>identical</b> and step to Separated. What is generated?",
       test:s=>s.stage===3 && !s.dissimilar},
      {q:"Restore dissimilar materials, but make them <b>conducting</b>. Step to Separated again.",
       test:s=>s.stage===3 && s.dissimilar && !s.insulating}
    ],
    developing:[
      {q:"Find the stage at which the voltage first becomes large. It is not the one most people name.",
       test:s=>s.stage===3 && s.dissimilar && s.insulating && s.v>1000},
      {q:"With everything else correct, switch to a <b>slow</b> separation and compare the voltage.",
       test:s=>s.stage===3 && !s.fast && s.dissimilar && s.insulating},
      {q:"Produce a setup where charge is transferred but <b>no voltage</b> builds up.",
       test:s=>s.dissimilar && !s.insulating && s.stage>=2}
    ],
    proficient:[
      {q:"Show that friction alone, without separation, produces almost no potential difference.",
       test:s=>s.stage===2 && s.dissimilar && s.insulating},
      {q:"Demonstrate the condition a dissipative bench mat defeats, and name it from the readout.",
       test:s=>!s.insulating && s.stage===3},
      {q:"Get the highest voltage this bench can produce.",
       test:s=>s.stage===3 && s.dissimilar && s.insulating && s.fast}
    ]
  };

  function state(){
    let v = 0, transferred = false;
    if(stage >= 1 && dissimilar) transferred = true;
    if(stage >= 2 && dissimilar) transferred = true;
    if(!dissimilar) transferred = false;
    if(transferred){
      if(!insulating)      v = 0;                       /* leaks away as fast as it is made */
      else if(stage === 3) v = fast ? 15000 : 6000;     /* separation is where V appears */
      else if(stage === 2) v = 400;                     /* charges sit face to face */
      else                 v = 60;
    }
    return {stage, dissimilar, insulating, fast, transferred, v};
  }

  function drawConds(){
    condRow.innerHTML = "";
    const mk = (label, on, fn)=>{
      const b = el("button",{class:"btn sec", style:"width:100%;margin-bottom:7px;text-align:left;"+
        (on?("border-color:"+HI+";color:"+HI):("border-color:"+ACC+";color:"+ACC)),
        onclick:()=>{ fn(); draw(); labTouch(id,7); }},
        (on?"&#10003; ":"&#10007; ")+label);
      condRow.appendChild(b);
    };
    mk(dissimilar ? "Dissimilar materials" : "Identical materials", dissimilar, ()=>{ dissimilar=!dissimilar; });
    mk(insulating ? "Non-conducting (insulators)" : "Conducting materials", insulating, ()=>{ insulating=!insulating; });
  }

  function draw(){
    const s = state();
    const W = 460, H = 200;
    const gap = [150, 40, 8, 170][s.stage];
    const cx = W/2, bw = 120, bh = 46, by = 60;

          <rect x="${bx2}" y="${by}" width="${bw}" height="${bh}" rx="4" fill="${colB}" opacity=".85"/>
          <text x="${bx2+bw/2}" y="${by+bh/2+4}" class="ml">${dissimilar?"Material B":"Material A (identical)"}</text>`;
    if(s.stage === 2){
      g += `<path d="M${ax+bw/2-30},${by-14} L${ax+bw/2+30},${by-14}" stroke="${AMB}" stroke-width="2" marker-end="url(#fa)"/>
            <path d="M${bx2+bw/2+30},${by+bh+14} L${bx2+bw/2-30},${by+bh+14}" stroke="${AMB}" stroke-width="2" marker-end="url(#fa)"/>
            <text x="${cx}" y="${by-24}" class="cs" text-anchor="middle" fill="${AMB}">RUBBING</text>`;
    }
    if(s.transferred && s.stage >= 2){
      const n = 6;
      for(let i=0;i<n;i++){
        const yy = by + 10 + i*5;
        g += `<text x="${ax+bw-14}" y="${yy}" class="sg" fill="${ACC}">+</text>`;
        g += `<text x="${bx2+8}" y="${yy}" class="sg" fill="${CYN}">&#8722;</text>`;
      }
    }
    if(s.stage === 3 && s.v > 1000){
      g += `<path d="M${ax+bw+6},${by+bh/2} L${cx-14},${by+bh/2-10} L${cx+6},${by+bh/2+8} L${bx2-6},${by+bh/2}"
              stroke="${AMB}" stroke-width="2.4" fill="none"/>`;
    }
    g += `<text x="${cx}" y="${H-52}" class="cs" text-anchor="middle">${
      ["Apart — nothing has happened yet",
       "Contact — electrons redistribute at the interface",
       "Friction — a far larger contact area, far more transfer",
       "Separated — the charges are pulled apart and the voltage rises"][s.stage]}</text>`;
    g += `<text x="${cx}" y="${H-24}" class="bigv" text-anchor="middle" fill="${s.v>1000?ACC:(s.v>0?AMB:"#5c728a")}">${
      s.v>0 ? fmtV(s.v) : "no potential difference"}</text>`;
    anim.innerHTML = `<svg class="viz" viewBox="0 0 ${W} ${H}">
      <defs><marker id="fa" markerWidth="6" markerHeight="6" refX="5" refY="2.8" orient="auto">
        <path d="M0,0 L6,2.8 L0,5.6 Z" fill="${AMB}"/></marker></defs>
      <style>.ml{fill:#0b1219;font:700 11px system-ui;text-anchor:middle}
             .cs{fill:#8fa3b5;font:600 10px system-ui}
             .sg{font:700 11px ui-monospace,monospace;text-anchor:middle}
             .bigv{font:800 20px ui-monospace,monospace}</style>${g}</svg>`;

    ro.innerHTML = "";
    ro.appendChild(readout([
      {k:"Stage", v:["Apart","Contact","Friction","Separated"][s.stage]},
      {k:"Charge transferred?", v:s.transferred?"YES":"no", cls:s.transferred?"g":""},
      {k:"Potential difference", v:s.v>0?fmtV(s.v):"none", cls:s.v>1000?"r":(s.v>0?"c":"")},
      {k:"Separation", v:s.fast?"Fast":"Slow"}
    ]));

    note.innerHTML = "";
    let msg;
    if(!dissimilar){
      msg = ["err","<b>Identical materials transfer nothing.</b> Both surfaces hold their electrons with exactly "+
        "the same strength, so neither takes them from the other. The definition requires <b>dissimilar</b> "+
        "materials, and this is the condition it is protecting."];
    }else if(!insulating){
      msg = ["warn","<b>Charge is transferred, but no voltage builds up.</b> A conductor gives the charge a path to "+
        "spread out or leak away as fast as friction generates it, so there is never a potential difference. "+
        "This is the condition a <b>static dissipative bench mat</b> defeats &mdash; and it is why every "+
        "countermeasure in Module 6 is, at bottom, about making things less insulating."];
    }else if(s.stage < 2){
      msg = ["","<b>Not much yet.</b> Contact alone redistributes a little charge across the interface, but the "+
        "positive and negative charges are still sitting on top of each other, so the potential between them is "+
        "tiny. Keep going."];
    }else if(s.stage === 2){
      msg = ["","<b>Charge has transferred, but the voltage is still small.</b> Friction has moved a great many "+
        "electrons, and you can see the + and &minus; signs appear. But the two charge layers are still face to "+
        "face. This is the stage people wrongly call \"generating static\" &mdash; watch what happens when you "+
        "separate them."];
    }else{
      msg = ["err","<b>Separation is where the voltage appears.</b> Pulling the surfaces apart separates the two "+
        "charge layers. The charge Q has not changed, but the capacitance between them has collapsed, so V climbs. "+
        (s.fast ? "A <b>fast</b> separation gives the charge no time to recombine or leak away, which is why the deck lists a high rate of separation as one of the two factors."
                : "A <b>slow</b> separation lets some of the charge find its way back, so less voltage remains.")];
    }
    note.appendChild(el("div",{class:"note "+msg[0], style:"margin-bottom:0"}, msg[1]));
    drawConds();
    redrawTask && redrawTask();
  }

  const redrawTask = taskPanel(right, TASKS[tier], state,
    s=>`${["apart","contact","friction","separated"][s.stage]}, ${s.dissimilar?"dissimilar":"identical"}, ${s.insulating?"insulating":"conducting"}, ${s.fast?"fast":"slow"} &rarr; ${s.v>0?fmtV(s.v):"nothing"}`,
    id);
  draw();
};
