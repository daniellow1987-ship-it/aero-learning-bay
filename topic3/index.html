<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic 3 — Logic Circuits &amp; Data Converters | Interactive Learning Bay</title>
<style>
/* ============================================================
   Topic 3 — Logic Circuits & Data Converters
   Interactive learning environment · Temasek Polytechnic
   Self-contained: no external fonts, scripts, styles or images.
   ============================================================ */

:root{
  --bg:#080d13;
  --bg-2:#0e151d;
  --panel:#121b25;
  --panel-2:#17222e;
  --panel-3:#1d2b39;
  --line:#26384a;
  --line-soft:#1c2937;
  --ink:#e3edf6;
  --ink-2:#a8bccd;
  --ink-3:#6f8598;
  --tp:#e02b3c;
  --tp-deep:#a8121f;
  --grn:#3ad68b;
  --amb:#f5b431;
  --red:#ff5a5f;
  --cyn:#38c6d9;
  --vio:#9b8cff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1200px 700px at 78% -10%, #16283a 0%, transparent 60%),
    radial-gradient(900px 600px at 0% 100%, #14202c 0%, transparent 55%),
    var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.02rem}h4{font-size:.9rem}
p{margin:0 0 .85em}
a{color:var(--cyn)}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono)}

/* ---------- app frame ---------- */
.app{display:flex;min-height:100vh}

/* ---------- rail ---------- */
.rail{
  width:262px;flex:0 0 262px;background:linear-gradient(180deg,#0d141c,#0a1018);
  border-right:1px solid var(--line-soft);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.rail-head{padding:18px 18px 14px;border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.brand-mark{
  width:26px;height:26px;border-radius:6px;flex:0 0 26px;
  background:linear-gradient(145deg,var(--tp),var(--tp-deep));
  display:grid;place-items:center;font-weight:800;font-size:.72rem;color:#fff;letter-spacing:.02em;
}
.brand-txt{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.rail-title{font-size:.98rem;font-weight:650;line-height:1.3}
.rail-sub{font-size:.72rem;color:var(--ink-3);margin-top:3px}

.rail-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-label{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:10px 8px 6px;font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:8px;
  padding:8px 9px;margin-bottom:2px;cursor:pointer;color:var(--ink-2);
  font-size:.845rem;transition:background .13s,color .13s,border-color .13s;
}
.nav-item:hover{background:#141f2b;color:var(--ink)}
.nav-item.active{background:#182739;border-color:#2b4560;color:#fff;font-weight:600}
.nav-num{
  width:21px;height:21px;flex:0 0 21px;border-radius:5px;background:#1b2836;
  display:grid;place-items:center;font-size:.68rem;font-family:var(--mono);color:var(--ink-3);
  border:1px solid var(--line-soft);
}
.nav-item.active .nav-num{background:var(--tp);color:#fff;border-color:transparent}
.nav-item.done .nav-num{background:rgba(58,214,139,.15);color:var(--grn);border-color:rgba(58,214,139,.35)}
.nav-txt{flex:1;min-width:0}
.nav-tier{
  font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:2px 6px;border-radius:20px;white-space:nowrap;
}
.tier-foundation{background:rgba(56,198,217,.14);color:var(--cyn)}
.tier-developing{background:rgba(245,180,49,.14);color:var(--amb)}
.tier-proficient{background:rgba(58,214,139,.14);color:var(--grn)}

.rail-foot{padding:12px;border-top:1px solid var(--line-soft)}
.progress-wrap{margin-bottom:10px}
.progress-line{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-3);margin-bottom:5px}
.bar{height:5px;border-radius:5px;background:#18222d;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--tp),#ff7a5c);border-radius:5px;transition:width .35s ease}
.ghost-btn{
  width:100%;background:#141e29;border:1px solid var(--line);border-radius:8px;
  padding:7px;font-size:.76rem;color:var(--ink-2);cursor:pointer;transition:.13s;
}
.ghost-btn:hover{background:#1a2734;color:var(--ink)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 26px;border-bottom:1px solid var(--line-soft);
  background:rgba(9,14,20,.82);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;
}
.crumb{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.topbar h2{margin:2px 0 0;font-size:1.06rem}
.view{padding:26px;max-width:1120px;width:100%;margin:0 auto;flex:1}

/* ---------- generic pieces ---------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.card.tight{padding:14px 16px}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.card-h .dot{width:7px;height:7px;border-radius:50%;background:var(--tp);flex:0 0 7px}
.card-h h3{margin:0}
.eyebrow{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:6px}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:18px 0}

.btn{
  background:linear-gradient(180deg,#e33c4c,var(--tp-deep));border:0;border-radius:8px;
  padding:9px 16px;font-weight:600;font-size:.86rem;color:#fff;cursor:pointer;
  box-shadow:0 3px 10px rgba(224,43,60,.24);transition:filter .13s,transform .06s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#1c2836;border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.sec:hover{background:#243444}
.btn.ok{background:linear-gradient(180deg,#43dd95,#1e9e63);box-shadow:0 3px 10px rgba(58,214,139,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;background:#1b2836;color:var(--ink-2);border:1px solid var(--line-soft)}
.pill.g{background:rgba(58,214,139,.12);color:var(--grn);border-color:rgba(58,214,139,.28)}
.pill.a{background:rgba(245,180,49,.12);color:var(--amb);border-color:rgba(245,180,49,.28)}
.pill.r{background:rgba(255,90,95,.12);color:var(--red);border-color:rgba(255,90,95,.28)}
.pill.c{background:rgba(56,198,217,.12);color:var(--cyn);border-color:rgba(56,198,217,.28)}

.note{border-left:3px solid var(--cyn);background:#101c26;padding:11px 14px;border-radius:0 8px 8px 0;font-size:.87rem;margin:12px 0}
.note.warn{border-left-color:var(--amb);background:#1d1a10}
.note.err{border-left-color:var(--red);background:#201415}
.note.ok{border-left-color:var(--grn);background:#101f18}
.note b{color:var(--ink)}

/* ---------- lab shell ---------- */
.lab{background:linear-gradient(180deg,#101a24,#0c141c);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.lab-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 16px;background:#0d161f;border-bottom:1px solid var(--line-soft);
}
.lab-head .t{display:flex;align-items:center;gap:9px;font-weight:650;font-size:.92rem}
.lab-head .t svg{opacity:.85}
.lab-body{padding:18px}
.lab-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.lab-cols.wide-left{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}

.ctrl{margin-bottom:14px}
.ctrl label{display:flex;justify-content:space-between;align-items:baseline;font-size:.79rem;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.ctrl label .v{font-family:var(--mono);color:var(--ink);font-size:.86rem;background:#182430;padding:1px 7px;border-radius:5px;border:1px solid var(--line-soft)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;
  background:#22303e;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--tp);cursor:pointer;border:2px solid #0e151d;box-shadow:0 0 0 1px var(--tp);
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--tp);cursor:pointer;border:2px solid #0e151d;
}
input[type=text],input[type=number],select,textarea{
  width:100%;background:#0c141d;border:1px solid var(--line);border-radius:7px;
  padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:.88rem;
}
input:focus,select,textarea:focus{outline:2px solid rgba(56,198,217,.4);outline-offset:-1px}
textarea{font-family:var(--sans);line-height:1.6;resize:vertical;min-height:120px}
select{font-family:var(--sans)}

.seg{display:flex;gap:4px;background:#0d161f;padding:4px;border-radius:9px;border:1px solid var(--line-soft);flex-wrap:wrap}
.seg button{
  flex:1;min-width:62px;background:transparent;border:0;border-radius:6px;padding:7px 8px;
  font-size:.79rem;color:var(--ink-2);cursor:pointer;font-weight:600;transition:.12s;
}
.seg button:hover{background:#182432;color:var(--ink)}
.seg button.on{background:var(--tp);color:#fff}

/* input toggles (logic switches) */
.switches{display:flex;gap:10px;flex-wrap:wrap}
.sw{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:#0d161f;border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;
  min-width:66px;transition:.13s;user-select:none;
}
.sw:hover{border-color:#33506b}
.sw .nm{font-size:.72rem;color:var(--ink-3);font-weight:700;letter-spacing:.05em}
.sw .lamp{
  width:30px;height:30px;border-radius:50%;background:#16212c;border:2px solid #24313d;
  display:grid;place-items:center;font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--ink-3);
  transition:.16s;
}
.sw.on .lamp{background:rgba(58,214,139,.2);border-color:var(--grn);color:var(--grn);box-shadow:0 0 12px rgba(58,214,139,.35)}
.sw.out{cursor:default}
.sw.out.on .lamp{background:rgba(245,180,49,.2);border-color:var(--amb);color:var(--amb);box-shadow:0 0 14px rgba(245,180,49,.4)}

/* truth table */
table.tt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.85rem}
table.tt th,table.tt td{border:1px solid var(--line-soft);padding:6px 10px;text-align:center}
table.tt th{background:#16212c;color:var(--ink-2);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-family:var(--sans);font-weight:700}
table.tt td.out{color:var(--amb);font-weight:700}
table.tt tr.hi td{background:rgba(224,43,60,.14);outline:1px solid rgba(224,43,60,.45)}
table.tt tr.hi td.out{color:#ff9a5c}

/* readouts */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px}
.ro{background:#0d161f;border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px}
.ro .k{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:3px}
.ro .v{font-family:var(--mono);font-size:1.02rem;color:var(--ink);word-break:break-all}
.ro.hl .v{color:var(--amb)}
.ro.g .v{color:var(--grn)}
.ro.c .v{color:var(--cyn)}

svg.viz{display:block;width:100%;height:auto;background:#0a1119;border:1px solid var(--line-soft);border-radius:9px}

/* bit boxes */
.bits{display:flex;gap:6px;flex-wrap:wrap}
.bit{
  width:46px;text-align:center;background:#0d161f;border:1px solid var(--line);border-radius:8px;
  padding:7px 0 5px;cursor:pointer;transition:.12s;user-select:none;
}
.bit:hover{border-color:#3a5b78}
.bit .b{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--ink-3);line-height:1.1}
.bit.on{background:rgba(224,43,60,.14);border-color:var(--tp)}
.bit.on .b{color:#ff8b8b}
.bit .w{font-size:.6rem;color:var(--ink-3);font-family:var(--mono);margin-top:2px}
.bit.on .w{color:var(--amb)}
.bit.flip{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}

/* q&a */
.q{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:15px 17px;margin-bottom:12px}
.q .stem{font-weight:600;margin-bottom:11px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;align-items:flex-start;gap:10px;background:#0e1720;border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;cursor:pointer;transition:.12s;font-size:.89rem;
}
.opt:hover{border-color:#3a5b78;background:#122030}
.opt .k{
  width:20px;height:20px;flex:0 0 20px;border-radius:5px;background:#1b2836;border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;color:var(--ink-3);font-weight:700;
}
.opt.sel{border-color:var(--cyn);background:#0f1e26}
.opt.sel .k{background:var(--cyn);color:#04141a;border-color:transparent}
.opt.right{border-color:var(--grn);background:#0e1e17}
.opt.right .k{background:var(--grn);color:#052014;border-color:transparent}
.opt.wrong{border-color:var(--red);background:#1e1315}
.opt.wrong .k{background:var(--red);color:#2a0b0c;border-color:transparent}
.opt.locked{cursor:default}
.fb{margin-top:11px;font-size:.86rem;padding:10px 13px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.good{background:#0e1e17;border:1px solid rgba(58,214,139,.3)}
.fb.bad{background:#1e1315;border:1px solid rgba(255,90,95,.3)}

/* stepper */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;padding-bottom:14px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:1px;background:var(--line)}
.step .n{
  width:23px;height:23px;flex:0 0 23px;border-radius:50%;background:#1b2836;border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;color:var(--ink-2);z-index:1;
}
.step.done .n{background:var(--grn);color:#052014;border-color:transparent}
.step .c{flex:1;font-size:.88rem;padding-top:1px}

/* tier banner */
.tier-banner{
  display:flex;align-items:center;gap:14px;padding:13px 17px;border-radius:10px;margin-bottom:16px;
  background:linear-gradient(90deg,#131f2b,#101820);border:1px solid var(--line);
}
.tier-banner .ic{
  width:36px;height:36px;flex:0 0 36px;border-radius:9px;display:grid;place-items:center;font-size:1.05rem;font-weight:800;
}
.tb-foundation .ic{background:rgba(56,198,217,.16);color:var(--cyn)}
.tb-developing .ic{background:rgba(245,180,49,.16);color:var(--amb)}
.tb-proficient .ic{background:rgba(58,214,139,.16);color:var(--grn)}
.tier-banner .tx{flex:1;min-width:0}
.tier-banner .tx b{display:block;font-size:.92rem}
.tier-banner .tx span{font-size:.79rem;color:var(--ink-2)}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:.87rem;cursor:pointer}
.chk .box{
  width:19px;height:19px;flex:0 0 19px;border-radius:5px;border:1px solid var(--line);background:#0e1720;
  display:grid;place-items:center;font-size:.72rem;color:transparent;transition:.12s;margin-top:1px;
}
.chk.on .box{background:var(--grn);border-color:var(--grn);color:#052014}

/* module footer nav */
.modfoot{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft)}

/* summary print */
.sum-block{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.sum-block h4{margin:0 0 8px;font-size:.95rem;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:.86rem}
.kv .k{color:var(--ink-3)}
.quoted{background:#0d151d;border-left:3px solid var(--vio);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.87rem;white-space:pre-wrap;color:var(--ink-2)}

/* misc */
.badge-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.hidden{display:none !important}
.center{text-align:center}
.stack>*+*{margin-top:12px}
ul.tick{list-style:none;padding:0;margin:0}
ul.tick li{padding-left:22px;position:relative;margin-bottom:7px;font-size:.88rem}
ul.tick li::before{content:"▸";position:absolute;left:4px;color:var(--tp);font-size:.8rem}
ul.plain{margin:0 0 .8em;padding-left:20px}
ul.plain li{margin-bottom:5px;font-size:.89rem}

.hero{
  background:linear-gradient(135deg,#16232f 0%,#101820 60%);
  border:1px solid var(--line);border-radius:14px;padding:28px 30px;margin-bottom:18px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(224,43,60,.16),transparent 68%);
}
.hero h1{font-size:1.75rem;margin-bottom:8px;position:relative}
.hero p{max-width:640px;position:relative;color:var(--ink-2)}

.mod-card{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:11px;padding:15px 16px;
  cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;
}
.mod-card:hover{border-color:#33506b;background:var(--panel-2);transform:translateY(-1px)}
.mod-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mod-card .idx{font-family:var(--mono);font-size:.7rem;color:var(--ink-3)}
.mod-card b{font-size:.94rem}
.mod-card p{font-size:.8rem;color:var(--ink-3);margin:0}

@media (max-width:1080px){
  .lab-cols,.lab-cols.wide-left,.split{grid-template-columns:1fr}
  .g2,.g3{grid-template-columns:1fr}
}
@media (max-width:820px){
  .rail{position:fixed;left:-262px;z-index:60;transition:left .2s;box-shadow:var(--shadow)}
  .rail.open{left:0}
  .menu-btn{display:inline-flex !important}
  .view{padding:18px 16px}
}
.menu-btn{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#182432;border:1px solid var(--line);cursor:pointer}

@media print{
  .rail,.topbar,.modfoot,.no-print{display:none !important}
  body{background:#fff;color:#111}
  .sum-block,.card{background:#fff;border:1px solid #ccc;color:#111;break-inside:avoid}
  .quoted{background:#f5f5f5;color:#222}
  .kv .k{color:#555}
}
</style>
</head>
<body>
<div class="app">

  <!-- ================= RAIL ================= -->
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="brand">
        <div class="brand-mark">TP</div>
        <div class="brand-txt">School of Engineering</div>
      </div>
      <div class="rail-title">Topic 3 · Logic Circuits &amp; Data Converters</div>
      <div class="rail-sub">Interactive Learning Bay</div>
    </div>
    <nav class="rail-nav" id="railNav"></nav>
    <div class="rail-foot">
      <div class="progress-wrap">
        <div class="progress-line"><span>Topic progress</span><span id="progPct">0%</span></div>
        <div class="bar"><i id="progBar" style="width:0%"></i></div>
      </div>
      <button class="ghost-btn" id="resetBtn">Reset my progress</button>
    </div>
  </aside>

function clone(o){ return JSON.parse(JSON.stringify(o)); }

function load(){
  try{

}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch(e){ /* non-fatal: session continues in memory */ }
}
function resetAll(){
  S = clone(BLANK);
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}

}

function prog(id){
  if(!S.progress[id]) S.progress[id] = {concept:false,lab:false,practice:false,feynman:false};

   2 · SMALL DOM HELPERS
   ============================================================ */
const $  = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
function el(tag, attrs, html){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(attrs[k]===undefined || attrs[k]===null) continue;
    if(k==="class") n.className = attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  if(html!=null) n.innerHTML = html;
  return n;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

      }});
      b.innerHTML = `<span class="k">${"ABC"[oi]}</span><span>${o}</span>`;

function scoreDiagnostic(){
  const byMod = {};
  DIAG.forEach(q=>{
    if(!byMod[q.mod]) byMod[q.mod] = {right:0, total:0, wrong:[]};
    byMod[q.mod].total++;
    if(S.diagAnswers[q.id]===q.ans) byMod[q.mod].right++;
    else byMod[q.mod].wrong.push(q);
  });
  MODULES.forEach(m=>{
    const r = byMod[m.id] ? byMod[m.id].right : 0;
    S.tiers[m.id] = r===2 ? "proficient" : (r===1 ? "developing" : "foundation");
  });
  S.diagnosticDone = true;
  save();
  showDiagResult(byMod);
}

m1:{
 takeaways:[

   <p>Every number system works the same way. The only thing that changes is <b>how many digits you have
   before you run out and have to carry</b>. That count is the <b>base</b>.</p>
   <ul class="plain">
     <li><b>Decimal (base 10)</b> &mdash; digits 0&ndash;9. After 9 you carry: 10.</li>
     <li><b>Binary (base 2)</b> &mdash; digits 0 and 1 only. This is all a logic circuit can hold: a voltage is either HIGH or LOW.</li>
     <li><b>Octal (base 8)</b> &mdash; digits 0&ndash;7. There is no such thing as an 8 or a 9.</li>
     <li><b>Hexadecimal (base 16)</b> &mdash; digits 0&ndash;9 then A=10, B=11, C=12, D=13, E=14, F=15.</li>
     <li><b>BCD</b> &mdash; not really a base. Each decimal digit is written as its own group of 4 bits.</li>
   </ul>
   <div class="note"><b>Worked example &mdash; binary to decimal.</b> Take 1101<sub>2</sub>.
   Write the weight above each bit, starting at 2<sup>0</sup> on the right:<br>
   <span class="mono">weights: 2&sup3; 2&sup2; 2&sup1; 2&#8304; &nbsp;&rarr;&nbsp; 8 4 2 1</span><br>
   <span class="mono">bits:&nbsp;&nbsp;&nbsp;&nbsp; 1&nbsp;&nbsp; 1&nbsp;&nbsp; 0&nbsp;&nbsp; 1</span><br>
   Add the weights wherever the bit is a 1: 8 + 4 + 0 + 1 = <b>13</b><sub>10</sub>. Ignore the columns holding 0.</div>
   <div class="note"><b>Worked example &mdash; decimal to octal.</b> Convert 486<sub>10</sub> by <b>repeated division by 8</b>:<br>
   <span class="mono">486 &divide; 8 = 60 remainder <b>6</b> &nbsp;&larr; LSD</span><br>
   <span class="mono">&nbsp;60 &divide; 8 = &nbsp;7 remainder <b>4</b></span><br>
   <span class="mono">&nbsp;&nbsp;7 &divide; 8 = &nbsp;0 remainder <b>7</b> &nbsp;&larr; MSD</span><br>
   Now read the remainders <b>upwards</b>: 486<sub>10</sub> = <b>746</b><sub>8</sub>.</div>
   <p>The one that catches people out is <b>BCD</b>. In BCD you never convert the whole number &mdash; you convert
   each decimal digit on its own into 4 bits. So 85 becomes 8 &rarr; 1000 and 5 &rarr; 0101, giving 1000 0101.
   If you read that same pattern as ordinary binary you would get 133, which is wrong. Always check which one you have been given.</p>`,

     <li><b>Octal in avionics.</b> ARINC 429 label fields are conventionally written in octal &mdash; 8 bits of label
     collapse neatly into three octal digits for the interface control document. A transponder squawk is four octal
     digits, which is why you can select 7700 but never 7800: the digit 8 does not exist in base 8.</li>
     <li><b>Hex in maintenance.</b> Memory dumps, fault codes and BITE data come out in hex because one hex digit maps
     exactly to one nibble, so a byte is always two characters wide &mdash; easy to read across a column on a printout.</li>
     <li><b>BCD in data buses.</b> ARINC 429 defines BCD data words precisely because the destination is a
     <b>display</b>. Sending altitude as BCD means the display driver needs no conversion arithmetic, which removes a
     rounding-error path &mdash; at the cost of wasted code space and reduced resolution for the same word length.</li>
   </ul>
   <div class="note"><b>Resolution argument.</b> A 4-digit BCD field uses 16 bits to represent 0&ndash;9999.
   The same 16 bits as pure binary represents 0&ndash;65535. BCD throws away roughly 84% of the code space to buy
   display convenience. When you see a system with a strangely coarse least-significant digit, this trade is often why.</div>
   <p><b>Transfer task:</b> a maintenance manual quotes a discrete word as <span class="mono">0xA7</span>. Express it in
   binary, in octal, and say what its value would be if the same 8 bits had instead been transmitted as two BCD digits.
   (Hint: one of those three answers does not exist.)</p>`
 },

/* ---------------- MODULE 2 · WAVEFORMS & TIMING ---------------- */
m2:{
 takeaways:[
  "A digital waveform is a voltage that switches between two states: HIGH (logic 1) and LOW (logic 0).",
  "Period T is the time for one complete cycle; pulse width t_w is the time spent HIGH in that cycle.",
  "Frequency f = 1/T, measured in hertz. A 50 Hz waveform has a period of 20 ms.",
  "Duty cycle = (t_w / T) x 100%. It says what fraction of each cycle is HIGH.",
  "A timing diagram shows two or more waveforms on a shared time axis so their relationship is visible."
 ],
 concept:{
  foundation:`
   <p>An analogue signal can sit at any voltage. A <b>digital</b> signal is only ever allowed to be one of two
   things: <b>HIGH</b> (logic 1) or <b>LOW</b> (logic 0). Drawn against time, that gives the familiar square shape.</p>
   <ul class="plain">
     <li><b>Period (T)</b> &mdash; the time taken for one complete cycle, measured in seconds. Measure it from one
     rising edge to the <i>next</i> rising edge.</li>
     <li><b>Pulse width (t<sub>w</sub>)</b> &mdash; how long the signal stays HIGH within that one cycle.</li>
     <li><b>Frequency (f)</b> &mdash; how many cycles happen per second, in hertz (Hz). It is simply <b>f = 1/T</b>.</li>
     <li><b>Duty cycle</b> &mdash; what percentage of the cycle is HIGH: <b>(t<sub>w</sub> / T) &times; 100%</b>.</li>
   </ul>
   <div class="note"><b>Worked example.</b> A waveform is HIGH for 5 ms then LOW for 15 ms, over and over.<br>
   Period T = 5 + 15 = <b>20 ms</b> = 0.02 s.<br>
   Frequency f = 1/T = 1/0.02 = <b>50 Hz</b>.<br>
   Duty cycle = (5/20) &times; 100 = <b>25%</b>.<br>
   Notice you needed both the HIGH time and the LOW time to get T. A common slip is to use only t<sub>w</sub>.</div>
   <p>A <b>timing diagram</b> simply stacks two or more of these waveforms on the same time axis. That is how you see
   whether signal B goes HIGH before, during, or after signal A &mdash; which is exactly what you need when you are
   fault-finding a circuit that only misbehaves at a certain moment.</p>`,

  developing:`
   <p>The three quantities are locked together. Change one and you must say what happened to the other two.</p>
   <div class="note"><b>Two independent knobs.</b> A waveform has only <b>two</b> free parameters: period and pulse width.
   Frequency is fixed once you choose the period. Duty cycle is fixed once you choose both. So:
   <ul class="plain" style="margin:8px 0 0">
     <li>Halve T at constant t<sub>w</sub> &rarr; frequency doubles <b>and</b> duty cycle doubles.</li>
     <li>Halve t<sub>w</sub> at constant T &rarr; frequency unchanged, duty cycle halves.</li>
   </ul></div>
   <p>Duty cycle carries information independently of frequency, which is the whole basis of <b>pulse width
   modulation</b>. A valve, a lamp dimmer or a motor speed controller can be driven with a fixed frequency and a
   varying duty cycle: the average delivered power tracks the duty cycle, while the switching frequency stays where
   the hardware wants it.</p>
   <p>Average voltage of an ideal rectangular waveform = duty cycle &times; V<sub>HIGH</sub>. A 5 V signal at
   30% duty has an average of 1.5 V &mdash; which is what a meter on DC average would show you, and why a meter
   reading alone can mislead you about a digital line.</p>
   <div class="note warn"><b>Watch the units.</b> f = 1/T needs T in <b>seconds</b>. 20 ms is 0.02 s, not 20.
   Getting 0.05 Hz instead of 50 Hz is almost always this mistake.</div>`,

  proficient:`
   <p>Beyond the arithmetic, timing parameters are where real digital faults live.</p>
   <ul class="plain">
     <li><b>Edges, not levels, carry the timing.</b> Clocked logic samples on a rising or falling edge. A signal with
     the correct duty cycle but a slow, degraded edge can still fail, because the receiving device never sees a clean
     transition through its threshold band.</li>
     <li><b>Duty cycle distortion.</b> Long cable runs, capacitive loading and mismatched thresholds stretch one state
     at the expense of the other. The frequency is untouched, so a frequency counter says the line is fine while the
     data is corrupt. Only a scope showing t<sub>w</sub> against T reveals it.</li>
     <li><b>Bit rate versus frequency.</b> ARINC 429 runs at 12.5 kbps (low speed) or 100 kbps (high speed). Bit rate
     is not the same as clock frequency once encoding is applied &mdash; a bipolar return-to-zero scheme returns to a
     null state within every bit time, so the line contains transitions at a higher rate than the data rate.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A PWM-driven valve is specified as 400 Hz, 35% duty. During test, a scope
   shows t<sub>w</sub> = 0.875 ms and T = 2.5 ms. Is the valve command correct? Work out both parameters before you
   answer, then say what a frequency counter alone would have told you.</div>`
 },
 practice:{
  foundation:[
   {id:"m2f1",stem:"A waveform has a period of 4 ms. What is its frequency?",opts:["4 Hz","250 Hz","400 Hz"],ans:1,
    why:"f = 1/T = 1/0.004 s = 250 Hz. Convert milliseconds to seconds first.",
    mis:"Using T in milliseconds instead of seconds in f = 1/T."},
   {id:"m2f2",stem:"A signal is HIGH for 2 ms and LOW for 6 ms. What is its duty cycle?",opts:["25%","33%","75%"],ans:0,
    why:"T = 2 + 6 = 8 ms, so duty = (2/8) x 100 = 25%.",
    mis:"Dividing HIGH time by LOW time instead of by the full period."},
   {id:"m2f3",stem:"What is the period of a 50 Hz rectangular waveform?",opts:["10 ms","20 ms","30 ms"],ans:1,
    why:"T = 1/f = 1/50 = 0.02 s = 20 ms.",
    mis:"Confusing the reciprocal relationship between period and frequency."}
  ],
  developing:[
   {id:"m2d1",stem:"The period is halved while the pulse width stays the same. What happens?",
    opts:["Frequency doubles, duty cycle doubles","Frequency doubles, duty cycle unchanged","Frequency halves, duty cycle doubles"],ans:0,
    why:"f = 1/T so halving T doubles f. Duty = t_w/T, and with t_w fixed and T halved the ratio doubles.",
    mis:"Treating duty cycle as independent of the period."},
   {id:"m2d2",stem:"A 5 V digital line runs at 40% duty cycle. A DC meter reading average would show approximately:",
    opts:["5.0 V","2.0 V","0.4 V"],ans:1,
    why:"Average = duty x V_HIGH = 0.40 x 5 = 2.0 V. This is why a multimeter alone can badly mislead you on a digital line.",
    mis:"Expecting a meter to show the HIGH level of a switching signal."},
   {id:"m2d3",stem:"A PWM valve driver is set to 400 Hz. To command 35% open, the pulse width must be:",
    opts:["0.35 ms","0.875 ms","1.4 ms"],ans:1,
    why:"T = 1/400 = 2.5 ms. t_w = 0.35 x 2.5 = 0.875 ms.",
    mis:"Reading duty cycle as an absolute time rather than a fraction of the period."}
  ],
  proficient:[
   {id:"m2p1",stem:"A frequency counter on a suspect data line reads exactly the specified frequency, yet the receiving LRU rejects the data. The most likely timing cause is:",
    opts:["The period is wrong","Duty cycle distortion or degraded edges the counter cannot see","The frequency counter is faulty"],ans:1,
    why:"A counter only measures how often transitions occur. Stretched states, slow edges or threshold problems leave the frequency intact while corrupting the received bits.",
    mis:"Assuming a correct frequency reading proves a digital line is healthy."},
   {id:"m2p2",stem:"Two waveforms have identical frequency but different duty cycles. Which statement is true?",
    opts:["They deliver the same average power to a resistive load","They have the same period but different average voltages","They must have different periods"],ans:1,
    why:"Same frequency means same period by definition. Different duty cycles give different average voltages and therefore different average power.",
    mis:"Conflating frequency with delivered power."},
   {id:"m2p3",stem:"Why is a timing diagram more useful than two separate single-channel measurements when diagnosing a sequencing fault?",
    opts:["It shows the relative timing between the signals on one shared time axis","It is more accurate","It shows the voltage levels more precisely"],ans:0,
    why:"The fault is in the relationship, not in either signal alone. Only a shared time axis reveals which edge arrived first.",
    mis:"Trying to diagnose a sequencing problem from signals captured at different times."}
  ]
 },

/* ---------------- MODULE 3 · LOGIC GATES ---------------- */
m3:{
 takeaways:[
  "A logic gate is an electronic switching circuit whose output is decided entirely by its present inputs.",
  "AND (Y = A.B) is HIGH only when every input is HIGH; OR (Y = A+B) is HIGH when any input is HIGH.",
  "A bubble on the output means invert: NAND is AND then NOT, NOR is OR then NOT.",
  "XOR is HIGH when the inputs differ; XNOR is HIGH when the inputs are the same (an equality detector).",
  "Boolean addition is the OR operation and Boolean multiplication is the AND operation."
 ],
 concept:{
  foundation:`
   <p>A <b>logic gate</b> is an electronic switching device built from transistors. It has one or more inputs and one
   output, and that output is always at one of two voltage levels: HIGH (logic 1) or LOW (logic 0). For a given gate
   type, the output depends only on what the inputs are doing right now.</p>
   <p>Learn each gate as one sentence, and the truth table writes itself:</p>
   <ul class="plain">
     <li><b>NOT (inverter)</b> &mdash; one input. Output is the opposite. Y = <span style="text-decoration:overline">A</span></li>
     <li><b>AND</b> &mdash; output HIGH <b>only if all</b> inputs are HIGH. Y = A &middot; B</li>
     <li><b>OR</b> &mdash; output HIGH if <b>one or more</b> inputs are HIGH. Y = A + B</li>
     <li><b>NAND</b> &mdash; AND with the output inverted. Output LOW <b>only if all</b> inputs are HIGH.</li>
     <li><b>NOR</b> &mdash; OR with the output inverted. Output HIGH <b>only if all</b> inputs are LOW.</li>
     <li><b>XOR</b> &mdash; output HIGH if the inputs are <b>different</b>.</li>
     <li><b>XNOR</b> &mdash; output HIGH if the inputs are the <b>same</b>.</li>
   </ul>
   <div class="note"><b>Reading the symbol.</b> The <i>shape</i> tells you the base function: a flat-backed D is AND,
   a curved shield is OR, a triangle is a buffer or inverter. A small <b>bubble</b> on the output means
   &ldquo;then invert&rdquo;. So the AND shape plus a bubble is NAND. Two curved lines at the input of an OR shape means
   exclusive: XOR.</div>
   <div class="note warn"><b>Boolean addition is not ordinary addition.</b> In Boolean algebra 1 + 1 = 1, because
   &ldquo;+&rdquo; means OR, and OR asks only &ldquo;is at least one input HIGH?&rdquo;. There is no carry, because there
   is nowhere for a carry to go.</div>`,

  developing:`
   <p>Once you know the seven gates, work on the two skills that get tested: <b>reading a gate off a waveform</b>
   and <b>seeing the inversion relationships</b>.</p>
   <div class="note"><b>Identify a gate from its waveform.</b> Look only at the moments where A and B differ.
   <ul class="plain" style="margin:8px 0 0">
     <li>Output HIGH whenever they differ, LOW when they match &rarr; <b>XOR</b>.</li>
     <li>Output LOW only where both are HIGH &rarr; <b>NAND</b>.</li>
     <li>Output HIGH only where both are LOW &rarr; <b>NOR</b>.</li>
     <li>Output tracks HIGH whenever either is HIGH &rarr; <b>OR</b>.</li>
   </ul></div>
   <p><b>Inversion pairs.</b> NAND is the complement of AND, NOR of OR, XNOR of XOR. Every row of the truth table
   flips &mdash; not just some of them. That single fact halves the amount you have to memorise.</p>
   <p><b>XNOR as an equality detector.</b> Y = 1 when A = B. This is the gate used inside comparators: feed the two
   words in bit by bit and every XNOR must read 1 for the words to be identical. In BITE circuits that is how a
   channel-to-channel comparison is done.</p>
   <div class="note warn"><b>Common slip.</b> With three inputs, &ldquo;OR&rdquo; still means <i>one or more</i>, not
   <i>exactly one</i>. Exactly-one is a different function and is not a basic gate.</div>`,

  proficient:`
   <p>At this level the interesting questions are about <b>equivalence and implementation</b>, not about single gates.</p>
   <ul class="plain">
     <li><b>NAND and NOR are universal.</b> Any logic function can be built from NAND gates alone, or from NOR gates
     alone. A NAND with both inputs tied together is an inverter; a NAND followed by that inverter is an AND; and by
     De Morgan a NAND with both inputs inverted is an OR. This is why a board may carry rows of identical quad-NAND
     packages rather than a mixture of gate types &mdash; one part number, easier spares provisioning, and a spare gate
     is always available.</li>
     <li><b>De Morgan's theorems.</b>
     <span class="mono">NOT(A&middot;B) = NOT(A) + NOT(B)</span> and
     <span class="mono">NOT(A+B) = NOT(A) &middot; NOT(B)</span>. Practically: pushing a bubble through a gate changes
     its shape between AND and OR. This is how the same circuit gets redrawn in two different manuals and still be the
     same circuit &mdash; and it is how you recognise that an OR gate drawn with inverted inputs <i>is</i> a NAND.</li>
     <li><b>Active-low signalling.</b> Aircraft discretes are very often active-low, because a broken wire then reads
     as the safe inactive state. Once a signal is active-low, the gate that implements &ldquo;both conditions true&rdquo;
     on paper appears in the schematic as a NOR. Always establish the active sense before you name the gate.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> Show that a 2-input OR gate can be built from three NAND gates, and state
   which De Morgan identity you used. Then say what fails if one of the three gates is stuck HIGH.</div>`
 },
 practice:{
  foundation:[
   {id:"m3f1",stem:"For a 2-input AND gate with A = 1 and B = 0, the output Y is:",opts:["0","1","undefined"],ans:0,

    opts:["An AND gate","A NOR gate","An XOR gate"],ans:1,

    mis:"Naming a gate from the logical requirement without first establishing the active sense of the signals."}
  ]
 },

/* ---------------- MODULE 4 · AIRCRAFT LOGIC CIRCUITS ---------------- */
m4:{
 takeaways:[
  "Aircraft warning logic is written as a plain-English condition first, then translated gate by gate.",
  "'NOT' in the requirement becomes an inverter; 'AND' becomes an AND gate; 'ANY of' becomes an OR gate.",
  "Fire detection uses OR across loops so any single loop can raise the warning.",
  "Gear warning combines an inverted gear-down signal with a throttle-at-idle signal through an AND.",
  "Active-low signalling means a broken wire reads as the safe inactive state, which changes which gate appears on the schematic."
 ],
 concept:{
  foundation:`
   <p>Everything in this module is the same seven gates from Module 3. The only new skill is
   <b>translating a sentence into gates</b>. Do it one word at a time.</p>
   <div class="note"><b>The translation table.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li>&ldquo;<b>and</b>&rdquo; / &ldquo;both&rdquo; / &ldquo;at the same time&rdquo; &rarr; AND gate</li>
     <li>&ldquo;<b>or</b>&rdquo; / &ldquo;any of&rdquo; / &ldquo;one or more&rdquo; &rarr; OR gate</li>
     <li>&ldquo;<b>not</b>&rdquo; / &ldquo;is absent&rdquo; / &ldquo;fails to&rdquo; &rarr; NOT gate (inverter)</li>
   </ul></div>
   <p><b>Worked example &mdash; landing gear warning.</b> The requirement: <i>&ldquo;Sound the horn when the gear is
   NOT down AND the throttle IS at idle.&rdquo;</i></p>
   <div class="steps">
     <div class="step"><span class="n">1</span><span class="c">Identify the inputs: GEAR_DOWN (1 when locked down) and THROTTLE_IDLE (1 when at idle).</span></div>
     <div class="step"><span class="n">2</span><span class="c">&ldquo;NOT down&rdquo; &rarr; put an inverter on GEAR_DOWN. Now the line reads 1 when the gear is not down.</span></div>
     <div class="step"><span class="n">3</span><span class="c">&ldquo;AND&rdquo; &rarr; feed the inverted signal and THROTTLE_IDLE into an AND gate.</span></div>
     <div class="step"><span class="n">4</span><span class="c">The AND output drives the horn. It only sounds when both conditions hold together.</span></div>
   </div>
   <p>Notice why the AND matters: without it, the horn would sound every time the gear was up in the cruise, which
   would be useless. The throttle condition is what makes it a warning about <b>landing</b> rather than about flying.</p>`,

  developing:`
   <p>Two design patterns cover most aircraft warning logic. Learn to spot which one you are looking at.</p>
   <div class="note"><b>Pattern A &mdash; OR for detection.</b> Fire, smoke and overheat systems put multiple sensors or
   loops into an OR gate: <i>any</i> loop detecting fire must raise the warning. Missing a real fire is far worse than a
   spurious warning, so the logic is deliberately biased towards annunciating.</div>
   <div class="note"><b>Pattern B &mdash; AND for arming.</b> Configuration warnings (gear, flaps, spoilers,
   take-off configuration) put conditions into an AND gate so the warning only appears in the flight phase where it
   matters. Here a spurious warning during cruise would train crews to ignore the horn, so the logic is biased towards
   silence until the conditions line up.</div>
   <p><b>Dual-loop fire detection</b> is the interesting hybrid. Two loops are run in each zone. In <i>normal</i>
   operation both loops must agree &mdash; an AND &mdash; so a single loop failure cannot produce a false fire warning.
   If one loop is detected as failed, the system reconfigures to single-loop operation and reverts to OR. The gate
   arrangement is chosen to trade false alarms against missed detection, and the trade changes with the health of the system.</p>
   <div class="note warn"><b>Predict before you toggle.</b> In the lab below, decide what the annunciator should do
   <i>before</i> you flip the switch. Being wrong is the useful part &mdash; it shows you which term you misread.</div>`,

  proficient:`
   <p>At maintenance level the questions are about <b>failure behaviour</b>, not about the nominal truth table.</p>
   <ul class="plain">
     <li><b>Fail-safe sense.</b> Most aircraft discretes are active-low (ground-to-activate). An open circuit then
     floats to the inactive state, so a chafed wire produces no warning rather than a spurious one &mdash; or, in a
     detection circuit, the opposite is chosen deliberately so a break annunciates. Which way round it fails is a
     design decision you must read off the schematic, not assume.</li>
     <li><b>Latching.</b> A pure gate network is combinational: remove the condition and the warning disappears.
     Many warnings must <i>latch</i> so a transient event is not missed, which requires memory (a flip-flop) plus a
     reset path. If a warning you expect to be momentary stays on, look for the latch and its reset, not for a stuck gate.</li>
     <li><b>Voting.</b> Triple-channel systems use 2-out-of-3 voting: the warning is raised when any two of three
     channels agree. Expressed in gates that is (A&middot;B) + (B&middot;C) + (A&middot;C) &mdash; three ANDs into an OR.
     One failed channel cannot cause or suppress the warning, which is the entire point.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A take-off configuration warning must sound when: throttles are advanced AND
   (flaps are not in the take-off range OR the parking brake is set OR the trim is out of range). Draw the gate network,
   then state which single sensor failure would cause the warning to be missed entirely, and which would cause a nuisance warning.</div>`
 },

/* ---------------- MODULE 5 · DATA CONVERTERS ---------------- */
m5:{
 takeaways:[
  "The real world is analogue and continuous; digital computers only handle discrete 1s and 0s, so converters sit between them.",
  "A DAC divides its output range into steps: an n-bit DAC has 2^n - 1 steps, so an 8-bit DAC on 5 V steps about 19.6 mV at a time.",
  "Binary weighted ladder DACs are simplest but need many precise resistor values; R-2R needs only two values and is less noise-prone.",
  "An ADC samples the analogue signal in time and quantises it in amplitude; both introduce error.",
  "Ramp ADCs are slow and voltage-dependent, successive approximation is fast and fixed-time, integrating types are accurate and noise-immune but slow."
 ],
 concept:{
  foundation:`
   <p>A digital computer can only understand 1s and 0s, and it changes in <b>discrete steps</b>. The real world does
   not: temperature, pressure, control surface position and fuel quantity all vary <b>continuously</b>. So an interface
   is needed at each end of the computer.</p>
   <ul class="plain">
     <li><b>ADC (analogue to digital)</b> &mdash; takes the signal from a sensor and turns it into a digital word the
     computer can process. Sensors in, numbers out.</li>
     <li><b>DAC (digital to analogue)</b> &mdash; takes a digital word from the computer and produces an equivalent
     voltage or current to drive something. Numbers in, actuator out.</li>
   </ul>
   <div class="note"><b>How a DAC builds its output.</b> It divides the output range into a series of small, equal steps.
   How many steps you get depends on how many bits are in the data word:
   <br><br><span class="mono">number of steps = 2<sup>n</sup> &minus; 1</span>
   <br><span class="mono">step size = V<sub>ref</sub> &divide; (2<sup>n</sup> &minus; 1)</span><br><br>
   With 8 bits and a 5 V reference: 2<sup>8</sup> &minus; 1 = 255 steps, and each step is
   5 &divide; 255 &asymp; <b>0.0195 V</b>, which is the 19.5 mV you see on the staircase in your notes.</div>
   <p>Feed an 8-bit DAC from a counter and the output climbs one step at a time: 0 V, 0.0195 V, 0.0390 V, 0.0585 V and
   so on, up to 4.980 V at 1111 1111. That staircase <i>is</i> the DAC output. More bits means smaller steps and a
   smoother-looking result &mdash; it never becomes a true smooth line, it just gets finer.</p>`,

  developing:`
   <p>Concentrate on the two things you will be asked to compare: <b>DAC construction</b> and <b>ADC type selection</b>.</p>
   <div class="note"><b>Two DAC constructions.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Binary weighted ladder</b> &mdash; one resistor per bit, each half the value of the last (200k, 100k, 50k, 25k...).
     Simplest to understand, but for a wide word you need many <b>different, very precise</b> resistor values. Practically
     limited to about 8 bits, larger error, more susceptible to noise.</li>
     <li><b>R-2R ladder</b> &mdash; only <b>two</b> resistor values, repeated. Far easier to manufacture accurately,
     faster response, less prone to noise, so it is the one used in noisy environments &mdash; which describes an aircraft.</li>
   </ul></div>
   <div class="note"><b>Three ADC types.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>Ramp generation</b> &mdash; counts up until an internal ramp matches the input. Slow, and the conversion time
     <i>depends on the input voltage</i>: a larger voltage takes longer. Unsuitable for high speed.</li>
     <li><b>Successive approximation (SAR)</b> &mdash; a binary search. Tries the MSB, keeps or discards it, moves to the
     next bit. Fixed conversion time of one clock per bit, <b>independent of the analogue level</b>. This is the general workhorse.</li>
     <li><b>Integration type</b> &mdash; averages the input over a fixed window. High accuracy and excellent noise
     immunity because noise averages out, but slower than SAR.</li>
   </ul></div>
   <p>The ADC also introduces two distinct errors. <b>Sampling</b> chops the signal in time: sample too slowly and you
   reconstruct a completely wrong, lower-frequency signal (aliasing). <b>Quantising</b> chops it in amplitude: the value
   must be rounded to the nearest available step, leaving a quantisation error of up to half a step.</p>`,

  proficient:`
   <p>Converter specifications are where system-level performance is won or lost.</p>
   <ul class="plain">
     <li><b>Resolution is not accuracy.</b> Resolution is the step size set by the bit count. Accuracy is how close the
     output is to the true value, and it is limited by reference stability, linearity and offset. A 16-bit converter with a
     drifting reference is less accurate than a well-referenced 12-bit one, however impressive its resolution looks on paper.</li>
     <li><b>Nyquist and anti-aliasing.</b> Sample at more than twice the highest frequency present, or components above
     half the sampling rate fold back and appear as spurious low-frequency content that is indistinguishable from real data.
     Because you cannot remove it afterwards, an <b>analogue</b> anti-alias filter must sit ahead of the ADC. A vibration
     monitoring channel that is under-sampled will report a smooth, plausible, and entirely fictitious signal.</li>
     <li><b>Quantisation error.</b> Bounded at plus or minus half an LSB, and it behaves like added noise. Each extra
     bit halves the step and improves the signal-to-noise ratio by about 6 dB &mdash; the standard rule of thumb when
     someone asks whether a channel needs 12 or 14 bits.</li>
     <li><b>Why R-2R wins in practice.</b> Monolithic fabrication can match two resistor values to each other far better
     than it can hold eight absolute values to 0.1%. Matching, not absolute precision, is what an R-2R ladder needs, which
     is why it dominates despite being harder to explain.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A 12-bit ADC on a 10 V reference monitors a signal containing components up to
   2 kHz. State the step size, the minimum sampling rate, and what physically must be fitted ahead of the converter &mdash;
   and explain why increasing the bit count would not fix an aliasing problem.</div>`
 },

/* ---------------- MODULE 6 · PARITY ---------------- */
m6:{
 takeaways:[
  "A parity bit is one extra bit added to a data word so that the total number of 1s is made even or odd.",
  "Even parity: the generator sets the parity bit so the total count of 1s is even. Odd parity makes it odd.",
  "The receiver recounts the 1s. A mismatch means the data was corrupted in transit.",
  "Parity detects an error but cannot correct it, and cannot say which bit was wrong.",
  "Any even number of flipped bits cancels out and passes the check undetected. Parity is a cheap first line of defence, not a guarantee."
 ],
 concept:{
  foundation:`
   <p>Data travelling down a wire can be corrupted by noise: a bit that left as a 1 can arrive as a 0. <b>Parity</b>
   is the simplest way to notice that this has happened.</p>
   <div class="steps">
     <div class="step"><span class="n">1</span><span class="c">At the transmitter, a <b>parity generator</b> counts the 1s in the data.</span></div>
     <div class="step"><span class="n">2</span><span class="c">It sets one extra bit &mdash; the <b>parity bit</b> &mdash; so that the total count of 1s comes out even (even parity) or odd (odd parity), depending on the system.</span></div>
     <div class="step"><span class="n">3</span><span class="c">Data and parity bit travel together down the bus.</span></div>
     <div class="step"><span class="n">4</span><span class="c">At the receiver, a <b>parity checker</b> recounts. If the count no longer matches the rule, an error is flagged.</span></div>
   </div>
   <div class="note"><b>Worked example.</b> Data lines carry 1 1 1 1 1 1 &mdash; that is six 1s, already an even number.
   Under <b>even</b> parity the generator adds a <b>0</b>, leaving the total even. Under <b>odd</b> parity it must add a
   <b>1</b>, making seven 1s in total.</div>
   <div class="note warn"><b>The limitation you must remember.</b> A parity check tells the receiver that something is
   wrong. It does <b>not</b> tell it which bit is wrong, and it <b>cannot correct</b> the error. If the data is not time
   sensitive, the receiver can be designed to request a retransmission, and the retransmitted data goes through the
   parity check again.</div>`,

  developing:`
   <p>Parity is a single-bit summary of the data, so it can only ever tell you about the <b>parity of the number of
   errors</b>, not about their location or count.</p>
   <div class="note"><b>What parity catches and what it misses.</b>
   <ul class="plain" style="margin:8px 0 0">
     <li><b>1 bit flipped</b> &mdash; count changes parity &rarr; <b>detected</b>.</li>
     <li><b>2 bits flipped</b> &mdash; one goes up, one comes down, count parity is restored &rarr; <b>missed</b>.</li>
     <li><b>3 bits flipped</b> &mdash; detected. <b>4 bits</b> &mdash; missed. And so on.</li>
   </ul>
   Any <b>odd</b> number of errors is caught. Any <b>even</b> number is invisible.</div>
   <p>This matters more than it sounds, because real interference is often not a single tidy bit flip. A burst of noise
   from a nearby contactor or an intermittent shield can corrupt several adjacent bits at once, and a two-bit burst
   sails straight through a parity check looking perfectly healthy.</p>
   <p>The gate that implements parity is the <b>XOR</b>. Chain XORs across all the data bits and the result is 1 when the
   number of 1s is odd. That single output <i>is</i> the even-parity bit &mdash; which is why parity hardware is cheap and
   why it appears on so many buses.</p>
   <div class="note warn"><b>Detection is not protection.</b> Knowing data is bad is only useful if the system does
   something about it: request retransmission, discard the word, or flag the parameter invalid. On a time-critical
   parameter there may be no time to retransmit, so the word is simply discarded and the display goes blank or shows a
   fail flag &mdash; which is exactly the symptom you would be sent to investigate.</div>`,

  proficient:`
   <p>Parity is the cheapest point on a spectrum of error-control schemes. Know where it sits and why anyone still uses it.</p>
   <ul class="plain">
     <li><b>Overhead versus capability.</b> One parity bit on a 32-bit word is about 3% overhead and gives single-error
     detection only. ARINC 429 spends bit 32 of every word exactly this way, normally as odd parity. Cheap, fast to check
     in hardware, and adequate on a short, shielded, point-to-point twisted pair.</li>
     <li><b>Why not something stronger?</b> A CRC would detect burst errors far better, and an ECC scheme could correct
     them, but both cost bits, latency and gates. On a one-way broadcast bus that transmits the same parameter again a few
     milliseconds later, discarding a bad word costs almost nothing &mdash; the next update repairs the display. The design
     choice is driven by <b>refresh rate</b>, not by how clever the code is.</li>
     <li><b>Diagnostic value.</b> Occasional parity errors that clear themselves point to marginal signal quality:
     chafed shielding, a poor bond, a loose pin, or a nearby noise source. Persistent parity errors on one label point at
     the transmitting LRU. The pattern of the errors is more informative than any individual error.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A system reports intermittent parity errors on one ARINC 429 receiver only,
   worse during flap operation. Explain what parity can and cannot tell you here, and set out the reasoning that leads
   you from that symptom to a likely physical cause.</div>`
 },

function renderPractice(host, modId, qs){
  if(!S.practice[modId]) S.practice[modId] = {};
  const rec = S.practice[modId];

  qs.forEach((q,i)=>{
    const box = el("div",{class:"q"});
    box.appendChild(el("div",{class:"stem"}, `<span class="tiny muted">Question ${i+1}</span><br>${q.stem}`));
    const opts = el("div",{class:"opts"});
    const fb = el("div",{class:"fb"});

    const paint = ()=>{
      const r = rec[q.id];
      $$(".opt",opts).forEach((b,bi)=>{
        b.className = "opt locked";
        if(r){
          if(bi===q.ans) b.classList.add("right");
          else if(bi===r.choice) b.classList.add("wrong");
        }else{
          b.className = "opt";
        }
      });
      if(r){
        fb.className = "fb show "+(r.correct?"good":"bad");
        fb.innerHTML = (r.correct?"<b>Correct.</b> ":"<b>Not quite.</b> ")+q.why;
      }
    };

    q.opts.forEach((o,oi)=>{
      const b = el("button",{class:"opt", onclick:()=>{
        if(rec[q.id]) return;
        const ok = oi===q.ans;
        rec[q.id] = {choice:oi, correct:ok};
        if(!ok && q.mis) addMisconception(modId, q.mis);
        save();
        paint();
        if(qs.every(x=>rec[x.id])) markProg(modId,"practice");
      }});
      b.innerHTML = `<span class="k">${"ABC"[oi]}</span><span>${o}</span>`;
      opts.appendChild(b);
    });
    box.appendChild(opts);
    box.appendChild(fb);
    host.appendChild(box);
    paint();
  });

  const again = el("button",{class:"btn sec no-print", onclick:()=>{
    S.practice[modId] = {}; save(); host.innerHTML=""; renderPractice(host, modId, qs);
  }},"Clear my answers and try again");
  host.appendChild(el("div",{class:"btn-row", style:"margin-top:6px"})).appendChild(again);
}

/* ============================================================
   11 · FEYNMAN ENGINE
   ============================================================ */
function analyseFeynman(text, ideas){
  const t = " "+text.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ")+" ";
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const covered = [], missing = [];
  ideas.forEach(idea=>{
    const hit = idea.terms.some(term=> t.indexOf(" "+term.toLowerCase()) !== -1 || t.indexOf(term.toLowerCase()) !== -1);
    (hit?covered:missing).push(idea.k);
  });
  // sentence count as a rough proxy for whether it is an explanation or a label
  const sentences = (text.match(/[.!?]+/g)||[]).length;
  return {words, sentences, covered, missing, pct: Math.round(covered.length/ideas.length*100)};
}

function renderFeynman(modId, F){
  const card = el("div",{class:"card"});
  card.innerHTML = `<div class="card-h"><span class="dot"></span><h3>4 &middot; Explain it back (Feynman method)</h3></div>
    <p class="small muted">If you cannot explain it simply, you do not understand it yet. Write it as if the person in
    front of you has never seen this topic &mdash; no formulas you have not explained, no jargon you have not unpacked.</p>
    <div class="note">${F.prompt}</div>`;

  const ta = el("textarea",{placeholder:F.starter, id:"fey_"+modId});
  ta.value = S.feynman[modId] || "";
  card.appendChild(ta);

  const meta = el("div",{class:"small muted", style:"margin-top:6px"});
  const out = el("div",{style:"margin-top:14px"});

  const refresh = ()=>{
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    meta.textContent = n+" words"+(n<40?" — aim for roughly 60–120":"");
  };
  ta.addEventListener("input", refresh);
  refresh();
  card.appendChild(meta);

  const row = el("div",{class:"btn-row no-print", style:"margin-top:12px"});
  const chk = el("button",{class:"btn", onclick:()=>{
    const text = ta.value.trim();
    S.feynman[modId] = text; save();
    const a = analyseFeynman(text, F.ideas);
    S.feynmanScore[modId] = {covered:a.covered, missing:a.missing, words:a.words, pct:a.pct};
    save();
    out.innerHTML = "";

    if(a.words < 25){
      out.appendChild(el("div",{class:"note warn"},
        "<b>Too short to check.</b> A one-line answer is a label, not an explanation. Write it as you would say it out "+
        "loud to someone standing next to you &mdash; roughly 60 to 120 words."));
      return;
    }

    const head = el("div",{class:"note "+(a.pct>=80?"ok":(a.pct>=50?"warn":"err"))});
    head.innerHTML = `<b>${a.covered.length} of ${F.ideas.length} key ideas covered (${a.pct}%).</b> `+
      (a.pct>=80 ? "That is a solid explanation &mdash; someone could learn the idea from it."
       : a.pct>=50 ? "You have the shape of it. The gaps below are the parts your listener would still be confused about."
       : "Most of the key ideas are missing. Read the concept section again, then rewrite &mdash; do not just add the words in.");
    out.appendChild(head);

    const g = el("div",{class:"grid g2"});
    const cvd = el("div");
    cvd.innerHTML = `<div class="eyebrow">You covered</div>`+
      (a.covered.length? "<ul class='tick'>"+a.covered.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"
                       : "<p class='small muted'>Nothing yet.</p>");
    const mis = el("div");
    mis.innerHTML = `<div class="eyebrow">Still missing</div>`+
      (a.missing.length? "<ul class='tick'>"+a.missing.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"
                       : "<p class='small muted'>Nothing &mdash; all key ideas present.</p>");
    g.appendChild(cvd); g.appendChild(mis);
    out.appendChild(g);

    out.appendChild(el("div",{class:"note small"},
      "<b>Careful:</b> this check looks for the ideas, not for the exact words. Dropping a missing keyword into your "+
      "text will tick the box without teaching anyone anything. Rewrite the sentence so the idea is actually explained."));

    markProg(modId,"feynman");
  }},"Check my explanation");
  row.appendChild(chk);
  row.appendChild(el("button",{class:"btn sec", onclick:()=>{ ta.value=""; refresh(); out.innerHTML=""; }},"Clear"));
  card.appendChild(row);
  card.appendChild(out);
  return card;
}

/* square-wave path builder: pts = array of 0/1, drawn across w */
function wavePath(pts, x0, w, yHi, yLo){
  const dx = w/pts.length;
  let d = "", cy = pts[0]?yHi:yLo;
  d += "M"+x0+","+cy;
  for(let i=0;i<pts.length;i++){
    const y = pts[i]?yHi:yLo;
    if(y!==cy){ d += " L"+(x0+i*dx)+","+y; cy=y; }
    d += " L"+(x0+(i+1)*dx)+","+y;
  }
  return d;
}

/* gate glyph + wiring, returns SVG markup string */
function gateSVG(type, a, b, y, labels){
  const L = labels || {a:"A", b:"B", y:"Y"};
  const one = (type==="NOT");
  const col = v => v ? HI : LO;
  const shapes = {
    AND:'<path d="M30,15 L55,15 A25,25 0 0 1 55,65 L30,65 Z"/>',
    NAND:'<path d="M30,15 L55,15 A25,25 0 0 1 55,65 L30,65 Z"/><circle cx="85" cy="40" r="5"/>',
    OR:'<path d="M28,15 Q52,40 28,65 Q70,65 82,40 Q70,15 28,15 Z"/>',
    NOR:'<path d="M28,15 Q52,40 28,65 Q70,65 82,40 Q70,15 28,15 Z"/><circle cx="87" cy="40" r="5"/>',
    XOR:'<path d="M28,15 Q52,40 28,65 Q70,65 82,40 Q70,15 28,15 Z"/><path d="M19,15 Q43,40 19,65" fill="none"/>',
    XNOR:'<path d="M28,15 Q52,40 28,65 Q70,65 82,40 Q70,15 28,15 Z"/><path d="M19,15 Q43,40 19,65" fill="none"/><circle cx="87" cy="40" r="5"/>',
    NOT:'<path d="M32,16 L76,40 L32,64 Z"/><circle cx="81" cy="40" r="5"/>'
  };
  const outX = (type==="NAND")?90:(type==="NOR"||type==="XNOR")?92:(type==="NOT")?86:(type==="OR"||type==="XOR")?82:80;
  const inX  = (type==="XOR"||type==="XNOR")?19:(type==="OR"||type==="NOR")?28:(type==="NOT")?32:30;

  const K = 44;   // left gutter reserved for input labels
  let wires = "";
  if(one){
    wires = `<line x1="${K}" y1="40" x2="${K+inX}" y2="40" stroke="${col(a)}" stroke-width="2.5"/>
             <text x="2" y="37" class="lbl">${L.a}</text>
             <text x="16" y="38" class="val" fill="${col(a)}">${a?1:0}</text>`;
  }else{
    wires = `<line x1="${K}" y1="28" x2="${K+inX+4}" y2="28" stroke="${col(a)}" stroke-width="2.5"/>
             <line x1="${K}" y1="52" x2="${K+inX+4}" y2="52" stroke="${col(b)}" stroke-width="2.5"/>
             <text x="2" y="31" class="lbl">${L.a}</text>
             <text x="16" y="32" class="val" fill="${col(a)}">${a?1:0}</text>
             <text x="2" y="55" class="lbl">${L.b}</text>
             <text x="16" y="56" class="val" fill="${col(b)}">${b?1:0}</text>`;
  }
  return `<svg class="viz" style="max-width:340px;margin:0 auto" viewBox="0 0 200 80" role="img" aria-label="${type} gate">
    <style>
      .gsym{fill:#16222e;stroke:#7d94a8;stroke-width:2}
      .lbl{fill:#8fa3b5;font:600 10px system-ui;letter-spacing:.06em}
      .val{font:700 11px ui-monospace,monospace}
    </style>
    ${wires}
    <g class="gsym" transform="translate(${K},0)">${shapes[type]}</g>
    <line x1="${K+outX}" y1="40" x2="${174}" y2="40" stroke="${col(y)}" stroke-width="2.5"/>
    <circle cx="180" cy="40" r="7" fill="${y?'rgba(58,214,139,.25)':'#16212c'}" stroke="${col(y)}" stroke-width="2"/>
    <text x="176.5" y="44" class="val" fill="${col(y)}">${y?1:0}</text>
    <text x="176" y="24" class="lbl">${L.y}</text>
  </svg>`;
}

function switchEl(name, on, onclick, isOut){
  const s = el("div",{class:"sw"+(on?" on":"")+(isOut?" out":""), onclick:isOut?null:onclick});
  s.innerHTML = `<span class="nm">${name}</span><span class="lamp">${on?1:0}</span>`;
  return s;
}

const GATE_FN = {
  NOT:(a)=>a?0:1,
  AND:(a,b)=>(a&&b)?1:0,
  OR:(a,b)=>(a||b)?1:0,
  NAND:(a,b)=>(a&&b)?0:1,
  NOR:(a,b)=>(a||b)?0:1,
  XOR:(a,b)=>(a!==b)?1:0,
  XNOR:(a,b)=>(a===b)?1:0
};
const GATE_EXPR = {
  NOT:"Y = <span style='text-decoration:overline'>A</span>",
  AND:"Y = A &middot; B",
  OR:"Y = A + B",
  NAND:"Y = <span style='text-decoration:overline'>A &middot; B</span>",
  NOR:"Y = <span style='text-decoration:overline'>A + B</span>",
  XOR:"Y = A &oplus; B",
  XNOR:"Y = <span style='text-decoration:overline'>A &oplus; B</span>"
};
const GATE_RULE = {
  NOT:"Output is the opposite of the input.",
  AND:"Output is HIGH only if ALL inputs are HIGH.",
  OR:"Output is HIGH if ONE OR MORE inputs are HIGH.",
  NAND:"Output is LOW only if ALL inputs are HIGH.",
  NOR:"Output is HIGH only if ALL inputs are LOW.",
  XOR:"Output is HIGH if the inputs are DIFFERENT.",
  XNOR:"Output is HIGH if the inputs are the SAME."
};
