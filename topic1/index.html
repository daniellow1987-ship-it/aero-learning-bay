<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Topic 1 — Semiconductors, Integrated Circuits &amp; PCB | Interactive Learning Bay</title>
<style>
/* ============================================================
   Topic 1 — Semiconductors: Diodes, Transistors, ICs & PCB
   Interactive learning environment · Temasek Polytechnic
   Self-contained: no external fonts, scripts, styles or images.
   ============================================================ */

:root{
  --bg:#080d13;
  --bg-2:#0e151d;
  --panel:#121b25;
  --panel-2:#17222e;
  --panel-3:#1d2b39;
  --line:#26384a;
  --line-soft:#1c2937;
  --ink:#e3edf6;
  --ink-2:#a8bccd;
  --ink-3:#6f8598;
  --tp:#e02b3c;
  --tp-deep:#a8121f;
  --grn:#3ad68b;
  --amb:#f5b431;
  --red:#ff5a5f;
  --cyn:#38c6d9;
  --vio:#9b8cff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:
    radial-gradient(1200px 700px at 78% -10%, #16283a 0%, transparent 60%),
    radial-gradient(900px 600px at 0% 100%, #14202c 0%, transparent 55%),
    var(--bg);
  color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0 0 .5em;line-height:1.25;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1.02rem}h4{font-size:.9rem}
p{margin:0 0 .85em}
a{color:var(--cyn)}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono)}

/* ---------- app frame ---------- */
.app{display:flex;min-height:100vh}

/* ---------- rail ---------- */
.rail{
  width:262px;flex:0 0 262px;background:linear-gradient(180deg,#0d141c,#0a1018);
  border-right:1px solid var(--line-soft);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.rail-head{padding:18px 18px 14px;border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.brand-mark{
  width:26px;height:26px;border-radius:6px;flex:0 0 26px;
  background:linear-gradient(145deg,var(--tp),var(--tp-deep));
  display:grid;place-items:center;font-weight:800;font-size:.72rem;color:#fff;letter-spacing:.02em;
}
.brand-txt{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.rail-title{font-size:.98rem;font-weight:650;line-height:1.3}
.rail-sub{font-size:.72rem;color:var(--ink-3);margin-top:3px}

.rail-nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav-label{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:10px 8px 6px;font-weight:700}
.nav-item{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;border-radius:8px;
  padding:8px 9px;margin-bottom:2px;cursor:pointer;color:var(--ink-2);
  font-size:.845rem;transition:background .13s,color .13s,border-color .13s;
}
.nav-item:hover{background:#141f2b;color:var(--ink)}
.nav-item.active{background:#182739;border-color:#2b4560;color:#fff;font-weight:600}
.nav-num{
  width:21px;height:21px;flex:0 0 21px;border-radius:5px;background:#1b2836;
  display:grid;place-items:center;font-size:.68rem;font-family:var(--mono);color:var(--ink-3);
  border:1px solid var(--line-soft);
}
.nav-item.active .nav-num{background:var(--tp);color:#fff;border-color:transparent}
.nav-item.done .nav-num{background:rgba(58,214,139,.15);color:var(--grn);border-color:rgba(58,214,139,.35)}
.nav-txt{flex:1;min-width:0}
.nav-tier{
  font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:2px 6px;border-radius:20px;white-space:nowrap;
}
.tier-foundation{background:rgba(56,198,217,.14);color:var(--cyn)}
.tier-developing{background:rgba(245,180,49,.14);color:var(--amb)}
.tier-proficient{background:rgba(58,214,139,.14);color:var(--grn)}

.rail-foot{padding:12px;border-top:1px solid var(--line-soft)}
.progress-wrap{margin-bottom:10px}
.progress-line{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-3);margin-bottom:5px}
.bar{height:5px;border-radius:5px;background:#18222d;overflow:hidden}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--tp),#ff7a5c);border-radius:5px;transition:width .35s ease}
.ghost-btn{
  width:100%;background:#141e29;border:1px solid var(--line);border-radius:8px;
  padding:7px;font-size:.76rem;color:var(--ink-2);cursor:pointer;transition:.13s;
}
.ghost-btn:hover{background:#1a2734;color:var(--ink)}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px 26px;border-bottom:1px solid var(--line-soft);
  background:rgba(9,14,20,.82);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;
}
.crumb{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.topbar h2{margin:2px 0 0;font-size:1.06rem}
.view{padding:26px;max-width:1120px;width:100%;margin:0 auto;flex:1}

/* ---------- generic pieces ---------- */
.card{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px 20px;margin-bottom:16px}
.card.tight{padding:14px 16px}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.card-h .dot{width:7px;height:7px;border-radius:50%;background:var(--tp);flex:0 0 7px}
.card-h h3{margin:0}
.eyebrow{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:6px}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
hr.sep{border:0;border-top:1px solid var(--line-soft);margin:18px 0}

.btn{
  background:linear-gradient(180deg,#e33c4c,var(--tp-deep));border:0;border-radius:8px;
  padding:9px 16px;font-weight:600;font-size:.86rem;color:#fff;cursor:pointer;
  box-shadow:0 3px 10px rgba(224,43,60,.24);transition:filter .13s,transform .06s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#1c2836;border:1px solid var(--line);box-shadow:none;color:var(--ink)}
.btn.sec:hover{background:#243444}
.btn.ok{background:linear-gradient(180deg,#43dd95,#1e9e63);box-shadow:0 3px 10px rgba(58,214,139,.2)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:20px;background:#1b2836;color:var(--ink-2);border:1px solid var(--line-soft)}
.pill.g{background:rgba(58,214,139,.12);color:var(--grn);border-color:rgba(58,214,139,.28)}
.pill.a{background:rgba(245,180,49,.12);color:var(--amb);border-color:rgba(245,180,49,.28)}
.pill.r{background:rgba(255,90,95,.12);color:var(--red);border-color:rgba(255,90,95,.28)}
.pill.c{background:rgba(56,198,217,.12);color:var(--cyn);border-color:rgba(56,198,217,.28)}

.note{border-left:3px solid var(--cyn);background:#101c26;padding:11px 14px;border-radius:0 8px 8px 0;font-size:.87rem;margin:12px 0}
.note.warn{border-left-color:var(--amb);background:#1d1a10}
.note.err{border-left-color:var(--red);background:#201415}
.note.ok{border-left-color:var(--grn);background:#101f18}
.note b{color:var(--ink)}

/* ---------- lab shell ---------- */
.lab{background:linear-gradient(180deg,#101a24,#0c141c);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.lab-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 16px;background:#0d161f;border-bottom:1px solid var(--line-soft);
}
.lab-head .t{display:flex;align-items:center;gap:9px;font-weight:650;font-size:.92rem}
.lab-head .t svg{opacity:.85}
.lab-body{padding:18px}
.lab-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.lab-cols.wide-left{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}

.ctrl{margin-bottom:14px}
.ctrl label{display:flex;justify-content:space-between;align-items:baseline;font-size:.79rem;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.ctrl label .v{font-family:var(--mono);color:var(--ink);font-size:.86rem;background:#182430;padding:1px 7px;border-radius:5px;border:1px solid var(--line-soft)}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;
  background:#22303e;outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--tp);cursor:pointer;border:2px solid #0e151d;box-shadow:0 0 0 1px var(--tp);
}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--tp);cursor:pointer;border:2px solid #0e151d;
}
input[type=text],input[type=number],select,textarea{
  width:100%;background:#0c141d;border:1px solid var(--line);border-radius:7px;
  padding:8px 10px;color:var(--ink);font-family:var(--mono);font-size:.88rem;
}
input:focus,select,textarea:focus{outline:2px solid rgba(56,198,217,.4);outline-offset:-1px}
textarea{font-family:var(--sans);line-height:1.6;resize:vertical;min-height:120px}
select{font-family:var(--sans)}

.seg{display:flex;gap:4px;background:#0d161f;padding:4px;border-radius:9px;border:1px solid var(--line-soft);flex-wrap:wrap}
.seg button{
  flex:1;min-width:62px;background:transparent;border:0;border-radius:6px;padding:7px 8px;
  font-size:.79rem;color:var(--ink-2);cursor:pointer;font-weight:600;transition:.12s;
}
.seg button:hover{background:#182432;color:var(--ink)}
.seg button.on{background:var(--tp);color:#fff}

/* input toggles (logic switches) */
.switches{display:flex;gap:10px;flex-wrap:wrap}
.sw{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  background:#0d161f;border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;
  min-width:66px;transition:.13s;user-select:none;
}
.sw:hover{border-color:#33506b}
.sw .nm{font-size:.72rem;color:var(--ink-3);font-weight:700;letter-spacing:.05em}
.sw .lamp{
  width:30px;height:30px;border-radius:50%;background:#16212c;border:2px solid #24313d;
  display:grid;place-items:center;font-family:var(--mono);font-size:.9rem;font-weight:700;color:var(--ink-3);
  transition:.16s;
}
.sw.on .lamp{background:rgba(58,214,139,.2);border-color:var(--grn);color:var(--grn);box-shadow:0 0 12px rgba(58,214,139,.35)}
.sw.out{cursor:default}
.sw.out.on .lamp{background:rgba(245,180,49,.2);border-color:var(--amb);color:var(--amb);box-shadow:0 0 14px rgba(245,180,49,.4)}

/* truth table */
table.tt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:.85rem}
table.tt th,table.tt td{border:1px solid var(--line-soft);padding:6px 10px;text-align:center}
table.tt th{background:#16212c;color:var(--ink-2);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;font-family:var(--sans);font-weight:700}
table.tt td.out{color:var(--amb);font-weight:700}
table.tt tr.hi td{background:rgba(224,43,60,.14);outline:1px solid rgba(224,43,60,.45)}
table.tt tr.hi td.out{color:#ff9a5c}

/* readouts */
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px}
.ro{background:#0d161f;border:1px solid var(--line-soft);border-radius:9px;padding:9px 11px}
.ro .k{font-size:.63rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:3px}
.ro .v{font-family:var(--mono);font-size:1.02rem;color:var(--ink);word-break:break-all}
.ro.hl .v{color:var(--amb)}
.ro.g .v{color:var(--grn)}
.ro.c .v{color:var(--cyn)}

svg.viz{display:block;width:100%;height:auto;background:#0a1119;border:1px solid var(--line-soft);border-radius:9px}

/* bit boxes */
.bits{display:flex;gap:6px;flex-wrap:wrap}
.bit{
  width:46px;text-align:center;background:#0d161f;border:1px solid var(--line);border-radius:8px;
  padding:7px 0 5px;cursor:pointer;transition:.12s;user-select:none;
}
.bit:hover{border-color:#3a5b78}
.bit .b{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--ink-3);line-height:1.1}
.bit.on{background:rgba(224,43,60,.14);border-color:var(--tp)}
.bit.on .b{color:#ff8b8b}
.bit .w{font-size:.6rem;color:var(--ink-3);font-family:var(--mono);margin-top:2px}
.bit.on .w{color:var(--amb)}
.bit.flip{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}

/* q&a */
.q{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;padding:15px 17px;margin-bottom:12px}
.q .stem{font-weight:600;margin-bottom:11px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{
  display:flex;align-items:flex-start;gap:10px;background:#0e1720;border:1px solid var(--line);
  border-radius:8px;padding:9px 12px;cursor:pointer;transition:.12s;font-size:.89rem;
}
.opt:hover{border-color:#3a5b78;background:#122030}
.opt .k{
  width:20px;height:20px;flex:0 0 20px;border-radius:5px;background:#1b2836;border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.72rem;color:var(--ink-3);font-weight:700;
}
.opt.sel{border-color:var(--cyn);background:#0f1e26}
.opt.sel .k{background:var(--cyn);color:#04141a;border-color:transparent}
.opt.right{border-color:var(--grn);background:#0e1e17}
.opt.right .k{background:var(--grn);color:#052014;border-color:transparent}
.opt.wrong{border-color:var(--red);background:#1e1315}
.opt.wrong .k{background:var(--red);color:#2a0b0c;border-color:transparent}
.opt.locked{cursor:default}
.fb{margin-top:11px;font-size:.86rem;padding:10px 13px;border-radius:8px;display:none}
.fb.show{display:block}
.fb.good{background:#0e1e17;border:1px solid rgba(58,214,139,.3)}
.fb.bad{background:#1e1315;border:1px solid rgba(255,90,95,.3)}

/* stepper */
.steps{display:flex;flex-direction:column;gap:0}
.step{display:flex;gap:12px;padding-bottom:14px;position:relative}
.step:not(:last-child)::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:1px;background:var(--line)}
.step .n{
  width:23px;height:23px;flex:0 0 23px;border-radius:50%;background:#1b2836;border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--mono);font-size:.7rem;color:var(--ink-2);z-index:1;
}
.step.done .n{background:var(--grn);color:#052014;border-color:transparent}
.step .c{flex:1;font-size:.88rem;padding-top:1px}

/* tier banner */
.tier-banner{
  display:flex;align-items:center;gap:14px;padding:13px 17px;border-radius:10px;margin-bottom:16px;
  background:linear-gradient(90deg,#131f2b,#101820);border:1px solid var(--line);
}
.tier-banner .ic{
  width:36px;height:36px;flex:0 0 36px;border-radius:9px;display:grid;place-items:center;font-size:1.05rem;font-weight:800;
}
.tb-foundation .ic{background:rgba(56,198,217,.16);color:var(--cyn)}
.tb-developing .ic{background:rgba(245,180,49,.16);color:var(--amb)}
.tb-proficient .ic{background:rgba(58,214,139,.16);color:var(--grn)}
.tier-banner .tx{flex:1;min-width:0}
.tier-banner .tx b{display:block;font-size:.92rem}
.tier-banner .tx span{font-size:.79rem;color:var(--ink-2)}

/* checklist */
.chk{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:.87rem;cursor:pointer}
.chk .box{
  width:19px;height:19px;flex:0 0 19px;border-radius:5px;border:1px solid var(--line);background:#0e1720;
  display:grid;place-items:center;font-size:.72rem;color:transparent;transition:.12s;margin-top:1px;
}
.chk.on .box{background:var(--grn);border-color:var(--grn);color:#052014}

/* module footer nav */
.modfoot{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line-soft)}

/* summary print */
.sum-block{background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.sum-block h4{margin:0 0 8px;font-size:.95rem;display:flex;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:.86rem}
.kv .k{color:var(--ink-3)}
.quoted{background:#0d151d;border-left:3px solid var(--vio);padding:10px 14px;border-radius:0 8px 8px 0;font-size:.87rem;white-space:pre-wrap;color:var(--ink-2)}

/* misc */
.badge-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.hidden{display:none !important}
.center{text-align:center}
.stack>*+*{margin-top:12px}
ul.tick{list-style:none;padding:0;margin:0}
ul.tick li{padding-left:22px;position:relative;margin-bottom:7px;font-size:.88rem}
ul.tick li::before{content:"▸";position:absolute;left:4px;color:var(--tp);font-size:.8rem}
ul.plain{margin:0 0 .8em;padding-left:20px}
ul.plain li{margin-bottom:5px;font-size:.89rem}

.hero{
  background:linear-gradient(135deg,#16232f 0%,#101820 60%);
  border:1px solid var(--line);border-radius:14px;padding:28px 30px;margin-bottom:18px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-60px;top:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(224,43,60,.16),transparent 68%);
}
.hero h1{font-size:1.75rem;margin-bottom:8px;position:relative}
.hero p{max-width:640px;position:relative;color:var(--ink-2)}

.mod-card{
  background:var(--panel);border:1px solid var(--line-soft);border-radius:11px;padding:15px 16px;
  cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;
}
.mod-card:hover{border-color:#33506b;background:var(--panel-2);transform:translateY(-1px)}
.mod-card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mod-card .idx{font-family:var(--mono);font-size:.7rem;color:var(--ink-3)}
.mod-card b{font-size:.94rem}
.mod-card p{font-size:.8rem;color:var(--ink-3);margin:0}

@media (max-width:1080px){
  .lab-cols,.lab-cols.wide-left,.split{grid-template-columns:1fr}
  .g2,.g3{grid-template-columns:1fr}
}
@media (max-width:820px){
  .rail{position:fixed;left:-262px;z-index:60;transition:left .2s;box-shadow:var(--shadow)}
  .rail.open{left:0}
  .menu-btn{display:inline-flex !important}
  .view{padding:18px 16px}
}
.menu-btn{display:none;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;background:#182432;border:1px solid var(--line);cursor:pointer}

@media print{
  .rail,.topbar,.modfoot,.no-print{display:none !important}
  body{background:#fff;color:#111}
  .sum-block,.card{background:#fff;border:1px solid #ccc;color:#111;break-inside:avoid}
  .quoted{background:#f5f5f5;color:#222}
  .kv .k{color:#555}
}
</style>
</head>
<body>
<div class="app">

  <!-- ================= RAIL ================= -->
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="brand">
        <div class="brand-mark">TP</div>
        <div class="brand-txt">School of Engineering</div>
      </div>
      <div class="rail-title">Topic 1 · Semiconductors, ICs &amp; PCB</div>
      <div class="rail-sub">Interactive Learning Bay</div>
    </div>
    <nav class="rail-nav" id="railNav"></nav>
    <div class="rail-foot">
      <div class="progress-wrap">
        <div class="progress-line"><span>Topic progress</span><span id="progPct">0%</span></div>
        <div class="bar"><i id="progBar" style="width:0%"></i></div>
      </div>
      <button class="ghost-btn" id="resetBtn">Reset my progress</button>

const $  = (sel,root)=> (root||document).querySelector(sel);
const $$ = (sel,root)=> Array.from((root||document).querySelectorAll(sel));
function el(tag, attrs, html){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(attrs[k]===undefined || attrs[k]===null) continue;
    if(k==="class") n.className = attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  if(html!=null) n.innerHTML = html;
  return n;
}
function esc(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const SVGNS = "http://www.w3.org/2000/svg";
function svg(tag, attrs){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);

}

   </ul>

   <p>That last point is what the <b>characteristic curve</b> shows: nothing happens along the horizontal axis until

   <ul class="plain" style="margin:8px 0 0">
     <li>T&uarr; &rArr; more thermal activity &rArr; diode resistance falls</li>
     <li>Forward: T&uarr; &rArr; I<sub>F</sub>&uarr; and V<sub>F</sub>&darr; (the curve shifts left, from 0.7 V toward 0.6 V)</li>
     <li>Reverse: T&uarr; &rArr; I<sub>R</sub>&uarr; and V<sub>R</sub>&darr; (more leakage, breakdown happens sooner)</li>
   </ul>
   This is why "keep the equipment cool" is not just advice about comfort. A junction that runs hot conducts more,
   heats further, and can run away.</div>
   <p><b>The back-EMF diode.</b> Switching off a relay coil or a motor collapses its magnetic field and generates a
   large reverse voltage spike that will destroy the transistor driving it. A diode fitted <i>across the coil</i>, reverse
   biased in normal operation, short-circuits that spike harmlessly. It does nothing at all until the moment the
   switch opens &mdash; which is exactly why people forget to fit it.</p>`,

  proficient:`
   <p>At this level the diode is rarely alone. It is part of a power conversion chain or a protection scheme, and its
   ratings, not its symbol, decide whether the design survives.</p>
   <ul class="plain">
     <li><b>The regulated DC supply chain.</b> Transformer (steps the AC down) &rarr; rectifier (PN junction diodes,
     converts AC to pulsating DC) &rarr; filter (capacitor, reduces the variation) &rarr; regulator (Zener, holds the
     output constant). Each block fixes one defect of the block before it, and knowing which block a fault sits in
     saves you most of the diagnosis.</li>
     <li><b>Full wave doubles the ripple frequency.</b> A 60 Hz input through a full-wave rectifier gives a 120 Hz
     output, so the period is 1/120 = <b>8.33 ms</b>. That matters because ripple is easier to filter at higher
     frequency &mdash; which is one of two standard ways to reduce ripple, the other being an appropriate choice of
     capacitor and load resistor value.</li>
     <li><b>Peak inverse voltage.</b> A rectifier diode must survive the full reverse voltage during the blocked half
     cycle. Diodes are put in <b>series</b> to share reverse voltage, and in <b>parallel</b> to share current &mdash;
     but parallel diodes do not share current equally unless they are matched or balanced with small series resistors,
     because the one with the slightly lower V<sub>F</sub> hogs the current and then gets hotter, which lowers its V<sub>F</sub> further.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A 28 V DC aircraft bus is fed from a transformer-rectifier unit. Explain
   what a technician would see on an oscilloscope at the rectifier output, at the filter output, and at the regulator
   output &mdash; and say which of those three measurements would change if one diode of the bridge failed open circuit.</div>`
 },

/* ---------------- MODULE 2 · TESTING DIODES ---------------- */
m2:{
 takeaways:[
  "A diode is tested with a multimeter in one of two ways: the resistance range, or the dedicated diode-test position.",
  "The diode-test position supplies an internal voltage of about 2.5 to 3.5 V, enough to forward and reverse bias the junction.",
  "A GOOD diode: low resistance (or about 0.7 V) forward, very high resistance (or the meter's internal voltage) reverse.",
  "An OPEN diode: very high resistance, or the internal meter voltage, in BOTH directions.",
  "A SHORTED diode: very low resistance, or nearly 0 V, in BOTH directions."
 ],
 concept:{
  foundation:`
   <p>You test a diode with a multimeter, and there are <b>two ways</b> to do it. Both work; they just display the
   answer differently, and mixing them up is what makes readings confusing.</p>
   <ul class="plain">
     <li><b>Resistance range.</b> The meter measures how easily current passes. You are looking for a big
     <i>difference</i> between the two directions.</li>
     <li><b>Diode test position.</b> The meter supplies its own internal voltage, about <b>2.5 to 3.5 V</b>, which is
     more than enough to forward bias the junction. It then displays the forward volt drop directly.</li>
   </ul>
   <div class="note ok"><b>A good working diode</b><br>
   Resistance range: <b>very low</b> resistance in forward bias, <b>very high</b> resistance in reverse bias.<br>
   Diode test: about <b>0.7 V</b> in forward bias, and the meter's <b>internal voltage</b> (often shown as OL) in reverse bias.</div>
   <div class="note err"><b>A faulty OPEN circuit diode</b><br>
   Resistance range: <b>very high in both directions</b>.<br>
   Diode test: the meter's <b>internal voltage in both directions</b> &mdash; because the meter's test voltage cannot
   push any current through a broken junction either way.</div>
   <div class="note err"><b>A faulty SHORT circuit diode</b><br>
   Resistance range: <b>very low in both directions</b>.<br>
   Diode test: <b>zero or nearly zero in both directions</b>.</div>
   <p>Notice the pattern. A healthy diode is the only one that gives you <b>two different answers</b>. If both
   directions read the same, the diode is faulty &mdash; and <i>which</i> same answer tells you whether it failed open or short.</p>`,

  developing:`
   <p>Get out of the habit of memorising six readings and learn the single rule underneath them.</p>
   <div class="note"><b>The rule.</b> A diode is a device that is <b>asymmetric</b>. Test it both ways round.
   <ul class="plain" style="margin:8px 0 0">
     <li>Different readings &rarr; the junction is doing its job &rarr; <b>good</b>.</li>
     <li>Same reading, both "blocking" &rarr; <b>open</b>.</li>
     <li>Same reading, both "conducting" &rarr; <b>short</b>.</li>
   </ul>
   You never have to remember which probe is which, only whether the two readings differ.</div>
   <p><b>Why the diode-test position is usually better.</b> An ordinary resistance range may not supply enough voltage
   to forward bias the junction at all, so a perfectly good diode can read as open. The diode-test position is designed
   with a higher internal voltage precisely to avoid that, and it gives you a number you can interpret directly:
   0.7 V says silicon, about 0.3 V says germanium or Schottky, and a reading much above 0.8 V is suspicious.</p>
   <div class="note warn"><b>OL is not a fault by itself.</b> OL means the reading is beyond the meter's range &mdash;
   an open circuit as far as the meter is concerned. In <i>reverse</i> bias on a good diode that is exactly what you
   expect. OL only indicates a fault when you see it in the <i>forward</i> direction too.</div>`,

  proficient:`
   <p>The theory is easy. What catches people out is testing a diode that is still soldered into a circuit.</p>
   <ul class="plain">
     <li><b>Parallel paths lie to you.</b> A resistor, coil or another semiconductor across the diode gives the meter
     an alternative route, so a good diode can read low in both directions and be condemned as shorted. If the reading
     says short, lift one leg before you decide.</li>
     <li><b>Power must be off, and capacitors discharged.</b> A meter measuring resistance is injecting its own current;
     an external supply fighting it makes every reading meaningless, and a charged capacitor can damage the meter.</li>
     <li><b>The reading identifies the technology.</b> About 0.7 V is a silicon PN junction. About 0.3 V is germanium
     or a Schottky. An LED reads much higher, typically 1.2 to 3.2 V, and many meters will not forward bias a blue or
     white LED at all &mdash; which reads as open and is not a fault.</li>
     <li><b>Junctions inside other devices test the same way.</b> A BJT is two junctions back to back, so the same
     technique checks base-emitter and base-collector, and an SCR's gate-cathode junction reads like a diode too.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A technician reports "the diode reads 0.5 V forward and 0.5 V reverse on the
   diode test." State the two most likely explanations, say which is a component fault and which is not, and describe
   the one action that separates them.</div>`
 },

/* ---------------- MODULE 3 · SPECIAL DIODES & VARISTORS ---------------- */
m3:{
 takeaways:[
  "LED: forward biased to emit light; forward voltage 1.2-3.2 V, reverse breakdown only -3 to -10 V, and brightness is proportional to forward current.",
  "Schottky: a metal-to-semiconductor junction, no PN junction, low forward drop of about 0.3 V and very fast switching.",
  "Varactor: operated in reverse bias as a variable capacitor. More reverse voltage means a wider depletion layer and LOWER capacitance.",
  "Photodiode: operated in reverse bias; dark blocks current, light makes it conduct, and the current is proportional to the light.",
  "Varistor (VDR): resistance falls as voltage rises and polarity does not matter, so it clamps transients and surges."
 ],
 concept:{
  foundation:`
   <p>All of these are still diodes. What changes is which part of the diode's behaviour the designer decided to
   exploit &mdash; and, crucially, <b>which bias each one is used in</b>.</p>
   <div class="note"><b>LED &mdash; used in FORWARD bias.</b> Its curve is much like a normal PN diode, but its forward
   voltage is higher: <b>1.2 V to 3.2 V</b> typically, and the colour depends on the impurities added during doping,
   which set the wavelength. Brightness is proportional to forward current. Its reverse breakdown voltage is <b>low</b>,
   only about &minus;3 V to &minus;10 V, so an LED is easy to destroy by connecting it backwards across a supply.</div>
   <div class="note"><b>Schottky &mdash; the fast one.</b> A hot-carrier diode with a <b>metal-to-semiconductor</b>
   junction, so it has <b>no PN junction</b> at all. Low forward drop of about <b>0.3 V</b>, and very fast switching.</div>
   <div class="note"><b>Varactor &mdash; used in REVERSE bias.</b> A variable capacitance diode. The depletion region
   is the dielectric between two conducting regions, so C = A&epsilon;/d. Increase the reverse bias and the depletion
   layer gets <b>wider</b>, so d increases and capacitance goes <b>down</b>. Lower reverse bias, narrower layer, higher capacitance.</div>
   <div class="note"><b>Photodiode &mdash; used in REVERSE bias.</b> In the dark it blocks current. Illuminated, it
   becomes conductive and current flows in the reverse direction, and the amount of current is <b>proportional to the
   amount of light</b>.</div>
   <div class="note"><b>Varistor (VDR) &mdash; not really a diode at all.</b> Its resistance varies <b>inversely</b>
   with voltage: high resistance at low voltage, low resistance at high voltage. <b>Polarity does not matter.</b></div>`,

  developing:`
   <p>Two of these you will actually have to calculate with, and the rest you must be able to <i>select</i>.</p>
   <div class="note"><b>The LED series resistor.</b> An LED has no internal current limiting, so a resistor is always
   fitted in series. The supply splits between them:<br>
   <span class="mono">R<sub>LIMIT</sub> = (V<sub>S</sub> &minus; V<sub>F</sub>) / I<sub>F</sub></span><br>
   For a 5 V supply, an LED with V<sub>F</sub> = 2 V and a desired 20 mA: R = (5 &minus; 2)/0.02 = <b>150 &#8486;</b>.
   Leave the resistor out and the LED draws whatever current the supply can deliver, and dies.</div>
   <div class="note"><b>The varactor in a tuned circuit.</b> Put a varactor across an inductor and you have an
   electrically adjustable resonant circuit &mdash; a voltage-controlled oscillator:<br>
   <span class="mono">f<sub>r</sub> = 1 / (2&pi;&radic;(LC))</span><br>
   Raising V<sub>BIAS</sub> lowers C, and lowering C <b>raises</b> the resonant frequency. That is how a radio is tuned by a
   voltage rather than by a mechanical capacitor.</div>
   <p><b>The photodiode as a detector.</b> Reverse biased in series with a resistor, its light-dependent current
   develops a voltage that can drive a transistor &mdash; and the transistor drives a buzzer, a lamp or a logic input.
   This is the standard light-detector building block.</p>
   <div class="note warn"><b>Match the device to the job.</b> Tuning &rarr; varactor. Surge protection &rarr; varistor.
   Light detection &rarr; photodiode. Light emission &rarr; LED. Fast switching or low volt drop &rarr; Schottky.
   Exam questions in this topic are almost always testing that one mapping.</div>`,

  proficient:`
   <p>At maintenance level, know why each device was chosen and how each one fails.</p>
   <ul class="plain">
     <li><b>Schottky.</b> The absence of a PN junction means no minority-carrier storage, hence the very fast recovery.
     That is why it dominates in switch-mode supplies, where a slow diode still conducting after the polarity reverses
     wastes power as heat. The low 0.3 V drop also makes it the sensible reverse-polarity protection device on a
     low-voltage bus, where losing 0.7 V matters. The trade is a higher reverse leakage than a silicon PN diode,
     and that leakage grows with temperature.</li>
     <li><b>Varistor.</b> A metal-oxide varistor clamps by conducting hard above its rated voltage, absorbing the
     transient energy. It is a <b>sacrificial</b> device: each surge degrades it slightly, the clamping voltage drifts,
     and a varistor that has taken repeated hits can eventually fail short and become a fire risk. On an inspection,
     a discoloured or cracked varistor is a finding even though the equipment still works.</li>
     <li><b>Photodiode modes.</b> Reverse biased (photoconductive) gives fast, linear response &mdash; the mode used
     for data and detection. Zero-biased (photovoltaic) generates its own voltage, is slower, but has far less noise
     and is used for precise light measurement.</li>
     <li><b>LEDs in aircraft.</b> Long life and low current made them standard for annunciators and, increasingly,
     for exterior lighting. Because brightness tracks forward current, dimming is done by pulse-width modulation
     rather than by reducing the voltage, which would shift the colour and eventually stop conduction altogether.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A 28 V DC circuit drives an annunciator LED with V<sub>F</sub> = 2.1 V at 15 mA.
   Calculate the series resistor and the power it must dissipate, then explain why a designer might use a constant-current
   driver instead on an aircraft bus whose voltage varies between 22 V and 30 V.</div>`
 },

/* ---------------- MODULE 4 · THYRISTORS & SCR ---------------- */
m4:{
 takeaways:[
  "An SCR is a 4-layer device with 3 PN junctions and 3 terminals: anode (A), cathode (K) and gate (G).",
  "It conducts in one direction only, from anode to cathode, and is used for AC power control.",
  "A gate current triggers it on; increasing the gate current lowers the forward break-over voltage needed.",
  "Once latched, the SCR stays on even after the gate current is removed.",
  "It only turns off when the anode current falls below the holding current I_H - by natural commutation at an AC zero crossing, or by forced commutation."
 ],
 concept:{
  foundation:`
   <p>A thyristor is a <b>multilayered</b> semiconductor with a very high power rating. The member of the family you
   must know is the <b>silicon controlled rectifier (SCR)</b>.</p>
   <ul class="plain">
     <li><b>4 layers</b> (p-n-p-n), giving <b>3 PN junctions</b>.</li>
     <li><b>3 terminals</b>: anode (A), cathode (K) and <b>gate (G)</b>.</li>
     <li>It conducts <b>in one direction only</b>, anode to cathode &mdash; hence "rectifier" in the name.</li>
     <li>The equivalent circuit is <b>two transistors cross-coupled</b>, which is what produces the latching behaviour.</li>
   </ul>
   <div class="note"><b>Think of it as a rectifier with a switch built in.</b> An ordinary diode conducts as soon as it
   is forward biased. An SCR that is forward biased still <b>blocks</b> &mdash; the forward blocking region &mdash;
   until you tell it to conduct by applying a gate current.</div>
   <div class="note warn"><b>And here is the part that surprises everyone.</b> Once it has turned on, the gate loses
   all control. Remove the gate current and the SCR <b>keeps conducting</b>. It is a latch, not a valve. The only way
   to turn it off is to reduce the anode-to-cathode current I<sub>AK</sub> below the <b>holding current I<sub>H</sub></b>.</div>
   <p>So an SCR has three regions on its characteristic: reverse blocking, forward blocking (off), and forward
   conduction (on). Exceed the <b>reverse breakdown voltage</b> and the device is damaged.</p>`,

  developing:`
   <p>Three currents and one voltage do all the work. Keep them straight.</p>
   <div class="note"><b>V<sub>BR(F)</sub> &mdash; forward break-over voltage.</b> Without any gate current the SCR eventually
   breaks over and conducts on its own, at a high voltage. Apply gate current and that break-over voltage <b>falls</b>.
   The more gate current, the lower the voltage at which it fires &mdash; which is precisely how the firing point is controlled.</div>
   <div class="note"><b>I<sub>L</sub> &mdash; latching current.</b> The minimum anode current, rising from zero, needed to
   <i>latch</i> the SCR into the on state. If the gate pulse ends before the anode current has reached I<sub>L</sub>, the
   turn-on fails and the device drops back to blocking. This is why a short gate pulse into an inductive load can
   fail to fire while the same pulse into a resistive load works.</div>
   <div class="note"><b>I<sub>H</sub> &mdash; holding current.</b> The minimum anode current needed to <i>stay</i> on. It is
   lower than the latching current. Fall below it and the SCR turns off.</div>
   <p><b>Turning it off.</b> Two families of method:</p>
   <ul class="plain">
     <li><b>Natural commutation</b> &mdash; with an AC supply, the current passes through zero every half cycle and the
     SCR turns itself off. This is why SCRs suit AC applications so naturally.</li>
     <li><b>Forced commutation</b> &mdash; on DC you must intervene: reverse the anode-cathode voltage, push a reverse
     current through it, or open or close a switch to divert the current. The classic circuit uses a second SCR to dump
     a charged capacitor across the first one.</li>
   </ul>
   <div class="note warn"><b>Accidental turn-on.</b> An SCR can fire without any gate signal if the anode-cathode
   voltage is too high, if it gets too hot, or if V<sub>AK</sub> changes too fast (a high dV/dt). All three are real
   in-service causes of spurious operation.</div>`,

  proficient:`
   <p>The SCR earns its place where a transistor would not survive, and the design work is all in the firing and the
   protection.</p>
   <ul class="plain">
     <li><b>Phase control.</b> Delay the gate trigger further into each half cycle and the load receives a smaller
     slice of it. The load waveform is a chopped sine, and the average power delivered varies smoothly with firing
     angle. This is the basis of lamp dimmers, electric heaters and motor speed control. Note what it costs: the
     chopped waveform is rich in harmonics, so phase control is a notorious source of conducted electrical noise.</li>
     <li><b>dV/dt and the snubber.</b> Because the internal junction capacitance couples a fast-rising anode voltage
     into the gate region, a steep transient can fire the device with no gate drive at all. The standard fix is a
     resistor-capacitor snubber across the SCR to slow the rate of rise. A phantom turn-on that correlates with a
     nearby contactor operating is this, not a failed gate circuit.</li>
     <li><b>Why not just use a transistor?</b> A transistor needs continuous base drive proportional to the load
     current. The SCR needs only a brief pulse and then latches, so the drive circuit is trivial and the device
     handles far higher power. The price is that you give up the ability to turn it off at will.</li>
     <li><b>Ratings that matter.</b> Reverse breakdown voltage, because exceeding it destroys the device; holding and
     latching current, because they decide whether it fires and stays fired into your particular load; and the
     rate-of-rise limits for both current and voltage.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> An SCR-based heater controller works correctly on a resistive test load
   but fails to stay on when the real inductive load is connected. Explain, in terms of latching current and the
   gate pulse, why that happens and what change to the gate drive would fix it.</div>`
 },

/* ---------------- MODULE 5 · TRANSISTORS ---------------- */
m5:{
 takeaways:[
  "A BJT is three layers: NPN or PNP, with terminals base (B), collector (C) and emitter (E).",
  "The arrow is always on the emitter: it points OUT for NPN and IN for PNP, and shows the direction of emitter current.",
  "Kirchhoff at the transistor: I_E = I_B + I_C, and the DC current gain is beta_DC = I_C / I_B.",
  "Three operating regions: cut-off (open switch), saturation (closed switch) and active (amplifier).",
  "A BJT is a CURRENT controlled device with low input impedance; a FET is a VOLTAGE controlled device with very high input impedance and effectively zero gate current."
 ],
 concept:{
  foundation:`
   <p>A diode is two layers. Add a third layer and you get a <b>bipolar junction transistor</b>.</p>
   <ul class="plain">
     <li>Add an <b>n-type</b> layer to the p side of a PN diode &rarr; <b>NPN transistor</b>.</li>
     <li>Add a <b>p-type</b> layer to the n side &rarr; <b>PNP transistor</b>.</li>
     <li>Either way you get <b>three terminals</b>: base (B), collector (C) and emitter (E).</li>
   </ul>
   <div class="note"><b>Reading the symbol.</b> The arrow is always on the <b>emitter</b>, and it shows the direction
   of emitter current.
   <ul class="plain" style="margin:8px 0 0">
     <li>Arrow pointing <b>out</b> &rarr; <b>NPN</b> (remember: <i>N</i>ot <i>P</i>ointing i<i>N</i>)</li>
     <li>Arrow pointing <b>in</b> &rarr; <b>PNP</b></li>
   </ul></div>
   <div class="note"><b>The current law.</b> Everything that goes in must come out:<br>
   <span class="mono">I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></span><br>
   Example: if I<sub>B</sub> = 3 mA and I<sub>C</sub> = 150 mA, then I<sub>E</sub> = <b>153 mA</b>.</div>
   <div class="note"><b>The gain.</b> The whole point of a transistor is that a small base current controls a much
   larger collector current:<br>
   <span class="mono">&beta;<sub>DC</sub> = I<sub>C</sub> / I<sub>B</sub></span><br>
   From the same example: &beta;<sub>DC</sub> = 150 mA / 3 mA = <b>50</b>. So the base current is tiny compared with the
   collector current, which is why I<sub>C</sub> is very nearly equal to I<sub>E</sub>.</div>
   <p>Two jobs follow from that. As an <b>amplifier</b>, a tiny input current produces a much bigger output current
   &mdash; a hearing aid takes a whisper from a tiny microphone and drives a speaker. As a <b>switch</b>, the
   transistor is simply turned hard on or hard off, and several of them wired together make the logic gates inside
   every digital IC.</p>`,

  developing:`
   <p>The same transistor does completely different jobs depending on how its two junctions are biased. Learn this
   table and most transistor questions answer themselves.</p>
   <table class="tt" style="font-family:var(--sans);font-size:.85rem">
     <thead><tr><th>Operating region</th><th>Cut-off</th><th>Saturation</th><th>Active</th></tr></thead>
     <tbody>
       <tr><td><b>B-E junction</b></td><td>reverse biased</td><td>forward biased</td><td>forward biased</td></tr>
       <tr><td><b>B-C junction</b></td><td>reverse biased</td><td>forward biased</td><td>reverse biased</td></tr>
       <tr><td><b>Operates as</b></td><td class="out">an open switch</td><td class="out">a closed switch</td><td class="out">an amplifier</td></tr>
     </tbody>
   </table>
   <div class="note" style="margin-top:14px"><b>Switch or amplifier?</b>
   <ul class="plain" style="margin:8px 0 0">
     <li>Used as a <b>switch</b> &rarr; operated in <b>cut-off and saturation</b>, never in between.</li>
     <li>Used as an <b>amplifier</b> &rarr; operated in the <b>active</b> region, with the B-E junction forward biased
     and the B-C junction reverse biased.</li>
   </ul></div>
   <div class="note warn"><b>The control changes with the region.</b> In the <b>active</b> region I<sub>C</sub> is controlled by
   I<sub>B</sub>, and I<sub>C</sub> = &beta;<sub>DC</sub>I<sub>B</sub>. In <b>saturation</b> that stops being true &mdash; the transistor is
   fully on, the external circuit limits the current, and pushing more base current in does nothing. This is the single
   most common misreading of a transistor circuit.</div>
   <p>For a silicon transistor, the forward voltage across the B-E junction when it is conducting is about <b>0.7 V</b>
   &mdash; the same junction physics as a diode, because it <i>is</i> a diode.</p>`,

  proficient:`
   <p>Now compare the two families, because selecting between them is a design decision with maintenance consequences.</p>
   <table class="tt" style="font-family:var(--sans);font-size:.82rem">
     <thead><tr><th>&nbsp;</th><th>BJT</th><th>FET</th></tr></thead>
     <tbody>
       <tr><td><b>Types</b></td><td>NPN, PNP (bipolar: electrons and holes)</td><td>N-channel, P-channel; JFET and MOSFET (unipolar: one carrier)</td></tr>
       <tr><td><b>Terminals</b></td><td>Base, Collector, Emitter</td><td>Gate, Drain, Source</td></tr>
       <tr><td><b>Control</b></td><td>CURRENT controlled: I<sub>B</sub> controls I<sub>C</sub></td><td>VOLTAGE controlled: V<sub>GS</sub> controls I<sub>D</sub></td></tr>
       <tr><td><b>Input impedance</b></td><td>Low</td><td>Very high</td></tr>
       <tr><td><b>Junction biasing</b></td><td>B-E forward biased</td><td>G-S reverse biased (JFET)</td></tr>
       <tr><td><b>Currents</b></td><td>I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub></td><td>I<sub>D</sub> = I<sub>S</sub>, since gate current is always 0 A</td></tr>
     </tbody>
   </table>
   <ul class="plain" style="margin-top:14px">
     <li><b>Why the input impedance matters.</b> A BJT loads the stage before it, because it draws base current. A FET
     draws essentially none, so it can sense a high-impedance source &mdash; a capacitive sensor, a photodiode, an
     electrometer input &mdash; without disturbing it. That is why the front end of sensitive instrumentation is
     almost always a FET.</li>
     <li><b>The JFET transfer equation.</b>
     <span class="mono">I<sub>D</sub> = I<sub>DSS</sub>(1 &minus; V<sub>GS</sub>/V<sub>GS(off)</sub>)&sup2;</span>
     &mdash; square law, not linear, which is why FET amplifiers distort differently from BJT ones.
     I<sub>DSS</sub> is the maximum drain current, at V<sub>GS</sub> = 0.</li>
     <li><b>Handling.</b> The very high input impedance that makes a MOSFET useful also makes its gate oxide easy to
     destroy with static. Electrostatic discharge precautions on avionics boards exist largely because of these devices.</li>
     <li><b>Configurations.</b> BJT: common emitter, common collector, common base. FET: common source, common drain,
     common gate. Biasing: base bias, voltage divider bias and emitter bias for the BJT; gate bias, self bias and
     voltage divider bias for the FET.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A transistor stage is measured with V<sub>CE</sub> close to 0 V and the base
   drive well above its calculated value. State which region it is in, whether I<sub>C</sub> = &beta;I<sub>B</sub> still applies,
   and what would happen to V<sub>CE</sub> if the base drive were halved.</div>`
 },

  "A discrete component is one device per package; an integrated circuit puts many active and passive components on a single piece of silicon.",
  "ICs are classified by gate count: SSI under 12, MSI 12-99, LSI 100-9999, VLSI 10,000-99,999, ULSI over 100,000.",
  "ICs divide into linear circuits (amplifiers, oscillators, regulators) and logic circuits (gates, registers, ALUs, microprocessors).",

 concept:{
  foundation:`
   <p>A <b>discrete</b> component is one device in one package &mdash; a single diode, a single transistor. An
   <b>integrated circuit</b> is a single package containing any number of active components (diodes, BJTs, JFETs) and
   passive components, all constructed on one piece of silicon.</p>
   <p>Packages you should recognise: <b>ceramic DIP (CERDIP)</b>, <b>plastic moulded DIP</b>, <b>small outline package
   (SOP)</b> and <b>ceramic flat pack</b>.</p>
   <div class="note"><b>Classified by how many gates are on the chip.</b>
   <table class="tt" style="font-family:var(--sans);font-size:.82rem;margin-top:8px">
    <thead><tr><th>Name</th><th>Classification</th><th>Gates per chip</th></tr></thead>
    <tbody>
     <tr><td>SSI</td><td>Small-scale integration</td><td>Fewer than 12</td></tr>
     <tr><td>MSI</td><td>Medium-scale integration</td><td>12 to 99</td></tr>
     <tr><td>LSI</td><td>Large-scale integration</td><td>100 to 9,999</td></tr>
     <tr><td>VLSI</td><td>Very-large-scale integration</td><td>10,000 to 99,999</td></tr>
     <tr><td>ULSI</td><td>Ultra-large-scale integration</td><td>More than 100,000</td></tr>
    </tbody></table></div>
   <p>ICs split into two families. <b>Linear circuits</b>: amplifiers, summing circuits, oscillators, voltage
   regulators. <b>Logic circuits</b>: gates, multiplexers, registers, ALUs, microprocessors.</p>
   <div class="note"><b>The op-amp.</b> The most important linear IC. It has:
   <ul class="plain" style="margin:8px 0 0">
     <li><b>2 input terminals</b> &mdash; one <b>inverting</b> (&minus;) and one <b>non-inverting</b> (+)</li>
     <li><b>1 output</b></li>
     <li>a <b>dual power supply</b>, +V<sub>CC</sub> and &minus;V<sub>EE</sub></li>
   </ul>
   It amplifies the <i>difference</i> between its two inputs:
   <span class="mono">V<sub>id</sub> = V<sub>+</sub> &minus; V<sub>&minus;</sub></span> and
   <span class="mono">V<sub>o</sub> = A<sub>ol</sub> &times; V<sub>id</sub></span></div>`,

  developing:`
   <p>The gap between the <b>ideal</b> op-amp you calculate with and the <b>practical</b> one on the bench is where
   all the interesting behaviour lives.</p>
   <div class="grid g2">
     <div><div class="eyebrow">Ideal op-amp</div><ul class="tick">
       <li>Infinite input impedance Z<sub>in</sub></li>
       <li>Infinite open-loop gain A<sub>ol</sub></li>
       <li>Zero output impedance Z<sub>out</sub></li>
       <li>Infinite slew rate / infinite bandwidth</li></ul></div>
     <div><div class="eyebrow">Practical op-amp</div><ul class="tick">
       <li>Very large Z<sub>in</sub> (above 10&#8309; &#8486;)</li>
       <li>Very large A<sub>ol</sub> (around 200,000)</li>
       <li>Low Z<sub>out</sub> (75 &#8486; or less)</li>
       <li>High but finite slew rate and bandwidth</li></ul></div>
   </div>
   <div class="note warn" style="margin-top:14px"><b>Why open loop is useless for linear work.</b> Take
   A<sub>ol</sub> = 200,000 and a 1 mV<sub>pp</sub> input. V<sub>o</sub> = 200,000 &times; 0.001 = <b>200 V<sub>pp</sub></b>
   &mdash; but the supply only allows about &plusmn;14 V. So the output slams into the rails and you get a square wave
   from a sine input. A few microvolts of noise is enough to saturate it.</div>
   <p><b>The other problem is that A<sub>ol</sub> is unstable.</b> It differs from chip to chip and changes with supply
   voltage, load current, temperature and input frequency. Even with V<sub>in</sub> constant, V<sub>o</sub> drifts &mdash; and an
   open-loop circuit has no way to detect or correct that error.</p>
   <div class="note ok"><b>The fix is negative feedback.</b> Feed part of the output back to the inverting input and
   the circuit corrects its own error. The gain is now set by <b>resistors</b>, which are stable and cheap, instead of
   by the chip. You give up raw gain and get back stability, predictability and <b>more bandwidth</b>.</div>
   <p>For a linear amplifier: <span class="mono">V<sub>o</sub> = A<sub>v</sub> &times; V<sub>in</sub></span> and
   <span class="mono">A<sub>v</sub> = V<sub>o</sub> / V<sub>in</sub></span>. Output and input must have the same wave shape &mdash;
   if the shape changes, the amplifier is not operating linearly.</p>`,

  proficient:`
   <p>With feedback applied, two ideal-op-amp rules do nearly all the analysis:
   <b>V<sub>&minus;</sub> = V<sub>+</sub></b> and <b>I<sub>&minus;</sub> = I<sub>+</sub> = 0</b>.</p>
   <ul class="plain">
     <li><b>Non-inverting amplifier:</b>
     <span class="mono">A<sub>cl</sub> = 1 + R<sub>F</sub>/R<sub>1</sub></span>.
     Input goes to the + terminal, so the output is in phase and the gain can never be less than 1.</li>
     <li><b>Inverting amplifier:</b>
     <span class="mono">A<sub>cl</sub> = &minus;R<sub>F</sub>/R<sub>1</sub></span>.
     The minus sign means V<sub>o</sub> is <b>180&deg; out of phase</b> with V<sub>in</sub> for AC. Gains below 1 are possible here.</li>
     <li><b>Virtual ground.</b> In the inverting configuration the + input is tied to ground, so V<sub>+</sub> = 0. Since
     ideally V<sub>id</sub> = 0, the &minus; input sits at 0 V too &mdash; it is <i>virtually</i> at ground without being
     connected to it. It is never truly zero, because V<sub>id</sub> is never truly zero, but it is what makes the inverting
     gain equation fall out of Ohm's law in two lines.</li>
     <li><b>Voltage follower.</b> A special case of the non-inverting amplifier with 100% feedback:
     A<sub>cl</sub> = 1, V<sub>o</sub> follows V<sub>in</sub>, same phase. Useless as an amplifier, invaluable as a <b>buffer</b>:
     it presents a very high impedance to the source and a very low impedance to the load. Feed a 10 k&#8486; source
     into a 1 k&#8486; load directly and you lose most of the signal; put a follower in between and you keep it.</li>
     <li><b>Integrator:</b> capacitor in the feedback path, resistor at the input.
     <span class="mono">&Delta;V<sub>out</sub>/&Delta;t = &minus;V<sub>in</sub>/(R<sub>1</sub>C)</span> &mdash; a step in
     gives a ramp out, which is how triangular-wave generators work.</li>
     <li><b>Differentiator:</b> the mirror image &mdash; capacitor at the input, resistor in the feedback path.
     <span class="mono">V<sub>out</sub> = &minus;R<sub>F</sub>C &middot; dV<sub>in</sub>/dt</span> &mdash; a ramp in gives a
     step out. It responds to the <i>rate of change</i>, which also means it amplifies noise, so a real differentiator
     always has extra components to tame it.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> An inverting amplifier uses R<sub>1</sub> = 10 k&#8486; and R<sub>F</sub> = 100 k&#8486; on a
   &plusmn;15 V supply that saturates at &plusmn;14 V. State the gain, the largest input amplitude that stays linear, and
   what the output looks like if the input is doubled beyond that.</div>`
 },

/* ---------------- MODULE 7 · PRINTED CIRCUIT BOARDS ---------------- */
m7:{
 takeaways:[
  "A PCB mechanically supports and electrically connects components using copper traces etched onto a non-conductive substrate.",
  "The board is the substrate, the conductors are the traces; FR4 woven epoxy glass is the most common substrate, dielectric constant roughly 4 to 5.",
  "Trace resistance R = rho x l / (d x b): longer means more resistance, wider or thicker means less. Trace width is set by the current it must carry.",
  "Board types: single sided (NPTH), double sided (plated through holes), and multi-layer. Vias interconnect layers and are not for mounting components.",
  "Protection: conformal coating over the whole board except edge connectors, no touching the traces, and no mechanical stress that could cause hairline cracks."
 ],
 concept:{
  foundation:`
   <p>A <b>printed circuit board</b> does two jobs at once: it <b>mechanically supports</b> the components and
   <b>electrically connects</b> them, using conductive pathways etched from copper sheets laminated onto a
   non-conductive base.</p>
   <ul class="plain">
     <li>The laminate board itself is the <b>substrate</b>.</li>
     <li>The circuit conductors are the <b>traces</b> (also called tracks).</li>
     <li><b>Copper</b> is the usual trace material, bonded onto the substrate.</li>
     <li><b>Gold</b> is expensive but does not oxidise, so it is used where contact reliability matters most &mdash;
     on the <b>edge connector</b> fingers.</li>
   </ul>
   <div class="note"><b>The standard substrate is FR4</b>, a woven epoxy glass material, with a dielectric constant
   typically between <b>4 and 5</b>. Cheaper materials such as phenolic exist but are not suitable for plated-through
   holes or fine tolerance designs. Teflon (PTFE) is used only for special high-frequency designs.
   <div class="tiny muted" style="margin-top:8px">Typical dielectric constants: phenolic/epoxy resin on paper 4.2 &middot;
   ceramics 6 &middot; polyester foil 2.5 &middot; Teflon 2.6</div></div>
   <p>The alternatives to a PCB &mdash; wire wrap and point-to-point construction &mdash; are very inefficient. A PCB
   has robust physical strength, good electrical properties, and is cheap and easy to manufacture, which is why it
   won.</p>
   <div class="note warn"><b>Two things you must not do to a board.</b> Do not touch the conducting paths &mdash; skin
   contamination causes corrosion. Do not subject the board to mechanical stress &mdash; it causes hairline cracks in
   the traces, which are extremely hard to find and often intermittent.</div>`,

  developing:`
   <p>The one calculation in this module, and the reasoning that hangs off it.</p>
   <div class="note"><b>Trace resistance.</b>
   <span class="mono">R = &rho;l / A = &rho;l / (d &times; b)</span><br>
   where &rho; is the specific resistance of copper, <b>l</b> the trace length, <b>d</b> the trace thickness and
   <b>b</b> the trace width. Copper thickness is standardised at <b>35, 70 or 105 microns</b>.
   <ul class="plain" style="margin:8px 0 0">
     <li>The <b>wider</b> the trace, the <b>lower</b> the resistance.</li>
     <li>Trace resistance is <b>directly proportional to trace length</b>.</li>
     <li>As a general rule, the bigger the trace width the better &mdash; and the width is dictated by the current
     flowing through it.</li>
   </ul></div>
   <div class="note"><b>Current-carrying capacity depends on more than width.</b> It also depends on board thickness,
   the substrate material, ventilation, and heat dissipation from the mounted components and their attachment points.
   A trace that is fine in open air can overheat under a hot component or inside a sealed LRU.</div>
   <p><b>Manufacturing, two ways.</b></p>
   <ul class="plain">
     <li><b>Subtractive process</b> &mdash; the whole board is laminated with copper, the wanted paths are protected,
     and the rest is etched away. Simple, but copper is expensive and this throws most of it away.</li>
     <li><b>Additive process</b> &mdash; the board is not fully laminated; the conducting paths are galvanized onto it.
     Less waste.</li>
   </ul>
   <div class="note ok"><b>Protection after manufacture: conformal coating</b> &mdash; a thin, usually transparent,
   non-conducting layer that covers the entire board <b>except the edge connectors</b>. It is what prevents corrosion
   in service, and it is why you cannot simply solder onto a repaired board without removing and then reapplying it.</div>`,

  proficient:`
   <p>Board construction, interconnection and assembly &mdash; the vocabulary you need to read a repair scheme.</p>
   <ul class="plain">
     <li><b>Single sided:</b> traces on one side only, usually the solder side; components on the component side;
     holes are <b>non-plated through holes (NPTH)</b>.</li>
     <li><b>Double sided:</b> traces on both sides, and the drilled hole walls are copper plated &mdash; <b>plated
     through holes (PTH)</b> &mdash; so top and bottom circuitry is electrically interconnected.</li>
     <li><b>Multi-layer:</b> separately etched thin boards bonded together, alternating copper and insulator layers,
     used as circuit density rises.</li>
     <li><b>Vias</b> are plated holes whose only job is to interconnect traces on different copper layers. They are
     <b>smaller than PTH and NPTH and are not meant for mounting or soldering components</b>. Three kinds:
     <b>through-hole via</b> (all the way through), <b>buried via</b> (between inner layers only, invisible from
     outside) and <b>blind via</b> (from an outer layer to an inner one). A buried via is why a board that looks
     undamaged can still have an open circuit you cannot see.</li>
     <li><b>THT vs SMT.</b> Through-hole technology puts leaded components through holes, with the component side on
     top and the solder side beneath; DIP packages have a 100 mil pin pitch. Surface mount solders components to pads
     <b>without through holes</b>; the parts are smaller and designed to be handled by machines rather than by hand,
     which is exactly why SMT rework needs different tooling and training.</li>
     <li><b>Assembly soldering.</b> <b>Wave soldering</b> passes the board over a pool of molten solder on a conveyor.
     <b>Reflow soldering</b> applies solder paste to the pads, places the SMDs onto it, and takes the board through an
     oven &mdash; the preferred method for SMD.</li>
     <li><b>High frequency effects.</b> At high frequencies the physical dimensions of a conducting path change its
     electrical behaviour: <b>wide conducting paths create capacitance, narrow conducting paths create inductance</b>.
     A trace is not just a wire once the frequency is high enough.</li>
   </ul>
   <div class="note"><b>Transfer task.</b> A double-sided board in a vibrating equipment bay shows an intermittent
   open circuit that clears when the board is flexed. State the two most likely physical causes, say which board
   feature makes one of them invisible to inspection, and describe how conformal coating both helps and hinders the
   repair.</div>`
 },

MODULES.forEach(m=>{ VIEWS[m.id] = host => renderModule(host, m); });

function renderModule(host, m){
  const C = CONTENT[m.id];
  const tier = tierOf(m.id);
  setHead("Module "+m.n, m.title);

  /* ---- tier banner + level switch ---- */
  const tb = el("div",{class:"tier-banner tb-"+tier});
  tb.innerHTML = `
    <div class="ic">${TIER_META[tier].icon}</div>
    <div class="tx"><b>${TIER_META[tier].label} pathway</b><span>${TIER_META[tier].note}</span></div>
    <div class="no-print"><select id="tierSel" style="width:auto;font-size:.8rem;padding:6px 8px">
      <option value="foundation">Foundation</option>
      <option value="developing">Developing</option>
      <option value="proficient">Proficient</option>
    </select></div>`;
  host.appendChild(tb);
  $("#tierSel").value = tier;
  $("#tierSel").onchange = e=>{ S.tiers[m.id]=e.target.value; save(); go(m.id); };

  /* ---- 1 · concept ---- */
  const c1 = el("div",{class:"card"});
  c1.innerHTML = `<div class="card-h"><span class="dot"></span><h3>1 &middot; The concept</h3></div>`;
  c1.appendChild(el("div",{}, C.concept[tier]));
  const readRow = el("div",{class:"btn-row no-print", style:"margin-top:14px"});
  const readBtn = el("button",{class:"btn sec", onclick:()=>{ markProg(m.id,"concept"); readBtn.textContent="Read ✓"; readBtn.disabled=true; }},
                     prog(m.id).concept ? "Read ✓" : "I've worked through this");
  readBtn.disabled = prog(m.id).concept;
  readRow.appendChild(readBtn);
  c1.appendChild(readRow);
  host.appendChild(c1);

  /* ---- 2 · lab ---- */
  const labWrap = el("div");
  labWrap.appendChild(el("div",{class:"card-h", style:"margin:22px 0 10px"},
    '<span class="dot"></span><h3>2 &middot; Interactive lab &mdash; change something and watch what happens</h3>'));
  const labMount = el("div");
  labWrap.appendChild(labMount);
  host.appendChild(labWrap);
  try{ LABS[m.id](labMount, m.id, tier); }
  catch(err){ labMount.appendChild(el("div",{class:"note err"},"Lab failed to load: "+esc(err.message))); }

  /* ---- 3 · practice ---- */
  const c3 = el("div",{class:"card"});
  c3.innerHTML = `<div class="card-h"><span class="dot"></span><h3>3 &middot; Check yourself</h3></div>
    <p class="small muted">Three questions pitched at your current level. Wrong answers are logged as
    misconceptions so your summary can point you back to them &mdash; guessing costs you nothing but tells you less.</p>`;
  const qHost = el("div");
  c3.appendChild(qHost);
  host.appendChild(c3);
  renderPractice(qHost, m.id, C.practice[tier]);

  /* ---- 4 · feynman ---- */
  host.appendChild(renderFeynman(m.id, C.feynman));

  /* ---- footer nav ---- */
  const idx = MODULES.findIndex(x=>x.id===m.id);
  const foot = el("div",{class:"modfoot no-print"});
  if(idx>0) foot.appendChild(el("button",{class:"btn sec", onclick:()=>go(MODULES[idx-1].id)},"&larr; Module "+MODULES[idx-1].n));
  else foot.appendChild(el("span"));
  if(idx<MODULES.length-1) foot.appendChild(el("button",{class:"btn", onclick:()=>go(MODULES[idx+1].id)},"Module "+MODULES[idx+1].n+" &rarr;"));
  else foot.appendChild(el("button",{class:"btn ok", onclick:()=>go("summary")},"Build my knowledge summary &rarr;"));
  host.appendChild(foot);
}

   ============================================================ */
function renderPractice(host, modId, qs){
  if(!S.practice[modId]) S.practice[modId] = {};
  const rec = S.practice[modId];

  qs.forEach((q,i)=>{
    const box = el("div",{class:"q"});
    box.appendChild(el("div",{class:"stem"}, `<span class="tiny muted">Question ${i+1}</span><br>${q.stem}`));
    const opts = el("div",{class:"opts"});
    const fb = el("div",{class:"fb"});

    const paint = ()=>{
      const r = rec[q.id];
      $$(".opt",opts).forEach((b,bi)=>{
        b.className = "opt locked";
        if(r){
          if(bi===q.ans) b.classList.add("right");
          else if(bi===r.choice) b.classList.add("wrong");
        }else{
          b.className = "opt";
        }
      });
      if(r){
        fb.className = "fb show "+(r.correct?"good":"bad");
        fb.innerHTML = (r.correct?"<b>Correct.</b> ":"<b>Not quite.</b> ")+q.why;
      }
    };

    q.opts.forEach((o,oi)=>{
      const b = el("button",{class:"opt", onclick:()=>{
        if(rec[q.id]) return;
        const ok = oi===q.ans;
        rec[q.id] = {choice:oi, correct:ok};
        if(!ok && q.mis) addMisconception(modId, q.mis);
        save();
        paint();

   11 · FEYNMAN ENGINE
   ============================================================ */
function analyseFeynman(text, ideas){
  const t = " "+text.toLowerCase().replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ")+" ";
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const covered = [], missing = [];
  ideas.forEach(idea=>{
    const hit = idea.terms.some(term=> t.indexOf(" "+term.toLowerCase()) !== -1 || t.indexOf(term.toLowerCase()) !== -1);
    (hit?covered:missing).push(idea.k);
  });
  // sentence count as a rough proxy for whether it is an explanation or a label
  const sentences = (text.match(/[.!?]+/g)||[]).length;
  return {words, sentences, covered, missing, pct: Math.round(covered.length/ideas.length*100)};
}

function renderFeynman(modId, F){
  const card = el("div",{class:"card"});
  card.innerHTML = `<div class="card-h"><span class="dot"></span><h3>4 &middot; Explain it back (Feynman method)</h3></div>
    <p class="small muted">If you cannot explain it simply, you do not understand it yet. Write it as if the person in
    front of you has never seen this topic &mdash; no formulas you have not explained, no jargon you have not unpacked.</p>
    <div class="note">${F.prompt}</div>`;

  const ta = el("textarea",{placeholder:F.starter, id:"fey_"+modId});
  ta.value = S.feynman[modId] || "";
  card.appendChild(ta);

  const meta = el("div",{class:"small muted", style:"margin-top:6px"});
  const out = el("div",{style:"margin-top:14px"});

  const refresh = ()=>{
    const n = ta.value.trim() ? ta.value.trim().split(/\s+/).length : 0;
    meta.textContent = n+" words"+(n<40?" — aim for roughly 60–120":"");
  };
  ta.addEventListener("input", refresh);
  refresh();
  card.appendChild(meta);

  const row = el("div",{class:"btn-row no-print", style:"margin-top:12px"});
  const chk = el("button",{class:"btn", onclick:()=>{
    const text = ta.value.trim();
    S.feynman[modId] = text; save();
    const a = analyseFeynman(text, F.ideas);
    S.feynmanScore[modId] = {covered:a.covered, missing:a.missing, words:a.words, pct:a.pct};
    save();
    out.innerHTML = "";

    if(a.words < 25){
      out.appendChild(el("div",{class:"note warn"},
        "<b>Too short to check.</b> A one-line answer is a label, not an explanation. Write it as you would say it out "+
        "loud to someone standing next to you &mdash; roughly 60 to 120 words."));
      return;
    }

    const head = el("div",{class:"note "+(a.pct>=80?"ok":(a.pct>=50?"warn":"err"))});
    head.innerHTML = `<b>${a.covered.length} of ${F.ideas.length} key ideas covered (${a.pct}%).</b> `+
      (a.pct>=80 ? "That is a solid explanation &mdash; someone could learn the idea from it."
       : a.pct>=50 ? "You have the shape of it. The gaps below are the parts your listener would still be confused about."
       : "Most of the key ideas are missing. Read the concept section again, then rewrite &mdash; do not just add the words in.");
    out.appendChild(head);

    const g = el("div",{class:"grid g2"});
    const cvd = el("div");
    cvd.innerHTML = `<div class="eyebrow">You covered</div>`+
      (a.covered.length? "<ul class='tick'>"+a.covered.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"
                       : "<p class='small muted'>Nothing yet.</p>");
    const mis = el("div");
    mis.innerHTML = `<div class="eyebrow">Still missing</div>`+
      (a.missing.length? "<ul class='tick'>"+a.missing.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>"
                       : "<p class='small muted'>Nothing &mdash; all key ideas present.</p>");
    g.appendChild(cvd); g.appendChild(mis);
    out.appendChild(g);

    out.appendChild(el("div",{class:"note small"},
      "<b>Careful:</b> this check looks for the ideas, not for the exact words. Dropping a missing keyword into your "+
      "text will tick the box without teaching anyone anything. Rewrite the sentence so the idea is actually explained."));

    markProg(modId,"feynman");
  }},"Check my explanation");
  row.appendChild(chk);
  row.appendChild(el("button",{class:"btn sec", onclick:()=>{ ta.value=""; refresh(); out.innerHTML=""; }},"Clear"));
  card.appendChild(row);
  card.appendChild(out);
  return card;
}

/* ---- diode physics (Shockley) ---- */
const Q_K = 8.617333e-5;                       // eV/K
function diodeModel(mat, tempC){
  const T = tempC + 273.15;
  const VT = Q_K * T;                          // thermal voltage
  const n  = (mat==="ge") ? 1.5 : 1.8;
  const knee = (mat==="ge") ? 0.30 : 0.70;
  // Is chosen so that at 25 C the knee current is 10 mA at the quoted VF
  const VT25 = Q_K * 298.15;
  const Is25 = 0.01 / (Math.exp(knee/(n*VT25)) - 1);
  const Is   = Is25 * Math.pow(2, (tempC-25)/10);   // leakage roughly doubles per 10 C
  return {VT, n, Is, knee};
}
function diodeI(V, m){ return m.Is * (Math.exp(V/(m.n*m.VT)) - 1); }
/* solve  Vsrc = Vd + I(Vd)*R  by bisection */
function solveDiode(Vsrc, R, m){
  let lo = Math.min(-60, Vsrc-1), hi = Math.max(1.5, Vsrc+1);
  for(let i=0;i<80;i++){
    const mid = (lo+hi)/2;
    const f = mid + diodeI(mid, m)*R - Vsrc;
    if(f > 0) hi = mid; else lo = mid;
  }
  const Vd = (lo+hi)/2;
  return {Vd, I: diodeI(Vd, m)};
}

/* ---- tiny plot helper: returns an SVG string ---- */
function plotSVG(o){
  const W = o.w||520, H = o.h||250, L = o.left||54, B = 30, T = 18, Rp = 14;
  const pw = W-L-Rp, ph = H-B-T;
  const sx = v => L + (v - o.xmin)/(o.xmax-o.xmin)*pw;
  const sy = v => T + ph - (v - o.ymin)/(o.ymax-o.ymin)*ph;
  let g = "";
  const nx = o.nx||5, ny = o.ny||4;
  for(let i=0;i<=nx;i++){
    const v = o.xmin + i*(o.xmax-o.xmin)/nx, x = sx(v);
    g += `<line x1="${x}" y1="${T}" x2="${x}" y2="${T+ph}" stroke="${GRID}" stroke-width="1"/>`;
    g += `<text x="${x}" y="${H-10}" class="ax" text-anchor="middle">${o.xfmt?o.xfmt(v):v.toFixed(1)}</text>`;
  }
  for(let i=0;i<=ny;i++){
    const v = o.ymin + i*(o.ymax-o.ymin)/ny, y = sy(v);
    g += `<line x1="${L}" y1="${y}" x2="${L+pw}" y2="${y}" stroke="${GRID}" stroke-width="1"/>`;
    g += `<text x="${L-6}" y="${y+3.5}" class="ax" text-anchor="end">${o.yfmt?o.yfmt(v):v.toFixed(1)}</text>`;
  }
  if(o.xmin < 0 && o.xmax > 0) g += `<line x1="${sx(0)}" y1="${T}" x2="${sx(0)}" y2="${T+ph}" stroke="#4a6076" stroke-width="1.4"/>`;
  if(o.ymin < 0 && o.ymax > 0) g += `<line x1="${L}" y1="${sy(0)}" x2="${L+pw}" y2="${sy(0)}" stroke="#4a6076" stroke-width="1.4"/>`;
  (o.series||[]).forEach(s=>{
    let d = "";
    s.pts.forEach((p,i)=>{
      const x = sx(p[0]), y = Math.max(T-40, Math.min(T+ph+40, sy(p[1])));
      d += (i? " L":"M")+x.toFixed(1)+","+y.toFixed(1);
    });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w||2.2}"${s.dash?` stroke-dasharray="${s.dash}"`:""}/>`;
    if(s.label) g += `<text x="${L+pw-4}" y="${sy(s.pts[s.pts.length-1][1])-6}" class="ax" text-anchor="end" fill="${s.color}">${s.label}</text>`;
  });
  (o.marks||[]).forEach(mk=>{
    const x = sx(mk.x), y = Math.max(T, Math.min(T+ph, sy(mk.y)));
    g += `<line x1="${x}" y1="${T+ph}" x2="${x}" y2="${y}" stroke="${AMB}" stroke-dasharray="3 3" stroke-width="1"/>
          <circle cx="${x}" cy="${y}" r="5" fill="${AMB}"/>`;
    if(mk.label){
      const right = x > L + pw*0.62;
      g += `<text x="${right? x-9 : x+9}" y="${y-7}" class="ax" fill="${AMB}" text-anchor="${right?"end":"start"}">${mk.label}</text>`;
    }
  });
  return `<svg class="viz" viewBox="0 0 ${W} ${H}">
    <style>.ax{fill:#7d94a8;font:600 9px ui-monospace,monospace}.tt{fill:#8fa3b5;font:700 10px system-ui}</style>
    ${g}
    <text x="${L}" y="${T-5}" class="tt">${o.title||""}</text>
  </svg>`;
}

LABS.m1 = function(host, id, tier){

  right.appendChild(ctrl("Supply voltage V<sub>S</sub>","vVs",rV));
  right.appendChild(ctrl("Series resistor R","vR",rR));
  right.appendChild(ctrl("Junction temperature","vT",rT));

  right.appendChild(flipBtn);

  const chal = el("div",{class:"card tight", style:"margin:0"});
  chal.innerHTML = `<div class="eyebrow">Bench tasks</div>`;
  const chalTxt = el("div",{class:"small", style:"margin-bottom:10px"});
  const chalRow = el("div",{class:"btn-row"});
  const chalFb  = el("div",{class:"small", style:"margin-top:9px"});
  chal.appendChild(chalTxt); chal.appendChild(chalRow); chal.appendChild(chalFb);
  right.appendChild(chal);

  const TASKS = {
    foundation:[
      {q:"Get the lamp <b>lit</b>: forward bias a silicon diode from a supply of at least 2 V.", test:s=>s.I>0.001 && !s.flipped && s.mat==="si"},
      {q:"Now <b>turn the diode round</b> and confirm the current collapses to almost nothing.", test:s=>s.flipped && Math.abs(s.I)<1e-4},
      {q:"Switch to <b>germanium</b> and set the supply so it is only just conducting (between 0.3 V and 0.5 V).", test:s=>s.mat==="ge" && !s.flipped && s.Vsrc>=0.3 && s.Vsrc<=0.5 && s.I>1e-5}
    ],
    developing:[
      {q:"Set up a silicon diode conducting about <b>10 mA</b> (within 1 mA).", test:s=>!s.flipped && Math.abs(s.I-0.010)<0.001},
      {q:"With the diode conducting, raise the temperature to <b>100&nbsp;&deg;C</b> and note what happens to V<sub>D</sub>.", test:s=>s.tempC>=100 && s.I>0.001},
      {q:"Reverse bias a <b>germanium</b> diode and find its leakage current &mdash; then compare it with silicon.", test:s=>s.mat==="ge" && s.flipped && s.Vsrc>1}
    ],
    proficient:[
      {q:"Find the supply voltage at which a silicon diode passes exactly <b>20 mA</b> through a 470 &#8486; resistor.", test:s=>!s.flipped && Math.abs(s.R-470)<15 && Math.abs(s.I-0.020)<0.0015},
      {q:"Demonstrate the temperature coefficient: hold the current near 10 mA and show V<sub>D</sub> falling as temperature rises above 100&nbsp;&deg;C.", test:s=>s.tempC>=100 && s.I>0.005 && s.Vd<0.66},
      {q:"Show that germanium's reverse leakage exceeds silicon's by at least a factor of 100 at the same reverse voltage.", test:s=>s.mat==="ge" && s.flipped && s.Vsrc>=5}
    ]
  };
  let ti = 0; const tasks = TASKS[tier];

  function state(){
