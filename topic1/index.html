    const conducting = s.I > 1e-4;
    const col = conducting ? HI : LO;

    /* circuit */
    const dx = 250, dy = 46;
    const tri = s.flipped
      ? `<path d="M${dx+26},${dy-13} L${dx+26},${dy+13} L${dx},${dy} Z" fill="#16222e" stroke="${col}" stroke-width="2"/>
         <line x1="${dx}" y1="${dy-13}" x2="${dx}" y2="${dy+13}" stroke="${col}" stroke-width="3"/>`
      : `<path d="M${dx},${dy-13} L${dx},${dy+13} L${dx+26},${dy} Z" fill="#16222e" stroke="${col}" stroke-width="2"/>
         <line x1="${dx+26}" y1="${dy-13}" x2="${dx+26}" y2="${dy+13}" stroke="${col}" stroke-width="3"/>`;
    circ.innerHTML = `<svg class="viz" viewBox="0 0 520 150">
      <style>.cl{fill:#8fa3b5;font:600 10px system-ui}.cv{font:700 11px ui-monospace,monospace}</style>
      <line x1="60" y1="${dy}" x2="${dx}" y2="${dy}" stroke="${col}" stroke-width="2.4"/>
      ${tri}
      <text x="${dx-2}" y="${dy-20}" class="cl" text-anchor="middle">${s.flipped?"K":"A"}</text>
      <text x="${dx+28}" y="${dy-20}" class="cl" text-anchor="middle">${s.flipped?"A":"K"}</text>
      <line x1="${dx+26}" y1="${dy}" x2="360" y2="${dy}" stroke="${col}" stroke-width="2.4"/>
      <rect x="360" y="${dy-9}" width="44" height="18" fill="#16222e" stroke="#7d94a8" stroke-width="1.6"/>
      <text x="382" y="${dy+4}" class="cl" text-anchor="middle">R</text>
      <line x1="404" y1="${dy}" x2="460" y2="${dy}" stroke="${col}" stroke-width="2.4"/>
      <circle cx="470" cy="${dy}" r="14" fill="${conducting?'rgba(245,180,49,.3)':'#16212c'}" stroke="${conducting?AMB:LO}" stroke-width="2"/>
      <text x="470" y="${dy+34}" class="cl" text-anchor="middle">${conducting?"LAMP ON":"lamp off"}</text>
      <line x1="470" y1="${dy+14}" x2="470" y2="120" stroke="${col}" stroke-width="2.4"/>
      <line x1="470" y1="120" x2="60" y2="120" stroke="${col}" stroke-width="2.4"/>
      <line x1="60" y1="120" x2="60" y2="${dy}" stroke="${col}" stroke-width="2.4"/>
      <line x1="44" y1="${dy+22}" x2="76" y2="${dy+22}" stroke="#9fb4c7" stroke-width="2.4"/>
      <line x1="52" y1="${dy+32}" x2="68" y2="${dy+32}" stroke="#9fb4c7" stroke-width="4"/>
      <text x="18" y="${dy+30}" class="cv" fill="${Vs>=0?AMB:CYN}">${Vs.toFixed(1)}V</text>
    </svg>`;

    /* readouts */
    ro.innerHTML = "";
    ro.appendChild(readout([
      {k:"Bias", v: s.Veff>=0 ? "FORWARD" : "REVERSE", cls: s.Veff>=0?"g":"c"},
      {k:"V across diode", v: s.Vd.toFixed(3)+" V", cls:"hl"},
      {k:"Current", v: fmtI(s.I)},
      {k:"V across R", v: (s.I*s.R).toFixed(2)+" V"}
    ]));
    const knee = s.m.knee;
    if(s.Veff >= 0 && s.I <= 1e-4){
      ro.appendChild(el("div",{class:"note warn small", style:"margin-bottom:0"},
        `<b>Forward biased but not conducting.</b> The supply is only ${Vs.toFixed(1)} V and the junction needs about
         <b>${knee.toFixed(1)} V</b> before it will pass useful current. Below the barrier potential the diode is
         effectively an open circuit.`));
    }else if(s.Veff < 0){
      ro.appendChild(el("div",{class:"note small", style:"margin-bottom:0"},
        `<b>Reverse biased.</b> Almost the whole supply appears across the diode (${s.Vd.toFixed(2)} V) and only a
         leakage current of ${fmtI(Math.abs(s.I))} flows &mdash; carried by thermally generated minority carriers.
         ${mat==="ge"?"Germanium leaks noticeably more than silicon because its depletion region is smaller.":"Switch to germanium and compare: it leaks far more."}`));
    }else{
      ro.appendChild(el("div",{class:"note ok small", style:"margin-bottom:0"},
        `<b>Conducting.</b> The diode holds about <b>${s.Vd.toFixed(2)} V</b> and the remaining
         ${(s.I*s.R).toFixed(2)} V appears across R, setting the current at ${fmtI(s.I)}.
         ${tempC>25?` At ${tempC} °C the forward drop has fallen from its 25 °C value — T&uarr; means V<sub>F</sub>&darr;.`:""}`));
    }

    /* I-V curve */
    const pts25 = [], ptsT = [];
    const m25 = diodeModel(mat, 25);
    for(let v=-1.0; v<=1.0001; v+=0.005){
      pts25.push([v, Math.max(-0.004, Math.min(0.03, diodeI(v, m25)))]);
      ptsT.push([v, Math.max(-0.004, Math.min(0.03, diodeI(v, s.m)))]);
    }
    curve.innerHTML = plotSVG({
      title:"Characteristic curve — I against V across the diode",
      xmin:-1, xmax:1, ymin:-0.005, ymax:0.03, nx:8, ny:5,
      xfmt:v=>v.toFixed(1)+"V", yfmt:v=>(v*1000).toFixed(0)+"mA",
      series:[
        {pts:pts25, color:"#6f8598", w:1.6, dash:"5 4", label:"25 °C"},
        {pts:ptsT,  color:ACC, w:2.4, label:tempC+" °C"}
      ],
      marks:[{x:Math.max(-1,Math.min(1,s.Vd)), y:Math.max(-0.005,Math.min(0.03,s.I)), label:"operating point"}]
    });
    drawChal();
  }

  function drawChal(){
    const t = tasks[ti];
    chalTxt.innerHTML = `<span class="tiny muted">Task ${ti+1} of ${tasks.length}</span><br>${t.q}`;
    chalRow.innerHTML = "";
    chalRow.appendChild(el("button",{class:"btn", onclick:()=>{
      const s = state();
      if(t.test(s)){
        chalFb.innerHTML = `<span class="pill g">Done</span> V<sub>D</sub> = ${s.Vd.toFixed(3)} V, I = ${fmtI(s.I)}`;
        markProg(id,"lab");
        if(ti < tasks.length-1){ ti++; setTimeout(()=>{ chalFb.innerHTML=""; drawChal(); }, 1300); }
      }else{
        const s2 = state();
        chalFb.innerHTML = `<span class="pill r">Not yet</span> currently ${s2.flipped?"reverse":"forward"} biased, V<sub>D</sub> = ${s2.Vd.toFixed(3)} V, I = ${fmtI(s2.I)}`;
      }
    }},"Check the bench"));
  }

  [rV,rR,rT].forEach(r=>r.addEventListener("input",()=>{ draw(); labTouch(id,9); }));
  draw();
};

/* ---------------- M2 · MULTIMETER FAULT BENCH ---------------- */
LABS.m2 = function(host, id, tier){
  const box = labShell("Multimeter test bench","A diode of unknown condition is on the bench. Find out what it is.");
  const B = box._body;
  host.appendChild(box);

  const CONDS = ["good","open","short"];
  let cond = CONDS[Math.floor(Math.random()*3)];
  let mode = "diode";      // "diode" | "res"
  let dir  = "fwd";        // "fwd" | "rev"
  let answered = false, score = 0, attempts = 0;

  const cols = el("div",{class:"lab-cols"});
  const left = el("div"), right = el("div");
  cols.appendChild(left); cols.appendChild(right);
  B.appendChild(cols);

  const meter = el("div"); left.appendChild(meter);
  const ctrls = el("div",{style:"margin-top:14px"}); left.appendChild(ctrls);
  const diag  = el("div"); right.appendChild(diag);
  const tbl   = el("div",{style:"margin-top:14px"}); right.appendChild(tbl);

  function reading(){
    // returns {big, small}
    if(mode==="diode"){
      if(cond==="good") return dir==="fwd" ? {big:"0.758", small:"V · diode test"} : {big:"- OL -", small:"internal meter voltage"};
      if(cond==="open") return {big:"- OL -", small:"internal meter voltage"};
      return {big:"0.000", small:"V · diode test"};
    }else{
      if(cond==="good") return dir==="fwd" ? {big:"0.612", small:"kΩ · resistance"} : {big:"- OL -", small:"over-range"};
      if(cond==="open") return {big:"- OL -", small:"over-range"};
      return {big:"0.001", small:"kΩ · resistance"};
    }
  }

  function draw(){
    const r = reading();
    meter.innerHTML = `<svg class="viz" viewBox="0 0 460 190">
      <style>.lcd{font:700 44px ui-monospace,monospace;fill:#4dff88}.sm{font:600 10px system-ui;fill:#7d94a8}
             .bt{font:700 9px system-ui;fill:#8fa3b5}</style>
      <rect x="14" y="14" width="432" height="162" rx="10" fill="#141d27" stroke="#2b3b4b" stroke-width="2"/>
      <rect x="30" y="30" width="290" height="70" rx="6" fill="#0a1610" stroke="#1e3a2a" stroke-width="2"/>
      <text x="308" y="82" class="lcd" text-anchor="end">${r.big}</text>
      <text x="34" y="118" class="sm">${r.small}</text>
      <rect x="336" y="30" width="96" height="70" rx="6" fill="#0f1821" stroke="#26333f"/>
      <text x="384" y="56" class="bt" text-anchor="middle">MODE</text>
      <text x="384" y="76" class="bt" text-anchor="middle" fill="${ACC}">${mode==="diode"?"DIODE TEST":"RESISTANCE"}</text>
      <text x="384" y="92" class="bt" text-anchor="middle">${mode==="diode"?"(2.5–3.5 V)":"Ω range"}</text>
      <circle cx="${dir==="fwd"?120:230}" cy="146" r="9" fill="#ff5a5f"/>
      <circle cx="${dir==="fwd"?230:120}" cy="146" r="9" fill="#20303f" stroke="#5b6f82"/>
      <line x1="120" y1="146" x2="230" y2="146" stroke="#3a4c5e" stroke-width="2"/>
      <rect x="160" y="136" width="34" height="20" rx="3" fill="#1a2530" stroke="#5b6f82"/>
      <rect x="${dir==="fwd"?188:160}" y="136" width="6" height="20" fill="#cfd8e0"/>
      <text x="175" y="176" class="sm" text-anchor="middle">${dir==="fwd"?"red probe on anode (forward)":"red probe on cathode (reverse)"}</text>
      <text x="300" y="176" class="sm">device under test</text>
    </svg>`;

    ctrls.innerHTML = "";
    ctrls.appendChild(segBar([["diode","Diode test position"],["res","Resistance range"]], mode, v=>{ mode=v; draw(); labTouch(id,6); }, "margin-bottom:10px"));
    ctrls.appendChild(segBar([["fwd","Forward bias"],["rev","Reverse bias"]], dir, v=>{ dir=v; draw(); labTouch(id,6); }, "margin-bottom:0"));

    diag.innerHTML = `<div class="eyebrow">Your diagnosis</div>
      <p class="small muted">Test it in <b>both</b> directions before you decide. A healthy diode is the only one that
      gives two different readings.</p>`;
    const row = el("div",{class:"btn-row"});
    [["good","Good diode"],["open","Faulty &mdash; open"],["short","Faulty &mdash; short"]].forEach(([k,lab])=>{
      row.appendChild(el("button",{class:"btn sec", onclick:()=>{
        if(answered) return;
        answered = true; attempts++;
        const ok = (k===cond);
        if(ok) score++;
        else addMisconception(id, "Misread a multimeter diode test - check both directions before diagnosing.");
        markProg(id,"lab");
        const fb = el("div",{class:"note "+(ok?"ok":"err")+" small", style:"margin:12px 0 0"});
        fb.innerHTML = ok
          ? `<b>Correct &mdash; it was ${cond.toUpperCase()}.</b> ${explain(cond)}`
          : `<b>Not this one.</b> You said <b>${k}</b>, but the diode was <b>${cond.toUpperCase()}</b>. ${explain(cond)}`;
        diag.appendChild(fb);
        const again = el("button",{class:"btn", style:"margin-top:10px", onclick:()=>{
          cond = CONDS[Math.floor(Math.random()*3)]; answered=false; dir="fwd"; draw();
        }},"Put another diode on the bench");
        diag.appendChild(again);
        diag.appendChild(el("div",{class:"tiny muted", style:"margin-top:8px"}, "Score: "+score+" / "+attempts));
      }}, lab));
    });
    if(!answered) diag.appendChild(row);

    tbl.innerHTML = `<div class="eyebrow">Signature table</div>
      <table class="tt" style="font-family:var(--sans);font-size:.79rem">
        <thead><tr><th>Condition</th><th>Forward</th><th>Reverse</th></tr></thead>
        <tbody>
          <tr><td>Good</td><td>0.7 V / low &#8486;</td><td>OL / high &#8486;</td></tr>
          <tr><td>Open</td><td>OL / high &#8486;</td><td>OL / high &#8486;</td></tr>
          <tr><td>Short</td><td>0 V / low &#8486;</td><td>0 V / low &#8486;</td></tr>
        </tbody></table>
      ${tier!=="foundation" ? `<div class="note small" style="margin-bottom:0"><b>In service:</b> a low reading in both
      directions on a board is not proof of a short &mdash; a resistor or coil in parallel gives the meter another path.
      Lift one leg before you condemn the part.</div>` : ""}`;
  }

  function explain(c){
    if(c==="good") return "Forward it reads about 0.7 V (or a low resistance); reverse it reads OL (or a high resistance). Two different answers means the junction is doing its job.";
    if(c==="open") return "It blocked in BOTH directions. The meter's test voltage could not push current through the junction either way, so the junction is broken.";
    return "It conducted in BOTH directions, reading near zero. The junction has been destroyed and the device is now effectively a piece of wire.";
  }

  draw();
};
/* ---------------- M3 · SPECIAL DIODE EXPLORER ---------------- */
LABS.m3 = function(host, id, tier){
  const box = labShell("Special diode explorer","Four devices, four different jobs");
  const B = box._body;
  host.appendChild(box);
  let tab = "led";
  B.appendChild(segBar([["led","LED + resistor"],["varactor","Varactor / VCO"],["photo","Photodiode"],["varistor","Varistor"]],
    tab, v=>{ tab=v; paint(); labTouch(id,5); }));
  const mount = el("div"); B.appendChild(mount);

  /* ---- LED ---- */
  function led(){
    mount.innerHTML = "";
    const cols = el("div",{class:"lab-cols"});
    const L = el("div"), Rt = el("div"); cols.appendChild(L); cols.appendChild(Rt); mount.appendChild(cols);
    const view = el("div"); L.appendChild(view);
    const out  = el("div",{style:"margin-top:14px"}); L.appendChild(out);
    const rVs = range("lVs",3,28,0.5,5), rVf = range("lVf",1.2,3.2,0.1,2.0), rR = range("lR",10,2000,10,150);
    Rt.appendChild(ctrl("Supply voltage V<sub>S</sub>","vlVs",rVs));
    Rt.appendChild(ctrl("LED forward voltage V<sub>F</sub>","vlVf",rVf));
    Rt.appendChild(ctrl("Series resistor R","vlR",rR));
    Rt.appendChild(el("div",{class:"note small"},
      "<b>R = (V<sub>S</sub> &minus; V<sub>F</sub>) / I<sub>F</sub></b>. An LED has no internal current limiting, so the resistor is what "+
      "keeps it alive. Aim for about 20 mA."));
    const target = el("div",{class:"card tight", style:"margin:0"});
    Rt.appendChild(target);
    function draw(){
      const Vs=+rVs.value, Vf=+rVf.value, R=+rR.value;
      $("#vlVs").textContent=Vs.toFixed(1)+" V"; $("#vlVf").textContent=Vf.toFixed(1)+" V"; $("#vlR").textContent=R+" Ω";
      const I = Math.max(0,(Vs-Vf))/R;
      const mA = I*1000;
      const bright = Math.min(1, mA/20);
      const state = mA<1 ? "dim" : mA<=25 ? "ok" : mA<=40 ? "hot" : "dead";
      const col = state==="dead" ? "#ff5a5f" : state==="hot" ? AMB : HI;
      view.innerHTML = `<svg class="viz" viewBox="0 0 460 150">
        <style>.cl{fill:#8fa3b5;font:600 10px system-ui}</style>
        <line x1="50" y1="60" x2="150" y2="60" stroke="${mA>0.5?HI:LO}" stroke-width="2.4"/>
        <rect x="150" y="51" width="46" height="18" fill="#16222e" stroke="#7d94a8" stroke-width="1.6"/>
        <text x="173" y="64" class="cl" text-anchor="middle">R</text>
        <line x1="196" y1="60" x2="270" y2="60" stroke="${mA>0.5?HI:LO}" stroke-width="2.4"/>
        <path d="M270,47 L270,73 L296,60 Z" fill="#16222e" stroke="${col}" stroke-width="2"/>
        <line x1="296" y1="47" x2="296" y2="73" stroke="${col}" stroke-width="3"/>
        <line x1="302" y1="44" x2="316" y2="32" stroke="${col}" stroke-width="${1+2*bright}"/>
        <line x1="308" y1="50" x2="322" y2="38" stroke="${col}" stroke-width="${1+2*bright}"/>
        <circle cx="283" cy="60" r="${18+10*bright}" fill="${col}" opacity="${0.10+0.30*bright}"/>
        <line x1="296" y1="60" x2="400" y2="60" stroke="${mA>0.5?HI:LO}" stroke-width="2.4"/>
        <line x1="400" y1="60" x2="400" y2="120" stroke="${mA>0.5?HI:LO}" stroke-width="2.4"/>
        <line x1="400" y1="120" x2="50" y2="120" stroke="${mA>0.5?HI:LO}" stroke-width="2.4"/>
        <line x1="50" y1="120" x2="50" y2="60" stroke="${mA>0.5?HI:LO}" stroke-width="2.4"/>
        <line x1="34" y1="76" x2="66" y2="76" stroke="#9fb4c7" stroke-width="2.4"/>
        <line x1="42" y1="86" x2="58" y2="86" stroke="#9fb4c7" stroke-width="4"/>
        <text x="8" y="70" class="cl">${Vs.toFixed(1)}V</text>
      </svg>`;
      out.innerHTML="";
      out.appendChild(readout([
        {k:"V across R", v:(Vs-Vf).toFixed(2)+" V"},
        {k:"LED current", v:mA.toFixed(1)+" mA", cls: state==="ok"?"g":"hl"},
        {k:"R for 20 mA", v:Math.round((Vs-Vf)/0.02)+" Ω", cls:"c"},
        {k:"Power in R", v:(I*I*R*1000).toFixed(0)+" mW"}
      ]));
      const msgs = {
        dim:"<b>Barely lit.</b> The resistor is too big for this supply, so very little current flows. Brightness is proportional to forward current.",
        ok:"<b>Healthy.</b> Around 20 mA is the usual design point &mdash; bright, and well within the LED's rating.",
        hot:"<b>Over-driven.</b> Above about 25 mA a standard LED runs hot, dims over time and its life shortens sharply.",
        dead:"<b>Destroyed.</b> With this little resistance the LED draws whatever the supply can deliver. This is exactly what happens when the series resistor is left out."
      };
      out.appendChild(el("div",{class:"note "+(state==="ok"?"ok":state==="dead"?"err":"warn")+" small", style:"margin-bottom:0"}, msgs[state]));
      target.innerHTML = `<div class="eyebrow">Task</div><div class="small">Set the resistor so the LED runs at
        <b>20 mA &plusmn;1 mA</b> from the present supply and V<sub>F</sub>.
        ${Math.abs(mA-20)<=1 ? '<div class="pill g" style="margin-top:8px">Correct — R = '+R+' Ω</div>'
                             : '<div class="tiny muted" style="margin-top:8px">Currently '+mA.toFixed(1)+' mA. The calculated value is '+Math.round((Vs-Vf)/0.02)+' Ω.</div>'}</div>`;
      if(Math.abs(mA-20)<=1) markProg(id,"lab");
    }
    [rVs,rVf,rR].forEach(r=>r.addEventListener("input",()=>{ draw(); labTouch(id,8); }));
    draw();
  }

  /* ---- VARACTOR ---- */
  function varactor(){
    mount.innerHTML = "";
    const cols = el("div",{class:"lab-cols wide-left"});
    const L = el("div"), Rt = el("div"); cols.appendChild(L); cols.appendChild(Rt); mount.appendChild(cols);
    const plot = el("div"); L.appendChild(plot);
    const out  = el("div",{style:"margin-top:14px"}); L.appendChild(out);
    const rVr = range("vVr",0.5,20,0.1,4), rL = range("vL",1,100,1,10);
    Rt.appendChild(ctrl("Reverse bias V<sub>R</sub>","vvVr",rVr));
    Rt.appendChild(ctrl("Tank inductance L","vvL",rL));
    Rt.appendChild(el("div",{class:"note small"},
      "C = A&epsilon;/d. More reverse bias &rarr; wider depletion layer &rarr; larger d &rarr; <b>lower</b> capacitance. "+
      "And f<sub>r</sub> = 1/(2&pi;&radic;LC), so lower C means a <b>higher</b> resonant frequency."));
    const C0 = 200e-12;                       // pF at zero bias
    const Cof = Vr => C0 / Math.pow(1 + Vr/0.7, 0.5);
    function draw(){
      const Vr=+rVr.value, Lh=+rL.value*1e-6;
      $("#vvVr").textContent=Vr.toFixed(1)+" V"; $("#vvL").textContent=(+rL.value)+" µH";
      const C = Cof(Vr);
      const fr = 1/(2*Math.PI*Math.sqrt(Lh*C));
      const pts=[]; for(let v=0.5;v<=20.01;v+=0.1) pts.push([v, Cof(v)*1e12]);
      plot.innerHTML = plotSVG({
        title:"Junction capacitance against reverse bias",
        xmin:0, xmax:20, ymin:0, ymax:180, nx:5, ny:4,
        xfmt:v=>v.toFixed(0)+"V", yfmt:v=>v.toFixed(0)+"pF",
        series:[{pts:pts, color:CYN, w:2.4}],
        marks:[{x:Vr, y:C*1e12, label:(C*1e12).toFixed(1)+" pF"}]
      });
      out.innerHTML="";
      out.appendChild(readout([
        {k:"Reverse bias", v:Vr.toFixed(1)+" V"},
        {k:"Capacitance", v:(C*1e12).toFixed(1)+" pF", cls:"c"},
        {k:"Resonant freq", v:(fr/1e6).toFixed(2)+" MHz", cls:"hl"},
        {k:"Depletion layer", v: Vr<3?"narrow":Vr<10?"medium":"wide"}
      ]));
      out.appendChild(el("div",{class:"note small", style:"margin-bottom:0"},
        `Raise the bias and watch the two numbers move in <b>opposite</b> directions: capacitance down, frequency up.
         That single relationship is the whole reason a varactor can tune a radio with a control voltage instead of a
         mechanical capacitor.`));
    }
    [rVr,rL].forEach(r=>r.addEventListener("input",()=>{ draw(); labTouch(id,8); }));
    draw();
  }

  /* ---- PHOTODIODE ---- */
  function photo(){
    mount.innerHTML = "";
    const cols = el("div",{class:"lab-cols"});
    const L = el("div"), Rt = el("div"); cols.appendChild(L); cols.appendChild(Rt); mount.appendChild(cols);
    const view = el("div"); L.appendChild(view);
    const out  = el("div",{style:"margin-top:14px"}); L.appendChild(out);
    const rLux = range("pLux",0,2.5,0.05,0), rTh = range("pTh",50,500,10,200);
    Rt.appendChild(ctrl("Illumination","vpLux",rLux));
    Rt.appendChild(ctrl("Trigger threshold","vpTh",rTh));
    Rt.appendChild(el("div",{class:"note small"},
      "A photodiode works in <b>reverse</b> bias. In the dark it blocks; illuminated it conducts, and the reverse "+
      "current is <b>proportional to the light</b>. Feed that current through a resistor and it can switch a transistor."));
    function draw(){
      const lux=+rLux.value, th=+rTh.value;
      $("#vpLux").textContent = lux.toFixed(2)+" (rel.)"; $("#vpTh").textContent = th+" µA";
      const uA = lux*200;                     // 200 uA per unit, linear as per the deck
      const on = uA >= th;
      view.innerHTML = `<svg class="viz" viewBox="0 0 460 170">
        <style>.cl{fill:#8fa3b5;font:600 10px system-ui}</style>
        <circle cx="70" cy="40" r="${8+16*(lux/2.5)}" fill="${AMB}" opacity="${0.12+0.5*(lux/2.5)}"/>
        <circle cx="70" cy="40" r="9" fill="${lux>0.05?AMB:"#26333f"}" stroke="#7d94a8"/>
        <text x="70" y="18" class="cl" text-anchor="middle">${lux>0.05?"LIGHT ON":"dark"}</text>
        ${[0,1,2].map(i=>`<line x1="${82+i*6}" y1="${52+i*4}" x2="${110+i*6}" y2="${80+i*4}" stroke="${AMB}" stroke-width="1.6" opacity="${lux/2.5}"/>`).join("")}
        <path d="M150,88 L150,114 L124,101 Z" fill="#16222e" stroke="${on?HI:LO}" stroke-width="2"/>
        <line x1="124" y1="88" x2="124" y2="114" stroke="${on?HI:LO}" stroke-width="3"/>
        <text x="137" y="134" class="cl" text-anchor="middle">photodiode</text>
        <line x1="150" y1="101" x2="250" y2="101" stroke="${on?HI:LO}" stroke-width="2.4"/>
        <rect x="250" y="92" width="42" height="18" fill="#16222e" stroke="#7d94a8" stroke-width="1.6"/>
        <text x="271" y="105" class="cl" text-anchor="middle">R</text>
        <line x1="292" y1="101" x2="340" y2="101" stroke="${on?HI:LO}" stroke-width="2.4"/>
        <rect x="340" y="80" width="54" height="42" rx="5" fill="${on?'rgba(255,90,95,.25)':'#16212c'}" stroke="${on?'#ff5a5f':LO}" stroke-width="2"/>
        <text x="367" y="106" class="cl" text-anchor="middle" fill="${on?'#ff5a5f':LO}">BUZZER</text>
        <text x="367" y="138" class="cl" text-anchor="middle">${on?"SOUNDING":"silent"}</text>
      </svg>`;
      out.innerHTML="";
      out.appendChild(readout([
        {k:"Illumination", v:lux.toFixed(2)},
        {k:"Reverse current I&lambda;", v:uA.toFixed(0)+" µA", cls:"hl"},
        {k:"Threshold", v:th+" µA"},
        {k:"Output", v:on?"TRIGGERED":"idle", cls:on?"g":""}
      ]));
      out.appendChild(el("div",{class:"note small", style:"margin-bottom:0"},
        lux<0.05
          ? "<b>Dark.</b> The reverse-biased junction blocks, so essentially no current flows and the transistor stays off."
          : `<b>Illuminated.</b> Current has risen to ${uA.toFixed(0)} &micro;A &mdash; strictly proportional to the light.
             Notice the relationship is a straight line, which is what makes a photodiode useful for <i>measuring</i>
             light and not just detecting it.`));
      if(on) markProg(id,"lab");
    }
    [rLux,rTh].forEach(r=>r.addEventListener("input",()=>{ draw(); labTouch(id,8); }));
    draw();
  }

  /* ---- VARISTOR ---- */
  function varistor(){
    mount.innerHTML = "";
    const cols = el("div",{class:"lab-cols wide-left"});
    const L = el("div"), Rt = el("div"); cols.appendChild(L); cols.appendChild(Rt); mount.appendChild(cols);
    const plot = el("div"); L.appendChild(plot);
    const out  = el("div",{style:"margin-top:14px"}); L.appendChild(out);
    const rV = range("sV",-500,500,5,50);
    Rt.appendChild(ctrl("Applied voltage (either polarity)","vsV",rV));
    Rt.appendChild(el("div",{class:"note small"},
      "A varistor's resistance varies <b>inversely</b> with voltage, and the <b>polarity does not matter</b>. "+
      "That is what lets one device clamp surges on an AC or a DC line."));
    const Rof = V => 1000 / Math.pow(Math.max(20,Math.abs(V))/20, 2.6);   // kOhm
    function draw(){
      const V=+rV.value;
      $("#vsV").textContent = V+" V";
      const Rk = Rof(V), I = Math.abs(V)/(Rk*1000);
      const pts=[]; for(let v=20;v<=500;v+=5) pts.push([v, Rof(v)]);
      plot.innerHTML = plotSVG({
        title:"Varistor resistance against applied voltage (magnitude)",
        xmin:0, xmax:500, ymin:0, ymax:1000, nx:5, ny:4,
        xfmt:v=>v.toFixed(0)+"V", yfmt:v=>v.toFixed(0)+"kΩ",
        series:[{pts:pts, color:VIO, w:2.4}],
        marks:[{x:Math.abs(V), y:Rk, label:Rk.toFixed(1)+" kΩ"}]
      });
      out.innerHTML="";
      out.appendChild(readout([
        {k:"Applied", v:V+" V"},
        {k:"Polarity", v:V<0?"negative":"positive", cls:"c"},
        {k:"Resistance", v:Rk<1?(Rk*1000).toFixed(0)+" Ω":Rk.toFixed(1)+" kΩ", cls:"hl"},
        {k:"Current drawn", v:fmtI(I), cls: Math.abs(V)>250?"g":""}
      ]));
      out.appendChild(el("div",{class:"note "+(Math.abs(V)>250?"warn":"")+" small", style:"margin-bottom:0"},
        Math.abs(V)>250
          ? `<b>Clamping.</b> At ${Math.abs(V)} V the resistance has collapsed to ${Rk.toFixed(1)} k&#8486; and the varistor is
             conducting hard, absorbing the surge energy and holding the line voltage down. Drag the slider to the
             <b>negative</b> side: nothing changes, because polarity is irrelevant to a varistor.`
          : `<b>Standing off.</b> At normal line voltage the varistor is a high resistance and draws almost nothing &mdash;
             it is invisible to the circuit until a transient arrives.`));
    }
    rV.addEventListener("input",()=>{ draw(); labTouch(id,8); });
    draw();
  }

  function paint(){ ({led,varactor,photo,varistor})[tab](); }
  paint();
};

/* ---------------- M4 · SCR BENCH ---------------- */
LABS.m4 = function(host, id, tier){
  const box = labShell("SCR bench","Trigger it, then try to switch it off again");
  const B = box._body;
  host.appendChild(box);
  let tab = "latch";
  B.appendChild(segBar([["latch","DC latching"],["phase","AC phase control"]], tab, v=>{ tab=v; paint(); labTouch(id,5); }));
  const mount = el("div"); B.appendChild(mount);

  /* ---- DC latch ---- */
  function latch(){
    mount.innerHTML = "";
    let on = false;
    const IH = 12;                        // holding current, mA
    const cols = el("div",{class:"lab-cols"});
    const L = el("div"), Rt = el("div"); cols.appendChild(L); cols.appendChild(Rt); mount.appendChild(cols);
    const view = el("div"); L.appendChild(view);
    const out  = el("div",{style:"margin-top:14px"}); L.appendChild(out);
    const log  = el("div",{style:"margin-top:12px"}); L.appendChild(log);
    const rVs = range("sVs",0,60,1,40), rRL = range("sRL",200,4000,50,1000);
    Rt.appendChild(ctrl("Supply voltage V<sub>S</sub>","vsVs",rVs));
    Rt.appendChild(ctrl("Load resistance R<sub>L</sub>","vsRL",rRL));
    const btns = el("div",{class:"btn-row", style:"margin-bottom:12px"});
    Rt.appendChild(btns);
    Rt.appendChild(el("div",{class:"note small", style:"margin-bottom:0"},
      `<b>Holding current I<sub>H</sub> = ${IH} mA.</b> The gate can turn this device on. Only letting the anode current fall
       below I<sub>H</sub> will turn it off again.`));
    const events = [];
    function I(){ return on ? (+rVs.value)/(+rRL.value)*1000 : 0; }   // mA
    function draw(){
      $("#vsVs").textContent = (+rVs.value)+" V"; $("#vsRL").textContent = (+rRL.value)+" Ω";
      const i = I();
      if(on && i < IH){ on = false; events.unshift("I<sub>AK</sub> fell to "+i.toFixed(1)+" mA, below I<sub>H</sub> — the SCR turned OFF."); }
      const conducting = on;
      view.innerHTML = `<svg class="viz" viewBox="0 0 440 190">
        <style>.cl{fill:#8fa3b5;font:600 10px system-ui}</style>
        <line x1="60" y1="40" x2="230" y2="40" stroke="${conducting?HI:LO}" stroke-width="2.4"/>
        <text x="238" y="34" class="cl">A</text>
        <line x1="230" y1="40" x2="230" y2="66" stroke="${conducting?HI:LO}" stroke-width="2.4"/>
        <path d="M212,66 L248,66 L230,96 Z" fill="#16222e" stroke="${conducting?HI:"#7d94a8"}" stroke-width="2"/>
        <line x1="212" y1="96" x2="248" y2="96" stroke="${conducting?HI:"#7d94a8"}" stroke-width="3"/>
        <line x1="248" y1="90" x2="272" y2="78" stroke="#7d94a8" stroke-width="2"/>
        <line x1="272" y1="78" x2="300" y2="78" stroke="${conducting?AMB:LO}" stroke-width="2.4"/>
        <text x="308" y="82" class="cl">G</text>
        <line x1="230" y1="96" x2="230" y2="120" stroke="${conducting?HI:LO}" stroke-width="2.4"/>
        <text x="238" y="116" class="cl">K</text>
        <rect x="212" y="120" width="36" height="18" fill="#16222e" stroke="#7d94a8" stroke-width="1.6"/>
        <text x="230" y="133" class="cl" text-anchor="middle">RL</text>
        <line x1="230" y1="138" x2="230" y2="162" stroke="${conducting?HI:LO}" stroke-width="2.4"/>
        <line x1="230" y1="162" x2="60" y2="162" stroke="${conducting?HI:LO}" stroke-width="2.4"/>
        <line x1="60" y1="162" x2="60" y2="40" stroke="${conducting?HI:LO}" stroke-width="2.4"/>
        <line x1="44" y1="92" x2="76" y2="92" stroke="#9fb4c7" stroke-width="2.4"/>
        <line x1="52" y1="102" x2="68" y2="102" stroke="#9fb4c7" stroke-width="4"/>
        <text x="6" y="88" class="cl">Vs</text>
        <rect x="330" y="60" width="96" height="56" rx="8" fill="${conducting?'rgba(58,214,139,.16)':'#16212c'}" stroke="${conducting?HI:LO}" stroke-width="2"/>
        <text x="378" y="86" class="cl" text-anchor="middle" fill="${conducting?HI:LO}" style="font-size:12px;font-weight:700">${conducting?"CONDUCTING":"BLOCKING"}</text>
        <text x="378" y="104" class="cl" text-anchor="middle">${conducting?i.toFixed(1)+" mA":"forward blocking"}</text>
      </svg>`;
      out.innerHTML = "";
      out.appendChild(readout([
        {k:"State", v: on?"ON (latched)":"OFF", cls:on?"g":""},
        {k:"Anode current I<sub>AK</sub>", v: i.toFixed(1)+" mA", cls: on&&i<IH*1.5?"hl":""},
        {k:"Holding current I<sub>H</sub>", v: IH+" mA", cls:"c"},
        {k:"Gate control", v: on?"none":"can trigger"}
      ]));
      btns.innerHTML = "";
      btns.appendChild(el("button",{class:"btn", onclick:()=>{
        const i2 = (+rVs.value)/(+rRL.value)*1000;
        if(i2 >= IH){ on = true; events.unshift("Gate pulse applied — SCR latched ON at "+i2.toFixed(1)+" mA."); markProg(id,"lab"); }
        else events.unshift("Gate pulse applied but the circuit can only supply "+i2.toFixed(1)+" mA — below I<sub>H</sub>, so it did not latch.");
        draw(); labTouch(id,4);
      }},"Apply a gate pulse"));
      btns.appendChild(el("button",{class:"btn sec", onclick:()=>{
        events.unshift(on ? "Gate current removed — and the SCR is <b>still conducting</b>. The gate has no control now."
                          : "Gate current removed. The SCR was already off.");
        draw(); labTouch(id,4);
      }},"Remove gate current"));
      log.innerHTML = `<div class="eyebrow">Event log</div>`+
        (events.length? "<ul class='tick' style='font-size:.83rem'>"+events.slice(0,5).map(e=>"<li>"+e+"</li>").join("")+"</ul>"
                      : "<p class='small muted'>Apply a gate pulse to begin.</p>");
      if(on){
        out.appendChild(el("div",{class:"note ok small", style:"margin-bottom:0"},
          `<b>Latched.</b> Try it: press <i>Remove gate current</i> and nothing happens. Now wind the supply down (or the
           load resistance up) until I<sub>AK</sub> drops below ${IH} mA &mdash; that is the <b>only</b> way to turn it off on DC.`));
      }
    }
    [rVs,rRL].forEach(r=>r.addEventListener("input",()=>{ draw(); labTouch(id,9); }));
    draw();
  }

  /* ---- AC phase control ---- */
  function phase(){
    mount.innerHTML = "";
    const cols = el("div",{class:"lab-cols wide-left"});
    const L = el("div"), Rt = el("div"); cols.appendChild(L); cols.appendChild(Rt); mount.appendChild(cols);
    const plot = el("div"); L.appendChild(plot);
    const out  = el("div",{style:"margin-top:14px"}); L.appendChild(out);
    const rA = range("pA",0,170,1,45);
    Rt.appendChild(ctrl("Firing angle","vpA",rA));
    Rt.appendChild(el("div",{class:"note small"},
      "Delay the gate trigger further into each half cycle and the load gets a smaller slice of it. This is how lamp "+
      "dimmers, electric heaters and motor speed controllers work &mdash; and why they are such a notorious source of "+
      "electrical noise."));
    function draw(){
      const a = +rA.value; $("#vpA").textContent = a+"°";
      const sup=[], load=[];
      for(let d=0; d<=720; d+=2){
        const r = d*Math.PI/180, s = Math.sin(r);
        sup.push([d, s]);
        const inHalf = (d%360) < 180;
        const ang = d%360;
        load.push([d, (inHalf && ang>=a) ? Math.max(0,s) : 0]);
      }
      plot.innerHTML = plotSVG({
        title:"Supply (grey) and load (red) — SCR conducts only after the firing angle",
        xmin:0, xmax:720, ymin:-1.15, ymax:1.15, nx:4, ny:4,
        xfmt:v=>v.toFixed(0)+"°", yfmt:v=>v.toFixed(1),
        series:[{pts:sup, color:"#6f8598", w:1.6},{pts:load, color:ACC, w:2.4}]
      });
      /* average of half sine from a to 180, normalised to full half-wave */
      const rad = a*Math.PI/180;
      const frac = (1+Math.cos(rad))/2;
      out.innerHTML="";
      out.appendChild(readout([
        {k:"Firing angle", v:a+"°"},
        {k:"Conduction angle", v:(180-a)+"°", cls:"c"},
        {k:"Relative power", v:(frac*100).toFixed(0)+" %", cls:"hl"},
        {k:"Output", v:"half-wave DC"}
      ]));
      out.appendChild(el("div",{class:"note small", style:"margin-bottom:0"},
        `At ${a}&deg; the SCR conducts for the remaining ${180-a}&deg; of each positive half cycle, delivering about
         <b>${(frac*100).toFixed(0)}%</b> of full power. Note that the negative half cycle never appears: an SCR is a
         <i>rectifier</i>, so it conducts one way only &mdash; and that is also what turns it off, since the current
         naturally falls to zero at the end of every positive half cycle. That is <b>natural commutation</b>.`));
      if(a>90) markProg(id,"lab");
    }
    rA.addEventListener("input",()=>{ draw(); labTouch(id,8); });
    draw();
  }

  function paint(){ (tab==="latch"?latch:phase)(); }
  paint();
};

/* ---------------- M5 · BJT BIAS BENCH ---------------- */
LABS.m5 = function(host, id, tier){
  const box = labShell("Transistor bias bench","Drive the base and watch it move through all three regions");
  const B = box._body;
  host.appendChild(box);

  const cols = el("div",{class:"lab-cols wide-left"});
  const L = el("div"), Rt = el("div");
  cols.appendChild(L); cols.appendChild(Rt); B.appendChild(cols);
  const view = el("div"); L.appendChild(view);
  const out  = el("div",{style:"margin-top:14px"}); L.appendChild(out);
  const plot = el("div",{style:"margin-top:14px"}); L.appendChild(plot);

  const rIB = range("tIB",0,600,5,100), rB = range("tB",20,300,5,100), rVcc = range("tVcc",5,30,1,12), rRC = range("tRC",100,3000,10,470);
  Rt.appendChild(ctrl("Base current I<sub>B</sub>","vtIB",rIB));
  Rt.appendChild(ctrl("Current gain &beta;<sub>DC</sub>","vtB",rB));
  Rt.appendChild(ctrl("Supply V<sub>CC</sub>","vtVcc",rVcc));
  Rt.appendChild(ctrl("Collector resistor R<sub>C</sub>","vtRC",rRC));
  const regBox = el("div",{class:"card tight", style:"margin:0"});
  Rt.appendChild(regBox);

  function draw(){
    const IB=+rIB.value*1e-6, beta=+rB.value, Vcc=+rVcc.value, RC=+rRC.value;
    $("#vtIB").textContent=(+rIB.value)+" µA"; $("#vtB").textContent=beta;
    $("#vtVcc").textContent=Vcc+" V"; $("#vtRC").textContent=RC+" Ω";

    const ICsat = Vcc/RC;
    const ICactive = beta*IB;
    let region, IC;
    if(IB <= 0){ region="cutoff"; IC = 0; }
    else if(ICactive >= ICsat){ region="saturation"; IC = ICsat; }
    else { region="active"; IC = ICactive; }
    const VCE = Math.max(0, Vcc - IC*RC);
    const IE = IC + IB;

    const col = region==="active" ? HI : region==="saturation" ? AMB : LO;
    view.innerHTML = `<svg class="viz" viewBox="0 0 460 200">
      <style>.cl{fill:#8fa3b5;font:600 10px system-ui}.cv{font:700 10px ui-monospace,monospace}</style>
      <line x1="250" y1="16" x2="250" y2="46" stroke="#9fb4c7" stroke-width="2.2"/>
      <text x="258" y="24" class="cl">+Vcc ${Vcc}V</text>
      <rect x="238" y="46" width="24" height="40" fill="#16222e" stroke="#7d94a8" stroke-width="1.6"/>
      <text x="272" y="70" class="cl">Rc</text>
      <line x1="250" y1="86" x2="250" y2="104" stroke="${col}" stroke-width="2.4"/>
      <text x="262" y="102" class="cv" fill="${col}">Ic=${(IC*1000).toFixed(1)}mA</text>
      <line x1="250" y1="104" x2="220" y2="118" stroke="${col}" stroke-width="2.4"/>
      <line x1="212" y1="100" x2="212" y2="150" stroke="#cfd8e0" stroke-width="3"/>
      <line x1="150" y1="125" x2="212" y2="125" stroke="${IB>0?HI:LO}" stroke-width="2.4"/>
      <text x="104" y="122" class="cv" fill="${IB>0?HI:LO}">Ib=${(IB*1e6).toFixed(0)}µA</text>
      <line x1="212" y1="150" x2="250" y2="164" stroke="${col}" stroke-width="2.4"/>
      <path d="M238,152 L250,158 L240,162 Z" fill="${col}"/>
      <line x1="250" y1="164" x2="250" y2="184" stroke="${col}" stroke-width="2.4"/>
      <line x1="234" y1="184" x2="266" y2="184" stroke="#9fb4c7" stroke-width="2.4"/>
      <text x="150" y="178" class="cv" fill="${col}">Ie=${(IE*1000).toFixed(1)}mA</text>
      <text x="300" y="124" class="cl">Vce = ${VCE.toFixed(2)} V</text>
      <rect x="300" y="146" width="140" height="30" rx="6" fill="${region==="active"?'rgba(58,214,139,.14)':region==="saturation"?'rgba(245,180,49,.14)':'#16212c'}" stroke="${col}" stroke-width="1.6"/>
      <text x="370" y="166" class="cl" text-anchor="middle" fill="${col}" style="font-weight:700">${region.toUpperCase()}</text>
    </svg>`;

    out.innerHTML="";
    out.appendChild(readout([
      {k:"I<sub>C</sub> = &beta; &times; I<sub>B</sub>", v:(ICactive*1000).toFixed(2)+" mA"},
      {k:"Actual I<sub>C</sub>", v:(IC*1000).toFixed(2)+" mA", cls:"hl"},
      {k:"I<sub>E</sub> = I<sub>B</sub> + I<sub>C</sub>", v:(IE*1000).toFixed(2)+" mA", cls:"g"},
      {k:"V<sub>CE</sub>", v:VCE.toFixed(2)+" V", cls:"c"}
    ]));
    const msg = {
      cutoff:`<b>Cut-off.</b> No base current, so no collector current. Both junctions are reverse biased and the
              transistor behaves as an <b>open switch</b> &mdash; V<sub>CE</sub> sits at the full supply.`,
      active:`<b>Active region.</b> B-E forward biased, B-C reverse biased. Here I<sub>C</sub> = &beta;<sub>DC</sub> &times; I<sub>B</sub>
              = ${beta} &times; ${(IB*1e6).toFixed(0)} &micro;A = ${(IC*1000).toFixed(2)} mA, and the transistor works as an
              <b>amplifier</b>: a small change in I<sub>B</sub> makes a much bigger change in I<sub>C</sub>.`,
      saturation:`<b>Saturation.</b> Both junctions are forward biased and the transistor is a <b>closed switch</b>.
              Notice what has happened: &beta;I<sub>B</sub> would be ${(ICactive*1000).toFixed(1)} mA, but the circuit can only
              supply V<sub>CC</sub>/R<sub>C</sub> = ${(ICsat*1000).toFixed(1)} mA. <b>I<sub>C</sub> is no longer controlled by I<sub>B</sub></b> &mdash;
              push in more base current and nothing changes.`
    }[region];
    out.appendChild(el("div",{class:"note "+(region==="saturation"?"warn":region==="active"?"ok":"")+" small", style:"margin-bottom:0"}, msg));

    /* output characteristics with load line */
    const series = [];
    [50,100,150,200,250,300].forEach((ib,k)=>{
      const icv = beta*ib*1e-6;
      const pts = [];
      for(let v=0; v<=Vcc; v+=Vcc/60){
        const knee = 0.25;
        const val = v < knee ? icv*(v/knee) : icv*(1+0.02*(v-knee)/Vcc);
        pts.push([v, Math.min(val, Vcc/RC*1.4)*1000]);
      }
      series.push({pts, color:"#41647f", w:1.4});
    });
    series.push({pts:[[0, Vcc/RC*1000],[Vcc,0]], color:AMB, w:2, dash:"6 4", label:"load line"});
    plot.innerHTML = plotSVG({
      title:"Output characteristics — the operating point sits on the load line",
      xmin:0, xmax:Vcc, ymin:0, ymax:Vcc/RC*1000*1.15, nx:6, ny:4,
      xfmt:v=>v.toFixed(0)+"V", yfmt:v=>v.toFixed(0)+"mA",
      series, marks:[{x:VCE, y:IC*1000, label:region}]
    });

    regBox.innerHTML = `<div class="eyebrow">Region map</div>
      <table class="tt" style="font-family:var(--sans);font-size:.76rem">
        <thead><tr><th>&nbsp;</th><th>B-E</th><th>B-C</th></tr></thead><tbody>
        <tr${region==="cutoff"?' class="hi"':''}><td>Cut-off</td><td>reverse</td><td>reverse</td></tr>
        <tr${region==="saturation"?' class="hi"':''}><td>Saturation</td><td>forward</td><td>forward</td></tr>
        <tr${region==="active"?' class="hi"':''}><td>Active</td><td>forward</td><td>reverse</td></tr>
      </tbody></table>
      <div class="tiny muted" style="margin-top:8px">Drive I<sub>B</sub> up until the transistor saturates, and watch
      &beta;I<sub>B</sub> and the actual I<sub>C</sub> part company.</div>`;
  }
  [rIB,rB,rVcc,rRC].forEach(r=>r.addEventListener("input",()=>{ draw(); labTouch(id,9); }));
  draw();
};
/* ---------------- M6 · OP-AMP BENCH ---------------- */
LABS.m6 = function(host, id, tier){
  const box = labShell("Op-amp bench","Try it open loop first, then close the loop and see the difference");
  const B = box._body;
  host.appendChild(box);

  let cfg = "open";
  B.appendChild(segBar([["open","Open loop"],["noninv","Non-inverting"],["inv","Inverting"],["follow","Voltage follower"]],
    cfg, v=>{ cfg=v; draw(); labTouch(id,5); }));

  const cols = el("div",{class:"lab-cols wide-left"});
  const L = el("div"), Rt = el("div");
  cols.appendChild(L); cols.appendChild(Rt); B.appendChild(cols);
  const plot = el("div"); L.appendChild(plot);
  const out  = el("div",{style:"margin-top:14px"}); L.appendChild(out);

  const rVin = range("oVin",1,2000,1,50), rR1 = range("oR1",1,100,1,10), rRf = range("oRf",1,470,1,90),
        rAol = range("oAol",50000,400000,10000,200000), rSat = range("oSat",5,18,0.5,14);
  Rt.appendChild(ctrl("Input amplitude V<sub>in</sub>","voVin",rVin));
  const r1w = ctrl("Input resistor R<sub>1</sub>","voR1",rR1);
  const rfw = ctrl("Feedback resistor R<sub>F</sub>","voRf",rRf);
  Rt.appendChild(r1w); Rt.appendChild(rfw);
  Rt.appendChild(ctrl("Open-loop gain A<sub>ol</sub>","voAol",rAol));
  Rt.appendChild(ctrl("Saturation &plusmn;V<sub>sat</sub>","voSat",rSat));
  const formula = el("div",{class:"card tight", style:"margin:0"});
  Rt.appendChild(formula);

  function draw(){
    const VinmV = +rVin.value, Vin = VinmV/1000;
    const R1 = +rR1.value, Rf = +rRf.value, Aol = +rAol.value, Vsat = +rSat.value;
    $("#voVin").textContent = VinmV>=1000 ? (VinmV/1000).toFixed(2)+" V" : VinmV+" mV";
    $("#voR1").textContent = R1+" kΩ"; $("#voRf").textContent = Rf+" kΩ";
    $("#voAol").textContent = (Aol/1000)+"k"; $("#voSat").textContent = "±"+Vsat+" V";

    const showRes = (cfg==="noninv"||cfg==="inv");
    r1w.style.display = showRes?"":"none"; rfw.style.display = showRes?"":"none";

    let gain, name, note, phase;
    if(cfg==="open"){ gain = Aol; name="Open loop"; phase=0;
      note = `V<sub>o</sub> = A<sub>ol</sub> &times; V<sub>id</sub> = ${Aol.toLocaleString()} &times; ${Vin.toFixed(4)} V = <b>${(Aol*Vin).toFixed(0)} V</b> &mdash;
              which the supply cannot deliver.`; }
    else if(cfg==="noninv"){ gain = 1 + Rf/R1; name="Non-inverting"; phase=0;
      note = `A<sub>cl</sub> = 1 + R<sub>F</sub>/R<sub>1</sub> = 1 + ${Rf}/${R1} = <b>${gain.toFixed(2)}</b>. Output in phase with the input, and the gain can never be below 1.`; }
    else if(cfg==="inv"){ gain = -(Rf/R1); name="Inverting"; phase=180;
      note = `A<sub>cl</sub> = &minus;R<sub>F</sub>/R<sub>1</sub> = &minus;${Rf}/${R1} = <b>${gain.toFixed(2)}</b>. The minus sign is a <b>180&deg; phase shift</b>, not a negative voltage.`; }
    else { gain = 1; name="Voltage follower"; phase=0;
      note = `A<sub>cl</sub> = <b>1</b>, 100% feedback, output follows input in the same phase. Its value is not gain &mdash; it is
              <b>impedance matching</b>: very high input impedance, very low output impedance.`; }

    const Vopk = Math.abs(gain)*Vin;
    const clipped = Vopk > Vsat;

    /* waveforms */
    const inPts=[], outPts=[];
    const scale = Math.max(Vsat*1.15, 0.001);
    for(let d=0; d<=720; d+=2){
      const r = d*Math.PI/180;
      const vi = Vin*Math.sin(r);
      let vo = gain*vi;
      vo = Math.max(-Vsat, Math.min(Vsat, vo));
      inPts.push([d, vi/Vin * (Vsat*0.22)]);       // input drawn to a visible scale
      outPts.push([d, vo]);
    }
    plot.innerHTML = plotSVG({
      title:"Grey = input (scaled up so you can see it) · red = output",
      xmin:0, xmax:720, ymin:-scale, ymax:scale, nx:4, ny:4,
      xfmt:v=>v.toFixed(0)+"°", yfmt:v=>v.toFixed(0)+"V",
      series:[{pts:inPts, color:"#6f8598", w:1.6},{pts:outPts, color:ACC, w:2.4}]
    });

    out.innerHTML = "";
    out.appendChild(readout([
      {k:"Configuration", v:name},
      {k:"Gain", v:(cfg==="open"? (Aol/1000)+"k" : gain.toFixed(2)), cls:"c"},
      {k:"Ideal V<sub>o</sub> peak", v: Vopk>=1000 ? (Vopk/1000).toFixed(1)+" kV" : Vopk.toFixed(2)+" V", cls:"hl"},
      {k:"Actual V<sub>o</sub> peak", v: Math.min(Vopk,Vsat).toFixed(2)+" V", cls: clipped?"":"g"}
    ]));
    out.appendChild(el("div",{class:"note "+(clipped?"err":"ok")+" small", style:"margin-bottom:0"},
      clipped
        ? `<b>Saturated.</b> The op-amp wants ${Vopk>=1000?(Vopk/1000).toFixed(1)+" kV":Vopk.toFixed(1)+" V"} but the supply
           limits it to &plusmn;${Vsat} V, so the peaks are flattened against the rails. The output is no longer the same
           shape as the input, which means the amplifier is <b>not operating linearly</b>.
           ${cfg==="open"?" This is why the open-loop amplifier is unusable for linear work: a few millivolts is enough to slam it into the rails.":" Reduce the input, or reduce the gain."}`
        : `<b>Linear.</b> Output and input have the same wave shape, so the circuit is genuinely amplifying rather than
           clipping. ${cfg==="inv"?"Look at the phase: the output is upside down relative to the input.":""}`));

    formula.innerHTML = `<div class="eyebrow">${name}</div><div class="small">${note}</div>
      ${cfg==="inv"?`<div class="note small" style="margin:10px 0 0"><b>Virtual ground.</b> The + input is grounded,
       so V<sub>+</sub> = 0. Ideally V<sub>id</sub> = 0, so the &minus; input sits at 0 V too &mdash; virtually at ground without
       being connected to it.</div>`:""}
      ${cfg==="open"?`<div class="note warn small" style="margin:10px 0 0">Try setting the input to the smallest value
       the slider allows. It still saturates. Then switch to a closed-loop configuration and compare.</div>`:""}`;

    if(cfg!=="open" && !clipped) markProg(id,"lab");
  }
  [rVin,rR1,rRf,rAol,rSat].forEach(r=>r.addEventListener("input",()=>{ draw(); labTouch(id,9); }));
  draw();
};

/* ---------------- M7 · PCB BENCH ---------------- */
LABS.m7 = function(host, id, tier){
  const box = labShell("PCB bench","Size a copper trace, then look inside the board");
  const B = box._body;
  host.appendChild(box);
  let tab = "trace";
  B.appendChild(segBar([["trace","Trace calculator"],["board","Board construction"]], tab, v=>{ tab=v; paint(); labTouch(id,5); }));
  const mount = el("div"); B.appendChild(mount);

  const RHO = 1.72e-8;   // ohm-metre, copper

  function trace(){
    mount.innerHTML = "";
    const cols = el("div",{class:"lab-cols wide-left"});
    const L = el("div"), Rt = el("div"); cols.appendChild(L); cols.appendChild(Rt); mount.appendChild(cols);
    const plot = el("div"); L.appendChild(plot);
    const out  = el("div",{style:"margin-top:14px"}); L.appendChild(out);
    let d = 35;
    const rLen = range("cL",10,300,5,100), rW = range("cW",0.2,6,0.1,1.0), rI = range("cI",0.1,10,0.1,1.0);
    Rt.appendChild(ctrl("Trace length l","vcL",rLen));
    Rt.appendChild(ctrl("Trace width b","vcW",rW));
    Rt.appendChild(el("div",{class:"eyebrow"},"Copper thickness d"));
    Rt.appendChild(segBar([[35,"35 µm"],[70,"70 µm"],[105,"105 µm"]], d, v=>{ d=v; draw(); labTouch(id,7); }, "margin-bottom:14px"));
    Rt.appendChild(ctrl("Current carried","vcI",rI));
    Rt.appendChild(el("div",{class:"note small", style:"margin-bottom:0"},
      "<b>R = &rho;l / A = &rho;l / (d &times; b)</b><br>Longer trace &rarr; more resistance. Wider or thicker &rarr; less. "+
      "The width is dictated by the current the trace must carry."));

    function draw(){
      const l = +rLen.value/1000, b = +rW.value/1000, I = +rI.value;
      $("#vcL").textContent = (+rLen.value)+" mm"; $("#vcW").textContent = (+rW.value).toFixed(1)+" mm";
      $("#vcI").textContent = I.toFixed(1)+" A";
      const A = (d*1e-6) * b;
      const R = RHO*l/A;
      const Vd = I*R, P = I*I*R;
      const density = I / (A*1e6);           // A per mm^2
      const risk = density > 70 ? "high" : density > 35 ? "warm" : "ok";

      const pts=[]; for(let w=0.2; w<=6.01; w+=0.05) pts.push([w, RHO*l/((d*1e-6)*(w/1000))*1000]);
      plot.innerHTML = plotSVG({
        title:"Trace resistance against width, at this length and copper thickness",
        xmin:0, xmax:6, ymin:0, ymax:Math.max(60, RHO*l/((d*1e-6)*0.0002)*1000*0.35), nx:6, ny:4,
        xfmt:v=>v.toFixed(1)+"mm", yfmt:v=>v.toFixed(0)+"mΩ",
        series:[{pts, color:CYN, w:2.4}],
        marks:[{x:+rW.value, y:R*1000, label:(R*1000).toFixed(1)+" mΩ"}]
      });
      out.innerHTML="";
      out.appendChild(readout([
        {k:"Cross-section A", v:(A*1e6).toFixed(3)+" mm²"},
        {k:"Resistance R", v:(R*1000).toFixed(2)+" mΩ", cls:"hl"},
        {k:"Volt drop at "+I.toFixed(1)+" A", v:(Vd*1000).toFixed(1)+" mV", cls:"c"},
        {k:"Heat dissipated", v:(P*1000).toFixed(1)+" mW", cls: risk==="ok"?"g":""}
      ]));
      const msg = {
        ok:`<b>Comfortable.</b> At ${density.toFixed(1)} A/mm&sup2; this trace carries the current with only a modest temperature rise.`,
        warm:`<b>Getting warm.</b> ${density.toFixed(1)} A/mm&sup2; is on the high side. Remember the current-carrying
              capacity also depends on <b>board thickness, substrate material, ventilation and heat dissipation from the
              mounted components</b> &mdash; the same trace inside a sealed LRU behaves differently from one in open air.`,
        high:`<b>Over-loaded.</b> ${density.toFixed(1)} A/mm&sup2; will overheat this trace, and an overheated trace lifts
              from the substrate or burns open. Widen it, use thicker copper, or shorten the run.`
      }[risk];
      out.appendChild(el("div",{class:"note "+(risk==="ok"?"ok":risk==="warm"?"warn":"err")+" small", style:"margin-bottom:0"}, msg));
      out.appendChild(el("div",{class:"note small", style:"margin-bottom:0"},
        `R = &rho;l/(d&times;b) = (1.72&times;10&#8315;&#8312; &times; ${(l*1000).toFixed(0)}mm) / (${d}&micro;m &times; ${(b*1000).toFixed(1)}mm)
         = <b>${(R*1000).toFixed(2)} m&#8486;</b>. Double the width and the resistance halves; double the length and it doubles.`));
      if(+rW.value >= 2) markProg(id,"lab");
    }
    [rLen,rW,rI].forEach(r=>r.addEventListener("input",()=>{ draw(); labTouch(id,8); }));
    draw();
  }

  function board(){
    mount.innerHTML = "";
    let type = "double", mnt = "tht", coat = false;
    const cols = el("div",{class:"lab-cols wide-left"});
    const L = el("div"), Rt = el("div"); cols.appendChild(L); cols.appendChild(Rt); mount.appendChild(cols);
    const view = el("div"); L.appendChild(view);
    const out  = el("div",{style:"margin-top:14px"}); L.appendChild(out);
    const ctlHost = el("div"); Rt.appendChild(ctlHost);
    const info = el("div",{class:"card tight", style:"margin:14px 0 0"}); Rt.appendChild(info);

    function draw(){
      ctlHost.innerHTML = "";
      ctlHost.appendChild(el("div",{class:"eyebrow"},"Board type"));
      ctlHost.appendChild(segBar([["single","Single sided"],["double","Double sided"],["multi","Multi-layer"]], type, v=>{ type=v; draw(); labTouch(id,6); }, "margin-bottom:14px"));
      ctlHost.appendChild(el("div",{class:"eyebrow"},"Mounting technology"));
      ctlHost.appendChild(segBar([["tht","Through hole (THT)"],["smt","Surface mount (SMT)"]], mnt, v=>{ mnt=v; draw(); labTouch(id,6); }, "margin-bottom:14px"));
      const cb = el("div",{class:"chk"+(coat?" on":""), onclick:()=>{ coat=!coat; draw(); labTouch(id,6); }});
      cb.innerHTML = `<span class="box">✓</span><span>Apply conformal coating</span>`;
      ctlHost.appendChild(cb);

      const layers = type==="multi" ? 4 : type==="double" ? 2 : 1;
      const H = 200, y0 = 92, th = type==="multi" ? 46 : 22;
      let g = "";
      /* substrate */
      g += `<rect x="40" y="${y0}" width="380" height="${th}" fill="#1c3324" stroke="#2f5a3d" stroke-width="1.5"/>`;
      /* copper layers */
      for(let i=0;i<layers;i++){
        const ly = layers===1 ? y0+th-3 : y0 + (i*(th-3))/(layers-1);
        g += `<rect x="40" y="${ly}" width="380" height="3" fill="#c9722f"/>`;
      }
      /* holes */
      if(type==="single"){
        g += `<rect x="120" y="${y0}" width="7" height="${th}" fill="#0a1119"/>
              <text x="123" y="${y0+th+16}" class="cl" text-anchor="middle">NPTH</text>`;
      }else{
        g += `<rect x="120" y="${y0}" width="8" height="${th}" fill="#0a1119"/>
              <rect x="118" y="${y0}" width="2" height="${th}" fill="#c9722f"/>
              <rect x="128" y="${y0}" width="2" height="${th}" fill="#c9722f"/>
              <text x="124" y="${y0+th+16}" class="cl" text-anchor="middle">PTH</text>`;
        g += `<rect x="250" y="${y0}" width="5" height="${th}" fill="#0a1119"/>
              <rect x="248" y="${y0}" width="2" height="${th}" fill="#c9722f"/>
              <rect x="255" y="${y0}" width="2" height="${th}" fill="#c9722f"/>
              <text x="252" y="${y0+th+16}" class="cl" text-anchor="middle">through via</text>`;
        if(type==="multi"){
          g += `<rect x="330" y="${y0+14}" width="5" height="${th-28}" fill="#0a1119"/>
                <rect x="328" y="${y0+14}" width="2" height="${th-28}" fill="#c9722f"/>
                <text x="332" y="${y0-8}" class="cl" text-anchor="middle">buried via</text>`;
          g += `<rect x="380" y="${y0}" width="5" height="${(th/2)|0}" fill="#0a1119"/>
                <rect x="378" y="${y0}" width="2" height="${(th/2)|0}" fill="#c9722f"/>
                <text x="382" y="${y0+th+16}" class="cl" text-anchor="middle">blind via</text>`;
        }
      }
      /* components */
      if(mnt==="tht"){
        g += `<rect x="160" y="${y0-24}" width="60" height="16" fill="#20303f" stroke="#7d94a8"/>
              <line x1="168" y1="${y0-8}" x2="168" y2="${y0+th+4}" stroke="#cfd8e0" stroke-width="2"/>
              <line x1="212" y1="${y0-8}" x2="212" y2="${y0+th+4}" stroke="#cfd8e0" stroke-width="2"/>
              <text x="190" y="${y0-30}" class="cl" text-anchor="middle">leaded component (component side)</text>
              <text x="190" y="${y0+th+30}" class="cl" text-anchor="middle">solder side</text>`;
      }else{
        g += `<rect x="168" y="${y0-13}" width="46" height="12" fill="#20303f" stroke="#7d94a8"/>
              <rect x="164" y="${y0-4}" width="8" height="5" fill="#cfd8e0"/>
              <rect x="210" y="${y0-4}" width="8" height="5" fill="#cfd8e0"/>
              <text x="191" y="${y0-22}" class="cl" text-anchor="middle">surface mount device — no through hole</text>`;
      }
      if(coat){
        g += `<rect x="40" y="${y0-34}" width="330" height="${th+40}" fill="#38c6d9" opacity="0.13"/>
              <text x="205" y="${y0-44}" class="cl" text-anchor="middle" fill="${CYN}">conformal coating — note the edge connector is left bare</text>`;
      }
      g += `<rect x="378" y="${y0+th-3}" width="42" height="3" fill="#e8c23a"/>
            <text x="399" y="${y0+th+30}" class="cl" text-anchor="middle" fill="#e8c23a">gold edge connector</text>`;

      view.innerHTML = `<svg class="viz" viewBox="0 0 460 ${H}">
        <style>.cl{fill:#8fa3b5;font:600 9px system-ui}</style>${g}</svg>`;

      const facts = {
        single:"<b>Single sided.</b> Traces on one side only, usually the solder side; components go on the component side. The holes are <b>non-plated through holes (NPTH)</b>, so there is no electrical connection between the two faces.",
        double:"<b>Double sided.</b> Traces on both the component and solder sides. The drilled hole walls are copper plated &mdash; <b>plated through holes (PTH)</b> &mdash; which is what electrically interconnects the top and bottom circuitry.",
        multi:"<b>Multi-layer.</b> Separately etched thin boards bonded together, alternating copper and insulator layers, used as circuit density and complexity rise. Note the <b>buried via</b>: it connects inner layers only and cannot be seen or probed from either surface."
      }[type];
      const mntFacts = mnt==="tht"
        ? "<b>Through-hole technology.</b> Leaded components pass through the board. The side they sit on is the <b>component side</b>; the side where solder is applied is the <b>solder side</b>. DIP packages have a 100 mil pin pitch. Assembly is typically by <b>wave soldering</b> &mdash; the board passes over a pool of molten solder on a conveyor."
        : "<b>Surface mount technology.</b> Components are soldered to pads on the surface <b>without through holes</b>. They are smaller than leaded parts and designed to be handled by machines rather than by hand. Assembly is by <b>reflow soldering</b>: paste onto the pads, place the SMDs, then through an oven.";
      info.innerHTML = `<div class="eyebrow">What you are looking at</div>
        <div class="small">${facts}</div>
        <div class="small" style="margin-top:10px">${mntFacts}</div>
        ${coat?`<div class="note ok small" style="margin:10px 0 0"><b>Conformal coating applied.</b> A thin, usually
         transparent non-conducting layer covering the entire board <b>except the edge connectors</b>, which must stay
         bare to make contact. It prevents corrosion &mdash; and it is why a repair means removing the coating locally
         and reapplying it afterwards.</div>`:`<div class="note warn small" style="margin:10px 0 0">No coating. The
         traces are exposed: touching them contaminates the copper and causes corrosion, and flexing the board causes
         hairline cracks that are intermittent and very hard to find.</div>`}`;

      out.innerHTML = "";
      out.appendChild(readout([
        {k:"Copper layers", v:layers},
        {k:"Hole type", v: type==="single"?"NPTH":"PTH + vias", cls:"c"},
        {k:"Mounting", v: mnt==="tht"?"Through hole":"Surface mount"},
        {k:"Soldering", v: mnt==="tht"?"Wave":"Reflow", cls:"hl"}
      ]));
      if(type==="multi" && coat) markProg(id,"lab");
    }
    draw();
  }

  function paint(){ (tab==="trace"?trace:board)(); }
  paint();
};
